[system_charsheet_skin]
string="Изменение внешнего вида персонажа."
[system_charsheet_quickgenerate]
string="Автоматическое распределение очков характеристик и навыков."
[system_charsheet_done]
string="Начать путешествие в мире Аркса"
[system_charsheet_strength]
string="СИЛА. Определяет урон, наносимый в бою, и способность носить тяжелое оружие. Влияет на навык ремесла и на боевые умения."
[system_charsheet_intel]
string="РАЗУМ. Определяет запас магической энергии и устойчивость к магии. Влияет на такие навыки, как медитация, магия, механика, интуиция, ремесло."
[system_charsheet_consti]
string="ВЫНОСЛИВОСТЬ. Определяет здоровье, устойчивость к ядам и способность носить тяжелую броню. Влияет на навык защиты."
[system_charsheet_mecanism]
string="МЕХАНИКА. Позволяет взламывать замки и обезвреживать ловушки."
[system_charsheet_intuition]
string="ИНТУИЦИЯ. Своего рода шестое чувство, которое помогает найти потайную дверь или обнаружить ловушку. Также способствует заключению выгодной торговой сделки."
[system_charsheet_etheral_link]
string="МЕДИТАЦИЯ. Предупреждает о присутствии враждебных существ, дает информацию о состоянии противника в бою. Также влияет на скорость восстановления магической энергии."
[system_charsheet_objknoledge]
string="РЕМЕСЛО. Позволяет чинить вещи, определять их свойства, делать зелья, а также отравлять оружие."
[system_charsheet_casting]
string="МАГИЯ. Дает доступ к заклинаниям высших уровней. Этот же навык определяет устойчивость к магическому воздействию."
[system_charsheet_projectile]
string="СТРЕЛЬБА. Улучшает шансы на попадание и увеличивает урон при атаке на расстоянии."
[system_charsheet_closecombat]
string="БЛИЖНИЙ БОЙ. Улучшает шансы на попадание и увеличивает урон в рукопашной схватке."
[system_charsheet_defense]
string="ЗАЩИТА. Определяет умение пользоваться щитом, улучшает класс защиты и уменьшает получаемый в бою урон."
