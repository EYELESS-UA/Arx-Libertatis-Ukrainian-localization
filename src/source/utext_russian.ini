[system_tutorial_bricks]
string="Найдите кирпичи и сложите их в стопку, чтобы вылезти по ним из камеры."

[player_shadowkill]
string="НЕЗАМЕТНОЕ УБИЙСТВО!!!!!"

[player_adrenaline]
string="АТАКА ПОД АДРЕНАЛИНОМ!!!!!"

[system_tutorial_food_rats]
string="Некоторые крысы и мыши дружелюбны. Вы можете положить некоторые типы еды рядом с ними, и им это обязательно понравится.*Примечание: не все крысы дружелюбны, особенно те, что в стаях."

[tutorial_stealth]
string="ИГРАЙТЕ ПО-СВОЕМУ:***-Вы можете убивать врагов мгновенно, атакуя их сзади, если, конечно, вас не поймают на этом. Для этого вам нужно иметь по крайней мере 40 очков незаметности, а также экипировать кинжал или короткий меч.**-Вы можете подслушивать разговоры персонажей, пока они вас не видят. Подслушивая, вы можете узнать полезную информацию для выполнения заданий.**-Персонажи могут услышать вас, так что следите за своими шагами. Вы можете попробовать кинуть предмет, и это может быть заставит врага подойти к нему. Не забывайте, что иконка незаметности появляется в нижнем левом углу экрана, когда вы прячетесь."

[tutorial_stealth2]
string="ИГРАЙТЕ ПО-СВОЕМУ:***-Вы можете убивать врагов мгновенно, атакуя их сзади, если, конечно, вас не поймают на этом. Для этого вам нужно иметь по крайней мере 40 очков незаметности, а также экипировать кинжал или короткий меч.**-Вы можете подслушивать разговоры персонажей, пока они вас не видят. Подслушивая, вы можете узнать полезную информацию для выполнения заданий.**-Персонажи могут услышать вас, так что следите за своими шагами. Вы можете попробовать кинуть предмет, и это может быть заставит врага подойти к нему. Не забывайте, что иконка незаметности появляется в нижнем левом углу экрана, когда вы прячетесь."

[tutorial_torchi]
string="ИГРАЙТЕ ПО-СВОЕМУ 1: Вы можете преодолевать препятствия различными методами, например:**-Потушить горящий факел водой;*-Отвлечь врагов или закрыть их за решёткой;*-Освободить заключённого во время боя;*-Атаковать врагов или избежать с ними прямого столкновения.**Экспериментируйте с комбинациями! По мере того, как вы изучаете новые способности, вам откроются новые возможности."

[tutorial_torch2]
string="Так держать, помните, что пока вы скрываетесь в тени, в нижнем левом углу появляется иконка незаметности: чем она ярче, тем сложнее вас обнаружить. Примечание: ваши очки, вложенные в незаметность, будут влиять на вашу способность прятаться."

[tutorial_exotic_runes]
string="Поздравляем, вы владеете экзотической руной! Этот тип рун улучшает заклинания, которые используют данную руну, продлевая их действие или разблокируя специальные возможности."

[system_break_door]
string="Ударьте по ржавой решётке, чтобы выбить её."

[system_break_box]
string="Вы можете бить по ящикам, чтобы ломать их. Некоторые из них могут содержать предметы внутри."

[system_shrunken_player]
string="Будьте осторожны! Если вы уменьшены — не подходите к персонажам! Они могут легко раздавить вас и не заметить этого, даже если они дружелюбны."

[system_dummy3]
string="Вы можете скрытно атаковать противников со спины и проводить быстрые убийства, перерезая их горла. Имейте в виду, что это умение требует как минимум 40 очков незаметности. Если противники поймают вас на этом, ваша специальная атака будет отменена."

[system_fire_creative]
string="Вы можете подойти к активированию ловушек творчески. Если за вами гонится большое количество врагов — встаньте рядом с горючим мусором и сотворите заклинание «Возгорание». Сжигает врагов за короткое время, но будьте осторожны с огнём!"

[system_player_note]
string="Огромное вам спасибо за поддержку проекта.*Информация о будущих обновлениях будет появляться на нашем сайте.**Вы — наша мотивация продолжать разработку и улучшение мода!**Присоединяйтесь к сообществу Arx Insanity в Discord, если вы любите Arx:**https://discord.gg/mxTKk52"

[system_supporter_note]
string="Огромное вам спасибо за поддержку проекта.**В благодарность мы даём вам некоторые эксклюзивные вещи для донатеров: ранний доступ к алхимическому оружию в дополнение к другим предметам.**Информация о будущих обновлениях будет появляться на нашем сайте.**Вы — наша мотивация продолжать разработку и улучшение мода!**Присоединяйтесь к сообществу Arx Insanity в Discord, если вы любите Arx:**https://discord.gg/mxTKk52"


