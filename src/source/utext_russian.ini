[description_book_guardpost]
string="Дневник."
[book_guardpost_content]
string="- Год 266-й, белый сезон, неделя Крысы, день третий.*Сегодня на нашу заставу напала шайка гоблинов. Они были порядком пьяны, и мы легко разделались с ними. Они вряд ли пытались захватить заставу, просто выпили лишнего. Однако мы все же потеряли бойца (гоблины - пятерых).*- Год 266, белый сезон, неделя Крота, день второй.*Землетрясение. Оно длилось минут десять, и в тоннеле в сторону города появились трещины.**- Год 266-й, зеленый сезон, неделя Коровы, день четвертый.*С утра были атакованы неизвестным. Этот тип носил немыслимые доспехи и двигался чертовски ловко. Он тяжело ранил двоих моих людей и одного убил. А затем просто развернулся и исчез. Кажется, он выяснял, насколько мы сильны.*Боюсь, что этот воин - первый знак того, что в тени зреет некая сила, которая со временем попытается расправиться со всеми нами.***- Год 266-й, зеленый сезон, неделя Орла, день первый.*Вернулся загадочный воин. Он убил троих солдат, прежде чем я расправился с ним. Падая, он издал демонический хохот; я заподозрил неладное и приказал своим людям отступать. И тут страшный взрыв разбросал его останки по всей пещере.***- Год 266-й, желтый сезон, неделя Змеи, день первый.*Утреннее землетрясение перекрыло дорогу к замку. Уверен, что скоро подойдет помощь. Я послал гонцов, и король должен понимать, что землетрясение не сошло нам даром.*Да пребудут с нами боги."
[description_book_beloved]
string="Возлюбленный мой Акбаа."
[book_beloved_content]
string="Писание сие сотворено во славу господина моего и повелителя*Акбаа.***********Акбаа есть единый источник знания вселенной и всех ведомых нам измерений. Час, когда мы установили связь с культом его, дал нашему народу шанс, и с тех пор к прошлому нет возврата. Поклоняйтесь Акбаа - или умрите.**Поелику Акбаа есть бог, олицетворяющий разрушение и гибель мира, он вознаградит верных превыше чаяний их и повергнет во прах остальных. Акбаа бессмертен, но нуждается в душах для поддержания своей власти, и чем более душ у него, тем дальше распространит он свою безмерную мудрость.**И потому тот, кто желает угодить Акбаа, должен принести ему души неверных, отказывающихся признать власть его. Хотя лучшая жертва - душа неверного, некоторые из нас добровольно отдали себя Акбаа целиком и полностью. Ибо смерть - ничто по сравнению с вечным ликованием и просветлением, что ждет их.**Один день моей жизни с момента, когда уверовал я, стоит более, нежели тысяча лет жизней неверных.**Ибо я лицезрел то, что позволило мне понять суть вселенной. И никогда не узреть это неверным."
[description_book_iserbius]
string="Личный дневник Исербиуса."
[book_iserbius_content]
string="Я должен оставить историю своей жизни на этих страницах; ведь если со мной что-то случится, мой последователь сможет послужить Ордену вместо меня.**Я решился посвятить всю жизнь свою без остатка возлюбленному Акбаа. С того мига, как узнал я о нем, и до последнего вздоха буду я поклоняться ему.***Акбаа даровал мне то, о чем смертный не вправе и мечтать.**Я не забуду благословенный день, когда я повстречал господина Лонга.*Было это в году 240-м.**Глаза наши встретились, и притяжение меж нами стало очевидно обоим. Он стал для меня вторым отцом, и, убежден, я заменил ему сына, коего никогда не было у него.*И вскоре, когда я вошел в ряды последователей, он дал мне знать: я буду наследовать ему.**Я был еще послушником, когда он поведал мне все об Акбаа и о служении ему.*И не скрыл он, что высшая цель - привести Акбаа в наш мир. Он сообщил и о необходимых для того ритуалах, хоть, увы, и не дожил до их свершения.**Пророческий его взор показал ему час собственной смерти.*Он умолял меня завершить начатое, исполнить замысел Акбаа.**На следующий год он умер, в предсказанный день, и с тех пор в моей памяти непрестанно звучит его прорицание. Стоило мне сделаться полноправным последователем Акбаа, как меня произвели в верховные жрецы. И был этот день для меня исполнен величайшей радости и горя. Неизбывна скорбь моя по утерянному учителю и отцу, и неизмеримо счастье от приближения царствия Повелителя нашего.**С тех пор настало для меня время изысканий.**Я шел к Акбаа, и приблизился так, как только может смертный приблизиться к богу. Я вижу незримое, слышу неслышное и чувствую то, что не дано ощутить человеку. Акбаа даровал мне несказанную силу, как тела, так и духа, вооруженного волшебством.**Акбаа для меня - больше, чем бог, это мое солнце, воздух и пища; он для меня все. Его сверхъестественным вдохновением я управляю последователями его, держа вожжи железной рукой.**Я начал с очищения служителей от тех, кто изжил свою полезность. Нет оправдания неудаче, ничтожество одного опасно для всех.*Когда этот необходимый труд был завершен, я занялся планированием всех деталей возрождения Акбаа. Необходимо, чтобы орден оставался тайным и незримым, пока не станет слишком поздно пытаться остановить нас.**И вот я узнал, что Фалан Орбипланакс догадался о моей истинной цели и попытался призвать на помощь Ноден.*Дабы не допустить вмешательства Нодена, я предпринял следующее: во-первых, послал убийцу к Орбипланаксу, ибо он стал опасен.**Во-вторых, я приблизил дату пришествия Акбаа. У нас еще не все было готово для священного дня, а потому я повелел ускорить принесение в жертву неверных, делать это чаще и большим числом. *Подойдут и женщины, и дети: нет времени на излишнюю разборчивость.*Наконец, я усилил молитвы, и призвал служителей Акбаа добровольно пожертвовать свои жизни Акбаа, чтобы тот откликнулся на наши моления.**День за днем я не устаю восхищаться могуществом и познаниями, дарованными мне Акбаа. К моему изумлению, Акбаа посулил мне еще более по прибытии его в мир. Он доверил мне судьбу Аркса."
[description_book_cook]
string="Поваренная книга гоблина. Дури Палоа."
[book_cook_content]
string="Смешать сахар и муку.**Добавить воды, месить тесто до однородности.**Когда тесто будет готово, поместить его в печь, следить, чтобы не пригорело.**Когда тесто пропечется, взять куриное яйцо, взбить желток и белок.**Смесью смазать полученную булку и поставить ее снова в печь примерно на минуту."
[description_book_music]
string="Музыкальные заметки Фацци."
[book_music_content]
string="Флейта - один из самых тонких инструментов.**Вы увидите, как легко научиться играть, но стать виртуозом далеко не просто.*Вот первый урок тем, кто хочет стать флейтистом.**Флейты бывают разные, но большинство работает так.*Есть четыре основных ноты и четыре дополнительных, которые вызываются, если заткнуть отверстие внизу флейты при игре основной ноты.*Назовем основные ноты 1, 2, 3 и 4, а дополнительные - #1, #2, #3 и #4.**Начнем с самой простейшей мелодии, «Гимна Фацци»: 1 1 #1 3 4 1 1 2."
[description_book_weapon]
string="Зачарованное оружие. Карток."
[book_weapon_content]
string="Я прошел немало земель в своих поисках совершенного оружия.*Всю молодость я потратил на достижение этой цели, но в один печальный день понял, что усилия мои напрасны.*Напрасны потому, что найти совершенное оружие нельзя. Его можно лишь создать.**Чтобы сотворить такое оружие, надлежит в первую очередь отыскать идеальный металл, выковать его в идеальной кузне и увенчать идеальным заклятием.*Идеальный металл особенно важен; он определяет не только остроту и силу клинка, но и возможность оружия содержать в себе волшебную силу.**Помимо этого, вес металла определит маневренность оружия, эффективность выпада и пробивания брони.**Обычно оружие делают из железа: железо - самый распространенный из металлов.*Но нам известен и лучший материал: это мифрил, самый твердый и стойкий из известных нам металлов, и, я убежден, мифрил - единственно пригодная основа для совершенного оружия. Но прежде, чем ковать, надлежит еще усилить его, создав чудесный сплав.**Выбор субстанции, с которой вы сплавите мифрил - дело нелегкое; нужны редчайшие материалы, те, что несут в себе врожденную магическую силу.*Увы, даже и мифрил, абсолютно необходимый компонент, найти очень сложно. И если все же удастся раздобыть этот фантастический металл, отыщите лучшего из кузнецов и попросите его сковать оружие.*Не стану вдаваться в философские рассуждения, но, по моему скромному мнению, среди кузнецов лучшие - гномы.**Вся их культура основана на работе с металлом и камнем, и мастерство их таково, что даже инструменты у них намного превосходят те, которыми владеют прочие расы. И лишь они способны сотворить самое прекрасное и смертельное оружие в мире.**Важен и выбор кузницы; ведь в момент завершения закалки металла он должен быть готов принять в себя заклятие и навечно сохранить его.**Наконец, относительно наложения чар.*Разрешите рассказать о лучших из известных ингредиентов для наложения чар.*Однако помните, что мощь оружия зависит в первую очередь от металла и кузницы, во вторую - от субстанции, с которой металл был сплавлен.*Вот несколько примеров (но помните, что заменить уже наложенные чары другими невозможно):**-Чеснок даст хозяину оружия легко управляться с ним.*-Толченая кость добавляет оружию силы, хотя желательна для этой цели кость дракона.*-Камень Амикара дает оружию чрезвычайную стойкость; будучи заговоренным, оружие почти неразрушимо.*-Яйцо дракона позволяет оружию легко поражать тот материал, из которого оно сделано; например, железный клинок будет свободно пронзать железо."
[description_book_noden]
string="Законы Нодена, Мира Богов. Из архивов мыслителя Арана Салара. Том 1."
[book_noden_content]
string="Ноден, страна богов, существует в чрезвычайно отдаленном измерении.*Тем не менее время от времени между нашим миром и Ноденом возникает мост, и возможен переход меж ними. Это случается, например, под влиянием благоприятных астральных событий, таких, как противостояния, или из-за природных катаклизмов.**В мире Нодена пребывает особая энергия; она стекается туда отовсюду, будучи притянута эманациями Нодена.*Энергия эта есть не что иное, как коллективное бессознательное мыслящих людей всех измерений. В ней содержатся стремления, страхи, и, главное, верования этих людей.**Всякий раз, когда некто верует в бога и дает ему имя, сущность этого бога создается в Нодене.*Поначалу рожденный бог слаб и беззащитен, но чем больше людей поклоняется ему, тем сильнее он в Нодене.**Часто таких богов просят о чем-то особом. Накопленной мощью они вольны наградить своих служителей, и награда эта, в свою очередь, укрепляет веру и приумножает число последователей.**И если в какого-либо бога никто более не верит, его сила идет на убыль. Наконец он становится небольшим объектом из эктоплазмы, хрупкой тенью былого величия.**В сердце Нодена обладают почетным местом Крагоз и Зогарк, ибо они продолжают вызывать восхищение в людских душах.**Среди обитателей Нодена есть некий 'распорядитель', он определяет место богам в соответствии с количеством их почитателей, и следит, дабы боги не превосходили своих прав и полномочий.*В этой иерархии особое место занимает раса сибартов, или мыслителей.**Силиб Нурат, ведающий взаимодействием между Ноденом и прочими мирами - один из них.**Есть там и еще одна особая раса - фолки, служители сибартов. Они обычно исполняют маловажные миссии."
[description_book_noden_v2]
string="Законы Нодена, Мира Богов. Из архивов мыслителя Арана Салара. Том 2."
[book_noden_content_v2]
string="Законы Нодена неумолимы, и никто, даже сами боги, не волен их нарушить.**Первый и важнейший из них: ни один бог или демонический владыка не волен покинуть Ноден (Часть 1, параграф 1), ибо это привело бы к тяжелейшим последствиям для мировой гармонии.*Бог, который сумел бы преодолеть запрет, приобрел бы бесконечную силу, и смог бы действовать в любой реальности и любом измерении.**Вот почему боги и князья демонов могут влиять на миры своих подданных лишь через знамения, сны и наделение верных последователей особыми силами. Но никогда и ни в какой форме не могут они сами появиться среди них.**Лишь немногие боги пытались нарушить этот закон, и все они ныне гниют внутри гигантских кристаллов, именуемых 'Ноденскими Самоцветами', куда их заточили стражи Силиба Нурата.*Стражи эти - сверхъестественные создания, сотворенные сибартами, их посланники.*Они - не боги, они лишь охраняют порядок в Нодене и за его пределами, заставляя всю вселенную почитать ноденские законы.**Ранее сибарты наделяли их неограниченной мощью, дабы они быстро возвращали назад беглых богов, но вскоре поняли, что такая сила причиняет мирам слишком тяжкие раны. И тогда они оставили своим слугам лишь столько силы, сколько необходимо для исполнения миссии.**Они одарены теперь невероятной способностью приспосабливаться к новой ситуации, быстро учатся и могут пользоваться любыми ресурсами, оказавшимися под рукой.*Но они более не властны сделаться богами сами.**Никакой смертный не в силах существовать в Нодене, и, наоборот, всякий бог, желающий покинуть его пределы, должен подыскать себе тело для воплощения.*Обычно это оказывается тот, кто призвал их; такие фанатики добровольно приносят себя в жертву.**Ноден хранит записи о всех бывших когда-либо богах.*Легенды же измерений говорят об Акбаа, Фтан-Найяке, Зевсе, Зларде Коварном, Трн-Глрне, Аладоре и многих, многих других..."
[description_book_war_magic]
string="Война магов. Урфас Бефед."
[book_war_magic_content]
string="В те времена, когда люди жили на поверхности земли, магии учили в школах волшебства, и ученики могли познать разные способы владения колдовским искусством.**Некоторые предпочитали магию стихий, другие изучали иллюзии, бывали даже легальные и дозволенные практики некромантии.**Стили волшебства существовали во множестве, у каждого была своя философия, аксиомы и табу.*И неизбежно настал момент, когда вражда этих школ дошла до того, что часть магов попыталась навязать свой взгляд на вещи всем остальным.**Так началась страшнейшая из войн.**На деле оказалось, что ни один из путей не сильнее прочих, и битвы шли на равных.*Со временем каждая из выживших фракций сосредоточилась на одной цели: единственном заклинании, которое должно было принести победу в бою с любым соперником. Это заклятие лишало врага магической энергии, и после этого неприятель не мог противопоставить победителю ни единого, даже самого слабенького, заклинания.**Воюющие стороны находились в безвыходном положении: каждая схватка кончалась лишением одного из участников магической энергии.**И в те дни сестры Эдерней поддержали королевскую академию магии, предложив ей могущественный артефакт.**Он был сотворен из двух элементов, которые, будучи соединены, позволяли удерживать энергию, невзирая на вражеские заклятья.**Элементы эти известны как Крагоз и Зогарк - их назвали так в честь двух древних богов.**Артефакт остановил побоище; противникам пришлось согласиться с превосходством обладателя этого сокровища.*Крагоз и Зогарк были вручены королю Аркса и с тех пор передавались из поколения в поколение."
[description_book_day]
string="День Пришествия."
[book_day_content]
string="Текст этот писан лордом Лонгом, создателем и первосвященником Ордена Тьмы, в году 199.***********Когда он явился, я был дипломатом королевства Аркс.*Тогда мы еще жили на поверхности, под сиянием солнца.**На 37-й день 216-го года я был в обсерватории, где наблюдал солнцестояние, и увидел метеорит, обрушившийся с небес неподалеку от нас.*Когда он рухнул, земля сотряслась. Я подумал, что настал конец света, но, когда шум утих, я решил поглядеть на место падения.**Когда ладонь моя коснулась внеземного камня, я был поражен необычайным видением, лишившим меня сознания.*Словно во сне я слышал голос.*Голос поведал, что он прибыл спасти наш мир, и что мне предстоит узнать от него путь просветления.**Я чувствовал, как меня сжимают гигантские длани, и слышал этот гортанный голос. Я видел много картин, от начала времен до наших дней. Я узнал имя своего божества: Акбаа, единый и несомненный повелитель Аркса.**Теперь я знал свою цель в жизни: помочь Акбаа обрести последователей, верующих в него.*Чем больше их я отыщу, тем выше станет мощь моего господина. И однажды он сможет воплотиться в Арксе, сделав меня господином мироздания.**И я возвел в его честь храм под землей, невдалеке от нашего города, чтобы внимать его божественной мудрости и распространять слово веры меж людей. Средоточием молебнов стал метеорит, именуемый Колтк.**Угодить моему богу можно лишь одним способом: принося ему в жертву разумные существа. Восхищение и любовь моя к нему были вознаграждены бесчисленными возможностями и познаниями в магии, что сделали меня куда могущественнее, нежели доступно смертному.*Сила эта вселила ужас в сотни неверных..."
[description_book_chicken]
string="Чудо курицы. Писано лордом Инутом, владельцем фермы в Льюкало"
[book_chicken_content]
string="Я посвятил свою жизнь изучению необычайного существа - курицы.**Непостижимо, как чародеи осмеливаются использовать столь замечательных существ в своих бесстыдных ритуалах, принося в жертву самое курицу во имя жалкого колдовства.*Я убежден, что куры наделены немалым разумом и чувством юмора.**Куриная раса состоит из 57 разновидностей, каждая из которых обладает собственной культурой и образом жизни.**Я затратил восемь лет, день за днем, на общение с курами и попытки понять их. Из уважения к ним я даже научился передвигаться, подобно им.**Наконец, после долгих медитаций, я научился менять собственное обличье, становясь одним из них при благоприятной луне.*Это новое умение позволило изучать кур по новому. Я жил среди них, питался вместе с ними, танцевал и даже беседовал с ними...*Между прочим, их язык очень и очень сложен. Вот некоторые попытки перевода с куриного на человечий:**'Ко!' - 'Привет!', 'Ко-о?' - 'Что это вы делаете?';*'Ко-ко!' - 'Делать это запрещено, немедленно перестаньте'. 'Ко-о-о-о...' - проявление вежливого интереса.**Я могу долго описывать детали и тонкости куриного языка, но, думаю, приведенные примеры могут убедить самого закоренелого скептика.**Самое же замечательное в курах - это их несравненный альтруизм.*В курином обществе главный мужчина занят поиском еды для остальных. Найдя пищу, он ставит на нее лапу и призывает остальных кличем 'Кук-реку!', дабы все могли насытиться.*Затем он наблюдает за подданными любящим взором и сам ест не ранее, чем все остальные будут сыты.**В ходе своих экспериментов я чрезвычайно приблизился к тому, чтобы отложить яйцо, но пока, увы, не преуспел...*Последние изыскания показали, что вероятная причина моей неудачи - в мужском поле, но я не приму столь примитивное объяснение.*Так что я продолжаю жить надеждой на светлый час..."
[description_book_mine_log]
string="Рабочий журнал шахты. Изеп Этан, мастер."
[book_mine_log_content]
string="Донесение 87 - 266-й год, коричневый сезон, третий день недели Орла.**После долгих недель тяжкого труда мы наконец обнаружили мифрильную жилу.*Рудокопы были счастливы, они ликовали, и на их глазах были слезы.*Жила находится далеко отсюда, к востоку.*Поскольку нести груз к рудной мельнице слишком далеко, мы провели рельсовый путь для вагонеток.*********Донесение 87 - 266-й год, Коричневый сезон, второй день недели Крысы.**С момента открытия жилы мы проделали штольни во всех направлениях.*На севере от выхода руды мы нашли странную пещеру. Она казалась и природной, и искусственной одновременно. Там сильно пахло каким-то животным, и мы решили, что это логово дикого зверя.**Сейчас неделя Крысы, и такая находка является недобрым предзнаменованием..."
[description_book_forge_manual]
string="Кузница. Руководство пользователя."
[book_forge_manual_content]
string="Для создания вещи из металла нужны две машины. Плавильная машина производит слитки из руды. Делается это так:**1) поместите в машину камень силы, чтобы дать ей необходимую энергию;**2) положите в печь два больших куска руды. Не следует класть два куска руды разного вида!**3) по мере необходимости добавляйте присадочные вещества;**4) потяните за рычаг, и машина выдаст готовый слиток.*****Литейная машина используется следующим образом:**1) поместите в машину камень силы, чтобы дать ей необходимую энергию;**2) положите в машину форму для литья;**3) положите туда же слиток;**4) потяните за рычаг и берите готовое изделие."
[description_book_art_of_making_potions]
string="Волшебные Зелья. Киро Безали."
[book_art_of_making_potions_content]
string="Изготовление зелий - дело простое, даже примитивное.*От алхимика требуются только тщательность, терпение и некоторые компоненты.**Во-первых, нужна пустая бутыль. Во-вторых, нужен соответствующий ингредиент.*Растолките его в порошок с помощью пестика и ступки, и положите в пустой сосуд.*Нагрейте сосуд в перегонном аппарате.*Зелье готово.**Вот список известных на данный момент реагентов:**толченая лилия (синий порошок) годится для зелья магической энергии;**противоядия делаются из лекарственных трав (лиловый порошок);**зелье невидимости делается из толченого подснежника (белый порошок);**яды обычно делаются из папоротника (зеленый порошок);**наконец, лечебный эликсир приготовляется из толченой кувшинки (оранжевый порошок)."
[description_book_codex]
string="Фармакопея Ордена."
[book_edurneum_codex]
string="Жизнь королевы подобна змеиной коже**Возрождение дает новую королеву**Лишь особа королевской крови**Может достойно служить Великой Змее.**Лишь в Третью Луну Иксоса возможен ритуал возрождения королевы."
[description_book_the_order]
string="Орден Эдерней. Эфан Дирск."
[book_the_order_content]
string="О так называемых Сестрах Эдерней известно немногое. Даже то, откуда взялись эти полуженщины, полузмеи, неведомо. Кожа их порой покрыта чешуей.**Потомки ли они некоей древней расы, или человеческие женщины, подвергшиеся мутации?*Никто не знает ответа на эту загадку.*Они поклоняются некоему змеиному божеству, но никаких подробностей об этом божестве неизвестно, потому что сестры ревностно охраняют свои тайны.*Можно лишь предположить, что именно это божество дарует сестрам волшебные силы.**Некоторые легенды утверждают, что поклонение этому божеству дало им не только магию, но и само змеиное обличье.*Но доказательств, разумеется, нет.**С тех пор, как солнце Аркса закатилось, сестры - величайший из союзников рода людского.*В те времена, когда наша раса обживала подземный мир, сестры предложили королю волшебные дары. Только благодаря им мы вырастили новые растения, обходящиеся без солнечного света, и люди не умерли от голода.**Населению Аркса подобает вечно отдавать дань уважения и благодарности Сестрам Эдерней."
[description_book_history_arx]
string="История Аркса. Майо Касмадиан."
[book_history_arx_content]
string="В древние времена величайший континент мира населяло пять людских племен.*Эти племена вечно воевали между собой, и чем выше становилась их организация, тем страшнее была война.*После долгих лет ненависти явился человек по имени Покселлис, который преуспел в объединении племен.*Он стал первым королем людской расы.**После Битвы Расколотых Щитов (170-й год), в Арксе наступил самый долгий в истории период мира.**За время правления Покселлиса была всего одна война - философско-религиозный конфликт, известный как 'Война Магов'.*Но, как ни ужасна была эта война, длилась она всего несколько месяцев, и королевская власть фактически не пошатнулась.**За последние годы своего правления Покселлис столкнулся со множеством угроз.*Начались набеги гоблинов, а в подземельях города завелись крысолюди, именуемые также крысюками.**Битвы были кровавы, но армии Покселлиса разгромили врагов.*И снова в Арксе воцарился мир.**Начались исследования океанов.**Множество кораблей отправлялось в море на поиски новых земель и сокровищ.*Но в 216-м году на землю рухнул метеорит. Сперва никто не беспокоился по этому поводу, хотя некоторые прорицатели утверждали, что это - дурное знамение.**Однако через несколько лет солнце наше начало гаснуть. Оно давало все меньше света, и холод сковал землю. Ланшир, сын Покселлиса, распорядился, чтобы вся столица переселилась под землю, в заброшенные шахты гномов.**Потребовались многие труды, но все понимали, что работают ради собственного спасения, и никто не жаловался на тяготы.**Был заключен мир со всеми соседями, исключая лишь крысолюдей, с которыми договор невозможен.*Но и атаки крысюков стали более редкими.**Все, как один, трудились во имя спасения Аркса и собственной жизни.*Договор закрепил по ярусу подземелья за каждой из рас в награду за их усилия.**Гармония эта длилась пять лет, и за это время солнце окончательно погасло. Все возможное для спасения жителей Аркса было сделано, но, тем не менее, многие не пережили этого.**Хуже того - судьба других городов континента оставалась неизвестной, хотя логично предположить, что они последовали нашему примеру.**Впоследствии новообразованная Гильдия Путешественников принесла сведения о внешнем мире.**Существуют и другие крепости, помимо Аркса, и они также скованы толстой броней льда.**Сообщение с ними возможно лишь при посредстве Гильдии, Гильдия же осуществляет и торговлю предметами роскоши между городами.*За исключением этих контактов, Аркс находится в полной изоляции."
[description_book_ancient_gods]
string="Древние боги. Абдул аль-Раиф."
[book_ancient_gods_content]
string="В начале времен боги были всемогущи. Они правили Арксом на протяжении нескольких эр, когда в мире еще не было людей.**О богах мы знаем мало, но, насколько нам известно, они были разгневаны распространением людской расы и покинули мир.**Древнейшие тексты утверждают, что исчезновение богов вызвано недостатком веры у первых смертных.*Двое богов жили в мире дольше прочих. Звались они Зогарк и Крагоз.**Зогарк был величайшим из всех, он повелевал громом, молнией и землетрясениями, ураганами - всей мощью стихий.*Но сила его высвобождалась лишь волею Крагоз.*Крагоз - богиня справедливости, покровительница равновесия и равенства.*Они нуждались друг в друге, и, возможно, потому правили миром дольше остальных, но пришло время, и они также покинули мир.*В наши времена часть древних культов забыта, люди научились сами управлять силами природы через посредство магии, а к богам обращаются лишь ради таких проблем, как плодородие, или по случаю праздников.*Люди почитают богов торговли и золота, удачи и даже нищеты, но забыли исконных богов, повелителей природы.**И в новую эру эти могущественнейшие из богов ушли в свой собственный мир, именуемый Ноден, где они ждут новых верующих, что позволят им возвратиться."
[description_book_kings_arx]
string="Короли Аркса. Гриноник Вормхилл."
[book_kings_arx_content]
string="Первым королем людей был Покселлис. Ему первому удалось объединить пять людских народов нашего континента в 170-м году.**Эти народы до той поры непрестанно воевали, и ни один из них не был достаточно силен, чтобы утвердить свою власть над остальными.*Покселлис был отважным человеком, и он сразился с вождями всех пяти народов в поединке. Эта история известна как Битва Расколотых Щитов. Покселлис вышел победителем изо всех поединков.**Но перед этим Покселлис посетил заброшенный храм в Горах Воющих Шахт. Оттуда он принес заговоренный щит, который и позволил ему одержать эти победы.**Став главой всех племен, Покселлис объявил себя королем Аркса. Новым королевством он правил мудро, честно и справедливо.**Правление его было долгим и полным процветания, невзирая на вторжения гоблинов и набеги крысолюдей, благо военное дарование государя Покселлиса позволяло ему отражать все нападения.**С потомками ему повезло меньше.*Двое старших его сыновей, Элоис и Никус, были бравыми воинами, но погибли раньше его.**К счастью, на момент смерти короля в 212-м году у него оставался еще младший сын, Ланшир, но он был слишком юн, чтобы принять власть.*Лорд Понсет правил как регент до совершеннолетия короля и устроил заговор с целью лишить Ланшира трона. Однако Понсет не был достаточно популярен, и козни его провалились. Ланшир был коронован в 16 лет, в 215-м году.**Королю Ланширу выпало нелегкое время; как раз тогда солнце начало гаснуть.*Именно ему принадлежит идея миграции в подземелье. Он сделал все, что мог, чтобы спасти столько людей, сколько могло поместиться в катакомбах.**Его дипломатический талант помог заключить союз со всеми расами Аркса, иначе переселение могло не успеть завершиться до наступления льдов.**Король Ланшир почтил память отца, перенеся его прах в новый склеп в подземелье, так что народ и сейчас может поклониться гробнице великого короля."
[description_book_great_inventions]
string="Великие изобретения Аркса. Эдрик Арол."
[book_great_inventions_content]
string="Человеческое воображение даровало миру немало фантастических изобретений. Людям еще памятны гигантские шары, что плыли по небу, поднятые силой нагретого воздуха; они в прошлом дали нам много открытий.*Те же шары предуведомляли нас о вторжениях, позволяя охранять границы без лишней траты сил.**Не менее замечательным изобретением можно по праву считать подводную лодку.**Эта чудесная конструкция стала главным оружием против пиратских и гоблинских эскадр, и мы надолго обрели господство над морями.**Лорд Марко, автор этого бесценного изобретения - один из самых почитаемых ученых во всей истории Аркса. Но самым важным и удивительным изобретением нельзя не назвать подземное королевство Аркс.*Конечно, это не столько новое изобретение, сколько новое использование старого; шахты были отстроены гномами, и гномы снабдили их уникальной системой вентиляции.**Однако истинное величие катакомбы приобрели под рукой человека...*Бывшие шахты стали автономным миром. Все расы получили в них по ярусу, в соответствии с соглашением 217-го года. Королевство это - живая иллюстрация могущества и целеустремленности людской расы."
[description_book_race_arx_content]
string="Расы Аркса. Цебрафи Нин."
[book_race_arx_content]
string="Взаимоотношения между расами Аркса никогда не были простыми.**Среди всех рас самая многочисленная - гоблины, причиной тому их чрезвычайная плодовитость. Но гоблинам никогда не удавалось организоваться в единое королевство, и потому они постепенно потеряли свое главенствующее положение.*К тому же гоблины не слишком умны. У них есть свой язык, но большинство говорит на примитивном диалекте речи людей. Они всегда пытаются подловить на чем-нибудь собеседника, чем немало того раздражают.*Они лживы, надменны, трусливы и крайне ленивы.*Союзниками людей они были лишь единожды во всей истории - во времена великого соглашения. Тогда они помогали нам строить подземное королевство, на время забыв о своей агрессивности и дурных манерах. Но стоило работе завершиться, как они вернулись к старому образу жизни.*Похоже, что ни на какую мирную деятельность, кроме торговли драгоценными камнями, они не способны.**Тролли - совсем другая порода.*Хотя они и сродни гоблинам, между ними не так уж много общего. Они слабовольны и медлительны.*По природе своей они не агрессивны, скорее доброжелательны. Но их чудовищная сила и легендарная выносливость делает их ценными союзниками и опасными врагами.*Их жизнь проста - она протекает между едой и сном. Они не сильны разумом, так что их нетрудно обмануть, но горе тому, кто попадется на этом: гнев троллей вошел в поговорки.**С крысолюдьми, или же крысюками, никто по доброй воле дела не имеет.*Общаются между собой они не словами, а знаками и писком.*Крысюки отличаются ловкостью, и потому в бою их нельзя недооценивать. Среди них - самые удачливые убийцы в Арксе. Они изящны и быстры. Их любимое оружие - отравленный клинок.*Крысюки жили в подземельях городских канализаций даже тогда, когда люди еще не покинули поверхность. Жизнь среди отбросов и экскрементов им, видимо, отлично подходит.*До сих пор редкие встречи с крысюками бывают кратки и чрезвычайно кровопролитны. Они порой заявляются в поселения людей, разыскивают среди мусора пищу и простейшие орудия. Крысюки постепенно утратили контакт со всеми прочими расами.**Гномы - ценители техники, инженерного дела и всяческого ремесла; они же - лучшие в мире кузнецы. Они поселились под землей задолго до прочих рас.*Лишь гномы в совершенстве знали горнорудное искусство и часто продавали руду людям.*У них извечная вражда с гоблинами, они воевали многократно и мечтали уничтожить весь гоблинский род.*Одна из величайших гномьих шахт послужила убежищем от холода и местом, куда был перенесен город Аркс. Гномы помогли построить основные системы обеспечения и осуществили немало работ (избегая владений гоблинов). Они всегда хорошо умели жить в тоннелях, и после ухода прочих рас с поверхности отправились дальше в глубину, где и продолжают расширять свои шахты.**Происхождение Сестер Эдерней - сплошная загадка.*Они выглядят, как нечто среднее между женщинами и змеями. Кожа их покрыта чешуей.*Мужчин у них нет вовсе, и нам неизвестно, как они размножаются.*Сестры чрезвычайно искусны в магии и не имеют себе равных в этом. Согласно одной из легенд, они имеют отношение к самому возникновению магии в мире.*Сестры обещали помощь королю людей, и они сотворили подземные растения, что кормят население и скот.**О драконах известно еще меньше. Однако ученые установили, что на любом из них - ровно 4815 чешуек."
[description_book_known_gods]
string="Знай своих богов и демонов. Теолог Бракконус."
[book_known_gods_content]
string="Аладор, порожденный на Омнисе, благодетельный бог:*По-видимому, покинул мир, отдав управление своим измерением людям. Передал им также власть над их судьбой.*Утверждают, что он был чрезвычайно могуществен, но до самого своего ухода с Омниса не пользовался полной своей силой.**Ксарм, порожденный на Омнисе, злой бог:*противоположность предыдущему.*Ксарм был очень сердит на Аладора за то, что тот освободил людей. Он не мог изменить сделанного Аладором, но попытался отнять у людей свободу, поработив их.**Акбаа, порожденный на Колтке, злой бог:*известен как бог разрушения, ибо полностью разрушил свой родной мир, он пользовался большим почетом и поклонением людей, так как помогал им в войнах.**Тиркио, порожденный на Арксе, благодетельный бог:*презирает суетность богатства. Прежде, чем обращаться к нему, рекомендуется избавиться ото всякого золота."
[description_book_landscapes]
string="Пейзажи Внешнего Мира."
[book_landscapes_content]
string="Пейзажи Внешнего Мира."
[book_calpal_journal]
string="Год 238, зеленый сезон, второй день недели Паука:*Карло велел мне проследить за королевой. Темное дело; Карло напомнил мне о 'добрых старых деньках', когда я работал на королевство, но это задание куда опаснее всех предыдущих.**Год 238, зеленый сезон, пятый день недели Кота:*следя за королевой, я заметил, что она обронила у статуи рядом с гробницей письмо. Я подождал, пока она уйдет, и переписал его...*Карло был очень доволен мной.**Год 238, зеленый сезон, шестой день недели Кота:*дело сделано. Королева мертва, и все возлагают вину на мятежников, что похитили королевское дитя."
[description_book_traveler_guild]
string="Гильдия путешественников. Историк Дормал."
[book_traveler_guild_content]
string="Гильдия Путешественников - первая организация, созданная после гибели солнца.*Ее основатели - группка закаленных трудностями странников, которые не пожелали вместе со всеми укрыться в катакомбах. Их было немного, но они разработали способы бороться с холодом при помощи алхимических препаратов.**Они построили себе ледяные укрытия и вырастили собак, устойчивых к морозам.*К ним присоединилось немало людей, не испугавшихся холода и стремившихся к свободе передвижения.**Так постепенно росла и укреплялась Гильдия Путешественников - ныне единственное средство сообщения между подземными городами. Их привечают повсюду и везде уважают: без них никто не узнает, что творится за пределами города."
