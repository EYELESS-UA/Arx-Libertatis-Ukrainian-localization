[kultar_killed_ylside03]
string="Это безумие! Акбаа голоден, и Исербиус хранит их как запас свежего мяса для своего господина. Если дать Акбаа шанс, он пожрет все..."
[player_kultar_killed_ylside04]
string="Култар, зачем ты стал работать на илсидов и Исербиуса?"
[kultar_killed_ylside04]
string="Когда я выбрался из тюрьмы, это казалось неплохой идеей... Исербиус, знаешь ли, умеет быть убедительным, и планы у него что надо... Он хочет вернуть Арксу солнце и вывести народ из этих крысиных нор... Для тех, кто, как я, побывал на Поверхности, этот план дорогого стоит..."
[player_kultar_killed_ylside05]
string="Тогда почему ты ему изменил?"
[kultar_killed_ylside07]
string="Жертвоприношения, смерти, кровь... А потом я узнал, что он ни о чем так не мечтает, как о том, чтобы избавиться от тебя. Это не по мне... Я был не прав до сегодняшнего дня, но теперь я нашел тебя — и помогу тебе..."
[kultar_killed_ylside05]
string="Возьми у меня эти доспехи."
[kultar_killed_ylside06]
