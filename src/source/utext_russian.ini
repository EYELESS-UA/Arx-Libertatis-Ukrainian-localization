[note_garrett_content]
string="Есть новый приказ от Гарретта: особый самоцвет погребён в гоблинских катакомбах, будьте осторожнее в тюрьме, не дайте им поймать вас, это разрушит наши планы."

[note_expedit_content]
string="Прошло шесть дней, и боюсь, что экспедиция провалилась — нам пришлось изрядно попотеть, чтобы прокрасться в эти руины, и я не уверен, стоило ли оно того. Мы обнаружили лагерь гоблинов возле одного из пунктов экспедиции. Ещё и эти надоедливые крысы… Нам нужно быть осторожными."

[note_exgob_content]
string="Твоя входить сюда, твоя вор, твоя гнить с червями! Вот твоя мусор, моя несчастный и бедный гоблин, надеяться вор не будет никогда просить еду, как моя."

[note_immersives_content]
string="Во время экспедиции мы наткнулись на старинный сейф, к сожалению он был пуст и весил с тонну, но он всё ещё выполнял свою основную функцию, поэтому я оставил в нём немного припасов на всякий случай. Открыть его было просто: две цифры кода выгравированы на задней стенке, третью разобрать невозможно, но подобрать её не составило труда."


