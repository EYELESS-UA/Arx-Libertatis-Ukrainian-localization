[description_note_ellie]
string="Это письмо для тебя, девушка моей жизни, моя любимая Элли Роуз. Я всегда думаю о тебе, дни и ночи напролёт... Закаты, бриз, всё напоминает мне о тебе, даже холод пещер. Если бы только у меня хватило смелости рассказать тебе, что я чувствую, когда-нибудь я это сделаю… Я сделаю это, когда моя смена закончится."

[description_book_cells]
string="Тюремный учёт"

[book_cells_content]
string="УЧЁТ ЗАКЛЮЧЁННЫХ.***ИЗОЛЯТОР:**266-ой год, жёлтый сезон, неделя Змеи, день первый.*Камера 1: человека на продажу. Примечание: 'Плохая человека, найдена на 2-ом ярусе, она спать, очень странно'.**266-ой год, зелёный сезон, неделя Орла, день шестой.*Камера 2: человека на продажу. Примечание: 'Азук привести человека ко мне, моя не знать кто это такая, смешная лысая человека выглядеть аппетитно'.***КАМЕРА СУДЕБНОГО ОЖИДАНИЯ:**266-ой год, зелёный сезон, неделя Орла, день первый.*Камера 1: плохой гоблин 'Польсий', обвинение: богохульство и нападение на вождя Алотара.**266-ой год, зелёный сезон, неделя Коровы, день седьмой.*Камера 2: заключённый гоблин 'Болзон', обвинение: убийство двух гоблинов — моя убил его по приказу короля.**266-ой год, зелёный сезон, неделя Собаки, день пятый.*Камера 3: заключённый гоблин 'Зурок', обвинение: плохой гоблин, вор.**266-ой год, белый сезон, неделя Крысы, день второй.*Камера 4: заключённая человека, обвинение: несанкционированный доступ к запрещённой камере, она сбежать, вождя очень злиться на меня.**266-ой год, белый сезон, неделя Крысы, день второй.*Камера 5: заключённая человека, обвинение: плохая человека напасть на друга Колтора, пьяная опасная человека сейчас в камере."

[note_aldaner]
string="Босс, наша поймать человеку на заставе, секта сделала срочный заказ, продали за 40 золотых монет.**Толонео."

[description_book_celly]
string="Тюремные отчёты"

[book_celly_content]
string="266-ой год, жёлтый сезон, неделя Змеи, день первый, свидетельства и отчёты для любимая вождя:** Наша продать примерно три человеки… Не-а, моя вырвать эта страница и написать фантастические истории, но сначала съесть пирог, твоя читать это, вонючая вождя… Моя скучать..."

[description_book_color_code]
string="Энселмо Тричер, «Искусство магии: свитки»"

[book_color_code_content]
string="С момента открытия магии, самая лучшая интерпретация, которая была ей дана, даёт магу глубокое восприятие. Магия, которую вы будете изучать, является универсальным типом — это магия Эдерней.**Свитки обозначаются цветной маркировкой, которая является показателем того, насколько мощный той или иной свиток. Чем выше уровень цветовой маркировки, как это обозначено далее, тем выше эффективность свитка:**Уровень 1: белый.*Уровень 2: жёлтый.*Уровень 3: оранжевый.*Уровень 4: зелёный.*Уровень 5: голубой.*Уровень 6: красный.*Уровень 7: пурпурный.*Уровень 8: синий.*Уровень 9: коричневый.*Уровень 10: чёрный."

//FORK UPDATE

[description_book_greu]
string="История Грю (неразборчивые записи)"

[book_greu_content]
string="Грю решил написать историю.**Грю хотеть поговорить о странных завываниях. Грю думать, что это дракон. Грю напуган. Дракон поблизости? Однажды Грю всё узнать..."


