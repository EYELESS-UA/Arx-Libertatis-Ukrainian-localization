string3="О господин мой, я разорен. Но у меня осталась любовь моей прекрасной Алисии, она никогда меня не оставит..."
[tafiok_my_name]
string="Приветствую тебя, путник. Я — Тафьок, здешний ювелир. Выбирай все, что приглянется. Если что-нибудь тебя заинтересует — бери и плати. Если желаешь что-то продать — положи это в сундук, я предложу достойную цену."
[tafiok_bad_days]
string="Добро пожаловать. Я — ювелир Тафьок. Прошу извинения за мой скудный ассортимент, но тролли отказываются работать и подрывают мою торговлю."
[player_another_way]
string="А что, разве нет другого источника драгоценных камней?"
[tafiok_no_goblins]
