[chinkashh_portal01]
string="Пусть мое присутс-с-ствие не бес-с-спокоит тебя, Ам Ш-ш-шегар. Мне подтвердили твое право. Пророчество ис-стинно — ты долж-жен его ис-с-сполнить. Я не долж-жна направлять тебя к цели, Ам Ш-ш-шегар, но я позволю с-с-себе оказать некую ценную помощ-щь. Иди за мной; я научу тебя проходить через с-с-стены этого королевс-с-ства."
[chinkashh_portal02]
string="На каж-ждом этаже королевс-с-ства у моих сес-с-стер есть такая комната. Чш-штобы воссспользоваться порталом, ссстань перед ним и прочитай заклятие, его пробуждающщщее."
