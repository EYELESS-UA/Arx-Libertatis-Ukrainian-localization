string="Помните, что сила вашей атаки зависит от времени на её подготовку."

[ready_tuto_3]
string="Если вы нажмёте клавишу движения во время подготовки атаки, вы нанесёте направленный удар. К примеру, если вы пойдёте налево, зажав левую кнопку мыши, вы нанесёте рубящий удар справа налево."

[ready_tuto_4]
string="Вместо заклинания тушения вы можете потушить факел с помощью бутылки с водой. Чтобы её наполнить, найдите умывальник и используйте пустую бутылку на нём."

[ready_tuto_5]
string="Если вам нужно дать кому-либо денег, ваш кошелёк можно найти на экране справа, возле вашего журнала и инвентаря."

[ready_tuto_5b]
string="Боитесь темноты? Не забудьте взять с собой факел или лампу, чтобы осветить путь."

[ready_tuto_6]
string="Продавцы оружия могут починить ваше повреждённое снаряжение. Просто отдайте его им, и они починят его за некоторую плату."

[ready_tuto_7]
string="Чтобы починить своё оружие, используйте его на наковальне. В зависимости от вашего навыка ремесла, починка будет более или менее эффективной."

[ready_tuto_8]
string="Чтобы заняться рыбалкой, сперва найдите удочку (или сделайте её сами с помощью палки и верёвки), а затем используйте её возле реки или озера."

[ready_tuto_9]
string="Купите кольцо для ключей как можно скорее! Это позволит вам вместить все ключи в одном предмете."

[ready_tuto_10]
string="Пробовали ли вы выковать оружие? Найдите невыкованный клинок, опустите его в огонь, задействуйте мехи, а затем ударьте по лезвию молотком! Эффективность зависит от вашего уровня владения навыком."

[ready_tuto_11]
string="А вы знаете, что можете пополнить свой колчан? Для этого используйте его на продавце оружия, и он за небольшую плату восполнит ваш запас стрел."

[ready_tuto_12]
string="А вы знаете, что можете отравить своё оружие с помощью яда? Результат зависит от вашего уровня владения навыком."

[ready_tuto_13]
string="А вы знаете, что можете добывать драгоценные камни? Просто найдите кирку и примените её к кускам драгоценных камней, которые вы найдёте инкрустированными в стенах."

[ready_tuto_14]
string="Не стесняйтесь экспериментировать! Одна проблема может иметь отличные решения в зависимости от ваших уровней навыков и предметов, которые у вас есть."

[ready_tuto_15]
string="Помните, что хорошо приготовленный яблочный пирог излечит и насытит вас быстрее, чем гриб."

[ready_tuto_16]
string="Будьте осторожны! Не пейте слишком много вина, или вы напьётесь!"

[ready_tuto_17]
string="Вы убили кого-то, кто оказался нужен позже в игре? Не волнуйтесь: ваша игра не окончена! Всегда есть другой способ продолжить, если важный персонаж мёртв."

[ready_tuto_18]
string="Если вы хотите остановить заклинание, вы можете переключится в режим внимательного исследования, выбрать заклинание, которое желаете остановить и дважды нажать на его значок в правом верхнем углу. Также для этого можно просто нажать на колёсико мыши или, альтернативно, на клавишу <6> (по умолчанию)."

[ready_tuto_19]
string="Знаете ли вы, что можете колоть врагов прямо в шею? Чтобы мгновенно убить таким образом врага, вам нужно подобраться к нему со спины, а для этого вам пригодится высокий навык незаметности."

[ready_tuto_20]
string="В пылу схватки будьте осторожны, когда наносите удары. Если вы попадёте в камень, стену или другую жёсткую поверхность, то это может снизить прочность вашего оружия."

[ready_tuto_21]
string="Пробовали ли вы когда-нибудь сотворить заклинание «Огненный шар» на курицу?"

[ready_tuto_21b]
string="Экзотические руны усовершенствуют ваши заклинания. Для сотворения улучшенного заклинания вам понадобятся все необходимые экзотические руны."

[ready_tuto_22]
string="Не забывайте, что вы можете назначить горячие клавиши для противоядий, зелий магической энергии и лечебных зелий! Например, горячая клавиша для использования лечебного зелья может здорово помочь вам в бою. Горячие клавиши по умолчанию: <G>, <H> и <Y>."

[ready_tuto_23]
string="Знаете ли вы о существовании контр-магии? Попробуйте использовать заклинание «Тушение» на врага, произносящего заклинание «Огненный шар», и если ваш навык магии выше — вражеский огненный шар будет потушен."

[ready_tuto_24]
string="Для того, чтобы красть предметы из сумок персонажей, вам необходимо более 50 очков незаметности. Подойдите вплотную к персонажу, и в левом нижнем углу у вас появится иконка кошелька; нажмите на неё — и вы увидете инвентарь жертвы... Чтобы красть более крупные предметы, вам необходимо добавить больше очков в незаметность."

[ready_tuto_25]
string="Вы же видели бегающих по пещерам мышей и крыс? Оставьте им немного сыра или мяса — они будут довольны."

[ready_tuto_26]
string="Ношение кожаной брони не будет издавать столько же шума, сколько ношение кольчуги. Задумайтесь об этом, когда захотите передвигаться незаметно."

[ready_tuto_27]
string="А вы знаете как зачаровывать оружие, броню и кольца? Сначала используйте подходящий реагент на них, а затем примените заклинание наложения чар! Результат зависит от вашего навыка магии."

[ready_tuto_28]
string="А вы знали, что воду в умывальниках можно отравить? Это может быть очень полезным..."

[ready_tuto_29]
string="Если вы хотите завести нового друга, то не стесняйтесь и покормите пса!"

[ready_tuto_30]
string="Не забывайте искать и использовать экзотические руны, они увеличат эффективность заклинаний, а также дадут вам доступ к новым возможностям. Например, улучшенное заклинания ночного зрения позволит вам видеть сквозь двери, распознавать всех ближайших противников и искать предметы, это может вам помочь на вылазках..."

[ready_tuto_31]
string="Если вам нужно немного золота, не забудьте посетить бойцовский клуб Мигеля. Там вы можете участвовать в боях или делать ставки!"

[ready_tuto_32]
string="Вы можете подслушивать разговоры, если вас не видят. Это может помочь вам узнать полезную информацию."

[ready_tuto_33]
string="А вы знали, что тушение факелов может быть полезным? Вы можете потушить факел, используя заклинание тушения или бутылку воды. Потушив свет, вы станете более незаметными."

[ready_tuto_33B]
string="А вы знали, что тушение факелов может быть полезным? Вы можете потушить факел, используя заклинание тушения или бутылку воды. Потушив свет, вы станете более незаметными."

[ready_tuto_34]
string="Вы сами можете варить зелья: используйте ступку, чтобы измельчить травы в порошок. Затем высыпьте порошок в пустую бутылку. Примените бутылку с порошком на перегонном аппарате. Результат зависит от вашего навыка ремесла."

[ready_tuto_35]
string="ЛЮКИ: благодаря люкам у вас есть доступ к крышам, фасадам и обходным путям."

[ready_tuto_35b]
string="ЛЮКИ: благодаря люкам у вас есть доступ к крышам, фасадам и обходным путям."

[system_fire_creative]
string="Вы можете подойти к активированию ловушек творчески. Если за вами гонится большое количество врагов — встаньте рядом с горючим мусором и сотворите заклинание «Возгорание». Сжигает врагов за короткое время, но будьте осторожны с огнём!"

[tutorial_stealth_mod]
string="ИГРАЙТЕ ПО-СВОЕМУ 2: Многие способности, например, как режим скрытности, могут быть использованы для разных целей.**-Используйте его, чтобы сделать ваши шаги тише, а также чтобы прятаться в тенях (по умолчанию — <C>).*-Оставайтесь незамеченным во время подслушивания разговоров, чтобы получить полезную информацию.*-Делайте мгновенные скрытные убийства, атакуя ничего не подозревающих врагов со спины (требуется 30 очков незаметности и кинжал или короткое оружие).**Эффективность незаметности зависит от количества вложенных в навык очков."

[tutorial_access_mod]
string="ИГРАЙТЕ ПО-СВОЕМУ 3: Экспериментируйте и ищите альтернативы. Чтобы пересечь дверь, вы можете:**-Найти ключ.*-Воспользоваться обходным путём.*-Использовать набор инструментов для взлома.*-Подкупить управляющего для получения доступа.**Любая задача имеет несколько решений."

[tutorial_rooftops_mod]
string="ФАСАДЫ И КРЫШИ: Используйте навесы, фасады и крыши, чтобы:**-Скрываться от преследований;*-Избегать прямого столкновения с противниками;*-Находить обходные пути;*-Внезапно нападать на врагов, спрыгивая на них и оглушая."

[system_no_lever]
string="Найдите палку и соедините её с основанием рычага, чтобы починить его."


