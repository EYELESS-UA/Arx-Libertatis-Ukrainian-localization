[Poxsellis_greetings]
string="Итак, ты полагаешь, что уже преодолел все преграды?.. Но теперь тебя ждет худшее, что ты только мог себе представить... Ты никогда не выйдешь отсюда живым. Поверь мне — мертвые не лгут..."
[Poxsellis_attack]
string="Вор!.. Ты пожалеешь об этом... Эй, верные мои слуги, убейте его!"
[Gladivir_greetings]
string="У меня, кажется, новый гость... Кто ты такой? Странник? Грабитель гробниц?"
[player_looking_for_shield]
string="Кто здесь?"
[Gladivir_no_no_no]
string="Я — Гладивир, которого смертные именуют призраком, Страж Щита Древних..."
[player_give_riddle]
string="Призрак... Я пришел за этим щитом..."
[Gladivir_challenge]
string="За этой дверью — путь, что ведет к Щиту. Но достоин ли ты хотя бы прикоснуться к нему? Щит наделен великой силой, и лишь истинно мудрый сможет взять его..."
[player_doubts_riddle]
string="Тогда испытай меня."
[Gladivir_cantlie]
string="Знай, о путник: привидения никогда не лгут… Внимай же моим словам. Если ты поймешь их, то сумеешь встать на путь, ведущий к Щиту Древних."
[player_ask_riddle]
string="Ну что ж, говори..."
[Gladivir_riddle]
string="Ты идешь от заката к рассвету. Чтобы миновать солнце, узнай и почти шесть знаков шести Древних... Сперва поверни плиты так, чтобы они указывали на шесть домов Древних."
[Gladivir_riddle_remind]
string="Напомню тебе: ты идешь от заката к рассвету. Чтобы миновать солнце, узнай и почти шесть знаков шести Древних... Сперва поверни плиты так, чтобы они указывали на шесть домов Древних."
[player_riddle_off01]
string="Уж не связаны ли эти руны с теми знаками, что я видел на земле перед тем, как войти сюда?"
[Gladivir_ecourage]
string="Ну что ж, отлично... Ты на верном пути... Теперь помести каждый камень на место, соответствующее его дому..."
[player_riddle_off02]
string="Очевидно, это еще не все камни Древних..."
[player_riddle_off03]
string="Теперь осталось понять, какой камень относится к какой колонне..."
[florence_affraid_traveler]
string="О-о-о... Подойди… Подойди, путник... я не желаю тебе зла... Выслушай меня… Помоги мне — и я вечно буду тебе благодарна..."
[florence_was_part_world]
string="При жизни я была знатной и любимой... Меня убили... Я видела своего убийцу, но не знаю, за что он так со мной поступил... Я жажду правосудия, о путник, ибо дух мой осужден скитаться под землей, пока моя смерть не будет отомщена..."
[player_who_murderer]
string="Кто же твой убийца? И что я могу сделать для тебя?.."
[florence_dont_remember]
string="Человек с одним глазом... Должно быть, кто-то приказал ему сделать это. Пусть власти Аркса покарают моего убийцу — и я смогу упокоиться с миром..."
[player_who_are_you]
string="Скажи мне: кто ты?"
[florence_reveal_later]
string="Ты узнаешь, когда настанет час. Прежде ты должен помочь мне... Найди тех, кто повинен в моей смерти..."
[dragon_leave_place_misc]
string="Человек... Убирайся отсюда, жалкая тварь, спасай свою ничтожную жизнь... И даже не думай стащить что-нибудь, если в самом деле хочешь, чтобы я отпустил тебя."
string2="Гр-р-р... Прочь из моей норы, человечишка, если не хочешь потерять свою жалкую жизнь. И не надейся, что сможешь прихватить что-либо с собой!"
string3="Убирайся вон, козявка, если надеешься сохранить остатки тепла! И не забудь, что я глаз не спускаю с твоих вороватых конечностей..."
[dragon_told_you_misc]
string="Я предупреждал тебя, воришка! Узри же гнев дракона!"
string2="Неужели воровство в крови у всех вас, людей?"
string3="Я преподам тебе простой урок, который стоит усвоить: уважай сильных..."
[player_well_actually]
string="Я пришел сюда в поисках драконьего яйца..."
[dragon_grrrr_human]
string="Гр-р-р, Страж... Неужели твои повелители из Нодена могли приказать тебе такое? Они хотят, чтобы я принес моих потомков в жертву?.."
[player_understand_surprise]
string="Я должен спасти Аркс и его обитателей. Акбаа, бог разрушения, уже..."
[dragon_enough_grrrr]
string="Р-р-р-р-р, можно подумать, я этого не знаю... Я спрашиваю: зачем тебе яйцо дракона?.."
[player_because_only_way]
string="Я хочу создать оружие, которым можно уничтожить воплощение Акбаа, но для этого мне необходимо драконье яйцо."
[dragon_not_want]
string="Ты ничего не знаешь о драконах, раз смеешь просить меня отдать в жертву детеныша!"
[player_not_want]
string="Что же мне делать?"
[dragon_well_then]
string="Попробуй доказать мне, что стоишь такой жертвы."
[player_what_fight]
string="Должен ли я сразиться с тобой?"
[dragon_ah_ah]
string="Гм... Гр-р-р. Почему бы и нет?.. Но это было бы не слишком честно... Нет, у слова «стоить» не одно значение. Все вещи чего-то стоят, великие и малые. Например, можешь ли ты принести мне столько золотых монет, сколько чешуек у дракона?"
[player_not_how]
string="Но я не знаю, сколько у дракона чешуек..."
[dragon_not_how]
string="И это — тоже часть доказательства, Страж..."
[player_yes_know]
string="М-м-да... Кажется, я где-то об этом читал..."
[dragon_leave_egg_misc]
string="Не приближайся к яйцам — они не любят тепло..."
string2="Уж не собираешься ли ты похитить яйцо, а? Неужели ты настолько глуп, человек?"
string3="Попробуй только прикоснуться к ним — и я разорву тебя на мелкие клочки!"
[dragon_gold_misc]
string="Итак, ты принес мне золото?"
string2="Чем ты занят, Страж? Считаешь мои чешуйки? А ты не пробовал узнать другим способом, сколько чешуек у дракона? Интересно: умеешь ли ты читать?"
[dragon_gold_right]
string="Все сходится, Страж... Возьми это яйцо, и пусть мудрость драконов направляет твой меч..."
[dragon_gold_wrong]
string="Ты ошибся... Чешуек у меня гораздо больше."
string2="Так мало? Я могу и обидеться..."
string3="Неужели у меня так мало чешуек?"
[dragon_leave_place_again_misc]
string="Не холодно ли тебе?.."
string2="Неужели ты не мерзнешь здесь, среди льда?"
[dragon_explain_guardian]
string="Не промерз ли ты насквозь, о Страж?"
[dragon_explain_guardian2]
string="Я знаю, кто ты, и нечего удивляться; я понял это с нашей первой встречи. Но ты сам должен осознать свою сущность."
[player_miserabilis]
string="Тогда почему ты обращался ко мне как к обычному человеку?"
[dragon_explain_guardian3]
string="Ха-ха... Традиции — прежде всего..."
[dragon_explain_guardian4]
string="Как же давно я не видел посланников Нодена! Рад, что ты сумел вернуть свою память. Потеря памяти — это наибольшее неудобство для Стражей; впрочем, у вас есть и немалые преимущества перед обитателями нашего мира..."
[player_question_dragon]
string="Какие?"
[dragon_explain_guardian5]
string="Ну, у Стражей есть своего рода предвидение, способность перемещаться во времени и видеть по-другому те ситуации, которые привели бы их к гибели или загнали в тупик. Ты наверняка чувствуешь это, даже если не понимаешь меня сейчас. Главное — ты обречен на успех. Не бойся использовать эту способность — она поможет тебе..."
[player_question_dragon2]
string="Может, у меня есть и другие способности, о которых я не знаю?"
[dragon_explain_guardian6]
string="Едва ли. Уже очень давно Ноден не давал своим Стражам особых сил... Возможно, потому, что иногда лекарство оказывалось злее болезни... Это напоминает о твоей главной слабости: ты — порождение Нодена, ты похож на человека, но родом ты не из этого мира. Ты можешь делать многое, но не все: ты не знаком с миром, Ноден вложил в тебя некие знания, о которых ты не помнишь, и все это не раз собьет тебя с пути. Разговор не всегда пойдет так, как ты ожидаешь. Слова, которые сорвутся с твоих губ, не всегда будут теми, что ты хотел бы произнести. Но не бойся, Страж. Это твоя судьба: в Арксе ты всегда будешь чужаком, странником, существом выше человеческого понимания."
[player_dragon6]
string="Я должен найти вход в храм..."
[dragon_scenar6]
string="Неужели тебя задерживает обычная дверь?.. Э-э-эх, где они, Стражи минувших дней?... Не стой тут на морозе, не то простудишься! Хэ-хэ-хэ!"
[player_dragon8]
string="Я не смог уничтожить метеорит прикосновением..."
[dragon_scenar8]
string="Не все так просто, как хотелось бы... Ты противостоишь богу, Страж, а боги не бывают легкими противниками! Тебе нужна защита — предмет, способный охранить тебя. Помнится мне, у людей раньше было что-то подобное..."
[player_dragon12]
string="Илсиды захватили всех людей королевства в плен..."
[dragon_scenar12]
string="Я знаю об илсидах не многое, но не бросайся в бой с ними очертя голову, друг мой... Действуй хитростью — нелегко сражаться с тем, кого не видишь..."
[player_dragon14]
string="Я ищу тайное укрытие последователей Акбаа..."
[dragon_scenar14]
string="Поспеши... Настал час финальной схватки, друг мой, схватки, где предназначение посланца Нодена должно превозмочь все. Собери свою отвагу и решимость, используй все слабости врага — и победи..."
[player_dragon_ghost]
string="Призрак женщины просил меня отомстить за ее смерть..."
[dragon_scenar15]
string="Призраки — это страждущие души, которые не могут найти покоя. Часто для их упокоения достаточно разъяснить обстоятельства их смерти и разоблачить убийцу..."
