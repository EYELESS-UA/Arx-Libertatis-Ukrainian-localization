string="ТОТ, У КОГО НЕТ ИМЕНИ: Вы приняли имя, которое дал вам Култар."

[achievement_description_2]
string="ПОБЕГ: Вам удалось сбежать из гоблинской тюрьмы."

[achievement_description_14]
string="МОЯ ПОЛЬСИЙ: Вы освободили Польсия из гоблинской тюрьмы."

[achievement_description_15]
