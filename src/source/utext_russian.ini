string="Но ты — моя единственная надежда! Не могу же я довериться кабацкому сброду! Лучше уж поверить чужаку."
[Player_ortiern3]
string="Я же тебе сказал..."
[Ortiern_briefing4]
string="Просто доберись до замка и расскажи королю, что здесь творится! Это же жизненно важно! После землетрясения путь к замку преградил обвал, и мы заперты тут. Скажи ему, что илсиды объявили нам войну!"
[Player_ortiern4]
string="Ты, верно, бредишь! Ты же сам сказал, что путь завален!"
[Ortiern_briefing5]
string="Ты сумеешь пробраться через пещеры гоблинов двумя ярусами ниже и найти выход обратно на наш ярус. Это опасно, но другого выхода нет! Если ты отыщешь дорогу, то вернешься в королевство людей."
[Player_ortiern5]
string="Ни за что! Я только что спасся из тюрьмы гоблинов!"
[Ortiern_briefing6]
string="Вот что тебе поможет: разрешение на торговлю самоцветами. Они сочтут, что ты торговец, и не нападут. Ты должен пробраться. Я останусь тут. Ты — наша единственная надежда, наемник!"
[Ortiern_repeat_briefing]
string="Отправляйся скорее, ты — наша единственная надежда!"
string2="Ты понял? Отлично... Иди в пещеры гоблинов, с разрешением, которое я тебе дал, они не тронут. Найди дорогу в замок короля."
string3="Когда увидишь короля, он велит расчистить путь и пришлет подкрепления против илсидов..."
string4="Если не сделаешь этого для меня — сделай для королевства, наемник!"
[Ortiern_repeat_briefing_caves]
string="Отправляйся скорее, ты — наша единственная надежда!"
string2="Когда увидишь короля, он велит расчистить путь и пришлет подкрепления против илсидов..."
string3="Если не сделаешь этого для меня — сделай для королевства, наемник!"
[Ortiern_misc_hi]
string="Я в долгу перед тобой!"
string2="И снова благодарю тебя, наемник!"
[Kacelbem_misc_before_guardian]
string="Я не знаю тебя и не верю тебе."
string2="Возможно, ты послан демоном. Оставь меня."
string3="Ты не человек - ты демон! Помогите! Я видел демона!"
string4="Еретик!"
[Kacelbem_misc_after_guardian]
string="Спаси, спаси нас, о Страж!"
string2="Я знал, что ты не простой человек!"
string3="Сверши свою судьбу, о Страж, срази Акбаа!"
string4="Благодаря тебе и Нодену еретики погибнут!"
[player_king_1stmeet1]
string="Я — Ам Шегар. Я бежал из гоблинской темницы. Меня прислал сюда Ортьерн. Он и его люди на заставе оказались в ловушке. Он просит расчистить путь к замку — дорогу перекрыл обвал. Кроме того, на них напало несколько илсидов, и со второй атакой им не совладать."
[king_player_1stmeet1]
string="Великие небеса! Это — страшные новости, Ам Шегар. Ты оказал королевству великую услугу и заслужил нашу глубочайшую благодарность. Ты, несомненно, будешь вознагражден за тот риск, что принял, чтобы доставить нам эту весть. Однако обвал — серьезная трудность. Надо поразмыслить, как справиться с нею."
[king_player_1stmeet1bis]
string="Я нашел выход. Ты отнесешь это письмо Погу, владыке троллей. Его народ — превосходные рудокопы, они помогли нам построить этот город. Тролли живут ярусом ниже нас, ты их, наверное, уже видел... Они так же уродливы, как гоблины, но впятеро больше их ростом. Однако с троллями у нас превосходные отношения. Уверен: они не откажутся немедленно помочь."
[player_king_1stmeet2]
string="Видимо, мне не избежать участия в этих делах... Ну что ж, я помогу, но надеюсь на ответную помощь."
[king_player_1stmeet2]
string="Не сомневайся: награда будет достойна поручения."
[player_king_1stmeet3]
string="Что проку в золоте, если я не могу восстановить собственную память!"
[king_player_1stmeet3]
string="Убежден: она вернется к тебе. Наверное, гоблины сильно ударили тебя по голове, вот и все. Не беспокойся. А теперь, прошу тебя, доставь мое письмо Погу, владыке троллей..."
[king_player_1stmeet_misc]
string="Прошу тебя, Ам Шегар, передай сообщение владыке троллей Погу."
string2="Уверен: понемногу твоя память к тебе вернется."
string3="Что ж, больше тебя здесь ничто не задерживает."
string4="Спеши! Мои люди на заставе в ловушке!"
[king_player_rocksaway1]
string="И снова благодарю тебя, Ам Шегар. Камни убраны. Ты вновь заслужил нашу признательность и награду. Ты необходим королевству, и я хотел бы предложить тебе официальный титул и звание..."
[king_player_rocksaway2]
string="Ах, да... как ты думаешь, если я сделаю тебя..."
[Carlo_breaks_in1]
string="Ваше величество! Мы обнаружили признаки того, что начат новый ритуал..."
[king_player_rocksaway3]
string="Хм. Третий раз за эту неделю. Где на этот раз?"
[Carlo_breaks_in2]
string="У вентиляционного хода, ваше величество. Возможно, это связано с убийством Фалана Орбипланакса?"
[king_player_rocksaway4]
string="Вероятно... Я попрошу взглянуть нашего нового друга. Спасибо, Карло, ты свободен!"
[Carlo_breaks_in3]
string="Слушаю, государь."
[king_player_rocksaway5]
string="Ну что ж... А что ты думаешь об этом? Я предлагаю тебе разузнать, что удастся, об этой таинственной секте. Я почти уверен, это они убили Фалана Орбипланакса, нашего старого астронома. Мне нужен человек, которого еще не знают как королевского агента, человек находчивый и отважный. Станешь ли ты этим человеком?"
[player_king_rocksaway1]
string="Это все немного странно, ваше величество, но я попытаюсь..."
[king_player_rocksaway6]
string="Уверен: ты меня не разочаруешь. Даю тебе право расспрашивать любого из моих подданных. Стража, этот человек может передвигаться во дворце совершенно свободно! И еще, дорогой Ам Шегар, вот ключ от одного из королевских покоев — чувствуй там себя как дома."
[player_king_rocksaway2]
string="Это очень великодушно с вашей стороны..."
[king_player_rocksaway7]
string="Не о чем говорить! Мы соберем совет, как только ты доставишь новости обо всех этих делах."
[king_player_rocksaway_misc]
string="Как только ты добудешь хоть какие-то сведения, мы соберем совет."
string2="Я рад, что могу положиться на твою помощь, Ам Шегар."
string3="Как тебе понравилось твое новое жилье?"
string4="Да помогут тебе боги в твоих поисках."
[king_krahoz]
string="Итак, Крагоз вернулась к нам. Тысяча благодарностей тебе за честь и доблесть, Ам Шегар. Спеши к сестрам Эдерней. Они будут счастливы получить назад свое сокровище и больше не будут досаждать мне... Королевство Аркс не забудет твоих заслуг."
[player_king_gold]
string="Для спасения Аркса мне нужно немного золота..."
[king_player_gold]
string="Нельзя сказать, что наше королевство сказочно богато, Ам Шегар, но после всего, что ты совершил, мы не можем отказать тебе в этой скромной сумме."
[king_gard_warmeet1]
string="Мне донесли о беспорядках на нижних ярусах города. Предупреди солдат на заставе!"
[guard_king_warmeet1]
string="Слушаюсь!"
[king_warmeet2]
string="Есть ли новости об илсидах, друзья?"
[carlo_warmeet1]
string="Наши люди удерживают форт, государь."
[felnor_warmeet1]
string="Необходимо разыскать их логово, прежде чем они снова нападут..."
[chinkashh_warmeet1]
string="Если бы люди чуть получше разбирались в волшебстве, все с-стало бы куда прощ-щ-ще..."
[kacel_warmeet1]
string="Всякий илсид есть еретик и должен быть уничтожен!.."
[king_warmeet3]
string="Королевство не может мириться с этой постоянной угрозой!"
[king_warmeet4]
string="Двадцать лет группка бунтовщиков издевается над моими лучшими людьми. Эти дни подходят к концу. Карло, ты понял меня?"
[carlo_warmeet2]
string="Но, государь, мы ведь почти не сталкиваемся с этими мятежниками последнее время... Может, они сами стали илсидами?"
[king_warmeet5]
string="Не желаю слышать никаких «может», Карло. Я требую результатов. Ты понял?"
[king_warmeet6]
string="Еще нам надо разобраться с землетрясениями. Они становятся все чаще и сильнее."
[felnor_warmeet2]
string="Подземные толчки в Арксе - дело обычное, но они происходят все чаще. Вероятно, канал энергии, созданный последователями Акбаа, нарушает природное равновесие... Это надо остановить и как можно скорее..."
[king_warmeet7]
string="Думаешь, есть опасность глобального обвала?"
[chinkashh_warmeet2]
string="Если бы было так, наш-ш-ш орден знал бы... С-сейчас-с-с главная опас-снос-с-сть — это Акбаа..."
[king_warmeet8]
string="Будьте бдительны оба и сообщите сразу же, как узнаете что-то новое..."
[king_council_come_start]
string="Итак, все члены совета на месте, начнем! Фелнор, что тебе удалось узнать из записей Фалана Орбипланакса?"
[felnor_council_see_note]
string="Так, секундочку... Фалан заметил что-то странное в поведении стражника по имени Эрцог. Он пишет, что видел Эрцога проводящим черный ритуал и приносящим в жертву животное. Вероятно, именно Эрцог повинен в убийстве... А может, он даже верховный жрец культа Акбаа. Вот, слушайте: «Я обнаружил доказательства существования культа, желающего привести в Аркс Акбаа»."
[king_council_take_erzog]
string="Этот Эрцог всегда казался мне подозрительным. СТРАЖА! Бросить Эрцога в темницу!"
[player_council_mentioned_akbaa]
string="Фелнор, кто такой этот самый Акбаа?"
[kacelbem_council_akbaa_demon]
string="Акбаа — могучий демон, бог разрушения. Этот культ пытается пробудить его и привести в Аркс. Святотатство — позволять такому свершиться. И, более того, это будет катастрофой для всего живого, для самого мира..."
[felnor_council_contact_noden]
string="Да-да, вот, слушайте дальше: «Этим вечером я свяжусь с Ноденом и запрошу их помощи»."
[King_council_noden]
string="С Ноденом?"
[felnor_council_yes_noden]
string="Ноден - это измерение, которое управляет существованием богов. Оно поддерживает вселенское равновесие, не давая богам завоевать абсолютную власть."
[kacelbem_council_fallan_really]
string="Если Фалан и впрямь сумел связаться с Ноденом, оттуда могли отправить к нам Посланника, чтобы остановить Акбаа..."
[King_council_gardian]
string="Посланника?"
[felnor_council_gardian]
string="Посланники — существа из чистой энергии, пока они остаются на Нодене. Их обычно посылают, чтобы отсечь энергетический канал, который может выдернуть божество из его измерения. Я слышал прелюбопытные истории о Посланниках силою в сотню человек, способных к высшей магии, неуязвимых... Их еще называют Стражами..."
[kacelbem_council_cinematic_cult]
string="Где-то в крепости таится секта, возносящая кощунственные молитвы перед куском метеорита. Метеорит этот состоит из материала, известного как колтк. Говорят, что эта скала упала из того мира, где родился Акбаа... Разрушить его — во всяком случае простыми средствами — невозможно. Разве что ноденский Страж сумеет разрушить метеорит..."
[suiberis_council_how_guardian_stop]
string="Но как может этот самый Страж остановить воплощение бога, всего лишь разбив кусок камня?"
[kacelbem_council_prayer_heretics]
string="Я уже говорил, что молитвы жрецов Акбаа и все их ужасные жертвы фокусируются на метеорите. Это — канал энергии для Акбаа. Если Акбаа соберет ее достаточно — он сможет завершить свое воплощение в Арксе. И тогда смерть и страдание обрушатся на всех. Метеорит надо найти и уничтожить любой ценой."
[player_council_how_find_guardian]
string="Но как найти этого Стража?"
[felnor_council_Koltk_sample]
string="В моей лаборатории есть кусочек колтка. Это может помочь."
[king_council_here_situation]
string="Давайте говорить прямо: мы знаем, что культ Акбаа в Арксе очень силен и набирает мощь. К счастью, мы схватили Эрцога, верховного жреца, пока не стало слишком поздно. Но другие последователи могут и без него попытаться вызвать Акбаа. А значит, наша задача — как можно быстрее отыскать этого самого Стража из Нодена."
[carlo_council_also_war]
string="Не стоит забывать и о войне с илсидами, ваше величество. Что мы предпримем по этому поводу?"
[king_council_shall_brief]
string="Карло, нам нужен план обороны. Я опасаюсь худшего. Никто точно не знает, что такое эти илсиды и кто ими командует. СТРАЖА! Принести сюда кусочек колтка!"
[king_council_while_army]
string="Ам Шегар, пока наша армия бьется с илсидами, тебе предстоит отыскать этого легендарного Стража... Не скрою: задание может стать тяжким и долгим. Мы не знаем, на что Страж похож и вообще прибыл ли он. Но я верю в твои способности и счастливую звезду."
[guard_council_here_sample]
string="Камень здесь, ваше величество."
[king_council_put_table]
string="Хорошо. Положи его на стол."
[king_council_take_sample]
string="Возьми этот камень, Ам Шегар. Он невелик, но Страж — единственный, кто может его разрушить. И будь осторожен, молю..."
[carlo_council_aaahhh]
string="Что?!"
[king_council_amazing]
string="Великие небеса!!"
[chinkashh_council_cant_believe]
string="Ш-ш-ш-што-о-о?!"
[felnor_council_so_am_shagar]
string="Но это значит, что Ам Шегар..."
[king_council_guardian_well]
string="...Страж! Теперь все становится понятно, в том числе его стремление всем помочь! Для меня великая честь — встретиться с тобой, о Страж!"
[player_council_surprise_for_me]
string="Прикосновение к этому камню осветило мой разум. Я послан сюда, чтобы остановить Акбаа, и должен действовать без промедления. Я должен найти вход в тайный храм, и там я уничтожу метеорит одним прикосновением!"
[felnor_council_noden_with_you]
string="Да направит тебя мудрость Нодена, Ам Шегар."
[king_council_now_go]
string="Не позволяй нам задерживать себя."
[suiberis_greetings_player]
string="Я — новый астроном. Я помогал бедному Фалану Орбипланаксу до самой его смерти и постараюсь как могу ухаживать за его обсерваторией."
[player_observing_misc]
string="Что говорят тебе звезды?"
[suiberis_nothing_stars]
string="Ничего. Небо затянуто облаками."
[suiberis_nothing_misc]
string="Звезды заняли необычное положение."
string2="Ты знаешь, моя работа требует полного сосредоточения."
string3="Если позволишь, я займусь делом. Мне предстоит еще много вычислений, и надо сделать немало гороскопов..."
[player_rituals_suiberis]
string="Суиберис, что ты можешь рассказать о ритуалах? Ты знаешь, кто убил Фалана Орбипланакса?"
[suiberis_dont_know_rituals]
string="Не понимаю, о чем ты. Я, конечно, еще новичок в искусстве астрономии... А злобу и убийство я ненавижу."
[felnor_greetings]
string="Я — Фелнор, придворный алхимик и друг бедного Фалана Орбипланакса."
[player_felnor_falan]
string="Что за Фалан Орбипланакс?"
[felnor_greetings2]
string="Фалан был нашим астрономом. Он умер несколько дней тому назад. Он собирался разоблачить какой-то заговор, но никак не мог толком все мне объяснить..."
[felnor_laboratory_generic]
string="Пока я работаю, ты можешь осмотреться..."
string2="Если найдешь что-нибудь полезное для себя, будь любезен, приобретай."
[player_felnor_falan2]
string="Я расследую вопрос о ритуалах и о смерти Фалана Орбипланакса."
[felnor_falan]
string="Что я могу сказать? Только то, что то и другое связано между собой... У меня есть записка, которую дал мне Фалан в день своей смерти. Я так и не сумел в ней разобраться. Может, ты поймешь больше..."
[felnor_keep_looking_weapon]
string="Тебе пригодится это легендарное оружие, Страж..."
[Iserbius_welcome]
string="Я знаю, кто ты! Знаю, зачем ты здесь! Орбипланакс наверняка успел связаться с Ноденом. Надо было скорее избавляться от него. Страж! Твое присутствие — большая отрада для нас. Значит, у нас и впрямь хватит сил, чтобы призвать сюда Акбаа во всем его величии... А мы с тобой, радость моя, продолжим нашу церемонию... Позже."
[Iserbius_incantation]
string="Ин рааа Никаа дум Реанима."
[carlo_statue_guard_post_attack]
string="Ваше величество, на заставу напали илсиды. Выживших на этот раз нет. Что хуже — и тел тоже нет. Вероятно, их забрали с собой..."
[king_statue_damned_where]
string="Великие небеса! Куда же их забрали?"
[carlo_statue_dont_know]
string="Не знаем. Они стремительны и беспощадны. Это опаснейший враг, государь."
[king_statue_supposed_linked]
string="Наверное, илсиды тоже поклоняются Акбаа..."
