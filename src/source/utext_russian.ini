string="Если завтра ночью мы не получим камни, готовьтесь к смерти. Братство торговцев самоцветами."
[note_for_pog_content]
string="Пог, тебе пишет Ланшир. Мне нужна твоя помощь. Дорога к заставе людей загорожена. Упали большие камни. Тролли расчистят проход — мы будем рады. Л."
[note_dwarf_mithril]
string="Аканор, у нас скоро кончится мифрил. Положение с каждым днем становится все опаснее, а в наших шахтах нет ни унции мифрила. Нам срочно надо что-то придумать. Оредак."
[note_jail_contain]
string="Моя приходить за тобой после еды. Ты следить людей и быть осторожный. Они опасный.*Анатоль."
[description_note_fallan_content]
string="Фелнор,**я обнаружил культ, который стремится вызвать в Аркс Акбаа. Акбаа — это ужасающий демон, покровитель разрушения, и его-то пытаются вернуть! Немыслимо позволить этому совершиться. Это было бы катастрофой. *Где-то в цитадели скрываются фанатики, они молятся у метеорита. Этот метеорит называется Колтк. Говорят, он прилетел оттуда, где рожден Акбаа. Повредить его почти невозможно.*Все молитвы и жертвоприношения культа сосредоточены на этом метеорите. Через него Акбаа получает свою силу, и, буде он соберет ее достаточно, его воплощение в Арке осуществится, и не будет конца горю и страданиям. Метеорит должен быть уничтожен любой ценой. Увы, лишь Страж Нодена способен разрушить метеорит. Этим вечером я буду просить помощи у Нодена.**Фалан."
[note_king_bedroom_contain]
string="О король, ты помнишь: никогда, НИКОГДА не пей вина, у тебя на него аллергия. Если ты только выпьешь его, будешь сильно болеть. Твой верный аптекарь."
[note_glavasias]
string="Брат Главасий, если будет необходимо отключить систему безопасности, используй свой код — 113. Защитное поле не должно тебе помешать. Братья Патрицио и Паскуале помогут отключить все остальное. — Лорд Исербиус."
[note_Patrizio]
string="Брат Патрицио, это сердце — один из ключей к системе безопасности. Не потеряй его. — Лорд Исербиус."
[note_Pasquale]
string="Не забудь, брат Паскуале: первый запирает второй. — Лорд Исербиус."
[note_gob_guardpost_contain]
string="Мои дорогие друзья-гоблины! Раз уж наш договор в силе, я буду рад получить пару человечков на жертву нашему возлюбленному Акбаа. Как всегда, вы получите по тысяче золотых за штуку. Я лично принесу деньги. — Лорд Исербиус."
[note_mike_lost]
string="Дорогой Оливер, увы, я не в силах решить четвертую загадку. Может быть, ты дашь какую-нибудь подсказку? — Майк."
[note_maria_love]
string="Мария, мы так давно не видели друг друга! Если бы все было иначе, я бы отдал все на свете, чтобы быть рядом с тобой! Твой Л."
[note_key_brother_treasure]
string="1-3-1 — ключ к сокровищам братьев."
[note_treasure_hunt_hint#4]
string="Ха-ха, ты делаешь успехи! Поразмышляй над четвертой подсказкой: 'с помощью которого сумел добыть'. Дальше твой путь лежит на лавовый остров."
[player_stone_riddle_first]
string="Путник, если желаешь поучаствовать в охоте за сокровищами, найди изумруд и открой мой сундук. Оливер."
[player_note_riddle_second]
string="Ага, я смотрю, у нас новый игрок! Ну что ж, незнакомец, вот тебе первая подсказка: 'Ключ к сокровищу'. Вторая подсказка скрыта под камнями, в шахтах троллей."
[note_carlo_sacred_sword]
string="Операция 'Священный кинжал' начинается завтра. Готовьтесь. Я позабочусь, чтобы поблизости не было стражи, а король крепко спал. Он ничего не подозревает. Как следует выполните свою миссию — и наше дело победит. — Ф."
[note_carlo_calpal]
string="Записка #1. Эноилл, королева Флоренс становится опасна. Проследи за ней, оставаясь незамеченным, и сообщи, что увидишь. — Карло."
[note_carlo_calpal2]
string="Записка #2. Это письмо, которое ты нашел, подтверждает мои подозрения. Королева пытается убить короля. Тебе предстоит сделать так, чтобы она исчезла. Я оставляю выбор времени и места за тобой. Разумеется, с наградой не поскуплюсь. Прочитав, сожги это. — Карло."
[note_carlo_calpal3]
string="Записка #3. Ты должен сделать все этой ночью. Как можно скорее после рождения ребенка займись королевой. Безопасность короля — моя задача. — Карло."
[player_note_riddle_third]
string="Вот вторая подсказка: 'найдешь на ярусе'. А теперь постарайся узреть незримое в комнате под темницей гоблинов."
[note_dear_mike_sorry]
string="Дорогой Майк, мне очень жаль, но будет просто нечестно по отношению к прочим игрокам давать тебе ключ к четвертой загадке. Удачи! — Отшельник Оливер."
[note_at_last]
string="Время пришло. Скоро мое тело впустит в себя Акбаа, и вместе мы будем править Арксом. Если со мной что-то случится, пусть этот лист попадет в достойные руки, чтобы другой завершил мой труд на благо Аркса. — Исербиус."
[note_Darkthorn]
string="Никто во всем королевстве не знает о моей миссии. Король избрал меня, потому что лучшего охотника на зомби нет. Я знаю, моя задача нелегка, но я собрал все, что необходимо для уничтожения нежити! Мумии неплохо сражаются, но их тела очень горючи. С прочими труднее: у них есть пакостная привычка возрождаться после смерти. Отгоняющее заклятие действует недолго и вреда им не наносит. Так что нет ничего лучше, чем пронзить тело старым добрым колом, пока оно не встало вновь. Отличный способ. Но стоит еще поискать снаряжение. Мой предшественник оставил немало полезных вещиц. Надеюсь, я еще очищу это место, и люди снова смогут воздавать почести усопшим. Я уже разведал первый ярус гробниц. Но нельзя терять бдительности: каждый шаг грозит здесь опасностью и смертью. Да пребудут с тобою боги. — Азраэль Шип Тьмы."
[note_fallan_code]
string="Шесть станет четырьмя, когда ты заберешь первый. Первый умножить на второй - получится последний, а последний на первый - будет 16."
[note_warning_golem]
string="Я не могу попасть в гробницу Покселлиса. Загадка стража оказалась мне не по зубам. Пусть сокровища Покселлиса достанутся другим."
[note_miguel_calpale_key]
string="Вот копия, что ты заказывал, Эноилл. Не застав тебя, проталкиваю ее под твою дверь. Загляни в лавку, чтобы уладить остальное. Мигель."
[note_twin]
string="На этой карте указан путь в логово женщин-змей. Там много товара, который можно продать за хорошие денежки."
[note_bad_snake_woman]
string="Страж вот-вот даст Залнашшш и ее верным служанкам новую королеву. Остановите его любой ценой. Потомки Залнашшш не должны жить."
[note_troops_for_jail]
string="Вождь Алотар, из тюрьмы сбежали пленники. Нужно еще солдат. Х."
[note_bad_snake_woman2]
string="До встречи в Хрустальных Гротах. У нас есть для тебя новое задание. И поберегись, чтобы никто не проведал о наших планах."
[note_gem_dealer_licence]
string="Лицензия на торговлю самоцветами номер 256Б. Выдана королем Ланширом и всемогущим вождем Алотаром."
