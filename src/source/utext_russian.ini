[Player_off_04]
string="Ортьерн говорил, что отсюда есть путь в королевство людей..."
[Player_off_05]
string="Может, поискать дома у Фалана?"
[Player_off_06]
string="Можно еще навестить в камере Эрцога..."
[Player_off_08]
string="Придется доложить королю, что я не смог уничтожить метеорит..."
[Player_off_14]
string="Надо проглядеть мои записи. Вероятно, тайный вход в логово илсидов скрыт где-то, где я еще не искал…"
[Player_off_14bis]
string="Тут повсюду — знаки Акбаа... Уж не ключ ли это?"
[Player_off_ghost]
string="Что за черт? Какой-то одноглазый..."
[Fallan_intro_1]
string="Слушайте, создания Света, и обратите внимание на мои слова. Вот Аркс, который был некогда обычным городом, широко раскинувшимся под теплыми лучами солнца. Наш король Покселлис был добрым и справедливым властителем, он правил долго и отразил все набеги крысюков и гоблинов. Через годы после его смерти, в роковом 226 году, солнце наше начало тускнеть и гаснуть — и вечная зима сковала мир... Его величество Ланшир, благородный сын Покселлиса, решил перенести весь город Аркс в подземные катакомбы, в заброшенные рудники гномов. Он примирил между собой расы Аркса, и люди вместе с гномами, троллями, гоблинами трудились во имя выживания. Переселение под землю заняло пять лет, за это время солнце окончательно потухло. Все расы отстроили себе подземные жилища, и постепенно взаимоотношения между ними вернулись на круги своя. Но сегодня новое зло стучится к нам в дверь..."
[Fallan_intro_2]
string="Акбаа, бог разрушения, почти... А-а-а..."
[human_guard_intro_1]
string="Эй, ты! Не двигаться! Это приказ стражи!"
[human_guard_intro_2]
string="Быстро сюда!"
[Carlo_intro_1]
string="Не выпускайте его!!!"
[human_guard_intro_3]
string="Сейчас мы его!"
[human_guard_intro_4]
string="Да! Он попался!"
[carlo_intro_2]
string="А ну-ка вышибите эту дверь!"
[Noden_servant_1]
string="Мой господин, мы обнаружили возмущение силы..."
[Sylib_noden_1]
string="Опять... Почему бессмертные так не любят ограничиваться собственным миром?.. Но недаром мы стоим на страже. Мы вечно будем удерживать вселенское равновесие. Где находится источник возмущения?"
[Noden_servant_2]
string="В некоем неприметного мире, его называют Экзоста. Проситель исчез, не успев завершить сообщение. Что прикажете, господин?"
[Sylib_noden_2]
string="Готовьтесь послать Стража..."
[Sylib_briefing_1]
string="Приветствую тебя, Страж. Вот твоя новая миссия. Тебе известны законы Нодена — мира богов и князей-демонов: ни одна из населяющих этот мир сил не имеет права его покинуть. Но Акбаа пытается вторгнуться в мир, именуемый Экзоста. Его последователи пытаются вызвать его туда. Ты знаешь, что быть так не должно. Мы не можем сражаться с Акбаа здесь, ибо не властны над богами. Поэтому мы отправляем тебя уничтожить культ. А с исчезновением поклонников его мощь снизится до приемлемого уровня..."
[player_noden_briefing_1]
string="Я сделаю это, господин."
[Sylib_briefing_2]
string="Это непростая задача. Мы даруем тебе особое умение: оно позволит уничтожить камень Колтк, метеорит, с которым связана сила Акбаа. Колтк неуязвим для обычных ударов. Именно через этот камень энергия последователей уходит к Акбаа. Скоро у него будет достаточно сил, чтобы завершить свое воплощение в одном из городов Экзоста, в Арксе."
[player_noden_briefing_2]
string="Понимаю, господин... С кем я должен связаться в Арксе?"
[Sylib_briefing_3]
string="Тот, с кем следовало связаться, во время передачи сообщения скончался. Придется искать путь самому. Это очень непросто: как известно, шок от перехода повреждает память Стража. Какое-то время ты не будешь знать, что происходит, и до возвращения памяти не вспомнишь нашего разговора. Но другого пути нет..."
[Sylib_noden_briefing_4]
string="Готовься, ты скоро отправляешься. Я верну тебя назад после завершения миссии..."
[Erzog_iserbius]
string="Пощадите, господин, он угрожал мне... пощадите..."
[Iserbius_erzog]
string="Ну-ну, Эрцог, ты же прекрасно знаешь, что каждый из нас должен сделать все, на что способен... Не отчаивайся: твоя скромная жертва не будет напрасной..."
[Iserbius_call_ylside]
string="Олухи! Вы упустили Стража! Оставьте это ничтожное королевство людям и возвращайтесь немедленно!"
[Iserbius_call_ylside_2]
string="Страж, я знаю, ты слышишь меня, ведь ты носишь сейчас одеяние моей паствы... Предатель Култар спас тебя на сей раз..."
[Iserbius_call_ylside_3]
string="Тебе повезло, Страж, но это ненадолго. Ничто в Арксе не может остановить пришествия моего господина. Поздно! Я и Акбаа почти едины..."
[Akbaa_dream_1]
string="А-а-а-а-а... М-м-м-м-м... Иди ко мне... Ты нужен мне... Отдай мне свою жизнь..."
[Akbaa_dream_2]
string="Страж! Мое воплощение в Арксе ничто уже не остановит! Слишком поздно! Но почему мы должны быть врагами? Присоединяйся! Ты, как и я, пленник Нодена, и лишь я волен освободить тебя. Не предавай же свободу! Что проку быть рабом в Нодене, если мы можем вместе, как боги, править миром? Иди со мной, Страж, и я обещаю тебе власть, о коей ты и не мечтал..."
[Akbaa_dream_3]
string="Хорошо же, Страж... Я вижу, ты отказываешься от моего щедрого предложения... Может, в нашу следующую встречу ты об этом горько пожалеешь... Уж не думал ли ты, что разрушение метеорита остановит меня? Оставшегося потока силы хватит, чтобы я воплотился в Арксе. Да, сейчас ко мне не поступает сила жертв, но стоит мне явиться — и она хлынет потоком. Столько душ, которые можно выпить..."
[King_Alia_destiny_1]
string="Моя прекрасная дочь, Алия! Я давно утратил надежду увидеть тебя вновь..."
[Alia_alia_destiny_1]
string="Отец... Какое счастье наконец встретить тебя..."
[King_Alia_destiny_2]
string="Мне так не хватало тебя... Поверить не могу! Я так счастлив видеть тебя живой..."
[Zalnashh_Alia_destiny_1]
string="И мы тоже, отец..."
[Alia_alia_destiny_2]
string="Во имя богов..."
[King_Alia_destiny_3]
string="Это - самый важный миг для меня и моей дочери! Я никому не позволю мешать. ПРОЧЬ ИЗ КОМНАТЫ!"
[Zalnashh_Alia_destiny_2]
string="Не будь смешным..."
[King_Alia_destiny_3bis]
string="Великие небеса, что вы делаете здесь! У вас есть все, что вы требовали! Крагоз опять у вас! Зачем вы здесь?"
[Zalnashh_Alia_destiny_8]
string="При чем здесь Крагоз? Мы тоже хотим отпраздновать возвращение Алии. Мы, ее истинная семья — наш орден..."
[King_Alia_destiny_6]
string="Ты лишилась разума, Залнашш?"
[Zalnashh_Alia_destiny_7]
string="Или скорее ты лишился памяти? Вспомни договор — тот, что заключил между нашими народами Покселлис, твой отец. «Во имя королевства я, король Покселлис, король Аркса, посвящаю четвертого своего прямого потомка ордену Эдерней. В обмен орден даст королевству Крагоз и Зогарк...». Дитя обещано нам, Ланшир. Отпусти ее с нами - или готовься к смерти."
[King_Alia_destiny_4bis]
string="Никогда! Я не слышал о таком договоре. Я отрекаюсь от него! Какие могут быть причины, чтобы требовать мою дочь? Стража!"
[Zalnashh_Alia_destiny_3]
string="Не торопись, Ланшир. Призови на помощь здравый смысл... Что нам твои мечи? Я-то думала, ты хоть чуточку умнее... Этот договор обеспечивает возрождение нашей королевы. И заодно спасает твою жалкую страну. Нам нужна королева, и это — Алия..."
[King_Alia_destiny_7]
string="Алия будет королевой... Но — королевой людей! Друзья, сражайтесь насмерть!"
[Alia_alia_destiny_3]
string="Хватит! Довольно кровопролития. Я чту слово Покселлиса. Я не знаю, что уготовал мне орден Эдерней, но я не стану разрывать договор. Королевство никогда не выиграло бы Войну Магов без помощи ордена, и обещания следует выполнять. Отец, я принимаю это - ибо для меня нет ничего важнее чести. Надеюсь, мы встретимся еще, но теперь я должна покинуть тебя..."
[florence_alia_destiny_1]
string="В этом нет необходимости..."
[Zalnashh_Alia_destiny_4]
string="Ш-ш-ш-ш-ш-ш??"
[human_guards_Alia_destiny_4]
string="О-о-о?"
string2="А-а-а!"
string3="А-а-ах-х-х..."
[King_alia_destiny_4]
string="Флоренс? Это ты?!."
[florence_alia_destiny_2]
string="Мне жаль прерывать ваше воссоединение, о сестры Эдерней, но Алия не будет вашей королевой... Алия — пятый потомок Покселлиса!"
[King_Alia_destiny_5]
string="Как? Я, два моих брата и Алия..."
[florence_alia_destiny_3]
string="Я принадлежала к ордену Священного Кинжала, тайному ордену, который создал Покселлис, чтобы защитить королевство Аркс от всяческих опасностей. Я была не последним лицом в этом ордене, одной из допущенных к тайнам договора. Я подстроила похищение Алии. Но в ночь, когда родилась Алия, была рождена и Кларисса, ее близнец, и была она старше на несколько минут. Это неожиданное рождение подало мне идею передать Клариссу на попечение слуги, который мог вынести девочку из Аркса с помощью Гильдии Путешественников. Но меня убил заговорщик — а Ам Шегар, да будет благословенно его имя, разоблачил убийцу."
[Zalnashh_Alia_destiny_5]
string="Предательство! И столько лет миновало! Неужто двуличие людей не ведает границ? Где же этот четвертый потомок, что обещан нам пророчеством?"
[florence_alia_destiny_4]
string="Истинная королева проявит себя сама — когда наступит время..."
[Zalnashh_Alia_destiny_6]
string="Я разочарована... Какая напрасная трата времени! Столько лет ждать королеву... Сестры, мы возвращаемся. Наша раса вымирает, и нам нечего более здесь делать!"
[Iserbius_akbaa_final_fight]
string="Ты опоздал на несколько секунд. Теперь я могу сразиться с тобой, о Страж... Я не вернусь в Ноден! А ты — ты вернешься прямо сейчас!"
[akbaa_final_fight]
string="Ты опоздал на несколько секунд. Теперь я могу сразиться с тобой, о Страж... Я не вернусь в Ноден! А ты — ты вернешься прямо сейчас!"
[Iserbius_akbaa_die]
string="Не-е-е-ет... Как ты... А-а-а-а... Не-е-е-е-е-ет!.."
[player_akbaa_die]
string="До встречи в Нодене, Акбаа..."
[Iserbius_die_1]
string="Что ты наделал? Пусть Акбаа несет зло, но никто, кроме него, не сможет вернуть Арксу солнце..."
[player_iserbius_die]
string="Акбаа нечего делать в этом мире. Ему ведомы законы..."
[Sylib_guardian_endgame_1]
string="Законы, которым и ты, Страж, обязан следовать..."
[player_sylib_endgame_1]
string="Господин?!. Что ты имеешь в виду?"
[Sylib_guardian_endgame_2]
string="Законы высечены в камне и нерушимы, Страж. Ты послан Ноденом и сейчас должен вернуться, поскольку миссия твоя закончена..."
[player_sylib_endgame_2]
string="А как же солнце Аркса? Неужто Исербиус говорил правду?"
[Sylib_guardian_endgame_3]
string="Не стоит беспокоиться об этом. Ведь это не во власти Нодена. К тому же вещи могут быть не такими, какими кажутся. Но ты — ты получил здесь немалый опыт, и твоя мощь делает тебя опасным для этого мира. Стоит тебе пробыть здесь чуть дольше — и последствия непредсказуемы. А у меня есть для тебя новое задание. Позволь мне забрать тебя домой..."
[player_sylib_endgame_3]
string="Конечно, мой господин."
[dummy]
string="Не стоит беспокоиться об этом. Ведь это не во власти Нодена. К тому же вещи могут быть не такими, какими кажутся. Но ты — ты получил здесь немалый опыт, и твоя мощь делает тебя опасным для этого мира. Стоит тебе пробыть здесь чуть дольше — и последствия непредсказуемы. А у меня есть для тебя новое задание. Позволь мне забрать тебя домой..."


