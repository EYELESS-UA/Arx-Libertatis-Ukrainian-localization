[player_alia_looking_for_Krahoz]
string="Я ищу волшебный предмет, которым завладели мятежники. Может быть, мои поиски приведут меня и к твоим похитителям."
[Alia_krahoz_lake]
string="Да? А что тебе известно об этом волшебном предмете?"
[player_alia_looking_for_Krahoz_2]
string="Они называют его Крагоз. Раньше Крагоз принадлежала королевству Аркс. Вместе с Зогарком она обладает великой силой."
[Alia_krahoz_lake_2]
string="Гм... Пожалуй, тебе лучше пойти за мной..."
[Alia_real_introduce_01]
string="А... ты наконец очнулся. И снова — здравствуй, Ам Шегар."
[player_alia_real_introduce_01]
string="Моя голова... Где я? Ты знаешь мое имя?"
[Alia_real_introduce_02]
string="Ты — в так называемом лагере мятежников. И беседуешь с их предводителем..."
[player_alia_real_introduce_02]
string="Как? Ты — глава банды, которая убила королеву, похитила ребенка и украла Крагоз?"
[Alia_real_introduce_03]
string="Не стоит верить всему, что слышишь... И потом, ты ведь здесь не для того, чтобы слушать старые истории, правда?"
[player_alia_real_introduce_03]
string="Да. Мне просто нужна Крагоз, чтобы уничтожить культ Акбаа."
[Alia_real_introduce_04]
string="Интересно. Я пыталась сама разведать что-нибудь об этом культе, но без особого успеха. А Крагоз нужна нам для безопасности. Но я могу уступить ее тебе, если ты найдешь нам что-нибудь столь же могущественное — и мы не останемся без защиты."
[player_alia_real_introduce_04]
string="Но почему ты доверяешь мне? Я же могу обо всем рассказать королю..."
[Alia_real_introduce_05]
string="Ну, хотя бы потому, что ты спас мне жизнь... и, кажется, у Акбаа сейчас нет врага опаснее, чем ты. Значит, враг у нас общий. Но если ты попробуешь заступить мне дорогу — умрешь."
[player_alia_real_introduce_05A]
string="Не сомневайся, я не предам тебя."
[player_alia_real_introduce_05B]
string="Скажи, что ты хочешь получить в обмен на Крагоз."
[Alia_real_introduce_06]
string="Я читала старые легенды о Щите Древних, который много лет назад захоронили вместе с его хозяином, великим воителем... Я посылала за ним немало экспедиций, но пока зря. Принеси Щит — и Крагоз останется тебе."
[player_alia_real_introduce_06]
string="Я сделаю это."
[Alia_real_introduce_misc]
string="Не обмани мое доверие, Ам Шегар."
string2="Честный обмен: Крагоз за Щит."
string3="Как видишь, эти ужасные мятежники не так ужасны, как говорят."
[Alia_player_with_shield_01]
string="Мои разведчики донесли, что ты нашел Щит. Это так?"
[Player_Alia_back_with_shield_01]
string="Да, вот он."
[Alia_player_back_with_shield_02]
string="О, Ам Шегар, ты же не знаешь... Этот щит — не просто магический предмет; это щит моего деда, короля Покселлиса."
[Player_Alia_back_with_shield_02]
string="Деда... Так ты..."
[Alia_player_back_with_shield_03]
string="Алия, дочь короля Ланшира и королевы Флоренс, принцесса Аркса, к твоим услугам."
[Player_Alia_back_with_shield_03]
string="Но почему ты скрываешься? И как ты можешь жить среди тех, кто похитил тебя и убил твою мать?"
[Alia_player_back_with_shield_04A]
string="Эти люди — моя охрана, мои защитники, тайный орден Священного Кинжала, основанный самим королем Покселлисом. И их единственная задача — беречь королевскую кровь."
[Alia_player_back_with_shield_04B]
string="И, конечно, они не убивали мать. Они нашли меня рядом с ее телом - сразу после моего рождения. До сих пор неизвестно, кто убил ее."
[Player_Alia_back_with_news]
string="Теперь ее убийца известен, и он дорого заплатил за свое преступление."
[Alia_player_back_with_news]
string="Правда? Ты полон неожиданностей, Ам Шегар. После всех этих лет... хорошо, что за нее отомстили."
[Player_Alia_back_with_shield_04]
string="Но почему ты прячешься ото всех?"
[Alia_player_back_with_shield_05]
string="До моего рождения Священный Кинжал узнал, что женщины-змеи из ордена Эдерней желают моей смерти, но не выяснил почему. Они инсценировали похищение, чтобы сберечь наследницу королевства. Они увезли бы меня из Аркса при помощи Гильдии Путешественников, но у Эдерней, кажется, всюду есть глаза и уши."
