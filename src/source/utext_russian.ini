[tafiok_still_strike_misc]
string="Если тролли не начнут работу, они сведут меня в могилу..."
string2="Эти тролли меня с ума сведут! Если бы кто-нибудь добыл мне хоть немного самоцветов!"
string3="Спрос очень велик, Гильдия Путешественников предлагает огромные суммы — а у меня нет ничего на продажу. Проклятие!"
[tafiok_thanks]
