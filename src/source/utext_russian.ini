[system_spell_description_magic_sight]
string="Улучшает зрение мага в темноте."
[system_spell_description_magic_projectile]
string="Наносит вред противнику."
[system_spell_description_ignit]
string="В определенном радиусе поджигает горючие материалы и некоторые объекты, например, факелы."
[system_spell_description_douse]
string="Гасит пламя. Может ослабить огненную атаку врага."
[system_spell_description_activate_portal]
string="Включает порталы ордена Эдерней."
[system_spell_description_heal]
string="Лечит всех вокруг мага, в том числе и врагов."
[system_spell_description_harm]
string="Все вокруг мага чувствуют острую боль."
[system_spell_description_detect_trap]
string="Предупреждает о ловушках и других опасностях."
[system_spell_description_armor]
string="Улучшает защиту."
[system_spell_description_curse]
string="Уменьшает силу, ловкость, выносливость и разум врага."
[system_spell_description_lower_armor]
string="Ухудшает защиту врага."
[system_spell_description_speed]
string="Увеличивает скорость движений."
[system_spell_description_reveal]
string="Развеивает невидимость и иллюзии."
[system_spell_description_fireball]
string="Огненный шар поражает противников."
[system_spell_description_create_food]
string="Создает область, в которой никто не чувствует голода."
[system_spell_description_Ice_projectile]
string="Наносит урон и замораживает всех, кто стоит у него на пути."
[system_spell_description_sanctify]
string="Улучшает силу, ловкость, выносливость и разум."
[system_spell_description_dispell_field]
string="Уничтожает магические преграды."
[system_spell_description_Fire_protection]
string="Уменьшает воздействие огня и жара."
[system_spell_description_Cold_protection]
string="Уменьшает воздействие льда и холода."
[system_spell_description_telekinesis]
string="Позволяет подбирать и использовать предметы на расстоянии."
[system_spell_description_rune_guarding]
string="Создает ловушку, видимую только тому, кто ее поставил."
[system_spell_description_levitate]
string="Позволяет магу подняться над землей."
[system_spell_description_ice_field]
string="Создает ледяной барьер."
[system_spell_description_paralyse]
string="Парализует врага."
[system_spell_description_cure_poison]
string="Лечит от яда всех вокруг мага, в том числе и врагов."
[system_spell_description_repel_undead]
string="Обращает часть нежити в бегство при виде мага, сотворившего это заклинание."
[system_spell_description_poison_projection]
string="Посылает ядовитое облако в сторону противника."
[system_spell_description_slowdown]
string="Замедляет движения."
[system_spell_description_raise_dead]
string="Призывает нежить. Маг должен стоять на земле, чтобы заклинание сработало."
[system_spell_description_create_field]
string="Создает магический защитный барьер."
[system_spell_description_disarm_trap]
string="Обезвреживает ловушки в некотором радиусе."
[system_spell_description_flying_eye]
string="Создает невидимый глаз, с помощью которого маг может исследовать местность, оставаясь незамеченным."
[system_spell_description_fire_field]
string="Создает огненный барьер."
[system_spell_description_Lightning_strike]
string="Посылает молнию в противника."
[system_spell_description_confuse]
string="Приводит противника в замешательство."
[system_spell_description_invisibility]
string="Делает персонажа невидимым. Невидимость исчезает, если персонаж нападает на врага, подбирает или использует предметы."
[system_spell_description_mana_drain]
string="Отнимает магическую энергию у всех вокруг мага."
[system_spell_description_life_drain]
string="Отнимает здоровье у всех вокруг мага."
[system_spell_description_explosion]
string="Наносит всем вокруг мага сильный урон."
[system_spell_description_enchant_weapon]
string="Придает предмету, находящемуся перед магом, волшебные свойства. Эти свойства зависят от ингредиентов, положенных рядом с предметом."
[system_spell_description_summon_creature]
string="Призывает демона. Поведение демона непредсказуемо, поскольку он неподвластен магу."
[system_spell_description_negate_magic]
string="Нейтрализует любую магию в определенном радиусе от мага."
[system_spell_description_incinerate]
string="Посылает волну испепеляющего пламени."
[system_spell_description_mass_paralyse]
string="Парализует всех в определенном радиусе вокруг мага."
[system_spell_description_mass_lightning_strike]
string="На мгновение окружает мага множеством молний."
[system_spell_description_control_target]
string="Позволяет магу управлять демоном. Заклинание действует только на призванных магом демонов."
[system_spell_description_freeze_time]
string="Замедляет время для всех, кроме мага."
[system_spell_description_mass_incinerate]
string="Испепеляет всех существ в определенном радиусе вокруг мага."
[system_Quest_log_escape_gobs]
string="Я в гоблинской тюрьме. Надо выбраться отсюда и вспомнить, кто я такой!"
[system_Quest_log_escape_gobs_done]
string="Я вырвался от гоблинов, но по-прежнему понятия не имею о том, что я здесь делаю..."
[system_Quest_log_gob_authorization]
string="Командир гоблинов, стерегущих вход на второй ярус, потребовал подписанное разрешение и лицензию на торговлю самоцветами."
[system_Quest_log_gob_authorization_done]
string="Командир гоблинов пропустил меня."
[system_Quest_log_message_ortiern]
string="Мне надо получить аудиенцию у короля Аркса и рассказать ему о нападении на заставу."
[system_Quest_log_greu_gift]
string="Я повстречал тролля. Он хочет дружить со мной, и ему нужен подарок на день рождения..."
[system_Quest_log_greu_gift_done]
string="Я подарил Грю книгу, он был просто счастлив и дал мне амулет троллей. Теперь у меня есть новый друг."
[system_Quest_log_fallen_rocks]
string="По желанию короля я должен передать владыке троллей Погу письмо с просьбой расчистить проход к заставе."
[system_Quest_log_troll_idol]
string="У троллей похитили их идола. Они не согласятся помочь, пока им не вернут украденное. Придется поискать во владениях гоблинов."
[system_Quest_log_troll_idol_done]
string="Путь к заставе свободен."
[system_Quest_log_rituals]
string="Вокруг замка проводились какие-то обряды с жертвоприношениями. Король велел мне узнать об этом побольше. Вероятно, это как-то связано с убийством Фалана Орбипланакса. Надо расспросить местных жителей."
[system_Quest_portal]
string="Чинкашш показала мне тайное заклинание для телепортации через порталы Эдерней: Мега Спациум."
[system_Quest_log_shanny]
string="Пропала Шани, дочь Марии. Мария умоляет разыскать девочку — если она еще жива."
[system_Quest_log_shanny_done]
string="Шани в безопасности. Я едва успел спасти ее от жертвоприношения."
[system_Quest_log_access_temple]
string="Нужно найти тайный вход в храм Акбаа и уничтожить метеорит."
[system_Quest_log_know_password]
string="Эрцог рассказал, что храм Акбаапод таверной, и сообщил мне пароль."
[system_Quest_log_destroy_meteor_for_good]
string="Метеорит так просто не разрушить. Надо объяснить все Фелнору и попросить его совета."
[system_Quest_log_krahoz_zohark]
string="Чтобы метеорит не исторг из меня магическую энергию, надо найти Крагоз и Зогарк. Иначе мне не уничтожить метеорит, не остановить возрождение Акбаа."
[system_Quest_log_krahoz]
string="Крагоз утащили мятежники. Те же люди, что убили королеву и похитили новорожденную принцессу. Надо отыскать этих преступников."
[system_Quest_log_zohark]
string="Зогаркна хранении у ордена Эдерней. Я уверен: женщины-змеи поймут важность моей миссии..."
[system_Quest_log_Shield]
string="Я встретил девушку, которую спас из храма Акбаа. Она-то и есть вождь мятежников! Но сейчас это все не важно. Важно то, что она готова отдать Крагоз, если я принесу некий особенный щит. Он называется Щит Древних и находится на втором ярусе склепа."
[system_Quest_log_Shield_done]
string="Я добыл великий Щит Древних."
[system_Quest_log_mythril_done]
string="Зачарованное оружие в моих руках."
[system_Quest_log_krahoz_done]
string="Я забрал Крагоз."
[system_Quest_log_zohark_done]
string="Я получил Зогарк."
[system_Quest_log_Meteor_time]
string="С Крагозом и Зогарком я могу вернуться в храм Акбаа и уничтожить метеорит."
[system_Quest_log_Meteor_destroyed]
string="Метеорит уничтожен! Козни Акбаа провалились. Но, что странно, Силиб Нурат не позвал меня обратно в Ноден. Надо вернуться в королевство и выяснить, не смогу ли я попасть в Ноден самостоятельно."
[system_Quest_log_save_kingdom]
string="Люди Аркса — в плену у илсидов. Придется проникнуть в темницу и выяснить, что тут творится, а потом уже можно будет вернуться в Ноден."
[system_Quest_log_super_weapon]
string="Королевство спасено. Ловушка Исербиуса не удалась. Теперь понятно, почему меня не вернули в Ноден: моя миссия все еще не завершена. Акбаа успел накопить слишком много сил. Превосходно, что я разрушил метеорит, не то Акбаа был бы непобедим. Сейчас он, наверное, уже объединяется с Исербиусом. Это займет немало времени, но Исербиус в это время будет неуязвим для большинства оружия. Мне понадобится для встречи с Акбаа нечто особенное."
[system_Quest_log_mythril]
string="Книга говорит, что зачарованное оружие надо делать из мифрила — только этот металл возможно сплавить с порошком Колтка. Надеюсь, тут нет ошибки..."
[system_Quest_log_Dragon_egg]
string="Чтобы наложить на оружие нужные чары, я должен добыть яйцо дракона."
[system_Quest_log_final_meeting]
string="Настал час исполнить мою миссию: я отправляюсь в убежище илсидов и уничтожу Исербиуса... или, может быть, правильнее говорить — Акбаа."
[system_Quest_log_key_bank]
string="В доме Алисии я нашел таинственный ключ. Если бы я сумел снять отпечаток с ключа, можно было бы сделать копию..."
[system_Quest_log_key_bank_done]
string="Я сделал дубликат ключа из дома Алисии..."
[system_Quest_log_olivier]
