[system_tutorial_0]
string="Загляните в сундук торговца, выберите предметы, которые хотите купить, или положите в сундук то, что хотите продать."
[system_tutorial_0bis]
string="Поврежденное оружие и доспехи можно отнести для ремонта к кузнецу."
[system_tutorial_1]
string="Нажмите правую кнопку мыши, чтобы перейти из режима «внимательного исследования» в режим «свободного обзора»."
[system_tutorial_1_new]
string="Чтобы свернуть записку, щелкните по ней правой кнопкой мыши."
[system_tutorial_1_new2]
string="Все учебные сообщения попадают в раздел заметок вашей книги путешественника (по умолчанию открывается клавишей <F4>)."
[system_tutorial_2_new]
string="Некоторые объекты игрового мира (рычаги, решетки, механизмы и т.п.) можно привести в действие двойным щелчком левой кнопкой мыши."
[system_tutorial_2bis]
string="Чтобы открыть книгу путешественника, нажмите клавишу «Книга» (по умолчанию — <Backspace>) или щелкните по символу книги в правом нижнем углу экрана."
[system_tutorial_2tris]
string="Чтобы открыть сумку, нажмите клавишу «Сумка» (по умолчанию — <I>) или щелкните по символу сумки в правом нижнем углу экрана."
[system_tutorial_3bis]
string="Наведите курсор мыши на кость и возьмите ее в руку, нажав клавишу «Использовать» (по умолчанию — <Enter> или <F>)."
[system_tutorial_3bis_new]
string="Чтобы взять оружие наизготовку и войти в режим боя, нажмите клавишу «Оружие» (по умолчанию — <Tab>)."
[system_tutorial_3bis_new2]
string="Чтобы нанести удар, нажмите кнопку «Действие» (по умолчанию — левая кнопка мыши). Чем дольше вы держите кнопку нажатой, тем сильнее получится удар."
[system_tutorial_3]
string="Чтобы начать разговор с персонажем, дважды щелкните по нему левой кнопки мыши."
[system_tutorial_4]
string="Чтобы выйти из боевого режима, снова нажмите клавишу «Оружие» (по умолчанию — <Tab>). Чтобы обыскать тело поверженного противника, дважды щелкните по нему левой кнопкой мыши."
[system_tutorial_4_new]
string="С помощью мыши можно перетаскивать предметы к себе в сумку. Чтобы использовать предмет (например, съесть пищу, прочитать записку или взять в руки оружие), наведите на него курсор и нажмите клавишу «Использовать» (по умолчанию — <Enter> или <F>)."
[system_tutorial_5]
string="Бой происходит в режиме свободного обзора."
[system_tutorial_5bis]
string="В бою для нанесения удара нажмите и держите кнопку «Действие» (по умолчанию — левая кнопка мыши). Удар будет нанесен, как только вы отпустите кнопку; чем дольше вы ее держали, тем сильнее будет удар."
[system_tutorial_6]
string="Вы нашли свои первые руны. Поместите их в книгу, нажав клавишу «Использовать» (по умолчанию — <Enter> или <F>)."
[system_tutorial_6bis]
string="Новые заклинания автоматически появятся в книге, как только для них будет собрана соответствующая комбинация рун. Откройте книгу в разделе заклинаний (по умолчанию — <F2>) и вы увидите, что две найденные вами руны позволяют сотворить заклинание «Возгорание». Но помните, что даже при наличии нужных рун заклинания высших уровней сложности  появятся в книге только при хорошо развитом навыке магии."
[system_tutorial_7]
string="Чтобы сломать решетку в полу, нажмите клавишу «Присесть» (по умолчанию — <X>) и ударьте костью по решетке."
[system_tutorial_8]
string="Чтобы починить механизм подъемника, найдите веревку и положите ее в сумку. Дважды щелкните по веревке левой кнопкой мыши, затем щелкните по механизму."
[system_tutorial_9]
string="Щелчок левой кнопкой мыши по символу заклинания позволяет увидеть его формулу. Формула останется на экране после того, как вы закроете книгу."
[system_tutorial_10]
string="Чтобы сотворить заклинание, нажмите и удерживайте клавишу «Магия» (по умолчанию — <Ctrl>) и в этом режиме по одной нарисуйте руны курсором мыши. Затем отпустите клавишу «Магия» — и заклинание будет сотворено."
[system_tutorial_11]
string="Портал включен, но вы не сможете им воспользоваться, пока не будут включены другие порталы."
[system_tutorial_12]
string="Попробуйте разжечь огонь, а затем поджарить себе еду, положив сырую пищу у огня."
[system_tutorial_13]
string="Попробуйте осветить коридор, сотворив вблизи факелов заклинание «Возгорание»."
[system_tutorial_14]
string="Чтобы подготовить заклинание, заключенное в свитке, щелкните по свитку  правой кнопкой мыши. Свитки позволяют творить заклинания, для которых еще не найдена нужная комбинация рун. Свиток можно использовать только один раз — после этого он исчезает."
[system_tutorial_15]
string="Заклинание подготовлено. Когда захотите его применить, дважды щелкните по символу этого заклинания на экране."
[system_tutorial_16]
string="Щелкните по значку лестницы в правом верхнем углу экрана, чтобы перейти на другой ярус."
[system_tutorial_level_01]
string="Поздравляем! Ваш персонаж набрал достаточно опыта, чтобы поднять свой уровень. Щелкните по символу креста в правом нижнем углу экрана, чтобы распределить заработанные очки навыков."
[system_tutorial_level_02]
string="Распределите очки характеристик и навыков персонажа. Число свободных очков показано рядом с курсором мыши."
[tutorial_bag]
string="Место в сумке заполняется очень быстро. Помните, что вы можете носить с собой не одну, а две сумки (вторую сумку сначало нужно найти)."
[tutorial_bag_02]
string="Чтобы навести порядок в своих вещах, дважды щелкните по символу сумки в правом нижнем углу экрана."
[tutorial_lever]
string="Чтобы починить механизм открывания решетки, дважды щелкните по только что найденному вами рычагу, а затем — по подходящему гнезду в стене."
[tutorial_shop]
string="Вы находитесь в режиме обмена торговли. Осторожно: обмен предмета на деньги совершается сразу же, как только вы возьмете предмет или положите его в сундук торговца. Если вы решите отказаться от сделки, затраты не будут вам возмещены."
[tutorial_mode_01]
string="Вы перешли в режим внимательного исследования."
[tutorial_mode_02]
string="Вы перешли в режим свободного обзора."
[tutorial_stealth]
string="Противники могут услышать ваши шаги и другие звуки. Попробуйте бросить что-нибудь в сторону — и увидите, как патрульные гоблины отреагируют на этот подозрительный звук. Когда вы находитесь в режиме скрытного перемещения, в левом нижнем углу экрана появляется соответствующий значок; это означает, что вы производите меньше шума и вас намного труднее заметить. Режим скрытного перемещения включается автоматически в зависимости от того, насколько развит навык незаметности у вашего персонажа."
[tutorial_steal]
string="Хотя делать это нехорошо, вы можете незаметно красть вещи у других обитателей Аркса. Для этого надо достичь показателя 50 в навыке незаметности. Толкните кого-нибудь, чтобы увидеть в левом нижнем углу экрана его мешок. Щелкните на мешке — и увидите, что можно украсть. Только старайтесь не попадаться!"
