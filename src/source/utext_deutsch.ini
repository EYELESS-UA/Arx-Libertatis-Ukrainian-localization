[insanity_choose_difficulty]
string = "Wählt den Schwierigkeitsgrad:"

[insanity_button_difficulty_normal]
string="Normal"

[insanity_desc_difficulty_normal]
string = "Ein Schwierigkeitsgrad der für neue Spieler ausgelegt ist, die eine bequemere Erfahrung in der Welt von Arx vorziehen. Verursachter Schaden durch Feinde und deren allgemeine Eigenschaften sind reduziert. Die Wiederherstellung der Lebenspunkte ist aktiviert und sowohl Tränke als auch Gegenstände aller Art sind in ihrer Effektivität deutlich spürbar."


[insanity_button_difficulty_insanity]
string="Insanity"

[insanity_desc_difficulty_insanity]
string = " Eine größere Herausforderung für erfahrene Spieler in der Welt von Arx. Gegner verursachen gesteigerten Schaden, sind aufmerksamer und weisen merklich erhöhte Eigenschaften auf. Es gibt mehr Feindkontakte, die Wiederherstellung der Lebenspunkte ist deaktiviert und sowohl Tränke als auch Gegenstände aller Art sind in ihrer Effektivität weniger spürbar."


[insanity_button_difficulty_nightmare] //secret difficult
string="Nightmare"

[insanity_desc_difficulty_nightmare]
string = "Spieler erwartet eine brutale Erfahrung in der Welt von Arx, die als geheimer Schwierigkeitsgrad gedacht ist (Nicht für den 1. Durchgang empfohlen). Gegner verursachen überaus großen Schaden, sind scharfsinnig in ihrer Wahrnehmung, bewegen sich unglaublich schnell und bringen extreme Eigenschaften mit sich. Es gibt noch mehr Feindkontakte, die Wiederherstellung der Lebenspunkte ist deaktiviert und sowohl Tränke als auch Gegenstände sind in ihrer Effektivität kaum spürbar. ""


[insanity_desc_immersive_mode]
string = "Aktiviert diesen Modus nur, wenn ihr auf der Suche nach einer eher Atmosphärischen Erfahrung seid ins Spiel einzutauchen, und einen freien bzw. sauberen Bildschirm bevorzugt. Hierzu werden abseits der wichtigen HUD-Elemente die über den Inventarring erreichbar bleiben und dem Ebenenwechsel-Icon alle anderen ausgeblendet. Der Immersive-Modus kann jederzeit im Optionsmenü über die (Benutzeroberfläche) aktiviert oder deaktiviert werden (Einstellungen)."


[system_menus_options_input_customize_controls_sprint]
string="Sprint Modus"

[system_menus_options_input_customize_controls_precast4]
string="Vorgemerkter Zauber 4"

[system_menus_options_input_customize_controls_precast5]
string="Vorgemerkter Zauber 5"


[required_st_9]
string = "Erforderlich: 9 STÄ"

[system_not_available_demo]
string = "In dieser Demo nicht verfügbar. Bitte, Cheats für einen anderen Anlass ..."

[insanity_button_normal_start]
string="Standard Start"

[insanity_desc_normal_start]
string = "Die anfängliche Charaktererstellung ist aktiviert. Ihr könnt darüber hinweg aber auch sofort mit eurem Abenteuer beginnen ohne für den Moment mit einer detaillierten Erstellung eures Helden abgeschlossen zu haben, ausschließlich die für eure Spielweise relevanten Punkte zuweisen, oder vorerst aufzusparen. Ihr könnt im späteren Spielverlauf alle nicht verwendeten Punkte nachträglich zuweisen."


[insanity_button_hardcore_start]
string="Hardcore Start"

[insanity_desc_hardcore_start]
string = "Die anfängliche Charaktererstellung ist deaktiviert. Ihr könnt eurem Helden keine Punkte zuweisen, als dass diese mit Beginn eures Abenteuers zurückgesetzt werden. Danach wird alles wie gewohnt ausgeführt, und Ihr erhaltet über den üblichen Weg Attribut- und Fertigkeitspunkte, bei Aufstieg eures Helden in eine neue Stufe. "


