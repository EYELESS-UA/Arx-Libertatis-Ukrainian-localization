[Zalnashh_Alia_destiny_6]//}~21 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Ich bin zutiefst enttäuscht! Was für eine Zeitverschwendung! Seit so vielen Jahren warten wir auf unsere Königin. Schwestern, lasst uns zurückkehren! Unsere Rasse wird aussterben, und wir haben hier nichtsss mehr zu tun!"

