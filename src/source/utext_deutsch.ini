String="Vor zwei Stunden schlichen sich drei von ihnen in den Außenposten. Sie griffen ohne Vorwarnung sofort an. Die Ylsiden gelten als starke, unüberwindliche Krieger, und jetzt hab ich es selbst gesehen! Sie sind unfassbar schnell. Blitzartig haben sie drei meiner Leute überwältigt. Und Ihr hättet sehen sollen, was sie mit Karnok machten. Ich weiß nicht, warum sie das getan haben, aber sie werden sicher bald wiederkommen."

[Player_ortiern2]//~00
String="Sucht Euch andere Hilfe! Im Augenblick habe ich selbst genug Probleme."

///FGE
[Ortiern_briefing3]//~09@badly wounded
String="Ihr seid meine einzige Hoffnung! Ich kann dem Pöbel in der Taverne nicht vertrauen! Lieber einem völlig Fremden!"

[Player_ortiern3]//~00
String="Ich sagte Euch doch bereits..."

///FGE
[Ortiern_briefing4]//~09@badly wounded
String="Geht zur Festung, und erzählt dem König, was hier geschah! Das ist lebenswichtig! Seit dem letzten Beben ist der Pfad für uns unpassierbar. Ihr müsst dem König sagen, dass uns die Ylsiden den Krieg erklärt haben!" 

[Player_ortiern4]//~00
String="Das ist doch lächerlich! Grade habt Ihr mir beschrieben, dass der Weg zur Festung blockiert ist!"

///FGE
[Ortiern_briefing5]//~09@badly wounded
String="Ihr solltet es durch die Goblinhöhlen schaffen können - zwei Ebenen tiefer. Sucht dann einen Weg zurück auf diese Ebene. Es ist gefährlich und schwierig, aber wir haben keine Wahl. Wenn Ihr es schafft, seid Ihr wieder im Königreich der Menschen."

///FGE
[Player_ortiern5]//~00
String="Unmöglich! Ich bin grade erst aus einem Kerker der Goblins entkommen."

///FGE
[Ortiern_briefing6]//~09@badly wounded
String="Hier, dies hilft Euch sicher: Die Lizenz eines Edelsteinhändlers. Solange sie denken, Ihr seid nur ein Händler, und Ihr sie nicht angreift, werden sie Euch in Ruhe lassen. Ich muss hier bleiben. Ihr seid unsere einzige Hoffnung, tapferer Söldner!"

///FGE
[Ortiern_repeat_briefing]//}~09@badly wounded
String="Sagte ich schon, dass Ihr unsere einzige Hoffnung seid?"
string2="Versteht Ihr? Gut! Geht nun mit der Lizenz, die ich Euch gab, in die Goblinhöhlen, und findet einen Weg wieder herauf!"
string3="Wenn Ihr es bis zum König schafft, wird er den Pfad wieder freimachen und Verstärkung für den Kampf gegen die Ylsiden schicken."
string4="Wenn nicht für mich, dann tut es für das Königreich, Söldner."

[Ortiern_repeat_briefing_caves]
String="Sagte ich schon, dass Ihr unsere einzige Hoffnung seid?"
string2="Wenn Ihr es bis zum König schafft, wird er den Pfad wieder freimachen und Verstärkung für den Kampf gegen die Ylsiden schicken..."
string3="Wenn nicht für mich, dann tut es für das Königreich, Söldner!"

[Ortiern_misc_hi]//~09
String="Loyal für alle Zeit!"
string2="Und nochmal: Danke für Eure Hilfe, Söldner!"

///////////////////
// Human_KacelBem //
///////////////////

[Kacelbem_misc_before_guardian]//~04@suspicious
String="Ich kenne Euch nicht, und ich traue Euch auch nicht."
string2="Vielleicht wurdet Ihr vom Teufel gesandt. Bitte, lasst mich in Frieden!"
string3="Ihr seid kein normaler Mensch, Ihr seid der Teufel! Hilfe, ich habe den Teufel gesehen!"
string4="Ketzer!"

[Kacelbem_misc_after_guardian]//~04@not suspicious anymore
String="Rettet uns! Rettet uns, oh Bewahrer!"
string2="Ich wusste, Ihr seid kein gewöhnlicher Mensch."
string3="Erfüllt Eure Bestimmung, Bewahrer! Vernichtet Akbaa!"
string4="Die Ketzer werden sterben, dank Euch und dem Noden!"


//////////////////
// Human_King //
//////////////////

[player_king_1stmeet1]//{~00~01
String="Mein Name ist Am Shaegar. Ich bin den Kerkern der Goblins entflohen, woraufhin Ortiern mich um Hilfe bat. Er und seine Männer sitzen bei Eurem Außenposten in der Falle. Der Weg zur Festung ist nach einem Erdrutsch unpassierbar. Er braucht Hilfe. Sie wurden von einigen Ylsiden angegriffen und werden nicht mehr lange durchhalten können."

///FGE
[king_player_1stmeet1]//~01
String="Bei den Himmeln! Das sind üble Nachrichten, Am Shaegar. Ihr habt unserem Königreich einen großen Dienst erwiesen. Dafür gebührt Euch unser aufrichtiger Dank. Ihr werdet für die Risiken, die Ihr auf Euch genommen habt, angemessen entlohnt werden. Doch nun lasst mich überlegen, was wir unternehmen können, um die Passage zum Außenposten wieder freizuräumen."

///FGE
[king_player_1stmeet1bis]//~01
String="Ich habe mich entschlossen, zu handeln. Bringt diese Meldung zu Pog, dem König der Trolle. Seine Männer sind sehr gute Bergleute. Sie haben sogar geholfen, diese Stadt zu bauen. Die Trolle leben eine Ebene unter uns. Vielleicht seid Ihr ihnen bereits begegnet. Sie sind so hässlich wie die Goblins, aber fünfmal größer. Doch die Beziehungen unserer Königreiche sind exzellent. Und wir haben beide eine Abneigung gegen die Rattenmenschen. Ich bin sicher, sie werden uns sofort helfen!"

///FGE
[player_king_1stmeet2]//~00
String="Es scheint, als würde ich ständig wieder in diese Dinge hineingezogen. Nun gut, ich will Euch helfen. Dafür erwarte ich aber auch Eure Hilfe."

[king_player_1stmeet2]//~01
String="Keine Sorge, Ihr sollt für diesen Dienst von uns belohnt werden."

///FGE
[player_king_1stmeet3]//~00
String="Gold hilft mir nur wenig, wenn ich meine Erinnerung nicht wiederfinde."

///FGE
[king_player_1stmeet3]//~01
String="Ich bin sicher, Ihr werdet Eure Erinnerung zurückerlangen. Die Goblins müssen Euch einen heftigen Schlag auf den Kopf verpasst haben, das ist alles. Keine Sorge. Ich flehe Euch an, bringt diese Meldung als Gesandter des Königreichs zu Pog, dem Trollkönig!"

[king_player_1stmeet_misc]//}~01
String="Ich bitte Euch, Am Shaegar, geht und sprecht mit Pog, dem König der Trolle."
string2="Ich bin sicher, Eure Erinnerung kommt zurück - Stück für Stück."
string3="Nun, ich sehe keinen Grund für Euch, hier noch länger zu säumen."
string4="Beeilt Euch! Meine Männer sitzen am Außenposten in der Falle."

///FGE
[king_player_rocksaway1]//~01
String="Abermals meinen Dank, Am Shaegar. Die Felsen wurden weggeräumt. Ihr habt wieder einmal unseren Dank und diese Belohnung verdient. Ihr habt Euch als wertvoller Bürger unseres Königreichs erwiesen, und ich werde mich um eine angemessene Position für Euch kümmern."

///FGE
[king_player_rocksaway2]//{~01~11
String="Ah, ja! Wie gefiele es Euch, wenn ich Euch zu einem..."

///FGE
[Carlo_breaks_in1]//~11
String="Euer Majestät, wir haben Anzeichen entdeckt, dass ein weiteres Ritual angewendet wurde."

///FGE
[king_player_rocksaway3]//~01
String="Hm, das ist das dritte in weniger als einer Woche. Wo war es dieses Mal?"

[Carlo_breaks_in2]//~11
String="Direkt beim Luftschacht, Eure Majestät. Glaubt Ihr, das könnte mit dem Mord an Falan Orbiplanax zu tun haben?"

[king_player_rocksaway4]//~01
String="Vielleicht. Ich werde meinen neuen Freund dort nachsehen lassen. Danke, Carlo, Ihr dürft Euch entfernen!"

[Carlo_breaks_in3]//}~11
String="Sehr wohl, Sire."

///FGE
[king_player_rocksaway5]//{~01~00
String="Nun, was haltet Ihr davon? Ich lege Euch nahe, diese dunkle Sekte genau zu beobachten. Sie ist ganz sicher am Tod unseres alten Astronomen Falan Orbiplanax schuldig. Ich brauche jemanden, der nicht bereits als Agent des Königs bekannt ist, einen furchtlosen Mann. Werdet Ihr mir in dieser Rolle dienen?"

///FGE
[player_king_rocksaway1]//~00
String="Dies ist alles etwas verwirrend, Eure Majestät. Aber ich kann es natürlich versuchen."

///FGE
[king_player_rocksaway6]//~01
String="Ich weiß, Ihr werdet mich nicht enttäuschen. Ihr dürft jeden meiner Bürger in dieser Sache befragen. Wachen! Gebt diesem Mann freien Zugang zu allen Privaträumen der Festung! Zusätzlich, mein lieber Am Shaegar, ist hier der Schlüssel zu einem der königlichen Gemächer. Betrachtet es als Euer neues Heim!"

[player_king_rocksaway2]//~00
String="Eine sehr freundliche Geste."

///FGE
[king_player_rocksaway7]//~01
String="Vergesst es! Wir werden eine Ratsversammlung abhalten, sobald Ihr Neuigkeiten über diese beunruhigenden Dinge gebracht habt."

///FGE
[king_player_rocksaway_misc]//}~01
String="Wir werden eine Ratsversammlung abhalten, sobald Ihr Neuigkeiten bringt."
string2="Ich bin hocherfreut, auf Eure Hilfe zählen zu können, Am Shaegar."
string3="Gefällt Euch Euer neues Domizil?"
string4="Mögen Euch die Götter bei Euren Ermittlungen helfen!"

//player gives Krahoz to the King
[king_krahoz]//~01
String="Endlich ist der Krahoz zu uns zurückgekehrt. Vielen Dank für Eure Ehrlichkeit und Treue, Am Shaegar. Bringt ihn sogleich zu den Schwestern von Edurneum. Sie werden entzückt sein, ihren wertvollen Besitz zurückzuerhalten, und mich nicht länger mit ihren Fragen löchern. Das Königreich von Arx wird Euren Mut niemals vergessen."

//** grassini new: when the player has to collect the large sum of gold for the dragon.
[player_king_gold]//{~00~01
String="Ich brauche eine Menge Gold, um Arx zu retten."

///FGE
[king_player_gold]//}~01
String="Unser Königreich ist von märchenhaftem Reichtum weit entfernt. Aber bei allem, was Ihr für uns getan habt, Am Shaegar, wie könnte ich auch diese bescheidene Summe verweigern."

//** grassini: scene-setting section when the player arrives in the throne room.

