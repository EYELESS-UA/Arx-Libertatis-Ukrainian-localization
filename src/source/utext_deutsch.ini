////////////////////////////////////////
// GAME_READY TUTOS AND CURIOUS FACTS //
////////////////////////////////////////

[ready_tuto_1]
string = "Denkt daran: Gegenstände, die Ihr für euer Abenteuer benötigt, haben eine Beschreibung, die mit '(Quest Item)' enden. Verliert diese Gegenstände nicht!"


[ready_tuto_2]
string = "Denkt daran, dass Ihre Angriffskraft von der Zeit abhängt, zu der Ihr euren Schlag vorbereitet habt."


[ready_tuto_3]
string = "Wenn Ihr während der Vorbereitung eures Hiebes eine Richtungstaste drückt, werdet Ihr verschiedene Züge ausführen. Lauft beispielsweise vor dem Angriff nach links, um euren Gegner mit eurer Waffe zu zerschneiden."


[ready_tuto_4]
string = "Abgesehen vom Löschzauber könnt Ihr Flammen auch mit einer Wasserflasche ersticken. Um die Flasche wieder aufzufüllen, sucht einfach ein Wasserbecken auf und verwendet die leere Flasche darauf."


[ready_tuto_5]
string = "Wenn Ihr jemandem Geld geben müsst, findet Ihr eure Goldbörse über dem im unteren rechten Bildschirmrand befindlichen Inventarring."


[ready_tuto_5b]
string = "Sind einige Orte zu dunkel? Vergesst nicht Fackeln/Taschenlampen bei euch zu führen, um den Weg der vor euch liegt zu beleuchten."


[ready_tuto_6]
string = "Ladenbesitzer, die Waffen verkaufen, können auch Ihre eigenen beschädigten Waffen reparieren. Gebt ihnen einfach eure beschädigte Waffe indem Ihr sie mit dem Ladenbesitzer kombiniert, und man wird sie euch gegen eine entsprechende Gebühr reparieren."


[ready_tuto_7]
string = "Um Ihre Waffe zu reparieren, verwendet eure beschädigte Waffe in Verbindung mit einem Amboss. Abhängig von eurem ´Objektwissen´ ist die Reparatur mehr oder weniger effektiv."


[ready_tuto_8]
string = "Um zu fischen, sucht euch eine Angel (oder stellt selbige mittels einer Rute und einem Seil her) und begebt euch in die Nähe eines Flusses oder Sees. Verwendet dann die Angelrute."


[ready_tuto_9]
string = "Kauft euch so schnell wie möglich einen Schlüsselring! Damit können alle Schlüssel auf ein einziges Objekt zugewiesen werden, was euch Platz in eurem Inventar erspart."


[ready_tuto_10]
string = "Habt Ihr schon versucht, eine Waffe zu schmieden? Sucht euch eine ungeschmiedete Klinge, legt diese ins Feuer, betätigt das Blasebalg und beschlagt die noch glühende Klinge zuletzt mit einem Hammer! Die Wirksamkeit richtet sich nach den Fertigkeiten Ihres ´Objektwissens´."


[ready_tuto_11]
string = "Wusstet Ihr, dass Ihr euren Köcher nachfüllen könnt? Kombiniert dazu euren Köcher mit einem Ladenbesitzer, der Waffen verkauft. Hierdurch wird er Ihren Köcher gegen eine geringe Gebühr nachfüllen."


[ready_tuto_12]
string = "Wusstet Ihr, dass Ihr eure Waffen mittels eines Gifttranks vergiften könnt? Das Ergebnis hängt von eurem ´Objektwissen´ ab."


[ready_tuto_13]
string = "Wusstet Ihr, dass Ihr Edelsteine abbauen könnt? Findet einfach eine Spitzhacke und wendet sie auf rohen Edelsteinen an, welche über mit Felswänden verkrusteten Vorkommen zu finden sind."


[ready_tuto_14]
string = "Zögert nicht, verschiedene Dinge auszuprobieren. Ein bestimmtes Problem kann je nach Ihren Fähigkeiten und den Objekten, die in eurem Besitz sind, auf unterschiedliche Arten gelöst werden."


[ready_tuto_15]
string = "Denkt daran, ein gut zubereiteter Apfelkuchen schenkt euch mehr Lebenspunkte als ein einzelner Pilz und sättigt dazu schneller."


[ready_tuto_16]
string = "Passt auf, dass Ihr nicht zu viel Wein einnehmmt, sonst werdet Ihr euch noch betrinken!"


[ready_tuto_17]
string = "Ihr habt jemanden getötet, der für den späteren Verlauf noch relevant wird? Macht euch keine Sorgen: Ihr Abenteuer ist noch nicht vorbei. Es gibt immer einen anderen Weg, um an euer Ziel zu kommen, selbst wenn eine wichtige Person bereits das zeitliche gesegnet hat."


[ready_tuto_18]
string = "Solltet Ihr einen aktiven Zauber unterbinden wollen, wechselt einfach in den Cursormodus und wählt den Zauber aus, der gestoppt werden soll. Doppelklickt auf das Zaubersymbol in der rechten oberen Ecke, drückt einfach die Rollen-Taste oder die Taste '6'. Schlüssel (Standard). "



[ready_tuto_19]
string = "Wusstet Ihr, dass Ihr eure Feinde direkt in den Hals stechen könnt? Dadurch werden sie auf der Stelle ausgeschaltet. Um dies tun zu können, müsst Ihr sie von hinten angreifen, wenn sie sich eurer Anwesenheit nicht bewusst sind. Ihr benötigt eine hohe Sleichfertigkeit um auf diese besonderen Attentäterfähigkeiten zuzugreifen. "


[ready_tuto_20]
string = "Seid während des Kampfes vorsichtig, wenn Ihr zuschlagt: Sollte Ihre Waffe auf einen Stein, eine Wand oder eine andere harte Oberfläche auftreffen, wird sie beschädigt."


[ready_tuto_21]
string = "Habt Ihr jemals versucht, einen Feuerball auf ein Huhn zu werfen?"


[ready_tuto_21b]
string = "Exotische Runen verleihen Zaubersprüchen zusätzliche Verbesserungen und Fähigkeiten. Um einen verbesserten Zauber wirken zu können, benötigt Ihr jede der Runen für diesen Zauber in ihrer exotischen Version."


[ready_tuto_22]
string = "Vergesst nicht, dass Ihr Gegenmitteln und Lebens- oder Manatränken einer Abkürzung zuweisen könnt! Zum Beispiel kann es hilfreich sein, einen Lebenstrank auf ein Tastenkürzel zu setzen, und selbigen während Ihr euch im Kampf befindet zu benutzen. Greift auf diese Endungen zurück indem Ihr 'G', 'H'. oder 'Y' drückt (Standard). "


[ready_tuto_23]
string = "Wusstet Ihr, dass Ihr Zauber eurer Feinde mittels eigener Magie abwehren könnt? Benutze zum Beispiel den Zauber " Löschen ", während ein Feind einen Feuerball nach euch wirft. Wenn eure Magie-Fertigkeit höher ist als die des Feindes, könnt Ihr seinen Feuerball noch bevor er euch erreicht hat ersticken."


[ready_tuto_24]
string = "Wenn Ihr mehr als 50 Punkte in eure Schleich-Fertigkeit investiert habt, könnt Ihr einen Charakter bestehlen. Wenn Ihr euch einen Charakter nähert und links unten auf dem Bildschirm eine Geldbörse angezeigt bekommt, könnt Ihr von ihm stehlen. Öffnet einfach euer Inventar (Doppelklick mit der rechten Maustaste) und Ihr werden auch sein Inventar zu gesicht bekommen. Um größere oder wertvollere Objekte sehen und stehlen zu können, benötigen Ihr eine noch höhere Anzahl an Sleich-Punkten. "


[ready_tuto_25]
string = "Habt Ihr all die Mäuse und kleinen sanftmütigen Ratten in den Höhlen rumtapseln sehen? Lasst Käse, Fleisch oder etwas anderes zu essen für die kleinen Allesfresser in ihrer Nähe fallen ... sie werden sich freuen."


[ready_tuto_26]
string = "Wusstet Ihr, dass das Tragen verschiedener Rüstungen beim gehen unterschiedliche Geräusche verursacht? Das Tragen von Lederrüstungen erzeugt nicht das gleiche Geräusch wie das Tragen von Kettenrüstungen. Denkt daran, wenn Ihr innerhalb der Schatten umherschleicht."


[ready_tuto_27]
string = "Wusstet Ihr, dass Ihr Waffen, Rüstungen und Ringe verzaubern könnt? Benutzt eine entsprechende Reagenz und wirkt dann den Zauber 'Objekt verzaubern'! Das Ergebnis hängt von eurer magischen Fertigkeit ab."


[ready_tuto_28]
string = "Wusstet Ihr, dass Wasserbecken vergiftet werden können? Dies könnte sich als nützlich erweisen ..."


[ready_tuto_29]
string = "Wenn Ihr einen neuen Freund finden möchtet, zögert nicht, einen Hund zu füttern!"


[ready_tuto_30]
string = "Vergesst nicht, exotische Runen zu finden und zu verwenden. Diese verbessern die Wirksamkeit Ihrer Zauber und gewähren Einsicht auf neue Funktionen. Verbessert beispielsweise euren Nachtsichtzauber, um durch eine Tür sehen zu können und all Ihre in der Nähe befindlich zu identifizierenden Feinde oder Gegenstände im Vorfeld sehen zu können, dies kann sehr nützlich für das Schleichen sein ... "


[ready_tuto_31]
string = "Wenn Ihr etwas Gold benötigen, zögert nicht, Miguels Kampfarena aufzusuchen. Wenn Ihr an Wetten oder Turnieren teilnehmt, könntet Ihr euch möglicherweise regelmäßig Belohnungen verdienen."


[ready_tuto_32]
string = "Ihr könnt NPC-Konversationen zuhören, solange diese euch nicht erkennen. Hierdurch könnt Ihr euch wichtige Informationen aneignen und auf mancherlei Hinweise zugreifen, die euch helfen könnten."


[ready_tuto_33]
string = "Wusstet Ihr, dass es nützlich sein kann, Fackeln zu löschen? Verwendet den Löschen-Zauber oder eine Flasche Wasser für das Feuer. Auf diese Weise könnt Ihr leichter mit den Schatten verschmelzen und unentdeckt umherschleichen."


[ready_tuto_33B]
string = " Habt Ihr Vergessen, dass das löschen von Fackeln nützlich sein kann? Verwendet den Löschen-Zauber oder eine Flasche Wasser auf dem Feuer. Auf diese Weise könnt Ihr leichter mit den Schatten verschmelzen und unentdeckt umherschleichen."


[ready_tuto_34]
string = "Ihr könnt eure eigenen Tränke brauen: Verwendet einfach einen Mörser und Stößel, um Kräuter in Pulver umzuwandeln. Wendet im nächsten Schritt das gewonnene Pulver auf einer leere Flasche an. Zu guter letzt benötigt Ihr einen Destillierapparat, um den Trank zu brauen."


[ready_tuto_35]
string = "FALLTÜREN: Doppel-klickt auf die Falltüren, um auf Schuppen, Dächer oder alternative Pfade zu gelangen."


[ready_tuto_35b]
string = "FALLTÜREN: Doppel-klickt auf die Falltüren, um auf Schuppen, Dächer oder alternative Pfade zu gelangen."


[system_fire_creative]
string = "Ihr könnt kreative Fallen auslösen, wenn Ihr von zahlreichen Feinden verfolgt werdet. Begebt euch in die Nähe von brennbaren Trümmern und wirkt den Zauber 'Entzünden'. Feinde werden hierdurch eine begrenzte Zeit verbrannt- Vorsicht beim ausführen."


[tutorial_stealth_mod]
string = "SPIELT AUF EURE WEISE 2: Die diversen Herangehensweisen wie das Schleichen können auf unterschiedlichste Weise verwendet werden. ** - Verwendet den Schleich-Modus, um eure Schritte leiser werden zu lassen und entlang der Schatten zu schleichen (Standardtaste 'C'). * - Verborgen zu bleiben um Konversationen lauschen zu können, kann euch Vorteile bieten, wichtige Informationen zu erhalten oder um auf Schlüsselfunktionen zuzugreifen die euch in eurem Abenteuer weiter bringen. * - Führt sofortige Schattentöttungen nur an ahnungslose Feinde von hinten durch (Erforderlich: 40 Schleichen, ausschließlich für Dolche oder kurze Waffen). ** Die Schleich-Effektivität für sich hängt davon ab, wie viele Punkte Ihr dieser Fähigkeit zugeordnet habt. "


[tutorial_access_mod]
string = "SPIELT AUF EURE WEISE 3: Experimentiert und sucht nach Alternativen. Ihr könnt an einer verschlossenen Tür vorbeikommen, indem Ihr: ** - Nach einem passenden Schlüssel sucht. * - Einen alternativen Pfad findet. * - Mit einer Reihe von Werkzeugen das Schloss knackt. * - Die fungierende Wache bestecht, um Zugang zu erhalten. ** Jedes Problem hat immer unterschiedliche Lösungen. "


[tutorial_rooftops_mod]
string = "ERHÖHUNGEN UND DÄCHER: Verwendet Erhebungen, Dächer und Schuppen, um: ** - einen alternativen Weg zu finden. * - euch zu verstecken oder eure Feinde zu umgehen. * - einen Fallangriff (nicht tödlich) auszuführen indem Ihr von einer entsprechenden Höhe auf eure Feinde herabfallt um sie zu betäuben und bewusstlos zu machen. "


[system_no_lever]
string = "Findet ein Stück Holz und kombiniert es mit der Hebelbasis, um den Mechanismus zu reparieren."




