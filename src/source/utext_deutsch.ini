[Akbaa_dream_3]//~23@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Also gut, Bewahrer! Wie ich sehe, hast du mein großzügiges Angebot abgelehnt. Vielleicht wirst du deine Entscheidung bei unserem nächsten Treffen schon bitter bereuen. Hast du wirklich geglaubt, dass die Zerstörung dieses Meteors meine Wiedergeburt aufhalten würde? Der verbleibende Energiekanal genügt mir. Ihm kann ich folgen. Ich werde nicht die Stärke haben, die mir das Opfer dieser erbärmlichen Anhänger verliehen hätte. Aber wenn ich erst angekommen bin, wird meine Kraft schnell anwachsen - bei all diesen Seelen, die es zu trinken gibt!"

