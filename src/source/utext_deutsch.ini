[system_tutorial_0]
string="Sehen Sie in die Kisten des Ladens und nehmen Sie die Objekte, die Sie kaufen möchten. Legen Sie diejenigen ab, die Sie verkaufen wollen."

[system_tutorial_0bis]
string="Rechtsklicken Sie, um vom 'CURSORMODUS' in den 'MAUSBLICK-MODUS' zu wechseln.."

[system_tutorial_1]
string="Rechtsklicken Sie, um vom 'MAUSBLICK-MODUS' in den 'INTERAKTIONS-MODUS' zu wechseln."

[system_tutorial_1_new]
string="Rechtsklicken Sie auf diese Notiz, um sie zu schließen."

[system_tutorial_1_new2]
string="Die Hinweise des Tutorials finden Sie auch im Tagebuch (zu erreichen über die voreingestellte Taste 'F4')." 

[system_tutorial_2_new]
string="Doppelklicken Sie auf Objekte, um sie zu aktivieren."

[system_tutorial_2bis]
string="Drücken Sie die Taste 'BUCH ÖFFNEN' (voreingestellt ist die 'Tab'-Taste), oder klicken Sie auf das BUCH-Icon, um Ihr Tagebuch zu öffnen."

[system_tutorial_2tris]
string="Drücken Sie die Taste 'INVENTAR ÖFFNEN' (voreingestellt ist die Taste 'I'), oder klicken Sie auf das GÜRTEL-Icon, um in Ihr Inventar zu schauen."

[system_tutorial_3bis]
string="Knochen aufnehmen (voreingestellt ist die 'Enter'-Taste oder die Taste 'F')."

[system_tutorial_3bis_new]
string="Drücken Sie 'WAFFE ZIEHEN' (voreingestellt ist die 'Tab'-Taste), um zu kämpfen."

[system_tutorial_3bis_new2]
string="Drücken Sie die Taste 'ACTION' (voreingestellt ist die linke Maustaste), um zuzuschlagen. Je länger Sie die Taste vor dem Loslassen gedrückt halten, desto härter schlagen Sie zu."

[system_tutorial_3]
string="Doppelklicken Sie auf einen Charakter, um mit ihm zu sprechen."

[system_tutorial_4]
string="Drücken Sie 'WAFFE ZIEHEN' (voreingestellt ist die 'Tab'-Taste), um den Kampfmodus zu verlassen.*Doppelklicken Sie auf die Körper besiegter Gegner, um deren Inventar zu öffnen."

[system_tutorial_4_new]
string="Markieren Sie Objekte mit einem Linksklick und ziehen Sie sie auf Ihr Inventar.*Drücken Sie 'ENTER' oder 'F', um das Objekt zu benutzen."

[system_tutorial_5]
string="Wenn Sie sich im 'Mausblick' befinden, drücken Sie auf die Taste 'ACTION' (voreingestellt ist die linke Maustaste), um zu kämpfen."

[system_tutorial_5bis]
string="Im Kampf können Sie die Taste 'ACTION' (voreingestellt ist die linke Maustaste) auch zum Ausholen gedrückt halten und erst später loslassen, um zuzuschlagen. Je länger Sie ausholen, desto härter schlagen Sie zu. Sie sehen dies an der rautenförmigen Anzeige für die Schlagstärke in der Mitte des unteren Bildschirmrandes: Je gelber, desto Schmerz!"

[system_tutorial_6]
string="Sie haben soeben Ihre ersten Runen gefunden. Erfassen Sie sie in Ihrem Buch (voreingestellt ist die 'Enter'-Taste oder die Taste 'F')."

[system_tutorial_6bis]
string="Nun, da Sie Ihre ersten Runen besitzen, öffnen Sie Ihr Buch, und wirken Sie Ihren ersten Zauber."

[system_tutorial_7]
string="Drücken Sie die Taste 'KRIECHEN' (voreingestellt ist die Taste 'X'), und zerstören Sie die hölzerne Falltür am Boden."

[system_tutorial_8]
string="Falls Sie es bereits gefunden haben, doppelklicken Sie auf das Seil  in Ihrem Inventar, und linksklicken Sie anschließend auf den Aufzugsmechanismus, um es zu befestigen."

[system_tutorial_9]
string="Linksklicken Sie auf ein Zauberspruch-Icon, um seine Formel zu sehen. Die Formel bleibt als Referenz auf dem Bildschirm, wenn Sie das Buch schließen."

[system_tutorial_10]
string="Drücken und halten Sie die Taste 'MAGIEMODUS' (voreingestellt ist die Taste 'Strg'), um in den Magiemodus zu gelangen, und malen Sie die Runen mit gedrückter linker Maustaste auf den Bildschirm - eine nach der anderen. Lassen Sie dann die Taste 'MAGIEMODUS' wieder los, um den Zauber zu wirken."

[system_tutorial_11]
string="Teleporter aktiviert. Sie können erst dann durch die Portale reisen, wenn andere Teleporter aktiviert wurden."

[system_tutorial_12]
string="Entfachen Sie die Feuerstelle mit dem Zauberspruch 'ANZÜNDEN', und legen Sie rohe Nahrung auf das Feuer, um sie zu braten."

[system_tutorial_13]
string="Wirken Sie den Zauberspruch 'ANZÜNDEN' auf die Fackeln, um den Gang zu erleuchten."

[system_tutorial_14]
string="Rechtsklicken Sie auf eine Spruchrolle, um sich den betreffenden Zauber zu 'merken'."

[system_tutorial_15]
string="Dieser Zauberspruch ist nun 'gemerkt'. Wenn Sie den Spruch wirken möchten, doppelklicken Sie auf das Spruchsymbol, das nach dem Merken links unten auf dem Bildschirm erscheint."

[system_tutorial_16]
string="Klicken Sie auf das Treppen-Icon, um in die andere Ebene zu gelangen."

[tutorial_bag]
string="Bei einem Rechtsklick auf Ihren Inventargürtel sehen Sie, was sich in Ihren Beuteln befindet."

[tutorial_bag_02] //Jowood version
string="Hinweis: Sie können Ihr Inventar neu organisieren, indem Sie auf das Inventar-Icon doppelklicken."

[tutorial_lever] //Jowood version
string="Um den Mechanismus zu reparieren, doppelklicken Sie auf den Hebel, den Sie gerade gefunden haben, und linksklicken Sie dann auf die Hebelfassung an der Wand."

[tutorial_shop] //Jowood version
string="Sie befinden sich jetzt im Transaktionsmodus. ACHTUNG: die Transaktion gilt als getätigt, sobald Sie ein Objektaufnehmen oder in die Kisten des Ladeninhabers ablegen. Es gibt keine Rückerstattung, Wenn Sie den Kauf dann doch nicht tätigen."

[tutorial_mode_01] //Jowood version
string="Sie befinden sich im Cursormodus."

[tutorial_mode_02] //Jowood version
string="Sie befinden sich im Erkundungsmodus."

[tutorial_stealth] //Jowood version2
string="Nichtspieler-Charaktere können Sie hören: Also passen Sie auf, wo Sie hintreten. Versuchen Sie, etwas fortzuschleudern, und sehen Sie zu, wie die feindlichen Nichtspieler-Charaktere sich auf das Geräusch zubewegen.*Beachten Sie, dass in der unteren linken Ecke das Schleich-Icon erscheint, wenn Sie sich verstecken."

[tutorial_steal] //Jowood version
string="Wussten Sie, dass Sie anderen etwas stehlen können? Dazu brauchen Sie mindestens 50 Schleich-Punkte. Rempeln Sie einfach jemanden an, so dass sein Inventar-Icon auf der linken unteren Bildschirmecke erscheint. Linksklicken Sie dann auf das Icon und sehen Sie sich an, was Sie stehlen. Doch Vorsicht: Lassen Sie sich dabei nicht erwischen.""

[system_tutorial_level_01]
string="Glückwunsch! Ihr Charakter hat eine neue Erfahrungsstufe erreicht! Klicken Sie auf das rote Kreuz, und verteilen Sie die erhaltenen Stufenpunkte auf ihre Attribute und Fertigkeiten."

[system_tutorial_level_02]
string="Verteilen Sie die Stufenpunkte, indem Sie auf die Icons der Attribute und Fertigkeiten klicken; am Mauszeiger können Sie die Zahl der verfügbaren Punkte erkennen." 

