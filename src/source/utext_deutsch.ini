[book_calpal_journal]
string="Jahr 238, grüne Zeit, zweiter Tag der Woche der Spinne: Carlo bat mich, der Königin zu folgen. Seltsame Mission; er versuchte, den 'Der guten-alten-Zeiten-wegen'-Spruch gegen mich auszuspielen, weil ich einmal als Söldner für das Königreich arbeitete. Dieses Mal aber achtete ich darauf, dass ich bezahlt wurde. Jahr 238, grüne Zeit, fünfter Tag der Woche der Katze: als ich der Königin folgte, sah ich sie einen Brief hinter einer Statue nahe der Krypta verstecken. Ich wartete bis sie fort war, bevor ich schnell abschrieb, was dort hinterlegt war... Ich wette, Carlo wird sich über meinen Fund freuen. Jahr 238, grüne Zeit, sechster Tag der Woche der Katze: Mission erledigt; die Königin ist tot, und jeder denkt, die Rebellen, welche die Thronfolgerin entführten, hätten die Königin umgebracht..."

//** this book is now in the human library
[description_book_traveler_guild]
string="Die Gilde der Reisenden, von Dormal dem Weisen."

[book_traveler_guild_content]
string="Die Gilde der Reisenden war die erste Vereinigung, die nach dem Tod der Sonne von Arx gegründet wurde. Ihre Ursprünge stammen von einer Handvoll zäher Überlebender, die nicht mit dem Rest der Völker im Untergrund leben wollten. Diese Leute entwickelten Techniken, in der Kälte zu überleben, indem sie alchimistische Essenzen zu sich nahmen. Sie bauten Behausungen aus Eis und züchteten Hunde, die ebenfalls in der Kälte überleben konnten. Andere Männer und Frauen, die die Kälte nicht fürchteten, schlossen sich ihnen an, und reisten zu anderen Städten. Aus diesen Leuten entwickelte sich die Gilde der Reisenden, die nun die einzige Verbindung zwischen den Städten des Untergrunds darstellt. Die Reisenden werden überall respektiert und willkommen geheißen, da sie die Einzigen sind, die Neuigkeiten von außen bringen."

