[tutorial_transparency_door]
string = "Wenn Ihr den exotischen Nachtsichtzauber in der Nähe einer Tür aktiviert, könnt Ihr für kurze Zeit durch sie durchschauen und andere Charaktere im Vorfeld ausfindig machen, während der Zauber aktiv ist."


[tutorial_exotic_rune_single]
string = "Ihr habt eure erste exotische Rune gefunden! Fügt sie rasch eurer Runensammlung hinzu, damit eure Zauber verbessert werden. Um auf außergewöhnliche Varianten der einzelnen Zauber zugreifen zu können, benötigt Ihr alle erforderlichen Runen sowohl in der Basisversion (blaue Runen) als auch in der exotischen Variante (schwarze Runen). ** Exotische Runen fungieren ausschließlich als Aufwertung für die Basis-Runen, was bedeutet das sie nicht zusätzlich in eurem Zauberbuch aufgelistet werden. Solltet Ihr jedoch im Vorfeld eine exotische Rune, noch bevor Ihr die Basis-Rune eurer Sammlung hinzugefügt habt finden, korrespondieren die zuvor konsumierten Basis-Runen dennoch mit ihrem exotischen Gegenstück und die neue Rune wird euch trotzdem in eurem Zauberbuch angezeigt. "


[tutorial_exotic_rune_plural]
string = "Ihr habt eure erste exotische Rune gefunden! Fügt sie rasch eurer Runensammlung hinzu, damit eure Zauber verbessert werden. Um auf außergewöhnliche Varianten der einzelnen Zauber zugreifen zu können, benötigt Ihr alle erforderlichen Runen sowohl in der Basisversion (blaue Runen) als auch in der exotischen Variante (schwarze Runen). ** Exotische Runen fungieren ausschließlich als Aufwertung für die Basis-Runen, was bedeutet das sie nicht zusätzlich in eurem Zauberbuch aufgelistet werden. Solltet Ihr jedoch im Vorfeld eine exotische Rune, noch bevor Ihr die Basis-Rune eurer Sammlung hinzugefügt habt finden, korrespondieren die zuvor konsumierten Basis-Runen dennoch mit ihrem exotischen Gegenstück und die neue Rune wird euch trotzdem in eurem Zauberbuch angezeigt. "


