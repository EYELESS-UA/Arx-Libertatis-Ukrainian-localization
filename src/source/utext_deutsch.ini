//// NOTES  ////
////////////////

[note_garrett_content]
string = "Es gibt einen neuen Befehl von Garrett, ein besonderes Juwel, das in den Goblin-Katakomben vergraben sein soll. Sei bloß vorsichtig im Gefängnis und lass dich nicht fangen, sonst ruinierst du die Pläne."


[note_expedit_content]
string = "Sechs Tage sind bereits vergangen und ich befürchte, dass die Expedition gescheitert ist. Nach all dem was es uns gekostet hat, in diese Ruinen zu schleichen, ist das Risiko dennoch das Rätsel wert. Wir haben ein Goblin-Lager in der Nähe des Expeditionspunkts entdeckt und dann gibt es auch noch diese nervigen Ratten; wir müssen vorsichtig sein. "


[note_exgob_content]
string = "Du ist treten ein hier, du Dieb, verrotten du mit Würmern. Dort sein Müll dein, ich elender und armer Goblin, hoffen ich, Dieb nie muss betteln um Essen wie ich."


[note_immersives_content]
string = "Während der Expedition haben wir einen antiken Tresor gefunden, der leider leer war und verdammt viel wiegt, aber immer noch funktioniert. Aus diesen Grund habe ich einige Vorräte darin aufbewahrt. Das Teil zu öffnen war simpel, zwei der Schlüsselkodes waren bereits auf der Rückseite eingraviert, der dritte ist zwar etwas unleserlich, sollte aber kein Problem darstellen. "


