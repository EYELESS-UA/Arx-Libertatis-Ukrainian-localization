[Poxsellis_greetings]//~25@vicious
String="Gut gemacht! Ihr glaubt also, alle Hindernisse überwunden zu haben? Dabei habt Ihr Euch gerade in die schlimmste Situation gebracht, die Ihr Euch nur vorstellen könnt. Ihr werdet hier nie mehr lebend heraus kommen. Glaubt mir - vertraut den Worten eines toten Mannes..."

