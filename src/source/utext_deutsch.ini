[system_charsheet_Dex]
string= "Geschicklichkeit. Bestimmt Ihre Präzision und erhöht Ihre Chance auf kritische Treffer im Kampf. Geschicklichkeit hat einen Einfluss auf Fingerfertigkeit, Schleichen, eure Kampffertigkeiten und das Objektwissen. Diese Fertigkeit wirkt sich für euch zusätzlich auch darauf aus sowohl schneller als auch längere Zeit sprinten zu können, verkürzt das Momentum zwischen den Sprinteinlagen und einer Zugabe gesteigerten Adrenalinaufbaus."


[system_charsheet_stealth]
string = "Schleichen. Macht Ihre Schritte leiser, was Ihnen die Möglichkeit gibt, noch besser mit den Schatten zu verschmelzen, Ihre Feinde von hinten angreifen zu können und spezielle Aktionen wie Taschendiebstahl oder sofortige Schattentöttungen auszuführen, sollte Ihr Schleich-Level extrem hoch sein und Ihr für eure Opfer unentdeckt bleiben."


