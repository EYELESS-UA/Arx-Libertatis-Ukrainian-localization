[Gladivir_greetings]//{~25~00@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Ah ja. Wie ich sehe, haben wir einen neuen Besucher. Was seid Ihr? Reisender oder Grabräuber?"

[player_looking_for_shield]//~00@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Wer seid Ihr?"

[Gladivir_no_no_no]//~25@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Ich bin Gladivir, Bewacher des Schildes der Ahnen und das, was gewöhnliche Sterbliche einen Geist nennen."

[player_give_riddle]//~00@a bit surprised but not too much, he's the guardian@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Ein Geist! Ich komme wegen dieses Schildes..."

[Gladivir_challenge]//~25@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Hinter dieser Tür befindet sich der Weg, der zum Schild führt. Glaubt Ihr, dass Ihr würdig seid? Es ist ein Gegenstand mit großer Macht, und nur ein Wesen höherer Intelligenz kann es mir wegnehmen."

[player_doubts_riddle]//~00@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Warum sollte ich Euch glauben?"

[Gladivir_cantlie]//~25@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Wisset dies, Reisender: Geister lügen nicht. Wir können uns weigern zu sprechen, aber mit jedem Wort, dass unsere Lippen verlässt, sprechen wir die Wahrheit."

[player_ask_riddle]//~00@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Nun - ich erwarte Eure Aufgabe..."

[Gladivir_riddle]//}~25@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Ihr kommt aus dem Sonnenuntergang und geht in Richtung Sonnenaufgang. Um über die Sonne hinaus zu kommen, müsst Ihr die sechs Elemente der sechs alten Götter identifizieren und ehren. Richtet als erstes die drehbaren Teile in die Position der sechs Häuser der Ahnen." 

[Gladivir_riddle_remind]//~25
String="Stellt Euch vor - Ihr kommt aus dem Sonnenuntergang und geht in Richtung Sonnenaufgang. Um über die Sonne hinaus zu kommen, müsst Ihr die sechs Elemente der sechs alten Götter identifizieren und ehren. Richtet die drehbaren Teile in die Position der sechs Häuser der Ahnen."

//** grassini new aside if the player is making hard work of the puzzle...
