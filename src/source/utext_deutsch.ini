///FGE
[king_gard_warmeet1]//{~01~10
String="Mir wurde von Unruhen in den unteren Ebenen der Stadt berichtet. Alarmiert die Wachen am Außenposten!"

[guard_king_warmeet1]//}~10
String="Zu Befehl!"
// Guard exits.

// The pathway to the outpost has been cleared.
// Characters present: the King, Carlo, Felnor, Chinkashh & Kacel Bem.

[king_warmeet2]//{~01~11~02~20~04
String="Irgendwelche Neuigkeiten über die Ylsiden, meine Freunde?"

[carlo_warmeet1]//~11
String="Unsere Leute halten das Fort, Sire."

[felnor_warmeet1]//~02
String="Ich denke, wir sollten ihr Versteck finden, bevor sie das nächste Mal angreifen."

[chinkashh_warmeet1]//~20
String="Wenn sich Menschen nur an die Magie gewöhnen könnten, wäre manches viel leichter."

[kacel_warmeet1]//~04
String="All diese Ylsiden sind Ketzer, die bestraft werden müssen!"

[king_warmeet3]//}~01
String="Das Königreich kann eine solch ständige Bedrohung nicht hinnehmen!"

// After the sequence where snake woman slaps Lunshire, but before Carlo goes to prison. 
// Characters present: the King, Carlo, 1 guards

///FGE
[king_warmeet4]//{~01~11
String="Seit zwanzig Jahren verspottet eine Handvoll Rebellen meine besten Leute. Diese Zeiten sind nun vorüber, Carlo! Versteht Ihr?"

///FGe
[carlo_warmeet2]//~11
String="Aber Sire, wir hatten nur wenige Begegnungen mit diesen Rebellen. Vielleicht sind sie selbst zu diesen Ylsiden geworden!"

///FGE
[king_warmeet5]//}~01
String="Ein 'vielleicht' kann ich nicht mehr hören, Carlo! Ich will Ergebnisse, habt Ihr verstanden?"
// Carlo and the guards exit

// Possible war meeting about the quest for Krahoz/Zohark and the destruction of the statue.
// Characters present: the King, Felnor, Chinkashh

///FGE
[king_warmeet6]//{~01~02~20
String="Wir benötigen mehr Informationen über diese Beben. Es wird immer schlimmer!"

///FGE
[felnor_warmeet2]//~02
String="Es gab schon immer kleinere Beben in Arx, aber es gibt keinen Zweifel: Sie sind in letzter Zeit häufiger geworden. Ich befürchte, der Energiekanal, der von Akbaas Anhängern erzeugt wurde, stört die natürliche Ordnung. Das muss enden - und zwar bald!"

[king_warmeet7]//~01
String="Glaubt Ihr, es besteht die Gefahr eines kompletten Einsturzes?"

///FGE
[chinkashh_warmeet2]//~20
String="Wenn das der Fall wäre, hätte dasss unser Orden entdeckt. Momentan ist Akbaa die wahre Gefahr."

[king_warmeet8]//}~01
String="Seid wachsam, alle beide! Und warnt mich augenblicklich, wenn ihr Neuigkeiten hört!"

/////////////////////
// Kingdom council //
/////////////////////

[king_council_come_start]//{~01~02~04~00~20~03~11~09
String="Gut! Nun, da alle Ratsmitglieder anwesend sind, lasst uns beginnen! Felnor, was habt Ihr in den Notizen von Falan Orbiplanax entdeckt?"

[felnor_council_see_note]//~02@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Mal sehen... Ah, Falan erwähnte etwas über Erzog, den Wächter. Er sagte, er sah ihn irgendwelche dunklen Rituale praktizieren - sogar mit Tieropfern. Vielleicht war es Erzog, der hinter dem Mord an Falan steckt, oder vielleicht der Hohepriester des Akbaa-Kults. Oh, hört Euch dies an: 'Ich entdeckte einen Kult, der Akbaa in Arx wiedererwecken will'."

[king_council_take_erzog]//~01
String="Dieser Erzog kam mir schon immer verdächtig vor. Wachen! Werft ihn in den Kerker!"

[player_council_mentioned_akbaa]//~00
String="Felnor, wer ist dieser Akbaa, von dem man überall reden hört?"

[kacelbem_council_akbaa_demon]//~04
String="Akbaa ist ein mächtiger Dämon - der Gott der Zerstörung, den dieser Kult offenbar wiedererwecken und nach Arx holen will. Es wäre Blasphemie, diesen Akt zuzulassen, und es wäre die Vernichtung für jedes lebende Wesen auf unserer Welt."

[felnor_council_contact_noden]//~02
String="Ja, ja! Hier, hört euch das nächste Textstück an: 'Heute Abend werde ich den Noden kontaktieren, und um Hilfe ersuchen'."

[King_council_noden]//~01
String="Den Noden?"

///FGE
[felnor_council_yes_noden]//~02
String="Der Noden ist eine Dimension, welche die Existenz der Götter reguliert. Dort achtet man auf das universelle Gleichgewicht, indem dem Übergewicht einer Gottheit vorgebeugt wird."

[kacelbem_council_fallan_really]//~04
String="Wäre es Falan wirklich gelungen, den Noden zu kontaktieren, wäre es möglich, dass sie einen Gesandten geschickt hätten, um das Erscheinen von Akbaa zu unterbinden."

//** grassini new text
[King_council_gardian]//~01
String="Einen Unterhändler?"

///FGE
[felnor_council_gardian]//~02
String="Diese Gesandten sind Kreaturen aus reiner Energie, wenn sie sich im Noden aufhalten. Sie werden entsandt, um die Energiekanäle abzuschneiden, welche die Götter aus ihrer Dimension reißen könnten. Ich habe schon wundersame Geschichten von Gesandten gehört, die die Stärke von 100 Mann besaßen, oder die höchsten Formen der Magie beherrschten, und von anderen, die unbesiegbar waren. Diese Gesandten werden Bewahrer genannt."

[kacelbem_council_cinematic_cult]//~04@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Hier in der Festung existiert ein Kult, der gottlose Gebete vor einem Meteor-Fragment rezitiert. Es besteht aus einem Material namens Koltk. Es heißt, dieser Meteor stamme von Akbaas Geburtsort. Normalerweise ist Koltk unzerstörbar. In Wahrheit, Felnor, kann der Meteor nur von einem Bewahrer des Noden vernichtet werden."

///FGE
[suiberis_council_how_guardian_stop]//~03
String="Wie soll einer dieser Bewahrer die Inkarnation eines Gottes aufhalten können, indem er nur ein Stück Stein zerstört?"

///FGE
[kacelbem_council_prayer_heretics]//~04
String="Es sind die gottlosen Verse der Priester und ihre entsetzlichen Opfer, die von dem Meteor gebündelt werden. Er öffnet einen Energiekanal für Akbaa, der in Arx auferstehen wird, wenn er genug Energien gesammelt hat. Falls es soweit kommt, werden wir alle vernichtet. Wir müssen diesen Meteor um jeden Preis finden und ihn zerstören."

[player_council_how_find_guardian]//~00
String="Wie können wir diesen Bewahrer finden?"

///FGE
[felnor_council_koltk_sample]//~02
String="Ich bewahre in meinem Labor ein Fragment des Koltk auf, das sehr hilfreich sein könnte, ihn zu finden."

[king_council_here_situation]//~01
String="Lasst uns über eines klar sein: Wir wissen, dass dieser Akbaa-Kult in Arx sehr präsent ist und dass er noch an Macht gewinnt. Glücklicherweise konnten wir Erzog, den Hohepriester des Kults, stoppen, bevor es zu spät war. Aber auch andere Anhänger von Akbaa könnten ihn erwecken. Wir müssen diesen berühmten Bewahrer des Noden so schnell wie möglich finden!"

///FGE
[carlo_council_also_war]//~11
String="Zusätzlich ist der Krieg mit diesen Ylsiden sehr aufreibend, Eure Majestät. Wie sollen wir uns in dieser Sache verhalten?"

[king_council_shall_brief]//~01
String="Carlo, wir benötigen einen durchdachten Verteidigungsplan. Ich befürchte das Schlimmste. Niemand weiß, wer diese Ylsiden sind, und wer sie befehligt. Wachen, bringt mir das Fragment von Koltk!"

///FGE
[king_council_while_army]//~01
String="Am Shaegar, wir brauchen Eure Hilfe, diesen legendären Bewahrer zu finden, während unsere Armee sich den Ylsiden entgegenstellt. Ich muss zugeben, dass diese Aufgabe schwer und langwierig sein wird. Wir wissen nicht, wie dieser Bewahrer aussieht, oder ob er sich bereits unter uns befindet. Aber ich glaube an Eure Fähigkeiten."

[guard_council_here_sample]//~09
String="Hier ist der Stein, Euer Majestät!"

[king_council_put_table]//~01
String="Gut! Legt ihn auf den Tisch!"

[king_council_take_sample]//~01
String="Nehmt diesen Stein, Am Shaegar! Er ist nur klein, aber nur der Bewahrer ist in der Lage, dieses Fragment des Meteors zu zerstören. Vor allem aber: seid sehr vorsichtig!"

[carlo_council_aaahhh]//~11
String="Ah!"

[king_council_amazing]//~01
String="Bei den Himmeln!"

[chinkashh_council_cant_believe]//~20
String="Tssssss!"

[felnor_council_so_am_shagar]//~02
String="Aber das würde bedeuten, Am Shaegar ist..."

///FGE
[king_council_guardian_well]//~01
String="Der Bewahrer! Nun verstehe ich! Und ich verstehe auch sein immerwährendes Bedürfnis, anderen zu helfen. Ich fühle mich geehrt, Euch gegenüberzustehen, Bewahrer!"

///FGE
[player_council_surprise_for_me]//~00
String="Diesen Stein zu berühren, hat meinen Geist erleuchtet. Ich wurde hierher entstandt, um das Erscheinen von Akbaa zu verhindern, und ich muss sofort ans Werk. Als erstes benötige ich Zugang zum geheimen Tempel, wo ich den Stein durch simple Berührung zerstören soll."

///FGE
[felnor_council_noden_with_you]//~02
String="Möge die Weisheit des Noden Euch leiten, Am Shaegar!"

[king_council_now_go]//}~01
String="So lasst uns nicht mehr säumen!"


