[mopak_introducing]//~08
String="Willkommen, Fremder! Mein Name ist Mopak! Ich kaufe und verkaufe so ziemlich alles. Nehmt, was Euch gefällt! Wenn Ihr mir etwas verkaufen wollt, legt es hier in meine Truhe, und ich mache Euch ein Angebot!"

