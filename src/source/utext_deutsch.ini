[snake_enough_lunshire]//~21 TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Genug! Der Orden hat kein Interesse an Euren rührseligen Geschichten! Ergebnisse sind das Einzige, das Euch vor dem Ausdruck unserer Enttäuschung bewahren kann!"

[lunshire_will_do_my_best]//~01 TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Ich werde meine besten Männer darauf ansetzen!"

[snake_assist_you]//}~21 TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Schwester Chinkashh wird hier bleiben, um Euch zu helfen... Wie immer!"

