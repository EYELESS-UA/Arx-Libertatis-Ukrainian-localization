// Suiberis //
////////////////

[suiberis_greetings_player]//{~03~00
String="Ich bin der neue Astronom. Ich war Assistent des armen Falan Orbiplanax. Seit er tot ist, tue ich mein Bestes, dieses Observatorium in Betrieb zu halten."

///FGE
[player_observing_misc]//~00
String="Was haben Euch die Sterne gesagt?"

// grassini new
///FGE
[suiberis_nothing_stars]//~03
String="Nichts! Der Himmel ist heute bedeckt."

[suiberis_nothing_misc]//}~03
String="Die momentane Astralkonfiguration ist faszinierend."
string2="Meine Arbeit verlangt viel Konzentration, wisst Ihr?"
string3="Wenn Ihr mich entschuldigt! Ich habe Berechnungen und Horoskope fertigzustellen!"

// If Carlo has talked about rituals. //

[player_rituals_suiberis]//{~00~03
String="Suiberis, was könnt Ihr mir über die Rituale sagen? Wisst Ihr, wer Falan Orbiplanax getötet hat?"

[suiberis_dont_know_rituals]//}~03
String="Also, ich weiß nicht, wovon Ihr redet. Ich bin auch ein Neuling auf meinem Gebiet. Und letztendlich hasse ich Gewalt."


////////////
// Felnor //
////////////

[felnor_greetings]//{~02~00
String="Ich bin Felnor, der Alchimist des Königreiches und Freund des verstorbenen Falan Orbiplanax."

[player_felnor_falan]//~00
String="Wer war Falan Orbiplanax?"

[felnor_greetings2]//}~02
String="Falan war unser Astronom. Er starb vor ein paar Tagen. Ich glaube, er war dabei, Licht in eine dunkle Sache zu bringen. Aber er fand keine Zeit mehr, mit jemandem darüber zu reden."

[felnor_laboratory_generic]//~02
String="Seht Euch nur um, während ich arbeite!"
string2="Wenn Ihr irgendetwas Hilfreiches in meinem Labor findet, zögert nicht, Euch zu bedienen!"

//** grassini: during the investigation on Falan and the rituals
[player_felnor_falan2]//{~00~02
String="Ich ermittle in Sachen der Rituale und des Todes von Falan Orbiplanax!"

[felnor_falan]//~02
String="Ich kann Euch nur sagen, dass diese zwei Dinge eine Verbindung besitzen. Ich habe hier eine Notiz, die mir Falan am Tag seines Todes gab - für den Fall, dass ihm etwas zustoßen sollte. Ich wusste nicht, was er meinte. Vielleicht versteht Ihr es."

[felnor_keep_looking_weapon]//}~02
String="Ihr müsst Euch diese legendäre Waffe zunutze machen, Bewahrer!"

///////////////////
// ISERBIUS   //
//////////////////
[Iserbius_welcome]//~03@vicious, he was expecting the player. TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Ich weiß, wer Ihr seid und warum Ihr hier seid. Orbiplanax muss Zeit gehabt haben, den Noden zu kontaktieren. Ich hätte mich eher um ihn kümmern sollen. Ein Bewahrer! Eure Gegenwart  beflügelt uns! Es beweist, dass wir endlich die Kraft haben, Akbaa wiederzuerwecken - stärker als je zuvor. Und was uns betrifft, mein Herz, werden wir die Zeremonie später fortsetzen!"

[Iserbius_incantation]//~03
String="In raaa Nikaaa dum Reanima!"

////////////////////////////////////////
// Player has tried to destroy statue //
////////////////////////////////////////

//** grassini when the player arrives, the King is with Felnor and Carlo is talking to him, bringing him sad news...
[carlo_statue_guard_post_attack]//{~11~01~00
String="Eure Majestät, unser Außenposten wurde von den Ylsiden angegriffen. Dieses Mal gab es keine Überlebenden. Schlimmer noch: Wir fanden keine Leichen. Vielleicht wurden sie entführt."

[king_statue_damned_where]//~01
String="Bei den Himmeln! Wohin könnten sie verschwunden sein?"

[carlo_statue_dont_know]//~11
String="Das wissen wir nicht. Sie sind schnell und gnadenlos. Und auch sehr stark, Sire!"

[king_statue_supposed_linked]//~01
String="Ich vermute, diese Ylsiden sind in der Tat Mitglieder des Akbaa-Kultes."

[player_statue_you_mean]//~00
String="Unter dem Befehl von Iserbius?"

[king_statue_no_proof]//~01
String="Ich habe keinen wirklichen Beweis, aber wir hörten erstmalig von ihnen, als der Akbaa-Kult auftauchte. Aber es gibt noch etwas anderes: Suiberis verließ erst kürzlich das Königreich. Er muss herausgefunden haben, dass wir der Wahrheit über ihn auf der Spur waren."

[player_statue_what_truth]//~00
String="Welche Wahrheit?"

[felnor_statue_have_figured]//~02
String="Suiberis und Iserbius sind ein und derselbe! Er steckt hinter dem Mord an Falan!"

[player_statue_why_iserbius]//~00
String="Nun ist mir klar, warum Iserbius am Tempel auf mich wartete! Er wusste, dass ich kommen würde!"

[king_statue_so_am_shagar]//~01
String="Also habt Ihr mit ihm gekämpft! Endlich ein paar gute Nachrichten. Am Shaegar, sagt mir, dass Ihr diesen Ursprung des Bösen ein für alle Mal vernichtet habt!"

///FGE
[player_statue_sorry]//~00
String="Nein, ich konnte den Meteor nicht zerstören! Stattdessen fühlte ich, wie meine Energie verfloss!"

[king_statue_damned]//~01
String="Guter Gott! Wie kann das sein? Felnor, wie lässt sich so etwas erklären?"

///FGE
[felnor_statue_mhh]//~02
String="Hm, ich befürchtete schon, dass dies passieren würde. Der Stein steht nun in Verbindung mit Akbaa, und der Energiekanal saugt sowohl Eure körperliche, als auch Eure magische Energie aus, um Akbaa zu nähren. In der Tat ist es so, dass Ihr durch die Berührung Eure eigene Energie zum schlimmsten unserer Feinde geschickt habt."

//** grassini new
[king_statue_damned2]//~01
String="Aber es muss trotzdem einen Weg geben, dies alles zu stoppen!"

///FGE
[felnor_statue_mhh2]//~02
String="Während des schrecklichen Krieges der Magier, vor langer, langer Zeit, war solcher Energie-Diebstahl verbreitet. Und natürlich gab es auch Gegenmaßnahmen!"

[king_statue_can_guess]//~01
String="Ich glaube, ich verstehe, was Ihr meint, Felnor! Aber selbst meine besten Leute haben in dieser Sache immer wieder versagt."

[felnor_statue_not_best_man]//~02
String="Am Shaegar ist nicht allein einer unserer besten Leute! Nein, er ist der Bewahrer, von den Göttern entsandt!"

[player_statue_apreciate_explanation]//~00
String="Wenn Ihr denkt, es gibt auch nur die geringste Chance, den Meteor zu zerstören, werde ich einen Weg finden, es zu tun!"

///FGE
[felnor_statue_your_only_chance]//~02
String="Ihr müsst Euch selbst gegen den Energieentzug des Meteors schützen. Während des Krieges der Magier erhielt das Königreich vom Orden von Edurneum ein Artefakt gewaltiger Macht. Ohne es hätten wir wahrscheinlich den Krieg verloren. Dieses Artefakt bestand aus zwei Teilen, dem Krahoz und dem Zohark. Ein Magier, der beide Artefakte besaß, wurde immun gegen den Energieentzug. Dank dieses Schutzes gewannen wir letztendlich den Krieg."

[player_statue_where_the_problem]//~00
String="Nun, dann gebt mir dieses Objekt!"

[felnor_statue_more_complicated]//~02
String="An diesem Punkt wird es kompliziert. Als uns dieses Objekt vom Orden von Edurneum übergeben wurde, unterzeichnete Poxsellis, der Vater unseres jetzigen Königs, einen Vertrag. Er besagt, dass wir das Artefakt zurückgeben müssen, wenn der Orden danach verlangt."

[player_statue_fair_enough]//~00
String="Darin sehe ich nichts Falsches! Und?"

[king_statue_20_years]//~01
String="Nun, 20 Jahre später tauchte eine Gruppe von Rebellen aus dem Nichts auf, tötete meine Frau und entführte meine Tochter, die grade erst auf die Welt gekommen war!"

///FGE
[felnor_statue_steal_krahoz]//~02
String="Darüber hinaus stahlen sie zusätzlich den Krahoz. Glücklicherweise konnten wir den Zohark vor ihnen schützen. Ein paar Stunden später erschien der Orden und verlangte das gesamte Artefakt zurück. Wir konnten ihnen nur den Zohark geben. Seither verlangen sie, dass wir uns an den Pakt halten und den Krahoz wiederfinden. Aber wir fanden diese Rebellen nie; wir wissen nicht einmal, ob sie noch in Arx sind, da sie nur dieses eine Mal gesehen wurden. Ungeachtet dessen versichert uns der Orden, dass sie die Präsenz des Krahoz in der Festung noch immer spüren können."

[player_statue_good_news]//~00
String="Also gut! Dann werde ich den Krahoz und den Zohark finden!"

[king_statue_now_go_save_misc]//~01
String="Geht nun, Am Shaegar, und rettet uns vor diesem Dämon! Findet den Krahoz und den Zohark, und zerstört diesen verfluchten Meteor ein für alle Mal!"
string2="Ihr müsst den Krahoz und den Zohark finden - die einzige Möglichkeit, den Meteor zu zerstören!"
string3="Findet den Krahoz und den Zohark, Am Shaegar! Dann werdet Ihr letztendlich in der Lage sein, den Meteor zu zerstören."

[felnor_statue_now_go_save_misc]//}~02
String="Am Shaegar, Ihr müsst nun losziehen, um den Krahoz und den Zohark zu finden!"
string2="Beeilt Euch, den Krahoz und den Zohark zu finden, und zerstört den Meteor!"
string3="Findet den Krahoz und den Zohark, Am Shaegar, um das Königreich zu retten!"

//////////////////////////////////////
// King is free after Ylside attack //
//////////////////////////////////////

[king_after_attack_thanks]//{~01~00~02
String="Vielen Dank, Am Shaegar! Ihr habt das Königreich gerettet! Wir werden Euch ewig dankbar sein!"

[player_after_attack_good_news]//~00
String="Ich habe den Meteor im Tempel von Akbaa zerstört!"

[felnor_after_attack_afraid]//~02
String="Ich fürchte, das genügt nicht, um Akbaa von Arx fernzuhalten!"

[player_after_attack_for_nothing]//~00
String="Aber das kann nicht sein! Der Meteor war sein Energiekanal!"

///FGE
[felnor_after_attack_usefull]//~02
String="Was Ihr getan habt, war unerlässlich, um Akbaa zu schwächen. Dennoch, nach meinen Berechnungen hatte Akbaa bereits Zeit genug, sich für eine Inkarnation in Arx zu stärken. Ich glaube, Iserbius hat ein geheimes Versteck zur Erweckung Akbaas, dem er seinen eigenen Körper als Wirt anbieten will."

[player_after_attack_stop_process]//~00
String="Wie können wir das verhindern?"

///FGE
[felnor_after_attack_kill_entity]//~02
String="Leider gar nicht! Der einzige Weg ist, ihn zu töten, bevor diese Verschmelzung stattfindet. Es wird ihn einige Zeit kosten, diese immense Energiemenge Akbaas zu beherrschen. Doch während dieses Prozesses ist er immun gegen fast alle Waffen. Ihr benötigt die stärkste, existierende Waffe, um Euch diesem Monstrum entgegenzustellen und die Verbindung zwischen Akbaa und Iserbius zu zerstören."

///FGE
[player_after_attack_where_weapon]//~00
String="Wo kann ich diese Waffe finden?"

///FGE
[felnor_after_attack_not_exist]//~02
String="Ich fürchte, eine solche Waffe gibt es nicht! Ihr müsst sie speziell für diesen Zweck schmieden! Es gibt ein Buch mit dem Namen 'Die Theorie der absoluten Waffe', das genau erklärt, wie man so etwas bewerkstelligt. Das müsst Ihr haben!"

[player_after_attack_my_best]//~00
String="Ich werde handeln, so schnell ich nur kann!"

// If player has the weapon. //

[player_after_attack_weapon]//~00
String="Ich habe die Waffe!"

///FGE
[king_after_attack_weapon]//~01
String="Hervorragend, Am Shaegar! Findet nun den Verräter Iserbius, und verbannt dieses Monster aus Arx!"

[king_after_attack_keep_weapon_misc]//}~01
String="Ihr müsst diese legendäre Waffe herstellen, Am Shaegar!"
string2="Die Zeit arbeitet gegen uns, Am Shaegar. Ihr müsst diese Waffe schmieden!"
string3="Diese Waffe wird in der Lage sein, Akbaa zu vernichten!"

[king_after_attack_akbaa_misc]//~01
String="Nun müsst Ihr Akbaa finden und vernichten!"
string2="Die Zeit ist reif, Akbaa gegenüber zu treten und ihn zu vernichten!"
string3="Am Shaegar, es ist Zeit, Akbaa zu stellen und ihn ein für alle Mal zu vernichten!"

// Player shows Carlo's diary to the King. //

[player_show_diary01]//{~00~01
String="Eure Majestät, leider muss ich Euch berichten, dass Carlo etwas mit dem Tod Eurer Gemahlin zu tun hatte."

[king_show_diary01]//~01
String="Was sagt Ihr da? Zeigt mir diese Dokumente!"

[player_show_diary02]//~00
String="Hier!"

[king_show_diary02]//~01
String="Bei den Himmeln! Carlo - ein Verräter! Und ich dachte, er wäre mein Freund. Bitte lasst mich einen Moment allein! Meine Wache wird sich darum kümmern."

[king_show_diary02_misc]//}~01
String="Lasst mich einen Moment allein, ich bitte Euch!"
string2="Ich möchte einen Augenblick allein sein!"
string3="Bitte, ich brauche einen Moment, um nachzudenken!"

// Player shows Carlo's diary to the King and Carlo is in jail. //

[king_show_diary03]//~01@sorry
String="Ich verstehe, was Carlo tat. Er glaubte, das Beste für das Königreich zu tun. Dennoch werde ich ihm nie verzeihen können!"

// Player shows Florence's letter to the King and Carlo is in jail. //

[player_show_florence_letter]//{~00~01
String="Dies ist der Brief, den Carlo fand, und der ihn dazu brachte, so zu handeln."

[king_show_florence_letter]//}~01
String="Ich danke Euch, ich werde es später lesen. Für den Moment habe ich Schwierigkeiten, all die Jahre voller Lügen zu akzeptieren."

// King has been slapped by snake woman. //

///FGE
[player_after_slap01]//{~00~01
String="Ich verstehe gar nichts. Um was dreht sich diese Unterhaltung?"

[king_after_slap01]//}~01
String="Hört mich an! Verzeiht mir, aber ich denke, es ist das Beste, Ihr habt hiermit nichts zu tun. Dies ist etwas, das allein das Königreich betrifft."

