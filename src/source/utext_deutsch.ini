[system_tutorial_bricks]
string="Findet Steine und stapelt diese zu einer passenden Plattform auf um eurer Zelle zu entkommen."

[player_shadowkill]
string="SCHATTEN-TÖTUNG!!!!!"

[player_adrenaline]
string="ADRENALIN-ANGRIFF!!!!!"

[system_tutorial_food_rats]
string="Einige Ratten und Mäuse sind euch freundlich gesinnt. Ihr könnt bestimmte Arten von Futter in ihrer Nähe abstellen; mit Sicherheit werden sie es lieben. * Hinweis: Nicht alle Ratten sind freundlicher Natur und umso weniger solche die in Gruppen unterwegs sind. "
."

[tutorial_stealth]
string="SPIELT AUF EURE WEISE: *** - Ihr könnt Feinde auf der Stelle töten indem Ihr sie von hinten angreift, solange Ihr nicht auf frischer Tat ertappt werdet. Ihr benötigt mindestens 40 Punkte in ´Schleichen´ und müsst entweder einen Dolch oder ein Kurzschwert ausgerüstet haben um dies tun zu können. ** - Ihr könnt Charakterkonversationen zuhören, solange diese euch nicht erkennen. Während Ihr lauscht, könnt Ihr Informationen erhalten und auf selbige zurückgreifen, die für euer Abenteuer nützlich sein könnten. ** - NPC´s können euch hören, also achtet auf eure Schritte. Ihr könnt versuchen, einen Gegenstand von euch wegzuwerfen, was dazu führen kann, dass sich feindliche NPC´s darauf zubewegen. Beachtet, dass das Schleich-Symbol in der unteren linken Ecke des Bildschirms angezeigt wird, wenn Ihr euch versteckt. "


[tutorial_stealth2]
string="SPIELT AUF EURE WEISE: *** - Ihr könnt Feinde auf der Stelle töten indem Ihr sie von hinten angreift, solange Ihr nicht auf frischer Tat ertappt werdet. Ihr benötigt mindestens 40 Punkte in ´Schleichen´ und müsst entweder einen Dolch oder ein Kurzschwert ausgerüstet haben um dies tun zu können. ** - Ihr könnt Charakterkonversationen zuhören, solange diese euch nicht erkennen. Während Ihr lauscht, könnt Ihr Informationen erhalten und auf selbige zurückgreifen, die für euer Abenteuer nützlich sein könnten. ** - NPC´s können euch hören, also achtet auf eure Schritte. Ihr könnt versuchen, einen Gegenstand von euch wegzuwerfen, was dazu führen kann, dass sich feindliche NPC´s darauf zubewegen. Beachtet, dass das Schleich-Symbol in der unteren linken Ecke des Bildschirms angezeigt wird, wenn Ihr euch versteckt. "



[tutorial_torchi]
string = "SPIELT AUF EURE WEISE 1: Ihr könnt ein Hindernis auf verschiedene Weise überwinden. ** - Kombiniert die Flasche Wasser mit der Fackel, um euch zu verstecken. * - Interagiert mit eurer Umgebung (lenkt den Feind ab oder sperrt ihn mit dem Fallgatter ein). * - Befreit den Gefangenen während des Kampfes. * - Greift Feinde direkt an oder weicht ihnen aus. ** Experimentiert mittels unterschiedlicher Kombinationen. Wenn Ihr neue Fähigkeiten erlernt, stehen euch mehr Optionen zur Verfügung. "


[tutorial_torch2]
string = "Gut gemacht! Denkt daran, dass während Ihr euch versteckt das Schleich-Symbol in der unteren linken Ecke angezeigt wird. Je intensiver dieses Symbol dargestellt wird, desto schwieriger wird es für ihre Feinde, euch zu erkennen. Hinweis: Ihre Schleich-Punkte beeinflussen eure Fähigkeit unentdeckt zu bleiben."


[tutorial_exotic_runes]
string = "Herzlichen Glückwunsch, Ihr habt eine exotische Rune in eurem Besitz! Diese Art von Rune verbessert Zaubersprüche, die mittels ihrer aktuellen Rune verwendet werden, um spezielle Funktionen freizuschalten oder sie weiterzuentwickeln."

[system_break_door]
string = "Schlagt auf das verrosteten Fallgatter ein, um es abzureißen."

[system_break_box]
string = "Ihr könnt auf Kisten einschlagen, um sie zu zerstören. Einige von ihnen enthalten möglicherweise im Inneren Objekte."


[system_shrunken_player]
string = "Seid achtsam, dass Ihr NPC´s nicht zu nahe kommt, während Ihr geschrumpft seit. Sie könnten euch leicht töten, ohne euch überhaupt entdeckt zu haben; selbst wenn sie Verbündete sein sollten."


[system_dummy3]
string = "Ihr könnt Feinde heimlich von hinten angreifen und auf der Stelle töten, indem Ihr ihnen in den Hals stecht. Denkt daran, dass für diese Fertigkeit mindestens 40 Punkte in ´Schleichen´ erforderlich sind. Sollten Feinde euch während des Aktes entdecken wird Ihr Spezialangriff abgebrochen."


[system_fire_creative]
string = "Ihr könnt kreative Fallen auslösen, wenn Ihr von zahlreichen Feinden verfolgt werdet. Begebt euch in die Nähe von brennbaren Trümmern und wirkt den Zauber 'Entzünden'. Feinde werden hierdurch eine begrenzte Zeit verbrannt- Vorsicht beim ausführen."

[system_player_note]
string = "Vielen Dank für die Unterstützung dieses Projekts. * Checkt die Website auf zukünftige Updates. ** Wir setzen mit der Weiterentwicklung und Verbesserung dieser Mod fort. Ihr seid dabei unsere Motivation, weiterzumachen! ** Wenn ihr Arx liebt, zögern nicht der Arx Insanity-Community auf Discord beizutreten: ** https: //discord.gg/mxTKk52 "


[system_supporter_note]
string = "Vielen Dank, für die Unterstützung dieses Projekts. ** Zur Anerkennung habt ihr hier einige exklusive Gegenstände für Donatoren: Einen Vorgeschmack auf die Alchemiewaffen und zusätzliche anderen Item´s. ** Checkt die Website auf zukünftige Updates. * * Wir werden die Mod vorerst weiterentwickeln und verbessern, ihr seid dabei unsere Motivation, weiterzumachen! ** Wenn ihr Arx liebt, zögert nicht, der Arx Insanity-Community auf Discord beizutreten: ** https: //discord.gg / mxTKk52



