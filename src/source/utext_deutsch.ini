[description_book_guardpost]
string="Tagebuch."

[book_guardpost_content]
string="- Das Jahr 266, weiße Zeit, Woche der Ratte, dritter Tag.*Heute versuchte eine kleine Goblinbande einen Angriff auf den Außenposten. Sie waren betrunken und leicht zu besiegen. Wir denken, das war nichts Geplantes, nur ein Ergebnis des Alkohols, den sie intus hatten. Wir schlugen sie problemlos zurück, verloren trotzdem einen Mann, die Goblins aber fünf.**- Jahr 266, weiße Zeit, Woche des Maulwurfs, zweiter Tag.*Ein Erdbeben erschütterte unseren Außenposten bis ins Fundament, für ganze zehn Minuten. Kein Schaden trat auf, aber ich entdeckte ein paar Risse in der Passage, die zu unserer Stadt führt.**- Jahr 266, grüne Zeit, Woche der Kuh, vierter Tag.*Ein seltsamer Angreifer attackierte uns heute morgen. Er trug schwere Rüstung von einer Art, wie wir sie noch nie gesehen hatten und schien unverwundbar. Jede seiner Bewegungen war unerhört präzise und er war unglaublich schnell. Er kannte keine Gnade, tötete einen meiner Männer und verletzte zwei, bevor er einfach kehrtmachte und so schnell verschwand, wie er gekommen war. Sein Verhalten macht mich glauben, dass er gekommen war, um unsere Stärke auszutesten.*Ich glaube, dieser Krieger ist das erste sichtbare Zeichen einer Macht, die in den Schatten heranwächst und die eines Tages machtvoll genug sein wird, uns alle zu vernichten.**- Jahr 266, grüne Zeit, Woche des Adlers, erster Tag.*Der seltsame Krieger kehrte zurück. Er tötete drei meiner Krieger, ehe ich es schließlich schaffte, ihn zu töten. Und als er in den letzten Zügen lag, brach er plötzlich in lautes, dämonisches Gelächter aus. Ich befürchtete das Schlimmste und trieb meine Leute zum sofortigen Rückzug an. Eine gewaltige Explosion verstreute seine Überreste in der ganzen Gegend. Außer seinem Dolch blieb nichts von ihm übrig.**- Jahr 266, gelbe Zeit, Woche der Schlange, erster Tag.*Wir erwachten heute sehr früh am Morgen durch ein Erdbeben. Einer meine Männer sagte mir, dass das Beben einen Erdrutsch in der Passage zur Festung auslöste. Sicher trifft bald Hilfe ein. Ich denke, ich warte eine Weile, bis ich jemanden schicke, die Neuigkeiten unserem geliebten König zu überbringen. Sie werden sicher wissen, dass der Erdrutsch für uns Probleme bedeutet...**Mögen uns die Götter behüten."
////////////////////////////////////////////////
[description_book_beloved]
string="Mein geliebter Akbaa."

[book_beloved_content]
string="Diese Texte wurden zu Ehren meines Herrn und Meisters verfasst:*Akbaa.***********Akbaa ist die Quelle der Weisheit des Universums und aller bekannter Dimensionen. Mit seinem Kult in Berührung zu kommen, ist eine entscheidende Erfahrung, auf die ein Punkt ohne Wiederkehr folgt: Verehre Akbaa oder leide.**Da Akbaa ein Gott ist, der ebenso die Kraft der Zerstörung der Welt symbolisiert, weiß er, wie er seine treuesten Diener mit großer Macht belohnen kann. Alle anderen straft er ohne Gnade. Er ist unsterblich und braucht Seelen, um seine Macht über die bekannten Universen auszudehnen, um seine Weisheit an jeden Ort, nah und fern, zu bringen. **Eine gute Möglichkeit, Akbaa zu befriedigen liegt darin, ihm starrsinnige Seelen zu opfern, die sich weigern, ihm zu dienen. Auch Ungläubige zählen zu unseren bevorzugten Zielen. Manche von uns, die mit ihm in direkten Kontakt zu treten vermögen, opfern sich ihm sogar selbst. Doch der Tod bedeutet nichts im Vergleich zu den Jahren spiritueller Erleuchtung, die ich durch ihn erreicht habe.**Ich würde lieber einen Tag in seinem Licht gegen 1000 Jahre in der Dunkelheit des Unglaubens tauschen wollen.**Weil ich, dank Akbaa, die ursächlichen Zusammenhänge des Universums geschaut habe. Dinge, die für alle Zeit außerhalb der Reichweite der Ungläubigen liegen."
////////////////////////////////////////////////
[description_book_iserbius]
string="Iserbius' persönliches Tagebuch."

[book_iserbius_content]
string="Es ist wichtig für mich, die Geschichte meines Lebens auf diesen Seiten zu hinterlassen. Wenn mir etwas zustößt, werden sie meinem Nachfolger in seiner Mission helfen.**Ich habe mich entschieden, meinem geliebten Akbaa mein ganzes Leben zu widmen. Ich verehre ihn vom Moment meines ersten Kontakts zu ihm bis hin zu meinem letzten Atemzug.**Akbaa gab mir, wovon sonst kein Mensch träumen darf.**Ich erinnere mich noch an den gesegneten Tag, da ich Lord Long traf.*Es war im Jahre 240.**Wir blickten in des anderen Augen, eine machtvolle Beziehung zwischen uns entstand. Er war wie ein zweiter Vater für mich, und ich bin sicher, ich war für ihn wie der Sohn, den er niemals hatte.*Nach einiger Zeit, als ich dem Kult beigetreten war, eröffnete er mir, dass ich sein Nachfolger werden sollte.**Während meiner Novizenzeit brachte er mir alles über den Kult und über Akbaa bei.*Er erklärte mir, dass der letztendliche Zweck des Kult darin läge, Akbaa in unserer Dimension zu erwecken. Er habe die Grundlage für das Erweckungsritual bereits geschaffen. Aber leider würde er diesen Tag nicht mehr selbst erleben können.**Dank seiner mächtigen Hellsicht hat er den Tag seines Todes bereits vorausgesehen.*Er bat mich, seine Vorbereitungen weiterzuführen.**Als er im folgenden Jahr starb - genau, wie er es vorausgesehen hatte - hallten seine prophetischen Worte in meinem Geiste wieder, und ich wurde nach meiner vollen Anerkennung im Kult zu dessen neuem Hohepriester. Dieser Tag wurde zu meinem größten Leid und meiner größten Freude. Der unsägliche Kummer über den Verlust meines Mentors und Vaters, und die gewaltige Freude über die Ankunft unseres Herren waren unbeschreiblich.**Es begann für mich eine Zeit intensiver Studien.**Ich kam Akbaa näher und näher: So nahe, wie ein Sterblicher einem Gott nur kommen konnte. Ich sah, was nicht gesehen werden konnte, hörte Klänge ohne Klang, und fühlte Dinge, die niemals jemand zu fühlen hatte erhoffen dürfen. Akbaa gab mir immer mehr Kraft: natürlich körperliche, aber auch die der Magie.**Akbaa wurde für mich zu mehr als einem Gott. Er wurde meine Sonne, mein Atem, mein Ernährer - er ist einfach alles. Dank seiner übernatürlichen Inspiration führte ich die Zügel des Kults mit eiserner Hand.**Als erstes entledigte ich den Kult aller nutzlosen Mitglieder - solcher Leute, die unzureichende Resultate erbrachten, die sich zuletzt wegen ihrer Schlampigkeit auch als gefährlich herausstellten.*Nach dieser dankbaren Aufgabe hatte ich ausreichend Zeit, Akbaas Erscheinen vorzubereiten - bis hin zum letzten Detail. Unser Kult musste bis zuletzt unbekannt bleiben - so lange, bis es unmöglich wurde, uns aufzuhalten.**Zu diesem Zeitpunkt aber hörte ich, dass Falan Orbiplanax einen Verdacht hegte und Akbaas Erscheinen mithilfe des Noden zu verhindern trachtete.*Um diesen Plan zu durchkreuzen, traf ich einige wichtige Entscheidungen: Zunächst sandte ich einen Meuchelmörder, um Orbiplanax zu töten, da er für uns zu gefährlich wurde.**Als zweites verkürzte ich die Zeit bis zu Akbaas Erscheinen. Wir hatten noch nicht alles vorbereitet, und so ordnete ich an, die Häufigkeit unserer Menschenopfer zu erhöhen, indem ich viele Gefangene machen ließ.*Wir nahmen alles: Ungläubige, Frauen, Kinder. Ich hatte keine Zeit, wählerisch zu sein.*Ich erhöhte auch das Maß unserer Gebete zu Akbaa und ermutigte mehr und mehr Mitglieder unseres Kults, sich selbst zu opfern. Tag für Tag staunte ich über die Menge an Wissen, die Akbaa mir verfügbar machte. Aber noch verwunderlicher war, dass er versprach, mir am Tag seiner Ankunft noch mehr zugänglich zu machen. Im Besonderen, dass er das Schicksal von Arx in meine Hände zu legen gedachte."
////////////////////////////////////////////////
[description_book_cook]
string="Kochbuch für Goblins, von Durey Palua."

[book_cook_content]
string="Rezept für Ciambels.** Zucker und Mehl mischen.**Das erforderliche Maß Wasser hinzufügen und den Teig kneten, bis er eine gleichmäßige Beschaffenheit hat.**Danach in den Ofen schieben und aufpassen, dass er nicht anbrennt.**Ist der Teig fertig, das Weiße und das Gelbe eines Hühnereis mischen.**Das Gemisch auf dem Kuchen verteilen und für etwa eine Minute noch mal in die Röhre schieben."
////////////////////////////////////////////////
[description_book_music]
string="Eine Anmerkung zur Musik, von Fazzi."

[book_music_content]
string="Die Flöte ist wohl eines der feinsinnigsten Instrumente überhaupt.**Sie ist leicht zu erlernen, doch andererseits schwer zu meistern.*Hier eine erste Lektion, falls Ihr Euch mit ihr vertraut machen wollt.**Es gibt viele verschiedene Arten auf der Welt, die gebräuchlichsten aber arbeiten auf diese Weise:*Es gibt vier normale Noten und vier erweiterte Noten, die durch Zuhalten des Loches unten an der Flöte erzeugt werden, während man die vier normalen Noten spielt.*Die normalen nennen wir 1, 2, 3, und 4, während die vier erweiterten Noten als #1, #2, #3 und #4 bezeichnet werden.**Ein sehr einfaches Musikstück für den Anfang wäre eines, das ich Fazzis Hymne genannt habe. Es geht so: 1 1 #1 3 4 1 1 2."
////////////////////////////////////////////////
[description_book_weapon]
string="Die Theorie der Absoluten Waffe, von Kartok."

[book_weapon_content]
string="Ich bin weit und durch viele Länder gereist, um die Absolute Waffe zu finden.*Ich investierte viel meiner Lebenszeit und meiner Kraft, ehe ich begriff, dass meine Suche vergebens gewesen war.*Vergebens, weil der Weg zur Absoluten Waffe darin besteht, sie zu erschaffen.**Um dies zu bewältigen, muss man das beste Metall finden, es in der besten Schmiede schmieden und es dann mit den besten Zaubersprüchen verfeinern, die es gibt.*Es ist sehr wichtig, das beste Metall zu wählen, da es nicht nur die Stärke der Waffe bestimmt, sondern auch eine große Menge magischer Energie speichern muss.**Darüber hinaus bestimmt das Gewicht der Waffe die Leichtigkeit, mit der sie geführt werden kann, und die Effektivität ihrer Durchschlagskraft.**Viele Leute benutzen Eisen, um ihre Waffen zu schmieden, da es am einfachsten zu bekommen ist.*Aber das beste, uns heutzutage bekannte Material (und meiner Ansicht nach das einzig taugliche für die Absolute Waffe), ist Mithril. Es ist das härteste und widerstandsfähigste, das je gefunden wurde. Vermischt mit anderen Elementen kann es sogar eine noch stärkere Legierung ergeben.**Das Zusatzmaterial für Mithril muss jedoch mit Bedacht gewählt werden, und nur die einzigartigsten Materialien, die ein außergewöhnliches magisches Potenzial besitzen, sollten ausgewählt werden.*Unglücklicherweise ist Mithril (das eine unverzichtbare Komponente darstellt), fast unmöglich aufzutreiben. Falls es aber dennoch zu bekommen ist, besteht der nächste Schritt darin, den besten Schmied ausfindig zu machen, um dieses Material zu schmieden.*Ich möchte mich nicht auf langwierige, philosophische Debatten einlassen, aber meiner Ansicht nach sind die Zwerge die besten Schmiede von allen.**Ihre ganze Tradition beruht auf der Arbeit mit Stein und Metall, und sie haben ihre Kunst zu einer Perfektion gebracht, dass selbst ihre Werkzeuge denen anderer Schmiede und Bergleute weit überlegen sind. Nur sie können in ihren Schmieden wirklich scharfe und tödliche Waffen erzeugen.**Das Schmieden ist ein wichtiger Prozess, denn die Waffe muss, wenn sie einmal fertig ist, in der Lage sein, den ersten Zauber, der auf sie gewirkt wird, völlig zu absorbieren und für alle Zeit zu speichern.**Der letzte Punkt ist dann natürlich diese Verzauberung der Waffe.**Viele Dinge können eine Waffe magisch aufwerten - der Schlüssel liegt in der Wahl des Elements, das die Waffe im Moment ihrer Verzauberung binden soll.*Ich möchte einige der besten Verzauberungen empfehlen.*Die Qualität der Waffe beruht jedoch mehr auf dem verwendeten Metall und der gewählten Schmiede.*Hier ein paar Beispiele - doch Vorsicht: Ist die Waffe einmal verzaubert, ist das nicht mehr zu ändern:**-Knoblauch erbringt eine leichtere Handhabung der Waffe.*-Zerpulverte Knochen fügen ihr Kraft hinzu; umso mehr, wenn die Knochen von einem Drachen stammen.*-Der Stein von Amikar gibt der Waffe enorme Widerstandkraft. Einmal verzaubert, scheint die Klinge unzerstörbar.*-Ein Drachenei ermöglicht der Waffe, dem Element Schaden zuzufügen, aus dem sie geschaffen wurde. Beispielsweise kann eine mit einem Drachenei verzauberte Eisenwaffe Eisen Schaden zufügen."
////////////////////////////////////////////////
[description_book_noden]
string="Die Gesetze des Noden - der Dimension der Götter, von Aran Salar, dem Denker. Archiv (Band 1)."

[book_noden_content]
string="Der Noden, Domäne der Götter, liegt in einer von uns weit entfernten Dimension.*Von Zeit zu Zeit werden jedoch Brücken gebildet, die eine Passage zwischen den Dimensionen ermöglichen. Dies kann durch gewisse Astralkonvergenzen wie Eklipsen entstehen, oder durch große, natürliche Kataklysmen wie Gezeitenwellen.**Die Dimension des Noden funktioniert auf folgender Grundlage: Dort existiert eine umgebende, stabile Energie, die aus allen Richtungen des bekannten Universums stammt und sich auf den Noden richtet.**Diese Energie repräsentiert die Kräfte des kollektiven Unterbewusstseins der denkenden Wesen dieser Dimensionen. Sie enthält die Wünsche, Ängste und den Glauben all dieser Kreaturen.**Deswegen kristallisiert sich jedes Mal, wenn ein Wesen an einen Gott denkt und ihm einen Namen gibt, diese göttliche Wesenheit im Noden.*Zu Beginn ist dieser neu geborene Gott sehr schwach und völlig ohne Verteidigung, aber wenn die Gläubigen beginnen, ihm zu huldigen, schöpft er im Noden mehr Energie und wächst.**Solche Götter werden von ihren Gefolgsleuten häufig wegen etwas ganz Speziellem angebetet. Entsprechend ihrem Willen und der Kraft, die sie angesammelt haben, belohnen sie ihre Verehrer mit materieller Kraft und vielen anderen Energien, was wiederum den Glauben der Verehrer aufbaut.**Falls jedoch niemand an einen existenten Gott glaubt, wird sich dessen Energie erschöpfen, und am Ende zu einer ektoplasmischen Form verkümmern - nur noch ein Schatten seines früheren Glanzes.**Es ist der Beachtung wert, dass der Krahoz und der Zohark stolz im Herz des Noden ruhen, dank der Verehrung, die sie durch uns erfahren.**Der Noden besitzt zugleich eine administrative Gewalt, welche die Aufenthaltsorte bestimmter Gottheiten in Abhängigkeit zu deren Anhängern regelt. Sie achtet darauf, dass die Gottheiten nicht über ihr Ziel hinausschießen, und sammelt den Glauben, der aus anderen Dimensionen entzogen wird.**Auch diese Organisation unterliegt einer strengen Hierarchchie, und an ihrer Spitze sitzen die Sybartas, die Denker.**Sylib Nurath, der sich um die Überlagerungen zwischen dem Noden und anderen Dimensionen kümmert, ist einer von ihnen.**Eine andere Rasse, die Volks, existiert ebenfalls dort. Man könnte sie die Dienerschaft der Sybartas nennen. Sie erfüllen normalerweise untergeordnete Aufgaben."
////////////////////////////////////////////////

[description_book_noden_v2]
string="Die Gesetze des Noden - der Dimension der Götter, von Aran Salar, dem Denker. Archiv (Band 2)."

[book_noden_content_v2]
string="Die Gesetze des Noden sind unverzichtbar, und niemand (nicht einmal die Götter), darf sie brechen.**Die erste und wichtigste Regel von allen ist, dass kein Gott oder Dämonenprinz den Noden je verlassen darf (Artikel 1, Kapitel 1), da die Gegenwart und Konsequenzen der Anwesenheit eines Gottes in einer der alten Dimensionen der Harmonie des Universums extrem abträglich ist.*Ein Gott, der dies tut, würde unermessliche Macht erhalten und könnte auf allen Ebenen der realen Existenz in dem Maße agieren, mit dem seine Macht wächst.**Deshalb dürfen Götter und Dämonenprinzen mit den Dimensionen interagieren, in denen sie verehrt werden, und Zeichen sowie Träume dorthin schicken. Manchmal dürfen sie auch Kreaturen inspirieren, indem sie ihnen bestimmte Kräfte verleihen. Aber sie dürfen in diesen Dimensionen keine Gestalt annehmen.**Die wenigen Götter, die es wagten, eine Reise in die Dimensionen anzutreten, verrotten nun in riesigen Kristallen, 'Die Steine des Noden' genannt. Dort wurden sie von den Bewahrern eingesperrt, die ihnen Sylib Nurath hinterher schickte, um sie zurück zu bringen.*Diese Bewahrer sind überlegene Wesenheiten, von den Sybarta erschaffen, und vom Noden entsandt, um Dimensionen zu überbrücken.*Sie sind keine Götter, sondern eher die Polizei der Götter, die geschaffen wurden, um den Gesetzen des Noden in anderen Dimensionen Geltung zu verschaffen.**Anfangs gaben die Sybarta den Bewahrern große Macht, so dass sie die abtrünnigen Götter schnell zurückbringen konnten. Aber bald schon sahen sie, dass ihre Macht in den Dimensionen, in die sie entsandt wurden, großen Schaden anrichten konnte. So ging man dazu über, den Bewahrern nur noch ein Minimum an Macht zu gewähren, um ihre Aufgabe erfüllen zu können.**Doch sie wurden zugleich mit einer außergewöhnlichen Fähigkeit ausgerüstet, sich neuen Situationen anpassen zu können, schnell zu lernen und das Beste aus dem zu machen, was ihnen an Ressourcen unterkam.*Durch die Begrenzung der Macht wurde auch einer möglichen Vergöttlichung eines Bewahrers in der Dimension vorgebeugt, die er besuchte.**Kein Sterblicher kann im Noden existieren, und ein Gott, der die Dimensionen überbrücken will, benötigt einen Wirtskörper.*Kurz ausgedrückt: Götter nutzen die Körper der Sterblichen für ihr Erscheinen, durch die sie erweckt wurden, denn letztere sind häufig übereifrig und tendieren dazu, sich selbst zu opfern.**Der Noden archiviert sämtliche Götter, die je existierten.*Legenden in anderen Dimensionen erzählen deshalb von Akbaa, Ftaghn-Nayak, Zeus, Zlatko dem Grausamen, Thrn-Glrn, Alador und vielen anderen..."
////////////////////////////////////////////////

[description_book_war_magic]
string="Der Krieg der Magier, von Ourfas Befed."

[book_war_magic_content]
string="Zu der Zeit, da die Menschen auf der Außenwelt lebten, wurde die Magie in Akadmien gelehrt, welche ihre Schüler in den unterschiedlichen Formen der Magie zu unterweisen trachtete.**Einige nutzten Elementarmagie, andere hatten mehr Interesse an Illusionen, und gelegentlich gab es auch sehr seltene Spezialgebiete. Sogar die seltsame Nekromantie war erlaubt.**Die Stile in der Magie variierten enorm, jede davon besaß ihre eigene Philosophie, Glauben und Tabus.*Es war unvermeidbar, dass diese Theorien eines Tagen miteinander kollidierten und einige Magier versuchten, ihre Anschauung anderen aufzuzwingen.**Dies war der Beginn eines schrecklichen Krieges.**Letztlich war keine Magie-Methode stärker als eine andere, und die Kämpfe endeten stets in einem Patt.*Als die Streitigkeiten sich ausweiteten, begann jede der Parteien, sich einzelnen Zaubern zuzuwenden, um den Gegner besiegen zu können. Der Zauber, dem Gegner Mana zu entziehen, erwies sich als der wirkungsvollste von allen. Er ließ den Gegner in Unfähigkeit zurück, auch nur den schwächsten Zauberspruch wirken zu können.**Die Magier schwebten im Unentschieden; Kämpfe reduzierten sich zu schnellen Konfrontationen zwischen zwei Leuten, die des anderen Manavorrat entzogen.**Zu dieser Zeit halfen die Schwestern von Edurneum der Königlichen Akademie, indem sie ihr ein mächtiges, magisches Artefakt zur Verfügung stellten.**Es bestand aus zwei Elementen, die, miteinander vereint, einem Magier erlaubten, all seine magische Energie zu konservieren, falls jemand versuchen sollte, sie ihm zu entziehen.**Diese beiden Objekte wurden, im Gedanken an zwei alte Götter, Krahoz und Zohark genannt.**Als dieses Artefakt zum Einsatz kam, versiegte der Konflikt, und alle Gegner waren sich einig, dass die Person, die dieses Objekt besaß, die Mächtigste von allen war.**Der Krahoz und der Zohark wurden dem König von Arx übergeben, und seit dieser Zeit wurde er den jeweiligen Nachfolgern weitergegeben."
////////////////////////////////////////////////

[description_book_day]
string="Der Tag Seines Kommens."

[book_day_content]
string="Diese Fakten betreffen Lord Long, Gründer und Hohepriester des Dunklen Ordens, im Jahre 199.**Als er erschien, war ich ein erfahrener Botschafter, der dem Königreich von Arx diente. Zu dieser Zeit lebten wir noch auf der Oberfläche, wo die Sonne mit all ihrer Macht schien.**Am 37. Tag des Jahres 216 hielt ich mich im Observatorium auf, als sich eine Sonnenfinsternis ereignete und ich einen Meteoriten vom Himmel auf unser Land fallen sah.**Als er aufschlug, kam es zu einem schrecklichen Erdbeben. Ich dachte, es wäre das Ende der Welt, aber als sich die Dinge beruhigten, begab ich mich zur Einschlagstelle.**Der Moment, in dem meine Hände den außerirdischen Felsen berührten, überkam mich eine Vision und ich verlor das Bewusstsein.*Während ich besinnungslos dalag, sprach die Stimme eines Wesens zu mir.*Es erklärte mir, dass es gekommen sei, um die Welt zu retten, und mir einen Pfad zur Erleuchtung zu zeigen.**Ich fühlte riesige Hände, die mich maßen, und ich hörte Gemurmel von tiefen und gutturalen Stimmen. Ich sah Bilder vom Anbeginn der Zeiten bis zum heutigen Tag. Dann vernahm ich den Namen meines Gottes: Akbaa, der einzig wahre Herrscher von Arx.**In diesem Moment wusste ich, was meine Mission im Leben war: Akbaa zu helfen, Gefolgsleute zu finden, die an seine Macht glaubten.*Je mehr ich finden konnte, desto größer würde die Macht meines Gottes werden. Er würde in der Lage sein, sich selbst in Arx zu manifestieren und mich zum Meister der Welt zu machen.**So erbaute ich einen Tempel zu seinen Ehren in den unterirdischen Gängen, nicht weit entfernt von unserer Stadt, und verbreitete die Kunde von seiner Größe. Ich machte zusätzlich den Koltk-Meteoriten zum Fokus all unserer Energien.**Der einzige Weg, meinen Gott zu befriedigen, war, ihm denkende Wesen zu opfern. Für die Verehrung und Liebe, die ich ihm gab, belohnte er mich mit zahllosen Gaben der Macht, des Wissens und der Zauberei, die mich viel stärker machten, als jeden gewöhnlichen Mann.*Macht, die Hunderte von Ungläubigen zu erschrecken vermochte..."
////////////////////////////////////////////////

[description_book_chicken]
string="Die Macht der Hühner, von Lord Inut, dem Bauern von Liukalau"

[book_chicken_content]
string="Ich habe mein Leben dem Studium dieses erstaunlichen Tieres gewidmet: dem Huhn.**Es ist schwer zu glauben, dass schreckliche Magier diese wundervollen Kreaturen schamlos benutzen, um mit ihnen ihre bösen Rituale durchzuführen - und sie für ihre Magie zu opfern.*Ich bin überzeugt, dass Hühner mit viel Intuition und Humor gesegnet sind.**Die Hühnerrasse besteht aus 57 unterschiedlichen Arten, jede davon erstaunlicher als die andere und mit ihrer eigenen Kultur und Lebensart.**Ich habe 8 Jahre lang Tag und Nacht in Kontakt mit Hühnern zugebracht und versucht, sie zu verstehen. Ich lernte sogar, wie sie zu gehen, um ihnen Respekt zu erweisen.**Nach tiefer Konzentration gelang es mir sogar, mich in ein Huhn zu verwandeln. Man konnte sagen, dass ich bei günstigem Mond ein Wer-Huhn war.*Die neue Fähigkeit wirkte sich grandios auf meine Studien aus. Ich konnte mit Hühnern leben, mit ihnen essen, fühlen, was sie fühlten, mit ihnen tanzen und sogar sprechen...**Ihre Sprache ist dagegen sehr komplex. Hier ein paar Übersetzungen vom Hühnischen in unsere Sprache:**Bog heißt Hallo;*Boog?! bedeutet, was tust du?;*Bog! bedeutet, dass das, was man tun will, verboten ist. *Booogbog kennzeichnet ein Interesse an etwas.**Ich könnte mit meinen Übersetzungen noch mehr ins Detail gehen, um die Komplexität des hühnischen Bogismus darzustellen, aber ich denke, eine einfache Kostprobe sollte für einen intelligenten Menschen genug sein.**Was ich zusätzlich noch über die Intelligenz der Hühner herausfand, ist, dass sie einen großen Sinn für Altruismus besitzen.*In einer Hühnergesellschaft dringt der dominante Hahn auf Futtersuche in angrenzende Gebiete ein. Sobald er etwas gefunden hat, stellt er ein Bein darauf und lässt ein lautes Booooog hören, was den Rest der Gesellschaft zur Mahlzeit ruft.*Er beobachtet seine Hühnchen mit liebendem Auge, und frisst erst, wenn alle anderen satt sind.**Als Teil meiner Experimente versuche ich seit Jahren ein Ei zu legen, leider jedoch bisher ohne Erfolg...*Eine neuerliche Studie legt mir nahe, dass es vielleicht deswegen ist, weil ich männlich bin, aber ich kann irgendwie eine so banale Erklärung nicht hinnehmen.*Deswegen lebe ich bis heute weiterhin in guter Hoffnung..."
////////////////////////////////////////////////
[description_book_mine_log]
string="Minen-Tagebuch, von Isep Ethan, Vorarbeiter."

[book_mine_log_content]
string="Bericht 87 - Jahr 266, braune Zeit, dritter Tag der Woche des Adlers.**Nach Wochen harter Arbeit haben wir endlich eine Mithril-Ader entdeckt.*Ein Aufschrei der Freude ging durch die Leute, als sie vor dem Punkt standen, an dem das Mithril austrat. Sie hatten Tränen in den Augen.*Sie liegt weit im Osten.*Es ist ein weiter Weg vom Quetschwerk, also bauten wir einen Schienenstrang, über den die Wagen das Erz direkt zur Quetscherei befördern können.*********Bericht 88 - Jahr 266, braune Zeit, dritter Tag der Woche der Ratte.**Seit wir die Ader entdeckt haben, gruben wir vom Ausgangspunkt in alle Richtungen.*Als wir nach Norden vorstießen, entdeckten wir einen seltsamen Hohlraum. Er wirkte zugleich natürlich wie auch künstlich angelegt. Wir vernahmen einen strengen, animalischen Geruch und vermuteten, dass es sich um den Bau eines wilden Tieres handelte.**Da es die Woche der Ratte ist, fühle ich eine gewisse Unruhe über das, was uns die Zukunft bringen wird..."
////////////////////////////////////////////////
[description_book_forge_manual]
string="Gießerei - Arbeitsanweisung."
//********* müsste eigentlich die "Foundry" - die Gießerei sein

[book_forge_manual_content]
string="Um ein Metallobjekt zu erzeugen, benötigt man zwei Maschinen. Als erstes sollte man die Schmelze benutzen. Diese Maschine schmilzt das Erz, um gleichmäßiges Rohmetall zu erzeugen. Folgende Schritte führen zum Erfolg:**1) Man platziere einen starken Stein in der Maschine, um ihr Energie zuzuführen.**2) Man schiebe zwei große Erzstücke in den Ofen - jedoch keine zwei von unterschiedlicher Sorte.**3) Sollte die Notwendigkeit entstehen, das Metall zu binden, muss man nun ein Reagenz hinzufügen.**4) Den Hebel ziehen, um das Rohmetall zu erzeugen. *****Als nächstes kommt die Gießmaschine zum Zuge:**1)Den Kraftstein in der Maschine platzieren, um ihr Energie zuzuführen.**2) Die Gussform des gewünschten Objektes in die Gießmaschine einführen.**3) Das Rohmetall in den Ofen zugeben.**4) Den Hebel ziehen, um das gewünschte Objekt herzustellen."
////////////////////////////////////////////////

[description_book_art_of_making_potions]
string="Die Magie der Tränke, von Cyro Besali."

[book_art_of_making_potions_content]
string="Seine eigenen Tränke herzustellen, ist sowohl einfach als auch nützlich.*Alles was man braucht, ist Sorgfalt und Geduld.**Als erstes benötigt man eine leere Flasche. Zweitens gehören die Reagenzien dazu, die man für den Trank benötigt.*Wenn dies vorhanden ist, muss man letztere mithilfe eines Stößels in einem Mörser zerpulvern und sie in die leere Flasche geben.*Man erhitze sodann die Mixtur in einem Destillierapparat.*Nun ist der Trank fertig.**Hier eine Liste von bekannten und geschätzten Reagenzien:**Für Manatränke benutze man zerpulverte Lilien (Blaues Pulver);**Gute Gegengifte entstehen aus Arzneikräutern (Lila Pulver);**Unsichbarkeitstränke macht man aus Schneeglöckchenpulver (Weißes Pulver);**Gifte erzeugt man aus Farnen (Grünes Pulver); und Heiltränke entstehen aus Wasserlilien (Orangefarbenes Pulver)."
////////////////////////////////////////////////
[description_book_codex]
string="Das Arzneibuch des Ordens."

[book_edurneum_codex]
string="Wie die Haut einer Schlange, so das Leben einer Königin.**Wiedergeburt ist notwendig, um eine neue Königin hervorzubringen.**Eine Frau königlichen Blutes.**Nur königliches Blut kann die Große Schlange angemessen ehren.**Das königliche Ritual der Offenbarung kann nur zum dritten Mond des Ixos stattfinden."
////////////////////////////////////////////////
[description_book_the_order]
string="Der Orden von Edurneum, von Efan Dirscue."

[book_the_order_content]
string="Man weiß nur wenig über die Schwestern von Edurneum. Selbst die Herkunft dieser Kreaturen, halb Frau und halb Schlange, ist uns unbekannt. An manchen Stellen ist ihre Haut von Schuppen bedeckt.**Sind sie eine Rasse aus den alten Zeiten, oder nur Frauen, die Opfer einer krankhaften Veränderung wurden?*Nur sie selbst kennen die Antwort auf diese Frage.*Sie scheinen einen Schlangengott zu verehren, aber über diesen Gott wissen wir nichts, und alle Geheimnisse des Kults werden sorgsam von der Schwesternschaft behütet.*Wir denken, dieser Gott gab ihnen ihre magischen Kräfte, aber wir können auch bei dieser Information über den Orden nicht sicher sein, wie auch in vielen anderen Fragen...**Bestimmte Legenden behaupten, dass ihre Verehrung für diesen Gott nicht nur für ihre magischen Kräfte, sondern auch für ihre Schlangenform verantwortlich ist.*Doch auch hierfür gibt es keine Beweise.**Seit die Sonne von Arx versiegte, sind die Mitglieder der Schwesternschaft die wichtigsten Verbündeten, die die Menschen jemals hatten.*Als unsere Rasse einst ihr Leben im Untergrund beginnen musste, boten die Schwestern dem König ihre magischen Geschenke an und ermöglichten damit eine neue Vielfalt von Pflanzen, die ohne das Licht der Sonnenstrahlen gedeihen konnten, so dass Mensch und Vieh Nahrung zu finden vermochten.**Die menschliche Bevölkerung empfindet großen Respekt für die Schwestern des Ordens von Edurneum und wird ihnen auf ewig für das dankbar sein, was sie getan haben."
////////////////////////////////////////////////
[description_book_history_arx]
string="Die Geschichte von Arx, von Maioo Kasmadian."

[book_history_arx_content]
string="Vor langer Zeit wurde der größte Kontinent unserer Welt von fünf Stämmen beherrscht.*Sie befanden sich ständig im Krieg miteinander, und je mehr Struktur die Stämme annahmen, desto schlimmer wurde es.*Nach Jahren des Krieges und des Hasses, erschien ein Mann namens Poxsellis, und er schaffte es, die zerstrittenen Gruppen zu einen.*Er wurde zum ersten König der Menschen.**Nach der letzten Schlacht der zerbrochenen Schilde im Jahre 170, erfreute sich Arx seiner längsten Periode des Friedens und des Wachstums.**Während Poxsellis' Herrschaft war in der Tat der einzige Krieg jener, der sich um die Philosophie der Magie drehte, und als Krieg der Magier bekannt wurde.*Obwohl er grausam war und viele Leute in ihm starben, dauerte er nur wenige Monate und hatte keinerlei Auswirkung auf die politische Führung unseres Königreichs.**Für den Rest seiner Herrschaft musste sich Poxsellis einer Anzahl von Gefahren stellen.*Eine große Zahl von Goblins wurde abgewehrt, während sich Rattenmenschen in den Kanälen der Stadt einnisteten.**Die Schlachten waren blutig, und dieser ungerechte Krieg währte lange Zeit, aber die Armeen des Königreichs, geführt von Poxsellis selbst, schlachteten ihre Feinde dahin.*Und einmal mehr herrschte Frieden in Arx.**Die Erforschung der Ozeane begann.**Viele starke Schiffe durchpflügten die Meere auf der Suche nach neuen Ländern und neuen Schätzen.*Im Jahre 216 jedoch fiel ein Meteor auf unsere Welt. Zuerst dachte sich niemand etwas bei diesem Phänomen, aber einige Seher behaupteten, dies wäre ein schlechtes Omen für die Zukunft von Arx.**Tatsächlich begann ein paar Jahre später die Sonne zu verlöschen. Das Licht wurde schwächer, die Temperaturen sackten in gefährliche Tiefen.**Unser noch junger König Lunshire, Sohn des Poxsellis, befahl, dass die gesamte Stadt hinab in eine verlassene Zwergenmine verlegt werden sollte.**Es war eine gewaltige Arbeit, aber jeder wusste, dass er zum eigenen Heil arbeitete, und niemand beklagte sich.**Ein Friedensvertrag wurde mit allen anderen Rassen unterzeichnet - außer mit den Rattenmenschen, mit denen man gar nicht kommunizieren konnte.*Zu dieser Zeit wurden ihre Angriffe jedoch seltener.**Jeder war damit beschäftigt,an der Rettung von Arx mitzuwirken.*Ein weiterer Vertrag wurde unterschrieben, der jeder Rasse für die getane Arbeit eine Ebene der Mine zusicherte.**Dieser Einklang hielt für fünf Jahre, während dessen unsere Sonne aber vollständig verlosch. Alles war getan worden, um die Einwohner von Arx zu schützen - dennoch verloren viele ihr Leben.**Von anderen Städten des Kontinents hörte man gar nichts, und der logische Schluss war der, dass man dort ebenso wie in Arx gehandelt hatte.**Nicht viel später kamen Nachrichten, überbracht von den Mitgliedern der Gilde der Reisenden.**Es existierten noch andere Festungen, über den ganzen Kontinent verstreut und eingeschlossen unter einer mächtigen Eisdecke.**Die Gilde der Reisenden stellt nun den einzigen Weg der Kommunikation dar. Gelegentlich werden von ihnen einige Luxusgüter transportiert.*Abgesehen von diesen sporadischen Kontakten ist Arx völlig auf sich allein gestellt."
////////////////////////////////////////////////
[description_book_ancient_gods]
string="Die Alten Götter, von Abdul Al Raïf."

[book_ancient_gods_content]
string="Zu Beginn waren die Götter allmächtig. Sie herrschten für Äonen über Arx, bevor die ersten Menschen auftraten.**Wir wissen nur sehr wenig über die Götter, einmal abgesehen von der Tatsache, dass sie voller Zorn über die schnelle Ausbreitung der Menschen waren und sich von der Oberfläche der Welt zurückzogen.**Einige sehr alte Texte deuten an, dass dieses Verschwinden auch durch den Mangel an Glauben der ersten Menschen motiviert war.*Zwei Götter blieben länger als alle anderen - Zohark und Krahoz.**Zohark war der Mächtigste aller Götter: er war Donner, Blitz und Erdbeben, wie auch Sturm, Orkan und alles andere, das die unbarmherzigen Mächte der Natur darstellte.*Aber seine Kraft konnte nur durch Krahoz freigesetzt werden.**Sie war die Göttin der Gerechtigkeit, Wächterin des Gleichgewichts und der Balance.*Sie brauchten einander, doch zuletzt verschwanden sie, wie auch der Rest der Götter.*In späteren Zeiten schwand auch der Glaube an sie, und die Menschen, welche die Magie entdeckten, wandten sich selbst der Beherrschung von Blitz und Donner zu.**Sie betraten nun ein neues Gebiet, in dem sie mehr Zutrauen zur eigenen Macht entwickelten und sich den Göttern nur in Nebenbereichen wie Fruchtbarkeit oder Hedonismus zuwandten.*Sie verehrten die Götter des Handels, des Goldes, des Glücks und selbst die Götter der Armen. Aber diese ersten Götter, die Götter der unbarmherzigen Naturmächte, fanden keinen Platz in ihren Tempeln.**Seit dem Beginn dieser neuen Ära und der Verschiebung des Glaubens zogen sich die mächtigsten Götter in ihre eigene Dimension zurück, den Noden, wo sie darauf warten, dass ihnen ihre Anhänger die Rückkehr ermöglichen."
////////////////////////////////////////////////
[description_book_kings_arx]
string="Die Könige von Arx, von Greenonic Warmhill."

[book_kings_arx_content]
string="Poxsellis war unser erster König. Er war es, der die fünf menschlichen Stämme zusammenbrachte, die im Jahr 170 unseren Kontinent bevölkerten.**Diese Stämme befanden sich von Anfang an in endlosem Konflikt miteinander, aber keiner von ihnen war stark genug, die Übermacht zu gewinnen.*Poxsellis war gut und mutig; er forderte die anderen Stammesführer heraus und besiegte sie, was als die Schlacht der zerbrochenen Schilde bekannt wurde.**Bevor er sich den anderen Anführern stellte, unternahm er eine Reise in einen verlassenen Tempel in den Bergen der Klagenden Mine. Aus dieser Mine brachte er einen verzauberten Schild mit, mit dessen Hilfe er alle anderen Anführer zu besiegen vermochte.**Als er der neue Anführer aller fünf Stämme war, erklärte er sich selbst zum König von Arx. Ab diesem Tage herrschte er mit Weisheit, Gerechtigkeit und Großzügigkeit über das Königreich von Arx.**Seine Regentschaft war lange und gut, einmal abgesehen von Scharmützeln mit Goblins und Rattenmenschen, die er dank seines militärischen Genies jedoch immer für sich entschied.*Seine ersten beiden Söhne, Elois und Nickus, die beide hervorragende Kämpfer waren, starben noch während Poxsellis' Lebenszeit.**Glücklicherweise gab es zum Zeitpunkt seines Todes im Jahre 212, noch einen dritten Sohn, sein Name war Lunshire. Er sollte sein Nachfolger sein, doch er war noch zu jung.**Lord Poncet herrschte über das Land, bis der Junge alt genug wurde, doch er plante, Lunshire am Besteigen des Thrones zu hindern. Er war nie sehr beliebt, und seine kleine Intrige scheiterte. Im Jahr 215 bestieg Lunshire im Alter von 16 Jahren den Thron.**Doch von Beginn an stand er einer besonderen Aufgabe gegenüber, als die Sonne über unserer Welt zu ersterben begann.*Er war der Urheber des Gedankens, die Bevölkerung in die Tiefe umzusiedeln. Alles in seiner Macht stehende tat er, so viele Menschen wie möglich in der Zwergenmine in Sicherheit zu bringen.**Er besaß das diplomatische Geschick, mit allen Rassen von Arx einen Vertrag zu schließen, ohne den der Umzug viel länger gedauert hätte, und womöglich von der Eiszeit aufgehalten worden wäre, die sehr rasch anbrach.**König Lunshire ehrte das Andenken an seinen Vater, indem er seinen Sarg in die Neue Krypta bringen ließ, die auf den Fundamenten des Grabes der alten Bergleute der Zwergenmine errichtet worden war. Auf diese Weise sollten die Leute den Respekt vor dem alten König bewahren, und ihn niemals vergessen."
////////////////////////////////////////////////
[description_book_great_inventions]
string="Große Erfindungen von Arx, von Edric Arol."

[book_great_inventions_content]
string="Die menschliche Erfindungsgabe hat unserer Gesellschaft immer wieder wundervolle Dinge beschert. Jeder kann sich an die riesigen Ballone erinnern, die durch heiße Luft emporgehoben wurden, und uns in der Vergangenheit so phantastische Möglichkeiten der Forschung gaben.*Sie ermöglichten auch eine hervoragende Überwachung gegen Invasoren, da man über Meilen hinweg beobachten konnte.**Eine weitere wundervolle Erfindung waren die Tauchboote.**Diese erstaunlichen Konstruktionen brachten uns Möglichkeiten, gegen Piraten und die Flotten der Goblins anzukämpfen. Dies brachte uns während der dunklen Jahre der Kriege Überlegenheit auf dem Wasser.**Lord Marko, Schöpfer dieser unbezahlbaren Erfindung, ist einer der bekanntesten Helden in ganz Arx. Aber die großartigste menschliche Leistung ist zweifellos das unterirdische Königreich von Arx.*Es ist weniger eine Erfindung, als die Verlegung einer bereits existierenden Struktur. Als Grundlage diente eine alte Zwergenmine mit einem bereits existierenden Abluft-System.**Obwohl sie bereits eine hervorragende Struktur besaß, wurde sie dank der Art und Weise, in der sie die Menschen organisierten, noch eindrucksvoller...*Die alte Mine wurde zu einer wahrhaft autonomen Struktur, die allen verfügbaren Platz nutzte. Jeder dort existierenden Rasse wurde eine Ebene zugestanden - entsprechend dem Vertrag aus dem Jahr 217. Das Königreich ist eine lebendige Demonstration, was menschliche Schaffenskraft hervorzubringen vermag."
////////////////////////////////////////////////
[description_book_race_arx_content]
string="Die Rassen von Arx, von Cebrafi Nin."

[book_race_arx_content]
string="Die Beziehungen der Rassen von Arx untereinander waren immer schon schwierig. Die Goblins waren wegen ihrer Fruchtbarkeit die vielköpfigste aller Rassen. Jedoch gelang es ihnen nie, sich selbst als ein Königreich zu organisieren, und so verloren sie ihre Vormachtstellung. Grundsätzlich sind Goblins nicht sehr intelligent. Sie haben ihre eigene Sprache, sprechen aber meist eine vereinfachte Version der menschlichen Sprache. Sie halten ständig Ausschau nach Konfliktstoff, um die Person zu ärgern, mit der sie sprechen. Sie lügen, sind arrogant, feige und extrem faul. Nur zu Zeiten des Großen Paktes waren die Goblins den Menschen gegenüber loyal. Sie halfen, das Königreich im Untergrund zu errichten, und unterdrückten für einige Zeit ihre natürliche Aggressivität und ihre schlechten Manieren. Nachdem das Werk vollbracht war, fielen sie jedoch in ihr altes Verhalten zurück. Es scheint, als wäre der Edelsteinhandel die einzige, friedliche Sache, die sich zwischen ihnen und den Menschen abspielt. Trolle sind wiederum andere Kreaturen. Obwohl sie dieselbe Herkunft wie die Golblins zu haben scheinen, sind sie völlig anders. Sie besitzen nur einen schwachen Willen und leben gewissermaßen in Trödelei. Sie sind nicht aggressiv und oftmals sogar gütig. Aber ihre enorme Körperkraft und ihre legendäre Ausdauer machen sie ebenso zu mächtigen Verbündeten wie auch zu schrecklichen Feinden. Ihre Existenz beruht auf den einfachen Dingen des Lebens wie Nahrungsbeschaffung oder Schlafen. Da sie mental schwach sind, kann man sie leicht an der Nase herumführen. Aber wehe dem, den sie dabei erwischen. Ihr Zorn ist berüchtigt. Die Rattenmenschen haben es stets vorgezogen, nur wenig Kontakt zu anderen Rassen zu haben. Sie kommunizieren mehr mit Zeichen als mit Worten, fügen manchmal gurrende Laute hinzu. Rattenmenschen sind sehr beweglich und deshalb gefährliche Gegner im Kampf. Einige von ihnen sind die schlimmsten Mörder von ganz Arx. Sie sind raffiniert und äußerst schnell. Häufig benutzen sie vergiftete Waffen. Sie hausten schon  in den unterirdischen Kanälen der Stadt, als die Menschen noch an der Oberfläche lebten. Abfälle und Exkremente scheinen ihnen als Nahrung gut zu dienen. Bis heute waren die wenigen Begegnungen zwischen uns und den Rattenmenschen kurz und blutig. Sie unternehmen gelegentliche Streifzüge in Menschenstädte, um Abfallbehälter nach Nahrung und einfachen Werkzeugen zu durchsuchen. Seit sie im Verborgenen unter der Festung von Arx leben, haben sie langsam alle Kontakte mit anderen Rassen verloren und benehmen sich äußerst zurückhaltend. Zwerge haben eine Passion für alles Mechanische, für das Handwerk und alles, was mit Baukunst zu tun hat. Sie sind außerdem die besten Schmiede der Welt. Sie lebten schon unterirdisch, bevor irgendeine andere Rasse in die Tiefe vorstieß. Zwerge sind die Einzigen, die wissen, wie man Bergwerke anlegt und sie gut ausbeutet. Häufig verkaufen sie ihre Minenprodukte an die Menschen. Sie hatten schon immer ein sehr schlechtes Verhältnis zu den Goblins, und führten schon ungezählte Kriege, um diese Rasse zu vernichten - jedoch ohne Erfolg. Eine ihrer größten Minen wurde zum Rückzugsort und zur neuen Heimat für Arx gewählt. Die Zwerge halfen auch bei der Errichtung der Infrastruktur der Stadt und übernahmen dort viele Arbeiten (nur solche in der Ebene der Goblins nicht). Da sie schon immer unterirdisch lebten, gruben sie sich noch weiter in die Tiefe, und fuhren fort, ihre Minen noch weiter auszubeuten. Die Herkunft der Schwestern von Edurneum ist ein Rätsel. Sie sehen aus wie eine Kreuzng aus Frauen und Schlangen. Ihre Haut ist mit Schuppen bedeckt. Sie scheinen in ihrer Rasse keine Männer zu besitzen, und wir wissen nichts über ihre Fortpflanzung. Sie sind im Gebrauch von Magie sehr bewandert, was sie zu den besten Magierinnen von Arx macht. Entsprechend einer bestimmten Legende waren sie sogar an der Entdeckung der Magie beteiligt. Sie standen der Rasse der Menschen stets sehr nahe und halfen ihnen in vielen schwierigen Phasen ihrer Geschichte. Während der Abwanderung in die Tiefe, versprachen die Schwestern dem König der Menschen ihre Hilfe, und erschufen Pflanzen, die unterirdisch wuchsen, so dass die Menschen und ihr Vieh Nahrung finden konnten. Über Drachen ist nur sehr wenig bekannt. Einzig und allein die Anzahl von Drachenschuppen wurde von Gelehrten ermittelt: Es sind 4815 Stück."
////////////////////////////////////////////////
[description_book_known_gods]
string="Kenne deine Götter und Dämonen, von Bracconus, dem Theologen."

[book_known_gods_content]
string="Alador, erschaffen auf Omnys, gütiger Gott: Scheint zu schlafen, nachdem er den Menschen freien Zugang zu seiner Dimension gewährte und ihnen die Kontrolle über ihr eigenes Schicksal überließ.*Man nimmt an, dass er sehr mächtig war, seine Macht aber niemals voll ausspielte, bevor er Omnys verließ. Xerm, erschaffen auf Omnys, böser Gott: Der exakte Gegenspieler des vorgenannten. Xarm war sehr wütend auf Alador, als dieser den Menschen ihre Unabhängigkeit gab. Als er sah, dass er ihnen das nicht mehr wegnehmen konnte, versuchte er, sie unter seine Herrschaft zu zwingen, indem er sie versklavte. Akbaa, erzeugt auf Koltk, böser Gott: Er wurde Gott der Zerstörung genannt, da er Koltk vollständig zerstörte. Anfangs wurde er von seinen Anhängern verehrt, weil er ihnen in ihren Kriegen und Konflikten half. Tirkio, erzeugt in Arx, gütiger Gott: verachtet die Nutzlosigkeit des Reichtums. Es ist anzuraten, sämtliche Goldstücke zurückzulassen, bevor man sich mit ihm auf irgendeinen Handel einlässt."
