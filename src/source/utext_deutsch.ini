[description_note_gobswords_content]
string = "Osok, hier sein ein neues Entwurf für großartig Holzknüppel. Starke Goblins können Knüppel verwenden. Mich denken, starke Truppen sind glücklich bald. Nuk sage schlechtes Entwurf, zu schwerer Knüppel, aber ich sagen, er hilft nicht. Jeder nur immer reden, aber niemals machen! Mich möchte Schwerter wie schmutzig Zwergen schmieden, ich hoffen, das Goblin-Königreich glücklich sei. "


