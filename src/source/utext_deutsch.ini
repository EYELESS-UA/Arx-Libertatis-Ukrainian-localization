// Chinkashh //
/////////////////

[chinkashh_greetings_player]//~20
String="Wohl, wohl! Ein neuesss Gesicht! Ohne Zweifel hat Euch der König wegen eines Ratschlagsss zu mir geschickt. Wie Ihr sehen könnt, kümmere ich mich um die königliche Bibliothek. Was kann ich für Euch tun?"

[chinkashh_library_misc]//~20
string="Aus diesen Regalen strahlt viel Weisheit auf Euch herab!"
string2="Lasst Euch von der Weisheit dieser Bücher erfüllen!" 
string3="Lasst Euren Geist durch die Bibliothek wandern! Vielleicht findet Ihr ein Buch, das Euch weiterhilft."

// If Carlo has talked about rituals. //

[player_pentagram_on_floor]//{~00~20
String="Hättet Ihr dieses Pentagramm nicht mit Blut zeichnen müssen?"

[chinkashh_it_protects]//~20
String="Jeder, der die Künste der Magie beherrscht, würde erkennen, dasss uns dieses Symbol vor dem Dämon schützt. Seit unser Astronom Falan Orbiplanax getötet wurde, fühle ich, das etwas Böses über ganz Arx schwebt."

[player_what_can_u_tell]//~00
String="Und was ist mit diesen Ritualen? Wer tötete Orbiplanax?"

[chinkashh_these_rituals]//~20
String="Diese Rituale verströmen Dunkelheit. Alle Spuren im Todesfall von Falan Orbiplanax weisen auf Schwarze Magie und deren bösartige Praktiken hin. Falan war ein guter Mann - rechtschaffen und zuverlässig. Ich vermute, er fand heraus, wer diese Rituale durchführt."

// If player has seen king slapped. //

[player_the_king_earlier]//~00
String="Chinkashh, in welcher Weise ist der König dem Orden von Edurneum verpflichtet?"

[chinkashh_not_related]//~20
String="Das hat nichts mit Eurer Aufgabe zu tun, Bewahrer! Es muss genügen, wenn ich sage, dass es eine Schuld abzuzahlen gilt!"

[player_does_king_hold]//~00
String="Hat der König etwas, das Euch gehört?"

[chinkashh_the_treaty]//~20
String="Der Vertrag! Der König musss sich an unseren Vertrag halten! Dasss ist alles!"

// Player knows about Greu's gift. //

[player_book_outside]//~00
String="Ich suche nach einem Buch mit Bildern, welche die äußere Welt zeigen."

[chinkashh_sure_book]//~20
String="Diesss issst das Buch, nach dem Ihr sucht. Nehmt esss, es sei Euer!"

// Player looking for ultimate weapon book. //

[player_book_ultimate_weapon]//~00
String="Ich suche nach einem Buch mit dem Titel 'Theorie einer Absoluten Waffe'."

[chinkashh_sorry_dont]//}~20
String="Tut mir leid, Am Shaegar! Ihr werdet dieses Buch hier nicht finden. Um es zu bekommen, müsst Ihr die Bibliothek aufsuchen, die von einer meiner Schwestern geführt wird!"

// Chinkashh gives the teleport spell. //

[chinkashh_portal01]//~20
String="Lasst Euch von meiner Anwesenheit hier nicht stören, Am Shaegar! Eure Identität wurde mir bestätigt. Die Prophezeiung stimmt. Jetzt liegt es an Euch, sie zu erfüllen. Obwohl ich Euer Schicksal nicht beeinflussen will, Am Shaegar, so kann ich Euch doch etwas zeigen, dasss von großer Hilfe für Euch sein könnte. Folgt mir, und ich werde Euch die Kunst lehren, durch die Wände in diesem Königreich zu gehen!"

[chinkashh_portal02]//~20
String="In jeder Ebene des Königreichesss haben meine Schwestern einen ähnlichen Raum erbaut. Um diese Portale zu benutzen, stellt Euch davor, und sprecht ‘Portal aktivieren’!"

[chinkashh_portal03]//~20
String="Danach könnt Ihr zu jedem Portal reisen, dasss Ihr schon einmal aktiviert habt. Möge Euer Glaube an die Götter, Eure Stärke im Angesicht der Dunkelheit sein!"

//** grassini: new: new tools section
// Advice asked of Chinkashh depending on the point in the scenario: the number refers to the relevant point in the scenario

[player_chinkashh_quest04]//{~00~20
String="Ich muss diese Nachricht dem obersten Troll übergeben!"

[chinkashh_quest04]//~20
String="Die Trolle arbeiten in ihren Minen zwei Ebenen unter uns. Ihr werdet den Anführer gleich erkennen, er ist der Lächerlichste von allen!"

[player_chinkashh_quest05]//~00
String="Ich ermittle im Fall von Falans Tod!"

[chinkashh_quest05]//~20
String="Ihr müsst Eure Nachforschungen in seinen Laboratorien oder in seinem Quartier fortsetzen!"

[player_chinkashh_quest09]//~00
String="Ich suche nach Informationen über den Krahoz und den Zohark!"

[chinkashh_quest09]//}~20
String="Ich denke, ich habe hier, wasss Ihr sucht. Ein Buch über die Alten Götter, in dem der Krahoz und der Zohark erwähnt sind. Es könnte hilfreich für Euch sein."

