[garlic_attack]
string="Knoblauch-Attacke!"

// shany sub quest
[note_5000_sons]
string="Nun, da Ihr ein wertvolles Geschenk für unseren Gott gefunden habt, können wir das Ritual durchführen. Ich warte morgen früh um zehn Uhr auf Euch in der vierten Ebene beim Schlangenpfeiler. Von dort aus führe ich Euch in die geheime Halle, wo wir die Fünftausend Söhne der Bestie aufwecken können. Achtet darauf, nicht verfolgt zu werden."

[note_alotar_threat_content]
string="Vergesst nicht: Wenn Ihr mir die Edelsteine nicht morgen Nacht bringt, seid Ihr tot! - Die Bruderschaft der Edelsteinhändler."

[note_for_pog_content]
string="Pog. Ich Lunshire Hilfe brauchen. Pfad zu Menschen-Außenposten blockiert: Große, schwere Steine. Falls Trolle Pfad freimachen, ich glücklich. - L."

[note_dwarf_mithril]
string="Akanor, ich fürchte, uns geht das Mithril aus. Die Situation wird jeden Tag schlimmer, ich kann nicht mal mehr eine Unze Mithril in unseren Minen entdecken. Wir müssen eine Lösung finden. - Oredak."

[note_jail_contain]
string="Ich dich kommen Ablösung nach Essen. Du aufpass Menschen, du Achtung sein mit Neuer. Er gucken gefährsam.** Anatole."

[description_note_fallan_content]
string="Felnor,**ich habe entdeckt, dass es einen Kult gibt, der sich Akbaa verschrieben hat. Akbaa ist ein mächtiger Teufel, der Gott der Zerstörung. Und dieser Kult versucht offenbar, Akbaa bei seiner Auferstehung hier im Königreich Arx zu unterstützen. Dies zuzulassen, wäre Blasphemie und eine Katastrophe für alles Leben unserer Welt...* Irgendwo in dieser Festung betet dieser Kult zu einem Meteor, der komplett aus einem Material namens Koltk besteht. Man sagt, dieser Stein stamme von dem Ort, an dem Akbaa zur Welt kam... Normalerweise ist dieses Material unzerstörbar.* Die gottlosen Gebete und die abscheulichen Opfer der Priester werden von diesem Meteor gebündelt und versorgen Akbaa mit Energie. Sobald Akbaa genug von dieser Energie gesammelt hat, wird seine Inkarnation vollendet sein. Sollte dies geschehen, werden Zerstörung und unendliches Leid über uns hereinbrechen. Wir müssen diesen Meteor um jeden Preis finden und zerstören. Um ehrlich zu sein, Felnor, kann dies nur ein Bewahrer aus dem Noden tun... Heute Abend werde ich den Noden kontaktieren und um Hilfe bitten.** Falan."

[note_king_bedroom_contain]
string="Hoi, König, du erinnern - niemals nix trinken Wein - du allergisch sein. Wenn trinken, du hab schlimmes Aua... - Dein ergebenes Apotheker."

[note_glavasias]
string="Bruder Glavasias, falls Ihr je das Sicherheitssystem abschalten müsst: Euer Geheimcode ist 113. Das schützende Kraftfeld sollte Euch keine Probleme bereiten. Bruder Patrizio und Bruder Pasquale werden Euch helfen, die anderen Sicherheitssysteme abzuschalten. - Lord Iserbius."

[note_Patrizio]
string="Bruder Patrizio, dieses Herz ist einer der Schlüssel zum Sicherheitssystem. Achtet gut darauf. - Lord Iserbius."

[note_Pasquale]
string="Bruder Pasquale, vergesst nicht: Das erste verschließt das zweite. - Lord Iserbius."

[note_gob_guardpost_contain]
string="Meine lieben Goblin-Freunde. Da unser Abkommen offenbar weiter bestehen soll, möchte ich meine Bestellung zweier Menschen zu Opferzwecken an unseren geliebten Akbaa noch einmal bestätigen. Ihr erhaltet bei Lieferung 1000 Goldstücke pro Kopf. Ich werde euch diese königliche Entlohnung persönlich übergeben. - Lord Iserbius."

[note_mike_lost]
string="Lieber Oliver, es tut mir Leid, aber ich bin nicht in der Lage, das vierte Rätsel zu lösen. Denkt Ihr, Ihr könntet mir einen Hinweis geben? - Mike."

[note_maria_love]
string="Maria, lang ist es her, dass wir uns sehen konnten, und wäre die Lage nur etwas anders, würde ich alles in der Welt unternehmen, um an deiner Seite zu sein. - Dein L."

[note_key_brother_treasure]
string="1-3-1 ist der Schlüssel zum Öffnen der Schätze meiner Brüder."

[note_treasure_hunt_hint#4]
string="Ich bin sehr beeindruckt von Eurem Fortschritt, Fremder, also hier der vierte Hinweis (... gebraucht zum Finden des Hinweises...). Sucht für den nächsten Hinweis die Lavainsel und seht sie Euch genau an."

[player_stone_riddle_first]
string="Reisender, wenn Ihr an meiner Schatzjagd teilnehmen wollt, benötigt Ihr einen Smaragd, um meine Truhe zu öffnen. - OLIVER."

[player_note_riddle_second]
string="Aha, ich sehe, wir haben einen neuen Mitspieler. Willkommen, Fremder. Hier ist der erste Hinweis: (Der Schlüssel zum Schatz...) Für den nächsten Hinweis geht in die Trollminen, und sucht nach der Notiz unter den Steinen."

[note_carlo_sacred_sword]
string="Die Operation Geheiligter Dolch beginnt morgen. Seid vorbereitet. Ich werde dafür sorgen, dass die Wachen nicht da sind, wenn Ihr kommt, und noch wichtiger: dass der König schnell eingeschlafen sein wird. Er wird keinen Verdacht hegen. Macht Eure Arbeit gut, und unsere Sache wird geheim bleiben. - F."

[note_carlo_calpal]
string="Notiz #1 - Enoill, Königin Florence ist eine Gefahr für unser Königreich geworden. Bitte folgt ihr ungesehen, und lasst mich wissen, was Ihr entdeckt. - Carlo."

[note_carlo_calpal2]
string="Notiz #2 - Dieser Brief, den Ihr fandet, bestätigt meinen Verdacht. Die Königin plant, den König zu ermorden. Deswegen will ich, dass Ihr das Verschwinden der Königin arrangiert. Ich überlasse Euch die Wahl von Zeit und Ort. Natürlich werdet Ihr dafür gut entlohnt werden. Vernichtet diese Nachricht, wenn Ihr sie gelesen habt. - Carlo."

[note_carlo_calpal3]
string="Notiz #3 - Heute Nacht müsst Ihr Eure Mission zu Ende bringen! Kümmert Euch um die Königin, sobald ihr Kind geboren wurde! Ich selbst werde für die Sicherheit des Königs sorgen. - Carlo."

[player_note_riddle_third]
string="Gut gemacht, Fremder. Hier ist der zweite Hinweis: (...ist auf Ebene...) Für den nächsten Hinweis versucht herauszufinden, was man in der Halle unter den Goblin-Gefängnissen nicht sehen kann."

[note_dear_mike_sorry]
string="Lieber Mike. Es tut mir Leid, aber es wäre nicht fair gegenüber den anderen Spielern, wenn ich dir eine Hilfe zu Rätsel 4 geben würde. Trotzdem viel Glück. - Oliver, der Eremit."

[note_at_last]
string="Endlich ist es so weit. Bald wird mein Körper der Tempel Akbaas sein, und vereint werden wir über Arx herrschen. Sollte mir etwas zustoßen, möchte ich diese Notiz hinterlassen, so dass ein anderer meine Arbeit zum Nutzen von Arx fortführen kann. - Iserbius."

[note_Darkthorn]
string="Niemand im Königreich weiß von meiner Mission. Der König wählte mich, da ich der beste Zombiejäger bin. Ich weiß, meine Aufgabe ist schwer, aber ich habe alle Werkzeuge, um diese Monster zu vernichten! Mumien sind harsche Gegner, aber leicht zu besiegen, da sie gut brennen! Die anderen Untoten sind zäher, da sie diese blöde Angewohnheit haben, wieder aufzustehen, wenn du denkst, du hast sie erledigt. Der Spruch, sie zurückzutreiben, wirkt nur kurz, und er tötet sie nicht. Der beste und einzige Weg, den ich kenne, ist, ihnen einen Pfahl in den Leib zu treiben, bevor sie wieder aufstehen. Dann sind sie erledigt. Ich glaube nicht, dass meine Ausrüstung genügen wird. Glücklicherweise hat mir mein edler Vorgänger einige hilfreiche Werkzeuge hinterlassen. Ich hoffe, ich kann diesen geheiligten Ort säubern, so dass die Leute wieder ihre Ahnen ehren können. Ich war bereits auf einer Erkundungstour in der ersten Ebene der Krypta. Aber ich muss auf die Gefahren um mich herum achten. Mögen die Götter mit Euch sein. - Azrael Darkthorn."

[note_fallan_code]
string="6 wird zu 4, wenn du das Erste nimmst. Das Erste mal dem Zweiten wird das Letzte und das Letzte, multipliziert mit dem Ersten macht 16."

[note_warning_golem]
string="Ich kann Poxsellis' Grab nicht erreichen. Das Rätsel des Wachmanns, der den Leichenwagen bewacht, ist zu schwer für mich. Ich überlasse Poxsellis' Schatz einem anderen."

[note_miguel_calpale_key]
string="Hier ist die bestellte Kopie, Enoill. Da du nicht da bist, schiebe ich sie unter der Tür durch. Schau am Laden vorbei, um die Rechnung zu bezahlen. Miguel."

[note_twin]
string="Hier ist eine Karte, mit der man das Versteck der Schlangenfrauen finden kann. Ich fand dort eine große Zahl unterschiedlicher Dinge, die man für einen guten Preis verkaufen kann."

[note_bad_snake_woman]
string="Der Bewahrer ist dabei, Zalnashh und ihren Schwestern eine neue Königin zu bringen. Stoppt ihn um jeden Preis. Die Linie der Zalnashh muss aussterben!"

[note_troops_for_jail]
string="König Alotar, Gefangene aus Gefängnis getürmt. Brauche mehr Soldaten. X."

[note_bad_snake_woman2]
string="Wir sehen uns in den Kristallhöhlen. Wir haben neue Instruktionen für Euch. Und Vorsicht: Jemand könnte von unseren Plänen wissen!"

[note_gem_dealer_licence]
string="Edelsteinhändler-Lizenz: Nr. #256B - Offiziell gewährt durch König Lunshire und den allmächtigen König Alotar -"

[note_goblin_authorization_unsigned]
string="Dies Erlaubnis sein. Wer hat, kann gehen durch Goblin Königreich. Gewährt durch:"

[note_goblin_authorization_signed]
string="Dies Erlaubnis sein. Wer hat, kann gehen durch Goblin Königreich. Gewährt durch: Anatole.  X"

[note_end_demo]
string="Herzlichen Glückwunsch**Sie haben hiermit die Arx Fatalis Demo durchgespielt."

