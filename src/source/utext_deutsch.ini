[gary_my_name_misc]//~06@gary is a very pretencious person
String="Willkommen. Mein Name ist Gary, und dies ist meine Bank. Hier könnt Ihr Eure Goldbarren und Nuggets zu einem guten Kurs gegen die Reichswährung tauschen. Und Ihr könnt auch Beteiligungen kaufen. Vertraut mir ruhig, denn ich bin der wohlhabendste und einflussreichste Mann in der Stadt - nach dem König natürlich. Fragt jeden!"
