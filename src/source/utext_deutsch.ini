[Zalnashh_greetings]//{~21~00@TO BE TIMED ACCORDING TO ENGLISH VERSION.
string="Ihr seid also der Bewahrer. Oder bevorzugt Ihr Euren menschlichen Namen, Am Shaegar? Ich bin Zalnashh, Oberin des Ordens von Edurneum."

[player_greetings_zalnashh]//~00@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Nennt mich, wie Ihr wollt! Ich bin hier, weil ich ein Objekt namens Zohark benötige."

[Zalnashh_interesting]//~21@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Interessant! Und warum glaubt Ihr, sollte der Orden zulassen, dass wir dieses Objekt aus unserer Obhut geben und Euch zur Verfügung stellen?"

[player_need_zohark_guardian]//~00@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Es ist ganz einfach: Akbaa bereitet seine Reinkarnation in Arx vor und will sämtliche lebenden Kreaturen in dieser Dimension systematisch vernichten. Ich bin der Einzige, der das verhindern kann. Aber ich brauche dazu diesen legendären Zohark!"

[Zalnashh_ah_ah_ah]//~21@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Hahahaha, sehr gut! Aber das wirkliche Problem liegt woanders, Bewahrer! Der Zohark ist nutzlos ohne seinen Bruder, den Krahoz. Nur die Vereinigung beider Objekte kann Eure magische Energie bewahren. Und der Krahoz wurde von Rebellen gestohlen. Lunshire hat in allen Versuchen, ihn für uns zurückzuholen, konsequent versagt!"

[player_will_find_krahoz]//~00@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Ich werde den Krahoz finden!"

[Zalnashh_you_will]//~21@maliciously@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Ihr werdet ihn finden, wenn Ihr ihn nicht sogar schon habt! Aber das ist nicht das Problem. Momentan hat die Vernichtung von Akbaa oberste Priorität. Ihr müsst die Wahrnehmungsprobe erfolgreich meistern! Dies ist eine schwere Prüfung, die jeder neue Rekrut unseres Ordens bestehen musss. Ihr müsst den Tempel der Illusionen erfolgreich durchqueren. Falls Ihr es schafft, könnt Ihr den Zohark mitnehmen. Ihr seid dann gegen alle Illusionen geschützt, mit denen Euch Akbaa zu täuschen versucht."

[Zalnashh_gives_orb_illusion]//}~21
String="Hier ist der Schlüssel zu unserem Tempel. Nutzt ihn weise!"

[Zalnashh_krahoz_impressed]//{~21~00@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Der Krahoz! Ich bin beeindruckt, Bewahrer! Das bedeutet, dass Ihr auch wisst, wo sich die Rebellen verstecken. Ahhh, erzählt es mir! Sagt mir, wo sie sind!"

[player_so_important]//~00@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Wozu ist das wichtig? Ihr habt den Krahoz zurück. Nichts anderes zählt!"

[Zalnashh_you_right]//~21@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Ihr habt Recht, Am Shaegar! Setzt Eure Suche fort! Aber vergesst nicht: Solltet Ihr jemals unsere Hilfe benötigen, werden wir eine Gegenleistung dafür fordern. Geht jetzt!"

//** Player gives Krahoz after statue is destroyed
[Zalnashh_keep_toy]//~21@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Ihr dürft dieses Spielzeug behalten! Sagt mir, wo sich die Rebellen verstecken!"

[player_why_why]//~00@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Warum? Warum ist das so wichtig für Euch?"

[Zalnashh_you_tell_us]//}~21@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Bald werdet Ihr uns verraten, wo sich ihr Versteck befindet. Ihr benötigt dringend unsere Hilfe, Bewahrer. Ihr habt also keine andere Wahl, als uns dieses Geheimnis zu verraten!"

[Zalnashh_bring_again]//{~21~00@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Am Shaegar, womit verdienen wir die Ehre Eures Besuches?"

[player_slowned]//~00@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Akbaas Erscheinen in dieser Dimension steht kurz bevor, obwohl der Energiekanal zerstört ist. Dennoch, es gibt einen Weg, ihn aufzuhalten. Werdet Ihr mir helfen?"

[Zalnashh_suuuure]//~21@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Aber natürlich werden wir das! Als könnten wir Euch irgendeinen Wunsch ausschlagen, geliebter Bewahrer. Vergesst aber nicht, dass Ihr auch uns helfen müsst, wenn es soweit ist! Ihr benötigt eine Waffe, die mächtig genug ist, den Koltk-Stein zu beeinflussen, sogar wenn er in Resonanz mit Akbaa ist. Um das zu erreichen, müsst Ihr diese Waffe in einer Legierung aus Koltk-Staub schmieden! Dann braucht Ihr noch ein Drachenei, um den Zauberspruch zu vervollständigen. Nur diese Zutat kann die Kraft eines solchen Zaubers erhalten."

[player_return_soon]//~00
String="Ich werde bald zurück sein!"

[player_have_egg]//~00
String="Ich habe ein Drachenei!"

[Zalnashh_still_weapon]//~21
String="Perfekt! Aber Ihr benötigt noch eine Waffe, auf die der Spruch angewandt werden soll!"

[player_soon_possible]//~00
String="Ich komme zurück, so schnell ich kann!"

[Zalnashh_here_weee]//~21
String="Ah, schon wieder hier, Am Shaegar? Jetzt kann ich die Waffe mit einem Spruch belegen. Legt die Waffe und das Drachenei auf den Altar der Umwandlung! Ich werde das Ritual vollziehen. Oh, jetzt hätte ich fast etwas vergessen. Wolltet Ihr uns nicht verraten, wo sich die Rebellen verstecken?"

[player_another_way_snake]//~00@for himself
String="Verstehe! Vielleicht finde ich einen anderen Weg!"

[player_rebel_hide]//~00
String="Das Rebellenversteck ist zwei Ebenen höher, nahe dem kleinen See. Klopft die Wand ab, und Ihr findet einen verborgenen Zugang!"

[Zalnashh_thank_you]//~21@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Ich danke Euch Tausend Mal!"

[Zalnashh_thank_you2]//~21@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Mega... Stregum... Cosum..."

[Zalnashh_thank_you3]//~21@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Nehmt Eure Waffe, und vernichtet Akbaa ein für alle Mal! Ich danke Euch dafür, dass wir jetzt eine neue Königin haben!"

[player_glad]//}~00@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Jetzt sind wir quitt!"

[Zalnashh_finish_temple]//~21
String="Stellt Euch der Herausforderung des Tempels, Bewahrer!"
string2="Eure Schicksalsreise führt zu diesem Tempel!"
string3="Wenn Ihr diesen Tempel nicht erfolgreich durchqueren könnt, solltet Ihr nicht einmal versuchen, Akbaa entgegenzutreten!"

[Zalnashh_you_need_us]//~21
String="Ihr werdet unsere Hilfe bald wieder benötigen!"
string2="Unsere Wege werden sich wieder kreuzen, Am Shaegar!"
string3="Wir werden uns bald wieder treffen!"

[Zalnashh_soon_you_tell]//~21
String="Bald werdet Ihr uns verraten, wo sich die Rebellen verstecken!"
string2="Bald werdet Ihr gesprächiger sein!"
string3="Früher oder später erzählt Ihr mir, was ich wissen will!"

[Zalnashh_need_weapon]//~21
String="Vergesst nicht, dass Ihr eine Waffe aus einer Koltk-Legierung benötigt!"
string2="Vergesst nicht, mir eine Waffe mitzubringen, wenn Ihr wollt, dass ich sie mit einem Spruch belege!"
string3="Der Spruch kann nur auf eine Waffe angewandt werden. Bringt mir eine!"

[Zalnashh_please_tell_rebel]//~21
String="Bevor ich den Zauber wirke, müsst Ihr mir verraten, wo das Versteck der Rebellen ist!"
string2="Verratet mir, wo sich das Versteck der Rebellen befindet, wenn Ihr wollt, dass ich Eure Waffe mit einem Zauberspruch belege!"
string3="Wenn Ihr eine magische Waffe wollt, erzählt mir, wo sich das Versteck der Rebellen befindet!"

[Zalnashh_new_queen]//~21
String="Ich danke Euch! Ich danke Euch dafür, dass wir eine neue Königin haben!"
string2="Dank Euch und dem Noden, der Euch gesandt hat, werden wir bald eine neue Königin haben!"
string3="Letztendlich bekommen wir doch eine neue Königin für unseren Orden. Gratulation, Bewahrer!"

