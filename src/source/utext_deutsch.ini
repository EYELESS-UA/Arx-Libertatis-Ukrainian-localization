///FGE
[florence_alia_destiny_3]//~26@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Ich war Teil des Ordens des Heiligen Dolchs, einer geheimen Organisation, die von Poxsellis selbst geschaffen wurde, um das Königreich gegen jede Art von Gefahr zu schützen. Ich bekleidete dort einen hohen Rang und war eine der wenigen, die von dem geheimen Vertrag wussten. Ich habe die Entführung von Alia vorbereitet. Aber in der Nacht, als sie auf die Welt kam, gebar ich auch ihre Zwillingsschwester, Clarissa, einige Minuten vor Alia. Diese unerwartete Geburt erweckte in mir die Idee, sie in die Obhut meines Dieners zu übergeben, der Sie aus Arx heraus und zur Gilde der Reisenden bringen sollte. Aber ich wurde von einem heimtückischen Attentäter getötet, der jetzt dank Am Shaegar endlich entlarvt wurde."

