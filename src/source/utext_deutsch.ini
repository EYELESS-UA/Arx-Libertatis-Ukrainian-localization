[Zalnashh_Alia_destiny_3]//~21 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Seid nicht unbesonnen, Lunshire! Ihr solltet einen Sinn für Veränderungen entwickeln! Was können Eure Schwerter schon gegen uns ausrichten? Ich dachte, Ihr wärt ein bisschen klüger. Dieser Vertrag sollte die Wiedergeburt unserer Königin sicherstellen. Zufälligerweise hat er auch Euer erbärmliches Königreich gerettet. Wir brauchen eine Königin, und diese Königin ist Alia!"

