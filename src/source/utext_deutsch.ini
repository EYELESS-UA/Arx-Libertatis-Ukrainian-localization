[dragon_leave_place_misc]//~27
String="Ein Mensch! Verschwinde von hier, du erbärmliche Kreatur, dann wirst du dein unbedeutendes Leben retten. Und denke nicht einmal daran, etwas mitzunehmen, oder du wirst sterben!"
string2="RRRAAARRRGH! Verschwinde aus meiner Höhle, elender Mensch, wenn dir dein bemitleidenswertes Leben lieb ist. Und glaube ja nicht, dass du davon kommst, wenn du hier etwas klaust!"
string3="Erbärmlicher Mensch! Dreh dich um und geh, wenn du das letzte bisschen Wärme in deinem Körper behalten willst."

// if the player has picked up anything from the dragon's lair
[dragon_told_you_misc]//~27
String="Ich habe dich gewarnt, du elender Dieb. Jetzt wirst du den Zorn eines Drachen spüren!"
string2="Seid ihr Menschen nichts anderes als eine Rasse von Dieben?"
string3="Ich werde dich etwas Grundlegendes lehren, von dem du noch nichts gehört zu haben scheinst: Respekt!"

[player_well_actually]//{~00~27
String="Ich bin hier, weil ich ein Drachenei brauche."

[dragon_grrrr_human]//~27
String="RRRAAARRRGH, Bewahrer! Welche Mission hat dir der Noden aufgetragen? Mich zu fragen, ob ich meine Nachfahren einfach so opfere?"

[player_understand_surprise]//~00
String="Ich muss Arx und seine Bewohner retten. Akbaa, der Gott der Zerstörung, beabsichtigt..."

[dragon_enough_grrrr]//~27
String="RRRAAARRRGH, ich weiß das nur zu gut. Meine Frage lautet: Warum brauchst du das Ei eines Drachen?"

[player_because_only_way]//~00
String="Nur ein Drachenei erlaubt das Wirken eines Zaubers, der stark genug ist, die Reinkarnation von Akbaa zu zerstören."

//** grassini new
// additional dialogues for the quest for golden pieces
[dragon_not_want]//~27
String="Wenn du es wagst, einen Drachen zu fragen, ob er eines seiner Jungen opfert, sei es auch, um die ganze Welt zu retten, dann kennst du uns schlecht."

[player_not_want]//~00
String="Nun, was soll ich tun?"

[dragon_well_then]//~27
String="Beweise mir erst, dass du es wert bist."

[player_what_fight]//~00
String="Muss ich gegen dich kämpfen?"

[dragon_ah_ah]//~27
String="Aha. RRRAAARRRGH. Warum nicht? Aber das wäre dir gegenüber nicht fair. Nein, ich spreche von einer anderen Art von Wert, einem Wert, der in allen Dingen steckt, ob klein oder groß. Weißt du zum Beispiel, wie du mir ein Geschenk aus so vielen Goldstücken machen kannst, wie ich Schuppen habe?"

// if the player has not read the book about Arx races
[player_not_how]//~00
String="Ich weiß nicht, wie viele Schuppen ein Drache hat..."

[dragon_not_how]//~27
String="Das ist Teil des Wertes aller Dinge, Bewahrer."

// if the player has read the book about Arx races 
[player_yes_know]//}~00
String="Ja, ich glaube, das habe ich mal in irgendeinem Buch gelesen."

[dragon_leave_egg_misc]//~27
String="Geh nicht zu nahe an meine Eier heran, sie mögen die Hitze nicht..."
string2="Du hast doch nicht etwa vor, eines meiner Eier zu stehlen, oder? So tollkühn bist du nicht, hmmm?"
string3="Solltest du auch nur versuchen, eines meiner Eier zu berühren, werde ich dir auf der Stelle alle Gliedmaßen einzeln ausreißen!"

// general sentence for when the dragon is waiting for his payment in gold 
[dragon_gold_misc]//~27
String="Hast du mir also mein Gold gebracht?"
string2="Was machst du, Bewahrer? Meine Schuppen zählen? Glaubst du nicht, dass es andere Methoden gibt, herauszufinden, wie viele Schuppen ein Drache hat? Bist du des Lesens nicht mächtig?"

// when the player has brought a sum of gold pieces, depending on whether it is the right amount (or above) or not enough.
[dragon_gold_right]//~27
String="Diese Zahl ist richtig, Bewahrer. Nimm dieses Ei, und möge die Weisheit der Drachen dein Schwert führen..."

[dragon_gold_wrong]//~27
String="Falsch! Ich habe mehr Schuppen."
string2="Diese Zahl ist zu klein, das ist ja fast eine Beleidigung."
string3="Sehe ich wirklich aus, als hätte ich so wenig Schuppen?!"

[dragon_leave_place_again_misc]//~27
String="Frierst du denn nicht?"
string2="Leidest du nicht in dieser eisigen Kammer?"
string3="Ich glaube, es wäre besser, wenn du gehst. Die Kälte muss für dich unerträglich sein."

// The player comes to see the dragon before they need a dragon's egg. The dragon explains the player's role as guardian to them...
[dragon_explain_guardian]//~27
String="Tja, Bewahrer, bist du nicht durch und durch ausgekühlt?"

// If the player turned up not knowing that he was the guardian...
[dragon_explain_guardian2]//{~27~00
String="Ich weiß, wer du bist. Sei nicht überrascht, denn ich konnte es schon spüren, als wir uns das erste Mal getroffen haben. Du musst dir über deine Identität selbst klar werden."

[player_miserabilis]//~00
String="Warum behandelst du mich dann wie einen gewöhnlichen Menschen?"

[dragon_explain_guardian3]//~27
String="Hahaha... Traditionen müssen am Leben erhalten werden."

[dragon_explain_guardian4]//~27
String="Es ist so lange her, dass ich einen Gesandten des Noden gesehen habe! Ich freue mich, dass es dir nicht zu schwer gefallen ist, dein Gedächtnis wieder zu erlangen. Ein Bewahrer zu sein, hat seine Vorteile, aber manchmal hat es auch unangenehme Seiten."

[player_question_dragon]//~00
String="In welcher Hinsicht?"

[dragon_explain_guardian5]//~27
String="Nun ja, es scheint, dass ein Bewahrer eine gewisse Art von Weitblick entwickelt. Eine Fähigkeit, sich in der Zeit zu bewegen und so eine neue Sicht von kritischen Situationen zu erhalten, die ihn sonst in Sackgassen oder Niederlagen geführt hätten. Du musst das gefühlt haben, auch wenn du dir dessen vielleicht nicht bewusst warst. Auf jeden Fall weiß ich eines: Dir ist es bestimmt, erfolgreich zu sein. Zögere nicht, diese Fähigkeit einzusetzen, sie wird für dich von großem Nutzen sein."

[player_question_dragon2]//~00
String="Besitze ich Kräfte, von denen ich noch nichts weiß?"

[dragon_explain_guardian6]//}~27
String="Ich denke nicht. Es ist lange her, dass die Führer des Noden den Bewahrern große Kräfte verliehen haben... Manchmal ist die Heilung schlimmer als die Krankheit. Das bringt mich zu deinem Schwachpunkt: Als eine Kreatur des Noden siehst du aus wie ein Mensch, bist aber nicht in dieser Dimension geboren. Es steht dir frei, die meisten Dinge zu tun, aber nicht alles - deine Unwissenheit über diese Dimension, zusammen mit den Tatsachen, die dir der Noden eingeprägt hat, und an die du dich wahrscheinlich nicht erinnern kannst, lassen dich oft vom Pfad abwandeln. So werden zum Beispiel viele Gespräche nicht so verlaufen, wie du es erwartest. Die Wörter, die aus deinem Mund kommen, werden nicht die sein, die du gewählt hattest, oder manchmal wirst du etwas sagen, dessen Sinn gar nicht dem entspricht, was du ausdrücken wolltest. Mach dir aber deshalb keine Sorgen, Bewahrer. Aus dem Blickwinkel der Menschen wirst du in Arx immer ein Fremder sein."

// Dragon asked for advice depending on different points in the scenario: the number refers to the particular scenario point in question
// Grassini new

[player_dragon6]//{~00~27
String="Ich muss den Zugang zum Tempel finden..."

[dragon_scenar6]//}~27
String="So so, von einer Tür aufgehalten? Was widerfuhr den Bewahrern der früheren Jahre? Verweile hier nicht zu lange. Ich fürchte, du wirst dich sonst erkälten."

[player_dragon8]//{~00~27
String="Ich konnte den Meteor durch bloße Berührung nicht zerstören..."

[dragon_scenar8]//}~27
String="Die Dinge sind nicht immer so einfach, wie du denkst. Du legst dich mit einem Gott an, Bewahrer, einem mächtigen Feind! Du brauchst einen Gegenstand mit der magischen Kraft des Schutzes. Ich glaube mich zu erinnern, dass Menschen vor einiger Zeit einen solchen Gegenstand besaßen."

[player_dragon12]//{~00~27
String="Die Ylsiden haben alle Menschen im Königreich gefangengenommen..."

[dragon_scenar12]//}~27
String="Ich weiß wenig über die Ylsiden, aber du solltest ihnen nicht Auge in Auge gegenüber treten, mein Freund. Versuche, listig zu sein - es ist schwer, gegen etwas zu kämpfen, das man nicht sieht."

[player_dragon14]//{~00~27
String="Ich suche das geheime Versteck der Anhänger Akbaas..."

[dragon_scenar14]//}~27
String="Du hast noch nicht alles versucht. Es ist Zeit für die letzte Konfrontation, mein Freund. Hier steht das Schicksal eines Mitglieds des Noden über allem anderen. Du musst all deinen Mut und deine Entschlossenheit bündeln. Nutze dein ganzes Wissen über den Feind, und vernichte ihn."

[player_dragon_ghost]//{~00~27
String="Der Geist einer Frau bat mich, ihren Tod zu rächen..."

[dragon_scenar15]//}~27
String="Geister sind gequälte Seelen, die nach dem Tod nicht ruhen dürfen. Oftmals reicht es, die Person zu finden, die sie getötet hat, oder Licht ins Dunkel zu bringen, um ihnen Frieden zu schenken."

