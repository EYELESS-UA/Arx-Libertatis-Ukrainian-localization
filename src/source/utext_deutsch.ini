[Rinco_busy]//~08
String="Ich bin sehr beschäftigt. Sprecht mit meinem Bruder!"
string2="Ich habe keine Zeit, mit Euch zu reden. Sprecht mit meinem Bruder!"
string3="Mein Bruder kann Euch vielleicht helfen. Ich bin zu beschäftigt."

[Rinco_cuscion_warning]//~08
String="Hey, Ihr da! Legt das sofort zurück, oder ich bringe Euch Manieren bei!"

[Rinco_note_touched]//~08
