///FGE
[Fallan_intro_1]//{~02~11~09@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Hört, ihr Wesen des Lichts, und lauscht dem, was ich zu sagen habe! Dies ist Arx, einst eine Stadt wie viele andere, stolz unter dem Antlitz der Sonne. Unser König Poxsellis war ein guter und gerechter Mann, der wusste, wie man in gelegentlichen Scharmützeln gegen die Goblins oder die Rattenmenschen vorging. Viele Jahre nach Poxsellis' Tod, im schlimmen Jahr 226, wurde unsere Sonne schwächer, und ewiger Winter kam über unsere Welt. Lunshire, der Sohn Poxsellis', entschied, dass ganz Arx in die Tiefe verlegt werden sollte - in eine der verlassenen Zwergenminen. Zu dieser Zeit lösten sich all die Konflikte der verschiedenen Rassen von Arx auf. Die Menschen, die Zwerge, die Trolle und die Goblins arbeiteten zusammen, um überleben zu können. Diese Übersiedlung in die Tiefe dauerte fünf Jahre, während derer die Sonne vollständig schwand. Jede der Rassen schuf sich eine neue Heimat in der Tiefe. Doch Stück für Stück glitten die Beziehungen zwischen ihnen zurück - dorthin, wo sie früher waren. Und heute klopft das Böse wieder an unsere Tore!"

[Fallan_intro_2]//~02@dying on the arghh, he's been killed from behind
String="Akbaa, der Gott der Zerstörung, ist dabei zu...argghhh!"

[human_guard_intro_1]//~09
String="Hey, Ihr! Stehen geblieben! Hier ist die Wache!"

// use generic guard deaths here

[human_guard_intro_2]//~09
String="Hier entlang! Schnell!"

[Carlo_intro_1]//~11
String="Lasst ihn nicht entkommen!"

[human_guard_intro_3]//~10
String="Wir kriegen dich!"

[human_guard_intro_4]//~09
String="In Ordnung! Er sitzt in der Falle!"

[carlo_intro_2]//}~11
