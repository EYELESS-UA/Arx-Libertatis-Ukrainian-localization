[Alia_alia_destiny_3]//~12 TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Genug! Kein Blutvergießen mehr! Ich werde Poxsellis' Wunsch respektieren. Ich weiß nicht, was der Orden von Edurneum mit mir im Sinn hat, aber es ist nicht an mir, über diesen Vertrag zu richten. Das Königreich hätte die Magierkriege ohne die Hilfe des Ordens niemals gewonnen, und nun müssen wir unsere Versprechen halten. Vater, ich akzeptiere dies. Ehre ist die höchste Tugend. Ich hoffe, wir sehen uns bald wieder, aber ich fürchte, für den Moment muss ich dich verlassen."

