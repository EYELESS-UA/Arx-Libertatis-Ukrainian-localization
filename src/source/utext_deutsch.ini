[Rinco_inn_come_misc]//~08
String="Kommt nur näher! Ich fühle, dass heute das Glück mit uns ist. Versucht es im Spiel, und geht mit Taschen voller Gold!"
string2="Jeder kann gewinnen und reich werden! Versucht Euer Glück!"
string3="Versucht es! Folgt Eurem Glücksstern, und gewinnt Kübel voller Gold!"

[Rinco_inn_greetings]//~08
String="Willkommen, Fremder! Mein Name ist Rinco. Bei mir könnt Ihr jede Menge Gold gewinnen! Die Spielregeln sind dort an der Wand angeschrieben."

[Rinco_inn_spin_misc]//~08
String="Dreht das Rad, bitte!"
string2="Und nun dreht das Rad!"
string3="Ihr könnt das Rad jetzt drehen."

[Rinco_inn_player_win_misc]//~08
String="Hoho, wir haben einen Gewinner! Hier ist Euer Gold. Das Glück ist auf Eurer Seite."
string2="Hey, ein Gewinner! Und hier ist Euer Gold!"
string3="Wir haben einen reichen Mann in unserer Mitte! Hier, nehmt Euer Gold!"

[Rinco_inn_player_loose_misc]//~08
string="Sicher habt Ihr das nächste Mal mehr Glück!"
string2="Nicht verzagen, das Glück ist heikel! Bald wird es Euch wieder lächeln!"

[Rinco_inn_loose_too_much]//~08
String="Hört, ich habe kein Gold mehr! Ihr habt für einen wie mich einfach zu viel Glück. Ich brauche mal 'ne Pause."

