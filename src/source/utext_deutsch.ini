[florence_affraid_traveler]//{~26~00
String="Ruuuhig, kommt näher! Kommt näher und hört mir gut zu! Habt keine Angst, Reisender, ich werde Euch nichts tun. Ich benötige Eure Hilfe und wäre Euch ewig dankbar dafür."

[florence_was_part_world]//~26~00
String="Im Leben war ich eine wichtige und einflussreiche Person... Und ich wurde ermordet. Ich habe den Mann gesehen, der es getan hat, aber ich weiß nicht, warum er es tat. Jetzt verlange ich Gerechtigkeit, da ich dazu verdammt bin, auf Erden zu wandeln, bis mein Tod gerächt ist."

[player_who_murderer]//~00
String="Wer ist Euer Mörder? Was genau soll ich für Euch tun?"

[florence_dont_remember]//~26
String="Es ist ein Mann mit nur einem Auge. Jemand muss ihm aufgetragen haben, es zu tun. Überbringt den Namen meines Mörders den Mächtigen von Arx, damit ich in Frieden ruhen kann..."

[player_who_are_you]//~00
String="Wer seid Ihr?"

[florence_reveal_later]//}~26
String="Vielleicht sollt Ihr das erfahren, wenn der Moment gekommen ist. Zuerst müsst Ihr mir helfen. Findet die Menschen, die für meinen Tod verantwortlich sind."

