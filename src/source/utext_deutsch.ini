[description_note_ellie]
string = "Dieser Brief ist für dich, die Frau meines Lebens, meine geliebte Ellie Rowse. Ich denke immerzu nur an dich, den ganzen Tag und die ganze Nacht ... Sonnenuntergänge, Brisen, all das erinnert mich an dich, selbst die anmutige Kälte der Höhlen. Wenn ich nur den Mut hätte, dir zu gestehen was ich für dich empfinde. Ich werde es tun ... Sobald meine Schicht endet, werde ich es tun. "


[description_book_cells]
string="Gefangenen Register"

[book_cells_content]
string = "Registrierung und Gefangene. ** Jahr 266, Woche der Ratte, Kriminelle :: ** ISOLATIONSZIMMER: ** Zelle 1: Mensch zu verkaufen. Hinweis: 'Schlechter Mensch auf Stufe 2 gefunden, er schläft, sehr seltsam. '* Zelle 2: Mensch zu verkaufen. Hinweis:' Azuk mir gebracht dies Mensch, ich nicht weiß, aber er sein kahler Mensch, lächerlich Mensch lecker ausguckt. '** AUSSTEHENDES URTEILZIMMER: ** Zelle 1: Schlechter Goblin 'Polsius', Anklage: Angriff und Gotteslästerung gegen Alotar. * Zelle 2: Goblin-Gefangener 'Bolson', Anklage: Mord an zwei Goblins - ich ihn getötet haben, Befehl des Königs. * Zelle 3: Goblin-Gefangener 'Zurok', Anklage: Böser Goblin , er sein Dieb. * Zelle 4: Menschlicher Gefangener, Anklage: unbefugter Zugriff auf verboten Kamera, er entkommen sein, König sehr wütend auf mich. * Zelle 5: menschlicher Gefangener, Anklage: böser Mensch angegriffen Koltor Freund, betrunkener gefährlicher Mensch jetzt in Zelle."



[note_aldaner]
string = "Boss, wir sein Menschen im Außenposten gefangen haben, Sekte dringende Bestellung gemacht, verkauft für 40 Goldmünzen. ** Toloneo."


[description_book_celly]
string="Gefangenen Bericht."

[book_celly_content]
string = "Jahr 266, sechster Tag der Woche der Ratten, Beweise und Anklageberichte für einen guten König :: ** Wir verkaufen ungefähr 3 Menschen ... Nein, ich reißen diese Seite ab und schreibe fantastisch Geschichte, aber zuerst Kuchen ich esse, du liest Bericht stink König ... Mir ist langweilig ... "


[description_book_color_code]
string = "Die Kunst der Magi: Schriftrollen von Enselme Tricher."


[book_color_code_content]
string = "Seit ihrer Entdeckung wurde die Magie auf die bestmöglichste Weise sowohl ergründet als auch interpretiert, um dem interessierten Magier ein tiefes und ausführliches Verständnis der Wahrnehmung selbiger zu offenbaren. Die Magie, die Sie im Begriff sind zu lernen, ist eine besondere Art der Kunst - es ist die Magie von Erduneum. ** Die Versiegelten Schriftrollen sind zur besseren Auseinanderhaltung mit unterschiedlich gefärbten Kordeln versehen, die ersichtlich machen, wie stark der darin enthaltene Zauberspruch ist. Der Farbcode ist folgendermaßen zu verstehen: Je höher die Stufe, desto höher die Wirksamkeit: ** Stufe 1: Grau. * Stufe 2: Gelb. * Stufe 3: Orange. * Stufe 4: Grün. * Stufe 5: Cyan. * Stufe 6: Rot. * Stufe 7: Lila. * Stufe 8: Dunkelblau. * Stufe 9: Braun. * Stufe 10: Schwarz. "



