[system_tutorial_10_bis2]
string = "Jetzt kannst du bis zu 5 Zauber vorbereiten!."

[system_tutorial_10_bis] //DELETE THIS IN VANILLA
string = "Gut gemacht! Beachtet, dass Ihr euch Zaubersprüche vorab ´merken´ könnt, um sie zu einem späteren Zeitpunkt wirken zu lassen. Um euch einen Zauberspruch zu merken, haltet beim wirken des Zaubers den 'SPRINT MODUS' (Standardtaste 'Shift') gedrückt, und lasst sie dann los. Die vorgemerkten Zauber werden dann am unteren linken Bildschirmrand neben eurer Lebensanzeige für euch sichtbar."


[system_tutorial_18] //DELETE THIS IN VANILLA
string = "Zieht den gesamten Stapel an Broten, indem Ihr selbigen auswählt während ihr die 'SPRINT-MODUS' Taste (Standardtaste 'Shift') gedrückt haltet, direkt in euer Inventar."


[system_tutorial_17] //DELETE THIS IN VANILLA
string = "Um einen Gegenstand oder einen Stapel von Gegenständen direkt in Ihr Inventar zu befördern, klickt mit der linken Maustaste auf das Objekt eurer Begierde, während Ihr die 'SPRINT-MODUS' Taste gedrückt haltet (Standardtaste 'Shift')."


[system_tutorial_2] //DELETE THIS IN VANILLA
string = "Klickt und zieht Objekte mittels eures Cursors, um sie zu verschieben. Um einen Gegenstand direkt in Ihr Inventar aufzunehmen, klickt mit der linken Maustaste auf das Objekt, während Ihr die 'SPRINT MODUS' Taste gedrückt haltet (Standardtaste 'Shift')."


