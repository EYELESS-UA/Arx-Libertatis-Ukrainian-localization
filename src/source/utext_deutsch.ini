// Player's quest gain access to Arx and meet the King //

[carlo_hello_stranger]//~11@introducing himself
String="Ich bin Carlo, Kommandant der Wache!"

[player_greetings_carlo]//{~00~11
String="Ich habe eine dringende Nachricht für den König!"

//** grassini new this line is triggered when the player is looking for the King for the first time.
[carlo_hello_stranger2]//~11
String="Seine Majestät König Lunshire ist im Thronsaal. Geht in die Festung und durch die Doppeltür der Säulenhalle. Dort findet Ihr den König!"

[carlo_find_king_misc]//~11
String="Der König ist im Thronsaal!"
string2="Geht in den Thronsaal, dort werdet Ihr den König finden!"
string3="Habt Ihr im Thronsaal nachgesehen?"

// Player talks to Carlo again //

[carlo_excuse_me]//~11
String="Bitte vergebt meinen Männern ihr grobes Gehabe! Sie sind gute Soldaten. Sie wollen nur sicherstellen, dass weder ein Goblin noch ein Ylside in die Festung gelangt."

[player_are_the_goblins]//~00
String="Sind die Goblins eure Feinde?"

[carlo_not_really]//~11
String="Nun, nicht wirklich. Wir tolerieren sie im Allgemeinen. Manchmal brauchen wir sie für den Edelsteinhandel. Weiter gehen unsere Beziehungen jedoch nicht."

[player_what_about_ylside]//~00
String="Und was ist mit den Ylsiden?"

[carlo_know_nothing]//}~11
String="Jedes Mal, wenn wir mehr über sie herausfinden, bezahlen wir teuer mit Menschenleben. Sie sind gewaltige Kämpfer, stark und ohne Gnade! Wir müssen wachsam sein, sie sind gefährliche Gegner unseres Reiches!"

[carlo_sorry_no_time_misc]//~11
String="Tut mir wirklich Leid, ich habe keine Zeit für Euch!"
string2="Habe leider keine Zeit! Ich muss die Verteidigung einer ganzen Festung planen!"
string3="Tut mir Leid, ich bin derzeit mit der Verteidigungsplanung beschäftigt!"

// Player knows about the rituals //

[player_any_news_misc]//{~00~11
String="Könnt Ihr mir etwas über die Rituale sagen?"

[carlo_no_am_shaggar]//}~11
String="Nein, Am Shaegar! Keine Neuigkeiten!"
string2="Nein, Am Shaegar! Es gibt nichts, was Ihr nicht schon wisst!"
string3="Ich sagte Euch bereits alles, was ich weiß, Am Shaegar!"

// Player needs to enter the crypt after scenario point 8

[player_need_enter_crypt]//{~00~11
String="Ich muss meine Nachforschungen in der Krypta fortsetzen. Würdet Ihr die Tür für mich öffnen?"

[carlo_here_the_key]//}~11
String="Ich gebe Euch einen Schlüssel zur Krypta. Aber seid vorsichtig! Sie ist ein sehr gefährlicher Ort. Mögen die Götter Euch beschützen!"

// player shows calpale journal to Carlo //

[player_carlo_murderer]//{~00~11
String="Carlo, Ihr müsst die Verantwortung für Eure Verbrechen übernehmen!"

[carlo_damn]//~11
String="Mein Gott, wo habt Ihr das gefunden?"

[player_carlo_accusation]]//~00
String="Das ist unwichtig. Gesteht Ihr es ein?"

[carlo_yes]//~11
String="Ja, das gebe ich zu! Aber ich tat alles nur für das Königreich! Ich fand heraus, dass die Königin einem Geheimorden angehörte - dem Orden des Geheiligten Dolches!"

[player_carlo_best_solution]//~00
String="Und Ihr wart der Meinung, dass der Tod der Königin die beste Lösung wäre? Dachtet Ihr nie daran, dem König zu berichten, was Ihr entdeckt habt?"

[carlo_dont_know]//~11
String="Manchmal tut die Wahrheit mehr weh als eine Lüge. Ich glaube, der König wäre vor Gram gestorben, hätte er gewusst, dass seine Frau ihn töten lassen wollte. Hier, nehmt diesen Brief! Dann werdet Ihr besser verstehen, was ich meine!"

[carlo_regret]//}~11
String="Ich hoffe, der König wird mir vergeben können. Ich tat alles nur für ihn."

