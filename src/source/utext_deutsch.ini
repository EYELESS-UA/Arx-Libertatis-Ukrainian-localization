// Human_Enoill_Calpale //
////////////////////////////

///FGE
[calpale_greetings_player]//{~07~00
String="Hey da! Ihr seht einsam aus. Kommt herüber und trinkt etwas, entspannt Euch! Ich bin Enoill Calpale, und das hier ist mein Lieblingsrattenloch. Nun, warum erzählt Ihr nicht ein bisschen von Euch?"

[player_calpale_well_actually]//~00
String="Ich habe Probleme mit meiner Erinnerung. Kannst du mir sagen, wer ich bin?"

///FGE
[calpale_i_cant]//~07
String="Haha, Ihr seid eine gutmütige Seele! Verzeihung, Freund, aber ich habe Euch noch nie zuvor gesehen. Kennt Ihr hier niemanden? Vielleicht wart Ihr einer aus der Gilde der Reisenden, und irgendetwas Schreckliches kam über Euch. Dann seid Ihr wie betäubt umhergewandert. Oder ein Schurke zog Euch eins über den Kopf und klaute Eure Börse. Wer weiß?"

[player_calpale_then_what]//~00
String="Nun gut! Dann erzähl mir etwas über diesen Ort!"

///FGE
[calpale_ok_we]//~07
String="Nun, das hier ist eine Taverne. Leute kommen herein, um zu trinken und zu nörgeln. Aber vielleicht meint Ihr mehr als nur diesen Ort. Euch muss ja wirklich was auf den Kopf gefallen sein. Wir leben hier unten in diesen alten Minen, weil vor einigen Jahren unsere Sonne verlosch und die Oberwelt als gefrorene Einöde zurückblieb."

[player_calpale_how_many]//~00
String="Wie viele Leute leben hier? Und wo kann ich diese Gilde der Reisenden finden, zu der ich angeblich gehöre?"

///FGE
[calpale_i_dont_know]//~07
String="Ah, ich bin nicht sicher, wie viele von uns hier herabgestiegen sind. Außer uns Menschen sind da noch die Goblins, die Zwerge, die Trolle. Und dann gibt es noch verschiedene Gruppen unter ihnen - schwer zu überblicken. Und die Gilde der Reisenden, das sind zähe Bastarde! Sie halten zwischen uns und den anderen Städten die Nachrichten- und Handelswege offen. Es sind verdammt weite Strecken, und wir sehen sie nicht sehr oft; auch die anderen Gruppen nicht."

[calpale_come_back_misc]//~07
String="Lasst Euch doch ab und zu mal wieder blicken!"
string2="Wenn Ihr mich braucht, ich bin immer hier!"
string3="Ihr wisst ja, mich findet Ihr immer hier!"

//** grassini new I think Calpale, as a bit of an expert in dodgy dealings, should at least know something about the door in the tavern...

[player_calpale_password]//~00
String="Was befindet sich hinter der Metalltüre in der Taverne?"

///FGE
[calpale_player_password]//~07
String="Da haben sich ein paar ziemlich üble Kerle zusammengerottet. Ich hab einen weiten Bogen um sie gemacht, und das solltet Ihr auch tun, Freund!"

// Player knows queen has been murdered //

[player_calpale_about_woman]//~00
String="Enoill, ich muss mit dir über den Mord an einer bestimmten Frau reden!"

///FGE
[calpale_what_do_you]//~07
String="Was fragt Ihr mich? Ich habe nichts zu sagen, also verschwindet!"

///FGE
[player_calpale_seem_annoyed]//~00
String="Hör zu, Einauge! Ich werde dich nicht noch mal fragen!"

[calpale_pleaset_leave_misc]//~07
String="Verschwindet! Ihr... Ihr wisst nicht, was ihr da sagt!"
string2="Geht mir von der Pelle, ja? Ich sagte Euch schon, ich weiß nichts darüber!"
string3="Haut ab! Ich hab keine Lust, mit Euch zu reden. Also fort mit Euch!"

[calpale_some_beer]//~07
String="Bier! Ich brauch noch mehr Bier! Tizzy!"

// Player shows Calpale's journal //

[player_calpale_ring_bell]//~00
String="Also, hilft dir dies, dich an etwas zu erinnern?"

[calpale_mister_detective]//}~07
String="Seht mal, wie würdet Ihr... Ach, egal! Ich bin nur angeheuert. Sie zahlten mich, ich tat meinen Job. So einfach ist das. Aber gebt lieber acht, wem ihr davon erzählt! Es gibt Leute, die wären wirklich sauer, wenn das ans Licht käme!"

