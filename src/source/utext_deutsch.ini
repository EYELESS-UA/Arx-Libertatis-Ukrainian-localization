String="Und wenn es eine Verbindung zwischen diesen Runen und den Symbolen gibt, die ich auf dem Boden sah, bevor ich hierher kam?"

[Gladivir_ecourage]//~25@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Oh ja, sehr gut. Ihr seid auf dem richtigen Weg. Jetzt legt jeden Ehrenstein passend zu den Häusern an die richtige Stelle!"

