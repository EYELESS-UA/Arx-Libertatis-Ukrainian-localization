// system spell descriptions

[system_spell_description_magic_sight]
string="Verbessert die Sicht des Zaubernden."

[system_spell_description_magic_projectile]
string="Kampfzauber."

[system_spell_description_ignit]
string="Entzündet brennbare Materialien wie Fackeln innerhalb eines begrenzten Wirkungsbereiches."

[system_spell_description_douse]
string="Erstickt brennende Materialien - kann sogar Angriffen mit Feuer entgegenwirken."

[system_spell_description_activate_portal]
string="Die Edurneum-Portale müssen mit diesem Zauberspruch aktiviert werden."

[system_spell_description_heal]
string="Heilt innerhalb eines begrenzten Wirkungsbereiches um den Zaubernden. Achtung: Auch Gegner werden geheilt!"

[system_spell_description_harm]
string="Erzeugt eine Aura des Schmerzes innerhalb eines begrenzten Wirkungsbereiches um den Zaubernden."

[system_spell_description_detect_trap]
string="Warnt vor Fallen und Gefahren."

[system_spell_description_armor]
string="Verbessert die Rüstungsklasse."

[system_spell_description_curse]
string="Verschlechtert Stärke, Genauigkeit, Konstitution und Intelligenz."

[system_spell_description_lower_armor]
string="Verschlechtert die Rüstungsklasse."

[system_spell_description_speed]
string="Erhöht die Geschwindigkeit."

[system_spell_description_reveal]
string="Zerstreut Illusionen und Unsichtbarkeit."

[system_spell_description_fireball]
string="Erzeugt ein Geschoss aus Feuer."

[system_spell_description_create_food]
string="Erzeugt eine Aura der Speisung, um Hunger zu besiegen."

[system_spell_description_Ice_projectile]
string="Erzeugt einen Kältestrahl, der Gegner vereist und verletzt."

[system_spell_description_sanctify]
string="Verbessert Stärke, Genauigkeit, Konstitution und Intelligenz."

[system_spell_description_dispell_field]
string="Hebt gegenerischen Schutzzauber auf."

[system_spell_description_Fire_protection]
string="Vermindert die Schadenswirkung von Feuerangriffen und Hitze."

[system_spell_description_Cold_protection]
string="Vermindert die Schadenswirkung von Eisangriffen und Kälte."

[system_spell_description_telekinesis]
string="Ermöglicht dem Zaubernden, entfernte Gegenstände zu heben und zu benutzen."

[system_spell_description_rune_guarding]
string="Eine Falle wird herbeigezaubert, die nur für denjenigen sichtbar ist, der diesen Zauber gewirkt hat."

[system_spell_description_levitate]
string="Erlaubt dem Zaubernden, über den Boden zu schweben."

[system_spell_description_ice_field]
string="Erzeugt eine Barriere aus Eis vor dem Zaubernden."

[system_spell_description_paralyse]
string="Lähmt einen Gegner."

[system_spell_description_cure_poison]
string="Heilt Vergiftungen innerhalb eines begrenzten Wirkungsbereiches um den Zaubernden. Achtung: Auch Gegner werden geheilt!"

[system_spell_description_repel_undead]
string="Einige Untote fliehen beim Anblick des Zaubernden."

[system_spell_description_poison_projection]
string="Erzeugt eine Wolke aus giftigem Gas."

[system_spell_description_slowdown]
string="Verringert die Geschwindigkeit eines Gegners."

[system_spell_description_raise_dead]
string="Ruft einen Untoten herbei. Achtung: Dieser Spruch wirkt nur auf einem Untergrund aus Erde."

[system_spell_description_create_field]
string="Wirkt einen Schutzzauber."

[system_spell_description_disarm_trap]
string="Entschärft jede Falle innerhalb eines begrenzten Wirkungsbereiches um den Zaubernden."

[system_spell_description_flying_eye]
string="Gibt dem Zaubernden die Kontrolle über ein unsichtbares Auge, um ungesehen andere Orte erforschen zu können."

[system_spell_description_fire_field]
string="Erzeugt eine Barriere aus Feuer vor dem Zaubernden."

[system_spell_description_Lightning_strike]
string="Erzeugt einen Blitz."

[system_spell_description_confuse]
string="Verwirrt den Gegner."

[system_spell_description_invisibility]
string="Macht eine Person unsichtbar. Der Spruch verliert seine Wirkung, wenn der Zaubernde versucht, anzugreifen, etwas zu benutzen/aktivieren, oder sich mit einem Objekt auszurüsten."

[system_spell_description_mana_drain]
string="Entzieht innerhalb eines begrenzten Wirkungsbereiches um den Zaubernden anderen Personen Mana."

[system_spell_description_life_drain]
string="Entzieht innerhalb eines begrenzten Wirkungsbereiches um den Zaubernden anderen Personen Lebenskraft."

[system_spell_description_explosion]
string="Richtet innerhalb eines begrenzten Wirkungsbereiches um den Zaubernden beträchtlichen Schaden an."

[system_spell_description_enchant_weapon]
string="Stattet ein Objekt mit magischen Eigenschaften aus - abhängig von den reaktiven Substanzen in der Nähe des Objektes."

[system_spell_description_summon_creature]
string="Ruft einen Dämon herbei. Achtung: Das Verhalten eines solchen Dämons ist unberechenbar!"

[system_spell_description_negate_magic]
string="Unterdrückt jegliche Magie innerhalb eines begrenzten Wirkungsbereiches um den Zaubernden."

[system_spell_description_incinerate]
string="Erzeugt eine Brandwelle."

[system_spell_description_mass_paralyse]
string="Erzeugt eine lähmende Frostwelle."

[system_spell_description_mass_lightning_strike]
string="Um den Zaubernden herum entstehen Blitze."

[system_spell_description_control_target]
string="Der Zaubernde kann über einen Dämon gebieten. Aber: Nur beschworene Dämonen können auf diese Weise kontrolliert werden."

[system_spell_description_freeze_time]
string="Für alle außer dem Zaubernden vergeht die Zeit langsamer."

[system_spell_description_mass_incinerate]
string="Verbrennt alle Kreaturen innerhalb eines begrenzten Wirkungsbereiches um den Zaubernden."

// quest log goals

[system_Quest_log_escape_gobs]
string="Ich fand mich in diesem Goblin-Gefängnis wieder. Ich muss hier unbedingt ausbrechen und herausfinden, wer ich bin."

// newlog
[system_Quest_log_escape_gobs_done]
string="Ich habe es geschafft, dem Goblin-Außenposten zu entfliehen, aber ich weiß noch immer nicht, wer ich bin und wie ich hierher komme..."

[system_Quest_log_gob_authorization]
string="Der Goblin-Lord, der diese zweite Ebene der Goblins bewacht, will von mir eine schriftliche Erlaubnis und eine Edelsteinhändler-Lizenz sehen."

// newlog
[system_Quest_log_gob_authorization_done]
string="Ich habe den Goblin-Lord passiert, der das Gebiet des Goblin-Königreichs bewacht."

[system_Quest_log_message_ortiern]
string="Ich muss zum König von Arx und ihm die Nachrichten vom Außenposten der Menschen überbringen."

[system_Quest_log_greu_gift]
string="Habe heute einen Troll getroffen. Er möchte mich zum Freund, will aber ein Geburtstagsgeschenk von mir haben..."

// newlog
[system_Quest_log_greu_gift_done]
string="Ich habe Greu ein Buch gebracht. Er freute sich und gab mir ein Troll-Amulett. Habe wohl seit heute einen neuen Freund."

[system_Quest_log_fallen_rocks]
string="Der König bat mich, Pog, dem König der Trolle, eine Nachricht zu überbringen. Er soll mit seinen Leuten die Felsen von der Passage zum Außenposten wegschaffen."

[system_Quest_log_troll_idol]
string="Den Trollen wurde ein Götze gestohlen. Sie wollen mir nicht helfen, bevor sie dieses Objekt nicht wiederhaben. Ich sollte das Gebiet der Goblins danach absuchen."

//newlog
[system_Quest_log_troll_idol_done]
string="Die Passage zum Außenposten der Menschen sollte nun wieder frei sein."

[system_Quest_log_rituals]
string="In letzter Zeit gab es in der Gegend der Festung Opferrituale. Der König möchte, dass ich mehr darüber herausfinde. Vielleicht hat das etwas mit dem Mord an Falan Orbiplanax zu tun. Ich muss die Leute im Königreich befragen."

[system_Quest_portal]
string="Chinkashh hat mir einen geheimen Zauberspruch verraten, mit dem man durch die Tore von Edurneum teleportieren kann: Mega Spacium."

[system_Quest_log_shanny]
string="Marias Tochter Shany ist verschwunden. Maria bat mich, nach ihr zu suchen. Sie könnte in Gefahr sein."

//newlog
[system_Quest_log_shanny_done]
string="Shany ist in Sicherheit. Ich fand sie rechtzeitig, bevor man sie opfern konnte."

[system_Quest_log_access_temple]
string="Ich sollte mich jetzt nach dem geheimen Zugang zum Akbaa-Tempel umsehen, damit ich den Meteor zerstören kann."

[system_Quest_log_know_password]
string="Erzog erzählte mir, der Akbaa-Tempel liege unterhalb der Taverne, und er gab mir ein geheimes Wort, um den Zugang zu finden."

[system_Quest_log_destroy_meteor_for_good]
string="Der Meteor widerstand meinem Angriff. Er ist stärker, als ich erwartet habe. Ich muss zu Felnor gehen und ihm beschreiben, was passiert ist."

[system_Quest_log_krahoz_zohark]
string="Ich benötige den Zohark und den Krahoz, um den Meteor daran zu hindern, meinem Körper Mana zu entziehen. Dies ist die einzige Möglichkeit, den Meteor zu zerstören und Akbaa daran zu hindern, sich in Arx zu manifestieren."

[system_Quest_log_krahoz]
string="Der Krahoz wurde von einer Gruppe Rebellen gestohlen - von den gleichen Leuten, welche die Königin töteten und die Tochter des Königs entführten. Ich muss sie finden."

[system_Quest_log_zohark]
string="Der Zohark wird vom Orden von Edurneum bewacht. Ich muss bei ihnen anklopfen. Sicher werden sie die Wichtigkeit meiner Mission verstehen."

[system_Quest_log_Shield]
string="Ich begegnete dem Mädchen, das ich im Akbaa-Tempel gerettet hatte. Ich war überrascht, als ich erfuhr, dass sie die Anführerin der Rebellen ist. Aber das ist nicht wichtig. Sie wird mir den Krahoz geben, wenn ich einen Schild für sie finde. Er heißt 'Schild der Ahnen' und soll in der zweiten Ebene der Krypta liegen."

//newlog
[system_Quest_log_Shield_done]
string="Ich habe den mächtigen 'Schild der Ahnen' gefunden."

//newlog
[system_Quest_log_mythril_done]
string="Die Absolute Waffe ist nun mein."

//newlog
[system_Quest_log_krahoz_done]
string="Ich habe den Krahoz."

//newlog
[system_Quest_log_zohark_done]
string="Ich habe den Zohark."

[system_Quest_log_Meteor_time]
string="Jetzt, da ich den Krahoz und den Zohark habe, ist es für mich an der Zeit, zum Akbaa-Tempel zurückzukehren, und diesen Meteor ein für alle Mal zu zerstören."

[system_Quest_log_Meteor_destroyed]
string="Der Meteor ist zerstört - Akbaas Plan ist durchkreuzt. Aber Sylib Nurath hat mich seltsamerweise nicht in den Noden zurückgerufen. Ich muss ins Königreich zurückkehren und selbst einen Weg finden."

[system_Quest_log_save_kingdom]
string="Die Leute von Arx wurden von den Ylsiden gefangen genommen. Ich muss zum Gefängnis und nachsehen, was da los ist, bevor ich Arx verlassen, und in den Noden zurückkehren kann."

[system_Quest_log_super_weapon]
string="Das Königreich ist gerettet, Iserbius' List hat versagt. Nun weiß ich, warum ich nicht in den Noden zurückgerufen wurde: Meine Mission ist noch nicht beendet. Akbaa hat genügend Zeit gefunden, Kräfte anzusammeln, ehe ich den Meteor zerstören konnte. Dennoch ist es gut so, da Akbaa nicht so stark werden konnte, wie er erwartet hatte. Im Moment dürfte er mit Iserbius verschmelzen. Das ist ein langer Prozess, und die meisten Waffen werden währenddessen wirkungslos gegen ihn sein. Ich muss die Absolute Waffe schmieden, bevor ich ihm gegenübertreten kann."

[system_Quest_log_mythril]
string="Das Buch der Absoluten Waffe beschreibt, dass ich sie aus Mithril herstellen muss, da dies das einzige Metall ist, das sich mit fremden Legierungen wie Koltk-Pulver verbindet. Hoffentlich stimmt das auch."

[system_Quest_log_Dragon_egg]
string="Ich muss ein Drachenei finden, um einen Zauber über die Waffe sprechen zu können."

[system_Quest_log_final_meeting]
string="Die Zeit ist für mich gekommen, meine Mission zu erfüllen: Ich muss zum Bunker der Ylsiden gehen und Iserbius vernichten... Oder sollte ich besser sagen: Akbaa?"

[system_Quest_log_key_bank]
string="Ich fand einen versiegelten Schlüssel in Alicias Haus. Wenn ich nur einen Weg fände einen Zauber darüber zu sprechen, könnte ich eine Nachbildung des Schlüssels anfertigen..."

//newlog
[system_Quest_log_key_bank_done]
string="Ich habe eine Nachbildung des Schlüssels aus Alicias Haus angefertigt..."

[system_Quest_log_olivier]
string="Ich hörte in der Taverne ein Gerücht über eine Schatzjagd, die von einem Einsiedler namens Oliver organisiert wurde. Offenbar beginnt man die Jagd, indem man einen Smaragd in seine Kiste wirft."

//newlog
[system_Quest_log_olivier_done]
string="Ich habe das Rätsel der von Oliver organisierten Schatzjagd gelöst."

[system_Quest_log_Florence]
string="Ich bin heute dem Geist einer Frau begegnet. Sie bat mich, die Schuldigen an ihrem Tod zu finden. Sie war einmal eine wichtige Person in Arx. Sie sagte, ihr Mörder besäße nur ein Auge."

//newlog
[system_Quest_log_Florence_done]
string="Das Geheimnis des Geistes ist gelöst. Carlo war der Urheber des Mordes an Königin Florence."

[system_Quest_log_dragon_scale]
string="Wie viele Schuppen mag ein Drache haben? Ich muss Informationen darüber finden."

[system_Quest_water_clan]
string="Der Wasser-Clan der Goblins will, dass ich die Leute des Erd-Clans umbringe. Als Lohn dafür soll ich einen magischen Gegenstand erhalten."

//newlog
[system_Quest_water_clan_done]
string="Ich habe den Erd-Clan ausgelöscht."

[system_Quest_earth_clan]
string="Der Erd-Clan der Goblins will, dass ich die Leute des Wasser-Clans umbringe. Als Lohn dafür soll ich Gold aus ihrem Schatz erhalten."

//newlog
[system_Quest_earth_clan_done]
string="Ich habe den Wasser-Clan ausgelöscht." 

[system_not_enough_gold]
string="Dafür habe ich nicht genug Gold."

//Jowood version 
[player_dbldmg]
String="DOPPELTER SCHADEN!!!!"

//Jowood version 
[player_backstab]
String="STICH VON HINTEN !!!!"


