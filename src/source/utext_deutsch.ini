String="Habt Ihr Euer Gedächtnis verloren? Hört diesen Schwur, den einzigen Pakt, der zwischen unseren beiden Völkern von Poxsellis, Eurem Vater, geschlossen wurde: 'Im Namen des Königreiches übereigne ich, König Poxsellis, König von Arx, meine vierte direkte Nachfahrin dem Orden von Edurneum. Als Gegenleistung soll der Orden das Königreich mit dem Krahoz und dem Zohark beschützen.' Dieses Kind wurde uns versprochen, Lunshire. Lasst sie mit uns gehen, oder bereitet Euch auf Euren Tod vor!"

