[Akbaa_dream_2]//~23@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Bewahrer! Nichts kann meine Inkarnation auf Arx jetzt noch verhindern! Es ist schon viel zu spät! Warum sollten wir uns also bekämpfen? Schließ dich mir an! Auch du bist ein Gefangener des Noden, und ich allein kann dich befreien. Sehnst du dich nicht nach Freiheit? Warum ein Gefangener des Noden bleiben, wenn wir wie Götter über diese Welt herrschen können? Sei mein Verbündeter, Bewahrer, und ich verspreche dir Zugang zu Mächten weit jenseits deiner Vorstellungskraft!"

