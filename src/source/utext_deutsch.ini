[system_charsheet_strength]
string="Stärke. Bestimmt Ihren Schadensbonus in Kämpfen und Ihr Geschick im Umgang mit schweren Waffen. Stärke hat Einfluss auf Objektwissen, Nahkampf und Fernwaffen."

[system_charsheet_intel]
string="Intelligenz. Bestimmt Ihre Mana-Reserven (magische Energie) und Ihre magische Widerstandskraft. Intelligenz hat Einfluss auf Astralverbindung, Magie, Fingerfertigkeit, Sinnesschärfe und Objektwissen."

[system_charsheet_consti]
string="Konstitution. Bestimmt Ihre Lebenspunkte, Ihre Resistenz gegenüber Giften und Ihre Fähigkeit, schwere Rüstungen zu tragen. Konstitution hat Einfluss auf die Verteidigung."

[system_charsheet_mecanism]
string="Fingerfertigkeit. Dies bestimmt Ihre Fertigkeiten im Öffnen verschlossener Türen und Entschärfen von Fallen."

[system_charsheet_intuition]
string="Sinnesschärfe. Eine Art sechster Sinn, der es Ihnen gestattet, versteckte Dinge wie Geheimgänge oder Fallen zu finden. Sinnesschärfe verbessert ebenso Ihr Geschick fürs Verhandeln, so dass Sie bessere Geschäfte abschließen."

[system_charsheet_etheral_link]
string="Astralverbindung. Dies warnt Sie vor feindlichen Kreaturen und gibt Ihnen während eines Kampfes Informationen über die Verfassung Ihres Gegners. Diese Fähigkeit bestimmt ebenso die Geschwindigkeit, mit der Sie Mana zurückgewinnen."

[system_charsheet_objknoledge]
string="Objektwissen. Dies wird für Aktionen wie Reparaturen, das Brauen von Tränken, das Vergiften von Waffen und das Identifizieren von Objekten benötigt."

[system_charsheet_casting]
string="Magie. Diese Fähigkeit gibt Ihnen auf die verschiedenen Zauberspruchstufen Zugriff. Es gibt zehn Zauberspruchstufen. Diese Fertigkeit bestimmt ebenso Ihre Fähigkeit, sich vor Magie zu schützen."

[system_charsheet_projectile]
string="Fernwaffen. Gewährt Ihnen Boni für Treffer und Schaden, wenn Sie mit einer Distanzwaffe kämpfen."

[system_charsheet_closecombat]
string="Nahkampf. Gewährt Ihnen Boni für Treffer und Schaden, wenn Sie eine Nahkampfwaffe benutzen."

[system_charsheet_defense]
string="Verteidigung. Dies beeinflusst Ihr Geschick in der Benutzung eines Schildes, erhöht Ihre Rüstungsklasse und vermindert den Schaden, der Ihnen während eines Kampfes zugefügt wird."

