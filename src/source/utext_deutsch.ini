/////////////////////////////

///FGE
[Sylib_briefing_1]//{~24~00@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Willkommen, Bewahrer! Erlaubt mir, Euch Eure nächste Mission zu erklären! Ihr kennt die Regeln des Noden, der Dimension der Götter und Dämonenprinzen. Kein Wesen der Macht darf diese Dimension verlassen. Aber Akbaa bereitet sich darauf vor, in eine Welt namens Arx einzufallen. Eine Gruppe seiner Anhänger ist dabei, ihn zu erwecken. Ihr wisst, dass das nicht geschehen darf. Wir können Akbaa von hier aus nicht bekämpfen, da wir Göttern nichts anhaben können. Somit schicken wir Euch, um den Kult derer, die ihn anbeten, zu zerschlagen. Ohne die Vergötterung seiner Anhänger wird sich seine Macht auf ein akzeptables Maß verringern!"

[player_noden_briefing_1]//~00@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Ich werde diesen Kult vernichten, Meister!"

///FGE
[Sylib_briefing_2]//~24@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Dies wird keine leichte Aufgabe. Für diese Mission verleihen wir Euch eine spezielle Fähigkeit, die es Euch ermöglicht, den Koltk-Stein zu vernichten, der mit Akbaas Macht verknüpft ist. Er kann durch Sterbliche nicht zerstört werden. Dieser Fels ist der Ursprung des Problems, da er die Energien von Akbaas Anhängern kanalisiert. Bald wird Akbaa über genug Energie verfügen, um seine Wiedergeburt auf Arx zu ermöglichen."

[player_noden_briefing_2]//~00@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Ich verstehe, Meister! Werde ich in Arx einen Kontakt haben?"

///FGE
[Sylib_briefing_3]//~24@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Euer Kontakt erstarb während der Übermittlung dieser Nachricht. Wenn Ihr dort ankommt, müsst Ihr Euch allein zurechtfinden! Das ist überaus problematisch, da sich der Schock der Passage verheerend auf das Gedächtnis eines Bewahrers auswirkt. Es kann sein, dass Ihr für kurze Zeit desorientiert seid, bevor Ihr Euch wieder an dieses Gespräch erinnern könnt. Aber es gibt keinen anderen Weg!"

//** grassini not the right character
[Sylib_noden_briefing_4]//}~24@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Bereitet Euch vor, Ihr werdet bald Eure Reise antreten! Ich werde Euch zurückholen, wenn Ihr Eure Mission erfüllt habt!"

