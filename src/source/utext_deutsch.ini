[Sylib_noden_1]//~24@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Schon wieder einer! Warum sind die Unsterblichen nie zufrieden mit ihrer eigenen Dimension? Aber darin liegt wohl unsre immerwährende Pflicht: Sicherzustellen, dass das allumfassende Gleichgewicht erhalten bleibt. Wo liegt der Ursprung des Energiekanals?"

///FGE
[Noden_servant_2]//~06@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Eine ansonsten bedeutungslose Welt namens Exosta. Der Bittsteller verstummte, bevor er die Kommunikation beenden konnte. Was sollen wir tun, Herr?"

[Sylib_noden_2]//}~24@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Lasst uns einen Bewahrer schicken!"

