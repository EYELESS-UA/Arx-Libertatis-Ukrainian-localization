[Iserbius_welcome]
string="Je sais qui vous êtes et pourquoi vous êtes là, gardien ! Orbiplanax a donc eu le temps de contacter le Noden. J'aurais dû lui régler son compte plus tôt. Mais votre présence ici est un grand encouragement pour nous. Cela prouve que nous avons enfin le pouvoir de faire venir Akbaa ici, qu'il est plus puissant que jamais... Je vais d'ailleurs vous donner un aperçu de son pouvoir... Quand à nous deux, ma chère, nous continuerons cette cérémonie plus tard..."

[Iserbius_incantation]
string="In raaa Nikaaa dum Raanima."

