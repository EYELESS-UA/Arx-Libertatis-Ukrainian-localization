[Noden_servant_1]
string="Seigneur, nous avons localisé un flux d'énergie..."

[Sylib_noden_1]
string="Encore... Pourquoi les Dieux ne se contentent jamais de rester dans leur propre dimension... Bien, après tout nous sommes là pour ça : faire en sorte que l'équilibre des univers ne soit pas perturbé. Où mène le canal de puissance ?"

[Noden_servant_2]
string="Il provient d'une petite planète nommée Exosta. Nous avons reçu un appel à l'aide de l'un de ses habitants qui est mort pendant la communication. Que devons-nous faire, seigneur ?"

[Sylib_noden_2]
string="Envoyons un Gardien..."

////////////////////////////////
//      Noden briefing           //
/////////////////////////////

[Sylib_briefing_1]
string="Bienvenue Gardien. Laissez-moi vous expliquer votre prochaine mission. Vous connaissez les règles du Noden, la dimension des dieux et des princes-démons. Aucun être de puissance n'est autorisé à quitter cette dimension. Mais Akbaa prépare son évasion vers un lieu nommé Arx, dans une autre dimension. Un groupe d'adeptes est en train d'essayer de l'invoquer. Vous savez que ceci ne doit pas être. Nous ne pouvons pas lutter contre Akbaa d'ici car nous ne pouvons rien imposer aux Dieux. Nous allons donc vous envoyer détruire ce culte qui croit en lui, car privé d'adoration, sa puissance déclinera jusqu'à un point acceptable..."

[player_noden_briefing_1]
string="Je détruirai ce culte, maître."

[Sylib_briefing_2]
string="Ce ne sera pas si simple. Pour cette mission nous allons vous conférer un pouvoir spécifique pour détruire la roche de Koltk raccordée au pouvoir d'Akbaa. Elle est indestructible pour le commun des mortels. Cette roche est la source du problème car elle canalise l'énergie envoyée par les adeptes vers Akbaa. Et bientôt Akbaa disposera d'assez d'énergie pour assurer son transfert vers Arx."

[player_noden_briefing_2]
string="Je comprends, maître... Aurai-je un contact sur Arx ?"

[Sylib_briefing_3]
string="Votre contact est mort lors de la transmission de son message. Il faudra vous débrouiller par vos propres moyens. Cela est néanmoins fâcheux car le choc du transfert est désastreux pour la mémoire d'un gardien. Vous serez désorienté un moment avant de recouvrer toute votre mémoire et de vous souvenir de notre conversation. Mais nous n'avons pas le choix..."

// pas le bon personnage
[Sylib_noden_briefing_4]
string="Soyez prêt pour votre transfert. Je vous ramènerai lorsque vous aurez accompli votre tâche..."

