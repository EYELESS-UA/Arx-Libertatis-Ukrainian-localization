[note_garrett_content]
string="Il y a un nouvel ordre de Garrett, une gemme spéciale est enterrée dans les catacombes gobelines, sois prudent dans la prison, ne les laisses pas t'avoir ou tu ruinerais les plans."

[note_expedit_content]
string="Six jours se sont déjà écoulés et je crains que l'expédition ait échouée, après ce qu'il nous en a coûté pour s'introduire dans ces ruines, le risque en vaut le détour. Nous avons découvert un camp de gobelins près du point d'expédition, il y a aussi ces rats ennuyeux, nous devons être prudent."

[note_exgob_content]
string="Toi entré ici, toi être voleur, toi pourrir avec les vers. Ici ta poubelle, moi misérable et pauvre gobelin, moi espère voleur jamais mendier nourriture comme moi."

[note_immersives_content]
string="Durant l'expédition nous avons trouvé un coffre antique, malheureusement il était vide et pesait une tonne mais il était fonctionnel, donc j'ai gardé quelques provisions dedans. L'ouvrir était simple, deux des chiffres étaient déjà gravés à l'arrière, le troisième est illisible cependant ça ne devrait pas poser problème."

