////////////

[felnor_greetings]
string="Je suis Felnor, alchimiste du royaume et ami du regretté Falan Orbiplanax." 

[player_felnor_falan]
string="Qui était Falan Orbiplanax ?"

[felnor_greetings2]
string="Falan était notre astronome. Il est mort il y a quelques jours. Je pense qu'il était sur le point de mettre à jour une terrible machination. Mais il n'a pas eu le temps de m'en dire plus..."

[felnor_laboratory_generic]
string="Jetez un coup d'oeil, pendant que je travaille..."
string2="Si vous trouvez quelque chose d'intéressant dans mon laboratoire, n'hésitez pas à vous servir."

// lors de l'enquête sue falan et les rituels
[player_felnor_falan2]
string="J'enquête sur les rituels et la mort de Falan Orbiplanax"

[felnor_falan]
string="Tout ce que je peux vous dire, c'est que ces deux choses sont liées... J'ai ici une note que Falan m'a donné le jour de sa mort au cas où quelque chose se passerait mal. Je n'ai pas vraiment réussi à comprendre ce qu'elle signifiait, peut-être le pourrez-vous..."

[felnor_keep_looking_weapon]
string="Il faut vous occuper de cette fameuse arme, Gardien..."

