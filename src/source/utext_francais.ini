[player_alia_father]
string="Cette décision t'appartient."

[alia_revelations_father_2]
string="S'il te plait, montre-lui cette bague. Je l'ai depuis ma naissance. Je suis sûre qu'il la reconnaîtra. Dis-lui que je l'attendrai près du lac..."

// after end cinematic
[alia_debriefing]
string="Merci, Am Shagar. Je ne sais plus trop où j'en suis... Il s'est produit tant d'évènement ces derniers temps... J'ai une soeur, un père que je n'ai jamais connu... Mais je dois faire face à tout cela. Je te remercie sincèrement pour toute ton aide."

// c'est les remerciements forcés d'Alia qui a été emmenée par les femmes-serpents et libérée par le fantôme de Florence.
[alia_debriefing_unhappy]
string="Am Shagar... Je dois sans doute te remercier pour ce que tu as fait... Les femmes-serpents ont investi notre camp et ont fait de nombreuses victimes... J'étais leur cible. C'est lors de ma capture, quand je croyais tout espoir envolé, qu'une voix d'outre-tombe s'est élevée. Le fantôme de ma mère, que manifestement tu as sauvé, leur a révélé que je n'étais pas celles qu'elles étaient venues chercher... Elles sont parties, laissant leur carnage derrière elles... Am Shagar, je me dois de te remercier pour ce que tu vas faire, sauver notre monde d'Akbaa, mais je ne peux te remercier pour ce que tu as fait..."

// la réplique du rebelle mourrant après la trahison d'Am Shagar et le passage des femmes-serpents
[sacred_sword_debriefing_unhappy]
string="Am Shagar... Sale traître, qu'Akbaa t'emporte... Qu'est-ce que nous t'avons fait ? Qu'est-ce qu'Alia t'a fait pour nous vendre aux femmes-serpents ? *kôf-kôf* Maudit sois-tu, toi et tout l'ordre d'Edurneum..."

[sacred_sword_debriefing_sad]
String="Am Shagar... Alia a été enlevée par les femmes-serpents, elles ont quitté ce monde, on ne peut plus rien faire... On a fait de notre mieux... A présent, pars détruire Akbaa !"

String="Am Shagar... Alia a été enlevée par les femmes-serpents, elles ont quitté ce monde, on ne peut plus rien faire... On a fait de notre mieux... A présent, pars, pars détruire Akbaa !"

[king_debriefing_happy]
