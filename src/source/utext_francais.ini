/////////////////////

// first time
// présents : roi, un garde
[king_gard_warmeet1]
string="On m'a signalé de l'agitation dans les niveaux inférieurs de la cité, allez prévenir les gardes de l'avant-poste !"

[guard_king_warmeet1]
string="A vos ordres !"
// Sortie du garde

// Le passage vers le guardpost est déblayé
// présents : le roi, Carlo, Felnor, Chinkashh & Kacel Bem.

[king_warmeet2]
string="A-t'on trouvé du nouveau sur ces Ylsides, mes amis ?"

[carlo_warmeet1]
string="Nos hommes tiennent leur position, sire..."

[felnor_warmeet1]
string="Je pense que nous ferions mieux de découvrir leur repaire avant la prochaine offensive..."

[chinkashh_warmeet1]
string="Si les humains étaient plus familiers de la magie, les choses seraient bien moins complexes..."

[kacel_warmeet1]
string="Tous ces Ylsides sont des hérétiques qu'il nous faut châtier !..."

[king_warmeet3]
string="Le royaume ne peut souffrir perpétuellement d'une telle menace !"

// Séquence snake_woman slaping Lunshire passée mais avant que Carlo ne soit en prison.
// présents : le roi, Carlo, 5 gardes

[king_warmeet4]
string="Cela fait trop longtemps qu'une poignée de rebelles ridiculise mes meilleurs hommes. Il faut en finir, Carlo, est-ce bien clair ?"

[carlo_warmeet2]
string="Mais sire, nous n'avons pas entendu parler de ces rebelles depuis 20 ans... Ils sont peut-être même devenus les Ylsides depuis !..."

[king_warmeet5]
string="Je ne veux plus de suppositions, Carlo, je veux des résultats, vous avez compris ? Des ré-sul-tats..."
// Carlo et les gardes sortent

// Warmeet éventuel lors de la quête kreahoz/zohark et destruction de la statue.
// présents : le roi, Felnor, Chinkashh

[king_warmeet6]
string="Il nous faut plus de renseignements sur ces tremblements de terre. C'est de plus en plus préoccupant."

[felnor_warmeet2]
string="Ces secousses ont toujours existé. Mais ces derniers temps il est vrai qu'elles ont été plus nombreuses... Je pense que le canal de puissance mis en place par les adorateurs d'Akbaa doit déranger le cours naturel des choses... Il faut que tout cela cesse rapidement..."

[king_warmeet7]
string="Pensez-vous qu'il y ait un risque d'effondrement général ?"

[chinkashh_warmeet2]
string="Si c'était le cas, notre ordre l'aurait perçu... Le véritable danger en ce moment c'est Akbaa..."

[king_warmeet8]
string="Restez tous deux vigilants et prévenez-moi si vous avez du nouveau..."

/////////////////////
// Kingdom council //
/////////////////////

[king_council_come_start]
string="Bien, puisque tous les membres du conseil sont présents, commençons ! Felnor, que contiennent les notes de Fallan Orbiplanax ?"

[felnor_council_see_note]
string="Voyons... Aahhhh, Falan mentionne quelque chose à propos du garde Erzog. Il déclare l'avoir vu pratiquer de noirs rituels implicant des sacrifices d'animaux. C'est peut-être Erzog qui a commandité le meurtre de Falan... C'est peut-être même le grand prêtre du culte d'Akbaa... Oh, écoutez ceci : 'J'ai découvert l'existence d'un culte qui veut invoquer Akbaa sur Arx'"

[king_council_take_erzog]
string="Je me suis toujours méfié de cet Erzog. GARDES ! Jetez Erzog en cellule !"

[player_council_mentioned_akbaa]
string="Felnor, qui est cet Akbaa dont j'ai déjà entendu parler ?"

[kacelbem_council_akbaa_demon]
string="Akbaa est un démon puissant, le dieu de la destruction que son culte cherche manifestement à invoquer sur Arx. Ce serait un blasphème que de laisser perpêtrer cet acte, et un bien lourd désastre pour chaque être vivant de notre planète..."

[felnor_council_contact_noden]
string="Oui, oui, tenez ! Ecoutez la suite : 'Ce soir je contacterai le Noden pour leur demander leur aide'."

[King_council_noden]
string="Le Noden ??"

[felnor_council_yes_noden]
string="Le Noden. Il est la dimension qui régule l'existence des dieux. Il maintient l'équilibre universel en ne laissant pas se produire de telles invocations..."

[kacelbem_council_fallan_really]
string="Si Falan a vraiment pu contacter le Noden, il est fort possible qu'ils aient envoyé un émissaire ici-même pour empêcher la venue d'Akbaa..."

[King_council_gardian]
string="Un émissaire ?"

[felnor_council_gardian]
string="Ces créatures sont constituées uniquement d'énergie lorsqu'elles résident sur le Noden. Elles sont envoyées pour couper les canaux de puissance qui permettent aux dieux de s'échapper de leur dimension. J'ai entendu des récits incroyables sur ces émissaires qui peuvent détenir toutes sortes de pouvoirs... On raconte que certains en viennent à obtenir la force de 100 hommes ou sont capables de la plus grande des magies, d'autres encore seraient invulnérables. On appelle ces émissaires des Gardiens..."

[kacelbem_council_cinematic_cult]
string="Quelque part dans cette forteresse se trouve un culte qui adresse des prières impies à un fragment de météorite entièrement constitué d'un minéral appelé Koltk. Ce rocher viendrait de l'endroit qui a vu naître Akbaa... Cette matière est normalement indestructible. Si vous voyez juste, Felnor, seul un Gardien du Noden pourrait détruire ce météore..."

[suiberis_council_how_guardian_stop]
string="Comment un de ces gardiens pourrait-il empêcher un dieu de se manifester simplement en détruisant un rocher ?"

[kacelbem_council_prayer_heretics]
string="Ce sont les prières impies des prêtres, ainsi que leurs odieux sacrifices, qui sont focalisés par ce météore. Il procure ainsi de l'énergie à Akbaa qui, lorsqu'il en aura accumulé suffisamment, pourra se manifester sur Arx. Si cela se produit, la destruction incarnée sera lachée sur nous, pour notre plus grand malheur. Ce météore doit être impérativement localisé et détruit..."

[player_council_how_find_guardian]
string="Comment trouver ce gardien ?"

[felnor_council_koltk_sample]
string="J'ai un fragment de Koltk dans mon laboratoire. Cela pourrait grandement nous aider à le trouver..."

[king_council_here_situation]
string="Faisons le point : nous savons que le culte d'Akbaa est très présent sur Arx et qu'il gagne en puissance. Heureusement, nous avons pu arrêter Erzog, le grand prêtre du culte avant qu'il ne soit trop tard. Mais d'autres adorateurs pourraient quand même invoquer Akbaa. Il faut donc que nous trouvions au plus vite ce fameux gardien du Noden."

[carlo_council_also_war]
string="En outre, la guerre avec les Ylsides est très préoccupante, majesté. Que devons-nous faire sur ce point ?"

[king_council_shall_brief]
string="Carlo, il faut établir un plan de défense solide. Je redoute le pire. Personne ne sait exactement qui sont ces Ylsides et qui les dirige. GARDES ! Apportez-moi le fragment de Koltk !"

[king_council_while_army]
string="Am Shagar, pendant que notre armée est aux prises avec les Ylsides, nous aurons besoin de votre aide pour trouver ce fameux gardien... Je ne vous cache pas que cette tâche sera sûrement rude et de longue haleine. En fait nous n'avons pas la moindre idée de ce à quoi il ressemble ni même s'il est déjà parmi nous. Mais j'ai confiance en vos capacités."

[guard_council_here_sample]
string="Voici la pierre, majesté"

[king_council_put_table]
string="Bien, posez-là sur la table."

[king_council_take_sample]
string="Prenez-la, Am Shagar. C'est peu de choses, mais le gardien est le seul à pouvoir détruire ce fragment de météore. Prenez-en grand soin surtout..."

[carlo_council_aaahhh]
string="aaaahh."

[king_council_amazing]
string="Par les dieux !!"

[chinkashh_council_cant_believe]
string="Ffffffff !!"

[felnor_council_so_am_shagar]
string="Alors cela veut dire que Am shagar est..."

[king_council_guardian_well]
string="... Le gardien ! Eh bien je comprends maintenant de nombreuses choses et notamment ce désir d'aider constamment les autres ! Je suis honoré de faire votre connaissance, Gardien !"

[player_council_surprise_for_me]
string="Le contact avec cette pierre a éclairci mon esprit. J'ai été envoyé ici pour empêcher la venue d'Akbaa. Je dois agir sans délai. Tout d'abord il me faut trouver un accès au temple secret. Ensuite, je détruirai le météore d'un simple contact !"

[felnor_council_noden_with_you]
string="Puisse la force du Noden vous guider, Am Shagar."

[king_council_now_go]
string="Nous ne vous retiendrons pas davantage."

