[player_dragon8]
string="Je n'ai pas pu détruire la statue d'un simple toucher..."

[dragon_scenar8]
string="Les choses ne sont pas toujours aussi simples qu'on les imagine... Vous faites face à un dieu, Gardien, c'est une opposition énorme ! Il vous faudrait un objet de protection magique... Je crois me souvenir qu'un tel objet était en la possession des humains il fut un temps..."

[player_dragon12]
string="Les Ylsides ont fait prisonnier tous les humains du royaume..."

[dragon_scenar12]
string="D'après le peu de choses que je sais sur les Ylsides, il vaudrait mieux ne pas les combattre de front, mon ami... Essayez la discrétion, on ne peut combattre ce que l'on n'a pas vu..."

[player_dragon14]
string="Je cherche le repaire secret des adorateurs d'Akbaa..."

[dragon_scenar14]
string="Vous n'avez pas encore tout exploré... C'est l'heure de la confrontation ultime, mon ami, celle où la destinée d'un membre du Noden prend le pas sur l'autre. Il vous faut rassembler tout votre courage et votre détermination, montrer votre pleine connaissance de l'ennemi et le terrasser..."

