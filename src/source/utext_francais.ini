[Akbaa_dream_1]
string="Ahhhhhh.... Mmmmhhhh... Viens à moi... J'ai besoin de toi... Donne-moi ta vie..."

//////////////////////////////////
//   akbaa dream 2    //
/////////////////////////////////

[Akbaa_dream_2] //tentateur
string="Gardien ! Rien ne peut maintenant empêcher mon arrivée sur Arx ! C'est trop tard pour toi, trop tard pour ce monde... Mais réfléchissons : pourquoi devrions-nous nous combattre ? Rejoins-moi, tu es toi aussi prisonnier des lois du Noden et moi seul peut t'en libérer. N'aimerais-tu pas être enfin libre ? Pourquoi être les esclaves du Noden alors que nous pouvons régner sur les mondes comme des Dieux ? Sois mon allié gardien et je te promets l'accès à un pouvoir dont tu n'as même pas idée..."

/////////////////////
//  akbaa dream 3  //
/////////////////////

[Akbaa_dream_3]
string="Très bien, Gardien... Je constate que tu as rejeté ma généreuse offre d'alliance... Peut-être que notre prochaine rencontre te fera regretter amèrement ce choix... Pensais-tu réellement que la destruction de ce météore allait empêcher mon arrivée ? Le canal d'énergie est juste assez fort pour permettre ma venue. Je n'aurai pas la puissance que les sacrifices de ces pathétiques adeptes aurait pu me conférer mais une fois sur place, l'énergie coulera à flots avec toutes ces âmes à prendre..."

//////////////////////
//  Alia's destiny  //
//////////////////////

[King_Alia_destiny_1]
string="Ma chère fille, Alia ! J'avais perdu tout espoir de te voir un jour..."

[Alia_alia_destiny_1]
string="Père... C'est si bon de vous rencontrer enfin..."

// ému
[King_Alia_destiny_2]
string="Tu m'as tellement manqué... C'est incroyable ! Je suis si heureux de te savoir en vie..."

[Zalnashh_Alia_destiny_1]
string="Sachez que cette allégresse est partagée..."

[Alia_alia_destiny_2]
string="Par les Dieux..."

[King_Alia_destiny_3]
string="C'est un moment précieux pour ma fille et moi ! Je ne permettrai à personne de venir le perturber. Veuillez quitter cette salle IMMEDIATEMENT !!!"

[Zalnashh_Alia_destiny_2]
string="Ce Lunshire... Toujours le mot pour rire..."

[King_Alia_destiny_3bis]
string="Diantre, mais que faites-vous là ? Vous avez ce que vous vouliez : Krahoz est à nouveau en votre possession alors je ne vois pas bien ce que vous venez faire ici..."

[Zalnashh_Alia_destiny_8]
string="Mais qui se soucie encore de Krahoz ? Nous sommes ici comme vous pour fêter le retour d'Alia, parmi les siens, sa vraie famille : notre ordre... "

[King_Alia_destiny_6]
string="Vous avez perdu la tête !"

[Zalnashh_Alia_destiny_7]
string="Et vous votre mémoire ! Jetez un oeil à ce traité, celui même conclu entre nos deux peuples par Poxsellis, votre père : 'Au nom du royaume, moi, le roi Poxsellis, souverain d'Arx, lègue mon quatrième descendant direct à l'ordre d'Edurneum en échange de Krahoz et Zohark'. Cette enfant est notre promise, Lunshire, laissez-la partir avec nous ou périssez !"

[King_Alia_destiny_4bis]
string="Jamais ! Je n'ai jamais entendu parler de ce traité, que je renie totalement ! Pourquoi voulez-vous m'arracher ma fille ? Gardes !"

//(Drawing his sword out), the guards do the same.
[Zalnashh_Alia_destiny_3]
string="ooohhh, Un combat ! Soyez sérieux, pour une fois... Pensez-vous avoir la moindre chance contre nous ? Je vous imaginais tout de même plus intelligent... Sachez que ce traité fut conclu pour permettre à notre reine de renaître mais qu'il a sauvé votre misérable royaume. Nous avons besoin d'une reine et cette reine c'est Alia..."

[King_Alia_destiny_7]
string="Alia sera reine... Mais la reine des humains ! Compagnons, jusqu'aux portes de la mort !"

[Alia_alia_destiny_3]
string="Assez ! Plus de sang ! J'honorerai la parole de Poxsellis. Je ne sais rien de ce que me réserve l'ordre d'Edurneum, et je n'ai pas à juger ce traité... Le royaume n'aurait jamais gagné la guerre des mages sans l'aide de l'ordre et nous devons honorer nos engagements. Père, l'honneur est la plus importante qualité à mes yeux. J'espère que nous nous rencontrerons à nouveau mais malheureusement je dois vous quitter..."

// if Alia's mother Quest 

[florence_alia_destiny_1]
string="Cela ne sera pas nécessaire..."

[Zalnashh_Alia_destiny_4]
string="fffff ??" 

[human_guards_Alia_destiny_4]
String="Ooohhh?"
String2="Aahh!"
String3="aaahhhhh"

[King_alia_destiny_4]
string="Florence ? Est-ce bien toi ..."

[florence_alia_destiny_2]
string="Je suis désolée d'interrompre votre réunion, soeurs d'Edurneum, mais Alia ne peut pas être votre reine... Alia est la cinquième descendante de Poxsellis..."

[King_Alia_destiny_5]
string="Comment ?..."

[florence_alia_destiny_3]
string="J'ai fait partie de l'ordre de l'Epée Sacrée, ordre créé par Poxsellis lui-même pour assurer la descendance du Royaume d'Arx. J'étais un officier important de l'organisation et une des rares personnes au courant du pacte secret. J'ai organisé moi-même l'enlèvement d'Alia. Mais la nuit où Alia est née j'ai également donné naissance à Clarisse, sa soeur jumelle qui est née quelques minutes avant Alia. Cette naissance inespérée me donna l'idée de confier ce bébé à ma servante qui pouvait l'emmener en dehors d'Arx grâce à la guilde des voyageurs. L'Epée Sacrée enleva la présumée quatrième descendante mais je fus assassinée par un visiteur inattendu, qui fut enfin démasqué grâce à Am Shagar."

[Zalnashh_Alia_destiny_5]
string="Trahies ! Depuis tant d'années ! La duplicité humaine n'a donc pas de limite ? Où est donc notre promise, la quatrième descendante de notre prophétie ?"

[florence_alia_destiny_4]
string="La véritable reine se dévoilera d'elle-même plus tard, quand le moment sera venu..."

[Zalnashh_Alia_destiny_6]
string="Je dois avouer mon extrême déception... Quelle perte de temps ! Nous qui avions attendu cette reine depuis tant d'années... Soeurs, retirons-nous ! Notre race est mourrante et Nous n'avons plus rien à faire ici !"

