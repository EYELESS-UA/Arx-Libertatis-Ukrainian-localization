[player_question_dragon]
string="Lesquels ?"

[dragon_explain_guardian5]
string="Eh bien il semble tout d'abord que le gardien développe une sorte de prescience, une aptitude à retourner dans le temps qui lui permet d'envisager d'une nouvelle façon une situation critique qui le conduisait dans une impasse, vers un échec.  Vous avez dû ressentir cela déjà sans forcément en avoir conscience. Vous êtes de fait condamné au succès, sachez-le. N'hésitez pas à recourir à ce pouvoir car il vous sera des plus utiles..."

[player_question_dragon2]
string="Y-a-t'il d'autres de mes pouvoirs qui me sont inconnus ?"

[dragon_explain_guardian6]
string="Je ne crois pas, il y a bien longtemps que les dirigeants du Noden ne donnent plus une forte puissance à leurs gardiens, parfois, le remède peut s'avérer pire que le mal lui-même... Cela m'amène à votre principale faiblesse : en tant que créature du Noden, vous n'avez qu'une apparence humaine et n'êtes pas natif de cette dimension. Vous avez une liberté d'action immense mais pas infinie, votre méconnaissance de cette dimension ajoutée à tout ce que le Noden vous a inculqué et dont vous ne vous souvenez probablement pas vous désorienteront souvent : il se pourrait que certaines conversations que vous entreprendrez ne se passent pas comme vous l'auriez pensé, que les mots qui sortent de votre bouche ne soient pas ceux que vous auriez employé, voire même pas du tout ceux que vous auriez aimé dire. Ne vous en inquiétez pas outre mesure gardien, vous demeurerez éternellement pour Arx un étranger, lointain des considérations humaines."

