[description_note_ellie]
string="Cette lettre est pour vous, la femme de ma vie, ma bienaimée Ellie Rowse. Je pense toujours à vous, nuits et jours... Les couchers de soleil, la brise, tout me ramène à vous, même le froid des cavernes. Si seulement j’avais le courage de vous déclarer ce que je ressens, je le ferais prochainement... Lorsque mon travail se terminera."

[description_book_cells]
string="Registre de la prison"

[book_cells_content]
string="Registration et prisonniers.**Année 266, saison du rat, criminels:: **CHAMBRE D’ISOLATION:**Cellule 1: Humain à vendre. Note: 'Mauvais humain trouvé au niveau  2, lui dort, très étrange.'*Cellule 2: Humain pour vente. Note: 'Azuk m’a ramené cet humain, moi pas savoir lui être humain chauve, ridicule humain sembler goûteux, délicieux'.**CHAMBRE D’ATTENTE DE JUGEMENT:**Cellule 1: Mauvais gobelin 'Polsius', Charge: attaque et blasphème contre Alotar.*Cellule 2: Prisonnier gobelin 'Bolson', Charge: meurtre de deux gobelins - Je tuer lui, ordres du Roi.*Cellule 3: Prisonnier gobelin 'Zurok', Charge: mauvais gobelin, lui être voleur.*Cellule 4: Humain prisonnier, Charge: entré non autorisée dans la chambre interdite, lui échappé, Roi très fâché contre moi.*Cellule 5: Humain prisonnier, Charge: mauvais humain attaqué ami Koltor, dangereux humain ivre maintenant en cellule."


[note_aldaner]
string="Chef, Nous capturé humain dans avant poste, secte faire commande urgente, vendre pour 40 pièces d’or.**Toloneo."

[description_book_celly]
string="Rapports de la prison."

[book_celly_content]
string="Année 266, sixième jour de la saison du rat, les rapports des preuves et charges pour notre bon Roi:: **Nous vendre environ 3 humains... Nah, moi arracher cette page et écrire histoires fantastiques mais moi manger tarte d’abords, toi être en train lire rapport Roi puant... Moi ennuyé..."

[description_book_color_code]
string="L’art de la magie: parchemins, par Enselme Tricher."

[book_color_code_content]
string="Depuis la découverte de la magie, la meilleure interprétation possible lui fut donnée, donnant au mage une profonde perception. La magie que vous apprendrez est d’une nature spéciale – c’est la magie d' Erduneum.**Les parchemins sont scellés avec une bandelette et un code-couleur qui montre à quel point ils sont puissants. Le code-couleur est le suivant, Plus la puissance est élevé, plus le sort est efficace:**Niveau 1: gris.*Niveau 2: jaune.*Niveau 3: orange.*Niveau 4: vert.*Niveau 5: cyan.*Niveau 6: rouge.*Niveau 7: violet.*Niveau 8: bleu foncé.*Niveau 9: marron.*Niveau 10: noir."


