[garlic_attack]
string="Attaque à l'aïl !!!!"

// shany sub quest
[note_5000_sons]
string="Maintenant que nous avons trouvé une offrande précieuse pour notre dieu, nous allons pouvoir réaliser le rituel. Je vous attendrai demain à dix heures près du pilier des serpents du niveau 4. De là, je vous guiderai à la chambre secrète pour appeler les cinq cents fils de la Bête. Faites bien attention à ce que personne ne vous suive."

[note_alotar_threat_content]
string="Souvenez-vous que si vous ne nous amenez pas les gemmes demain soir au plus tard, vous mourrez. La confrérie des marchands de gemmes."

[note_for_pog_content]
string="Pog, Moi : Lunshire, a besoin aide. Chemin avant-poste humain bloqué : gros cailloux. Si trolls pouvoir dégager passage : moi content. -L"

[note_dwarf_mithril]
string="Akanor, je pense que nous allons bientôt être à court de mithril. La situation devient chaque jour plus préoccupante et je n’arrive plus à trouver la moindre once de mithril dans notre mine. Nous devons trouver une solution au plus vite. Oredak" 

[note_jail_contain]
string="Moi venir remplacer toi après moi manger. Toi garder humains, faire bien attention au nouveau. Lui semble dangereux.* Anatole"

[description_note_fallan_content]
string="Felnor,**J'ai découvert l'existence d'un culte qui veut invoquer Akbaa sur Arx. Akbaa est un démon puissant, le dieu de la destruction que son culte cherche manifestement à invoquer sur Arx. Ce serait un blasphème que de laisser perpêtrer cet acte, et un bien lourd désastre pour chaque être vivant de notre planète...*Quelque part dans cette forteresse se trouve un culte qui adresse des prières impies à un fragment de météorite entièrement constitué d'un minéral appelé Koltk. Ce rocher viendrait de l'endroit qui a vu naître Akbaa... Cette matière est normalement indestructible.*Ce sont les prières impies des prêtres, ainsi que leurs odieux sacrifices, qui sont focalisés par ce météore. Il procure ainsi de l'énergie à Akbaa qui, lorsqu'il en aura accumulé suffisamment, pourra se manifester sur Arx. Si cela se produit, la destruction incarnée sera lâchée sur nous, pour notre plus grand malheur. Ce météore doit être impérativement localisé et détruit... En vérité, Felnor, seul un Gardien du Noden pourrait détruire ce météore...*Ce soir je contacterai le Noden pour leur demander leur aide.**Falan."

[note_king_bedroom_contain]
string="Ô roi, vous souvenir de ne surtout pas boire vin, vous allergique au vin. Si vous boire vin, douleur très insupportable... -Votre très dévoué apothicaire"

[note_glavasias]
string="Frère Glasavias, dans le cas où vous auriez besoin de neutraliser le système de sécurité, sachez que votre code d’accès est 113.  Le champ de protection ne devrait pas poser de problème pour vous. Frère Patrizio et Frère Pasquale vous aideront pour neutraliser les autres systèmes de sécurité. -Seigneur Iserbius."

[note_Patrizio]
string="Frère Patrizio, ce coeur est une des clefs du système de sécurité. Prenez-en soin. -Seigneur Iserbius."

[note_Pasquale]
string="Frère Pasquale, souvenez-vous: La première verrouille la seconde. -Seigneur Iserbius."

[note_gob_guardpost_contain]
string="Mes chers amis gobelins, comme notre collaboration semble se pérenniser, je vous confirme la commande de deux humains de plus à offrir en sacrifice à notre bien-aimé Akbaa. Vous recevrez 1000 pièces d’or par tête à la livraison. Je viendrai moi-même vous apporter cette somme. -seigneur Iserbius."

[note_mike_lost]
string="Cher Olivier, je suis désolé mais je n’arrive pas à résoudre la quatrième énigme. Y’aurait-il une chance que vous puissiez me donner une indication ? -Mike"

[note_maria_love]
string="Maria, voilà de cela bien longtemps que nous n’avons pas eu la possibilité de nous voir et si la situation n’était pas ce qu’elle est, je ferais n’importe quoi pour être à vos côtés. Bien à vous. -L."

[note_key_brother_treasure]
string="1-3-1 est la clé pour ouvrir le trésor de mes frères."

[note_treasure_hunt_hint#4]
string="Je suis extrêmement impressioné par vos progrès, étranger, voici donc l’indice numéro 4 (... avez Utilisé pour l'indice...) Pour l’indice suivant, trouvez l’île de lave et regardez bien."

[player_stone_riddle_first]
string="Voyageur, si vous voulez participer à ma chasse au trésor, vous devrez vous munir d'une émeraude pour ouvrir mon coffre. OLIVIER"

[player_note_riddle_second]
string="Ah, je vois que nous avons un nouveau joueur. Bienvenue, étranger, voici le premier indice : (La clé du trésor...), pour l’indice suivant, allez aux mines des trolls et trouvez la note sous les pierres."

[note_carlo_sacred_sword]
string="L’opération de l’épée sacrée aura lieu demain soir. Soyez prêt. Je m’assurerai que les gardes ne seront pas aux alentours quand vous viendrez, et plus important encore, que le roi soit bien endormi. Il ne se doutera de rien. Faites votre travail et la cause pourra être sauve. -F"

[note_carlo_calpal]
string="note#1- Enoill, la reine Florence est devenue dangereuse pour le royaume. S’il vous plait, suivez-là discrètement et tenez-moi au courant de ce que vous apprendrez. -Carlo"

[note_carlo_calpal2]
string="note#2 - Cette correspondance que vous avez découvert confirme mes doutes. La reine projette bien d’assassiner le roi. J’aimerais donc que vous arrangiez sa disparition. Je vous laisse le choix du moment et du lieu. Bien entendu, vous serez payé pour ce travail. Brûlez ce message une fois que vous l’aurez lu. -Carlo"

[note_carlo_calpal3]
string="note#3 - Vous devrez accomplir votre mission ce soir. Occupez-vous de la reine aussi vite que possible après la naissance du bébé, je m’occuperai moi-même de la sécurité du roi. -Carlo"

[player_note_riddle_third]
string="Bien joué étranger, voici l’indice # 2 (... est au niveau...). Pour le prochain indice, essayez de voir ce qui ne peut être vu dans la salle sous les prisons gobelines."

[note_dear_mike_sorry]
string="Cher Mike, je suis désolé mais ce ne serait pas juste pour les autres joueurs si je vous donnais un indice concernant l’énigme # 4. Bonne chance quand même. Olivier l’ermite."

[note_at_last]
string="Enfin, le jour est venu, bientôt mon corps accueillera Akbaa et ensemble, comme un seul nous règnerons sur Arx. Si les choses tournent mal pour moi, je tiens à laisser ce message pour que quelqu’un d’autre puisse continuer mon oeuvre pour le bien de Arx, car après tout, Akbaa est le seul qui puisse restaurer le soleil de Arx. -Iserbius"

[note_Darkthorn]
string="Ma mission est inconnue du reste du royaume. Le roi m’a choisi parce que je suis le meilleur des chasseurs de mort-vivants. Je sais que ma tâche n’est pas facile, mais je me suis procuré tout ce dont j’ai besoin pour détruire ces abominations. Les momies sont des opposants redoutables, mais elles sont faciles à erradiquer car leur cadavre animé brûle très bien. Les autres mort-vivants sont plus difficiles à détruire car ils ont la fâcheuse manie de se relever quand on croit les avoir battus. Le sort qui permet de les repousser est utile pour une courte période de temps, mais il ne permet pas de les détruire. Le meilleur moyen, et le seul que je connaisse en fait, est d'enfoncer profondément un pieu dans le corps du mort-vivant avant que ce dernier ne se relève. C’est alors qu’il sera détruit définitivement. Je pense que mon équipement ne me suffira pas. Heureusement, mon illustre prédécesseur m’a laissé du matériel fort utile. J’espère que je pourrai nettoyer cette place sainte pour que les gens puissent venir à nouveau honorer leurs morts. Je suis déjà parti en reconnaissance dans le premier niveau de la crypte. Mais je dois rester vigilant concernant les dangers qui m’entourent. Puissent les dieux me venir en aide. -Azrael Darkthorn."

[note_fallan_code]
string="6 devient 4 quand vous lui otez le premier. Le premier multiplié par le second fait le dernier et le dernier multiplié par le premier donne 16."

[note_warning_golem]
string="Je ne peux pas atteindre la tombe de Poxsellis. L'énigme de l'observateur qui protège la herse est trop difficile pour moi. Je laisse les trésors de Poxsellis à quelqu’un d’autre."

[note_miguel_calpale_key]
string="Voilà le double que tu m'as commandé Enoill. Vu que tu n'es pas là, je le glisse sous ta porte. Tu passeras au magasin pour me régler. Miguel."

[note_twin]
string="Voilà le plan pour accéder au repère des femmes-serpents. J'y ai découvert une grande quantité d'objets divers et variés que nous allons pouvoir revendre à un bon prix"

[note_bad_snake_woman]
string="Le Gardien est sur le point de découvrir une nouvelle reine pour Zalnashh et ses suivantes. Il doit être arrêté à tout prix. La lignée de Zalnashh doit s'éteindre."

[note_troops_for_jail]
string="Roi Alotar, prisonniers échappés. Besoin renforts. X."

[note_bad_snake_woman2]
string="Rendez-vous dans les Cavernes de Cristal. Nous devons vous faire part de nouvelles instructions. Et faites attention, il se peut que quelqu'un ai découvert nos plans."

[note_gem_dealer_licence]
string="Patente de Ventes de Gemmes Numéro #256B -Officiellement remise par le Roi Lunshire et le tout puissant Roi Alotar"

[note_goblin_authorization_unsigned]
string="Ca être autorisation. Celui qui a autorisation être libre pénétrer royaume Gobelin. Donnée par:"

[note_goblin_authorization_signed]
string="Ca être autorisation. Celui qui a autorisation être libre pénétrer royaume Gobelin. Donnée par: Anatole.  X"

[note_end_demo]
string="Félicitations,**Vous avez fini la démo de 'Arx Fatalis'."

[note_faln_letter]
string ="Felnor,**J'ai découvert l'existence d'un culte qui veut invoquer Akbaa sur Arx. Akbaa est un démon puissant, le dieu de la destruction que son culte cherche manifestement à invoquer sur Arx. Ce serait un blasphème que de laisser perpêtrer cet acte, et un bien lourd désastre pour chaque être vivant de notre planète...**Quelque part dans cette forteresse se trouve un culte qui adresse des prières impies à un fragment de météorite entièrement constitué d'un minéral appelé Koltk. Ce rocher viendrait de l'endroit qui a vu naître Akbaa... Cette matière est normalement indestructible.**Ce sont les prières impies des prêtres, ainsi que leurs odieux sacrifices, qui sont focalisés par ce météore. Il procure ainsi de l'énergie à Akbaa qui, lorsqu'il en aura accumulé suffisamment, pourra se manifester sur Arx. Si cela se produit, la destruction incarnée sera lachée sur nous, pour notre plus grand malheur. Ce météore doit être impérativement localisé et détruit... En vérité, Felnor, seul un Gardien du Noden pourrait détruire ce météore...**Ce soir je contacterai le Noden pour leur demander leur aide.**Falan."


