[Greu_introducing]
string="Moi Greu. Moi ici parce que quitté camp des trolls. Veux pas travailler pour gobelins. Aime pas gobelins. Gobelins petits. Gobelins fourbes. Gobelins pensent trolls stupides. Alors vivre ici, seul avec poissons. Poissons pas me donner d'ordres et moi manger eux..."

