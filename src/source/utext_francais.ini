[player_to_Pog01]
string="Bonjour. Vous êtes le roi Pog, je suppose ? Je sais que vous n'appréciez pas les étrangers, mais j'ai ici un message du roi Lunshire qui a quelque chose à vous demander..."

[Pog_asknote]
