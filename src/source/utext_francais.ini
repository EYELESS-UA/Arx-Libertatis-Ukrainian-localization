[Fallan_intro_1]
string="Ecoutez-moi, Etres de Lumière et entendez mon message : voici Arx, qui fut jadis une cité comme tant d'autres, étendant ses fiers bâtiments sous la majesté du soleil. Notre roi, Poxsellis était bon et juste et savait contenir les escarmouches que nous infligeaient les gobelins et les hommes-rats. Bien des années après la mort de Poxsellis, en la fatale année 226, notre soleil commença à décliner et un hiver éternel s'installa sur notre monde... Sa majesté Lunshire, digne fils de Poxsellis, décida de faire migrer toute la cité d'Arx sous terre, dans une ancienne mine naine. A cette occasion tous les conflits entre les races d'Arx s'estompèrent, humains, nains mais aussi trolls et gobelins furent unis pour une même survie. Cette migration dura 5 années, pendant lesquelles le soleil disparut complètement de nos cieux. Toutes les races s'aménagèrent des lieux de vie dans ce nouveau cadre et petit à petit les relations entre tous sont redevenues celle qu'elles étaient par le passé."

[Fallan_intro_2]
string="Mais aujourd'hui, le mal est à nos portes... Akbaa, le dieu de la destruction est sur le point de... argghh"

