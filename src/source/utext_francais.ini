[system_tutorial_0]
string="Regardez à l'intérieur des coffres des magasins, prenez les objets que vous désirez acheter et laissez-y les objets que vous voulez vendre."

[system_tutorial_0bis]
string="Donnez vos armes et armures détériorées au forgeron pour qu'il les répare."

[system_tutorial_1]
string="Cliquer le bouton droit une fois pour avoir la vue à la souris."

[system_tutorial_1_new]
string="Cliquer le bouton droit sur cette note pour la refermer."

[system_tutorial_1_new2]
string="Les messages du didacticiel peuvent être consultés dans la section quête du livre de quête (touche F4 par défaut)."

[system_tutorial_2_new]
string="Double cliquer sur n'importe quel objet fixe dans le jeu pour l'activer."

[system_tutorial_2bis]
string="Appuyer sur la touche 'OUVRIR LIVRE' (Touche TAB par défaut) ou cliquer sur l'icône du livre afin d'ouvrir le livre de quête."

[system_tutorial_2tris]
string="Appuyer sur la touche 'OUVRIR INVENTAIRE' (Touche I par défaut) ou cliquer sur l'icône de la ceinture pour ouvrir votre inventaire."

[system_tutorial_3bis] //Jowood version
string="Appuyer sur la touche 'F' ou 'ENTREE' lorsque le curseur est au-dessus de l'os pour l'équiper."

[system_tutorial_3bis_new]
string="Appuyer sur la touche 'Mode Combat' (Touche TAB par défaut) pour combattre."

[system_tutorial_3bis_new2]
string="Cliquer le bouton gauche pour frapper. Plus le bouton gauche est maintenu enfoncé longtemps, plus le coup sera puissant."

[system_tutorial_3]
string="Double cliquer sur un personnage pour lui parler."

[system_tutorial_4]
string="Double cliquer sur le cadavre pour le fouiller."

[system_tutorial_4_new] //Jowood version
string="Vous pouvez cliquer et maintenir le bouton gauche sur un objet et le faire glisser depuis l'inventaire du cadavre vers le votre.*Vous pouvez aussi appuyer sur la touche 'ENTREE' ou 'F' lorsque votre curseur est sur un objet pour l'utiliser."

[system_tutorial_5]
string="Quand vous êtes en mode 'vue à la souris', cliquer le bouton gauche pour accéder au mode combat."

[system_tutorial_5bis]
string="En combat, cliquer et maintenir le bouton 'ACTION' (bouton gauche par défaut) puis relâcher pour donner un coup. Plus le bouton 'ACTION' est maintenu enfoncé longtemps, plus le coup sera puissant."

[system_tutorial_6] //Jowood Version
string="Vous venez juste de trouver vos premières runes. Appuyer sur la touche 'ENTREE' ou 'F', quand votre curseur se trouve dessus, pour les placer dans votre livre."

[system_tutorial_6bis]
string="Maintenant que vous possédez vos première runes, vous pouvez ouvrir votre livre et lancer votre premier sort."

[system_tutorial_7]
string="Accroupissez-vous en appuyant sur la touche 'S'ACCROUPIR' (Touche C par défaut) et brisez la trappe en bois."

[system_tutorial_8]
string="Double cliquez sur la corde dans votre inventaire une fois que vous l'avez trouvée et cliquez ensuite sur le mécanisme pour le réparer."

[system_tutorial_9]
string="Cliquer sur un icône de sort pour afficher sa formule. Celle-ci restera à l'écran comme référence une fois le livre fermé."

[system_tutorial_10]
string="Appuyer et maintenir la touche 'MODE MAGIE' (Touche Ctrl par défaut) pour accéder au mode magie.**Tracer les runes avec le bouton gauche, l'une après l'autre. Relacher la touche 'MODE MAGIE', une fois la séquence reconnue, pour lancer le sort."

[system_tutorial_11]
string="Le téléporteur est maintenant activé. Vous ne serez pas en mesure de voyager au travers tant que d'autres téléporteurs n'auront pas été activés."

[system_tutorial_12]
string="Allumer le feu et placer de la nourriture crue à côté pour la cuire."

[system_tutorial_13]
string="Lancer le sort Etincelles sur les torches pour éclairer le passage"

[system_tutorial_14]
string="Cliquer le bouton 'UTILISER' (bouton droit par défaut) sur un parchemin magique pour mémoriser le sort qu'il renferme."

[system_tutorial_15]
string="Le sort est maintenant mémorisé. Son symbole apparaît au bas de l'écran, à gauche. Pour le lancer, double cliquez avec le bouton 'ACTION' sur ce symbole."

[system_tutorial_16]
string="Cliquer sur l'icône d'escalier pour changer de niveau."

[system_tutorial_level_01]
string="Félicitations! Vous venez juste de gagner un niveau d'expérience! Cliquez sur la croix en bas à droite de l'écran pour répartir les points que vous avez gagné."

[system_tutorial_level_02]
string="Vous pouvez maintenant rajouter des points à vos compétences en cliquant avec le bouton de gauche sur celles-ci. Le chiffre qui apparait sous le curseur de la souris indique le nombre de points qu'il vous reste à répartir."

[tutorial_bag] //Jowood version
string="Cliquer avec le bouton droit de la souris sur le ceinturon de l'inventaire pour afficher le contenu de tous vos sacs.."

[tutorial_bag_02] //Jowood version
string="Vous pouvez réorganiser votre inventaire en double cliquant sur le ceinturon de votre inventaire."

[tutorial_lever] //Jowood version
string="Pour réparer le mécanisme double cliquez sur le bout de bois que vous venez de trouver puis cliquez bouton de gauche sur la base de levier située sur le mur d'à côté."

[tutorial_shop] //Jowood version
string="Vous êtes maintenant en mode transaction. ATTENTION: la transaction prend effet dès que vous prenez ou déposer un objet dans le coffre du commerçant. Une transaction ne peut pas être annulée."

[tutorial_mode_01] //Jowood version
string="Vous êtes en mode interaction."

[tutorial_mode_02] //Jowood version
string="Vous êtes en mode exploration."

[tutorial_stealth] //Jowood version
string="Les créatures peuvent vous entendre: marcher silencieusement. Vous pouvez aussi essayer de jeter un objet. La créature sera attirée par le bruit provoqué et ira voir ce qui se passe. *Notez que l'icône de furtivité apparait dans le coin bas gauche de l'écran lorsque vous vous cachez.""

[tutorial_steal] //Jowood version
string="Saviez-vous que vous pouvez voler leur possession aux personnages du jeu? Pour cela, Vous devez avoir au moins 50 en Furtivité. Rapprocher vous de quelqu'un. S'il possède quelquechose que vous pouvez lui dérober, un petit sac apparaîtra au coin de l'écran. Cliquer dessus pour en voir le contenu. Mais faites attention: si vous n'êtes pas assez discret vous allez vous faire prendre."

