[Pog_readnote]
string="Voie bloquée... Mmmmm... Vouloir aider votre peuple mais, d'abord humains devoir aider trolls retrouver trésor perdu."

[player_to_Pog03]
string="Je passe mon temps à aider les autres depuis que je me suis enfui, mais bon je n'ai pas trop le choix... Et cela m'aidera peut-être à retrouver la mémoire... Alors, c'est quoi, cette histoire de trésor perdu ?"

[Pog_briefing]
string="Vilain voleur avoir pris notre idole. Idole protéger travail troll : empêcher caverne nous tombe sur tête, alors depuis trolls plus travailler pour gobelins."

[player_to_Pog04]
string="Que faites-vous pour les gobelins ?"

[Pog_explain]
string="Ramasser gemmes dans mines, gobelins vendre gemmes et donner à nous un peu or..."

[player_to_Pog11]
string="Pourquoi ne pas vendre les gemmes vous-même ?"

[Pog_explain2]
string="Gobelins les vendre. Trolls trop stupides pour faire commerce..."

[player_to_Pog05]
string="Bien, je ramènerai votre idole..."

[Pog_thanks]
