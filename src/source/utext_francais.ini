[Ortiern_welcome]
string="Un civil ?... Je suis Ortiern, capitaine des armées du roi et commandant de cet avant-poste. Etes-vous un mercenaire ? Pouvons-nous compter sur votre aide ?"

[Player_welcome_ortiern]
string="Mercenaire ? Peut-être... Pour l'instant, j'ai juste mis de la distance entre quelques gobelins et moi. Que vous est-il arrivé ?..."

[Ortiern_briefing1]
string="Nous avons été attaqués par un petit groupe d'Ylsides ; ils m'ont blessé et emporté trois de mes hommes..."

[Player_ortiern1]
string="Les Ylsides ?"

[Ortiern_briefing2]
string="Il y a deux heures, trois d'entre eux se sont infiltrés dans l'avant-poste. Sans raison apparente, sans même dire un mot ils nous ont attaqués. On les disait invincibles et formidables guerriers : je sais maintenant que c'est vrai. Leur rapidité n'est pas humaine... Ils ont gravement blessé trois de mes hommes qu'ils ont emmené avec eux. Quand à Karnok, vous avez dû voir ce qu'ils lui ont fait... Je ne sais pas pourquoi ils ont fait ça, ni à qui ils obéissent, tout ce que je sais, c'est que le temps presse avant leur retour..."

[Player_ortiern2]
string="Trouvez quelqu'un d'autre... J'ai mes propres problèmes..."

[Ortiern_briefing3]
string="Vous êtes mon seul espoir ! Je ne fais pas confiance aux gens de la taverne ! Un étranger est plus digne de confiance !"

[Player_ortiern3]
string="Je viens de vous dire que..."

[Ortiern_briefing4]
string="Il vous faudra aller au château pour informer le roi de la situation ici ! C'est d'une importance vitale ! Depuis le dernier tremblement de terre, le chemin vers le château est bloqué par des éboulis et nous n'avons pas pu y retourner. Vous devez lui dire que les Ylsides nous ont déclaré la guerre !..."

[Player_ortiern4]
string="C'est stupide ! Vous venez de me dire que le chemin d'accès au château est bloqué !"

[Ortiern_briefing5]
string="Il vous faut passer par les cavernes des gobelins, à deux niveaux en dessous et trouver un moyen de remonter à ce niveau-ci. Ce n'est pas un itinéraire fréquent et il doit être dangereux mais nous n'avons pas le choix ! Normalement en remontant par là vous devriez vous retrouver dans le royaume humain."

[Player_ortiern5]
string="Impossible, les gobelins et moi ne sommes pas en très bon termes..."

[Ortiern_briefing6]
string="Je vais vous donner ceci : c'est une patente de marchand de gemmes. Aussi longtemps qu'ils vous prendront pour un négociant et que vous ne les agresserez pas ils vous laisseront en paix et vous laisseront passer. Mes ordres sont de rester ici, vous êtes notre seul espoir valeureux mercenaire !"

[Ortiern_repeat_briefing]
string="Je vous ai déjà dit que vous êtes notre seul espoir ?"
string2="Vous n'avez pas bien compris ? Bon... Allez dans les cavernes des gobelins, avec la patente que je vous ai donnée, les gardes vous laisseront passer."
string3="Une fois que vous aurez vu le roi, il fera déblayer l'accès et pourra nous envoyer des renforts contre les Ylsides..."
string4="Si vous ne le faites pas pour moi, faites-le pour le royaume, valeureux mercenaire !"

[Ortiern_repeat_briefing_caves]
string="Je vous ai déjà dit que vous êtes notre seul espoir ?"
string2="Une fois que vous aurez vu le roi, il fera déblayer l'accès et pourra nous envoyer des renforts contre les Ylsides..."
string3="Si vous ne le faites pas pour moi, faites-le pour le royaume, valeureux mercenaire !"

[Ortiern_misc_hi]
string="Fidèle au poste !"
string2="Encore merci pour votre aide, mercenaire !"

///////////////////
// Human_KacelBem //
///////////////////

[Kacelbem_misc_before_guardian]
string="Je ne vous connais pas, je n'ai pas confiance en vous."
string2="Vous êtes peut-être envoyer par le démon, Laissez moi tranquille !"
string3="Vous n'êtes pas un humain normal, vous êtes le démon ! Au secours ! J'ai vu le démon !"
string4="Hérétique !"

[Kacelbem_misc_after_guardian]
string="Sauvez-nous, sauvez-nous, ô Gardien."
string2="Je savais que vous n'étiez pas un simple humain !"
string3="Accomplissez votre déstinée Gardien, détruisez Akbaa !!"
string4="Les hérétiques vont périr grâce à vous et au Noden !"

//////////////////
//  Human_King  //
//////////////////

[player_king_1stmeet1]
string="Je m'appelle Am Shagar. Je me suis libéré des prisons gobelines et je suis envoyé par Ortiern. Lui et ses hommes sont coincés à votre avant-poste. Il a besoin d'aide pour dégager la voie d'accès bloquée par des rochers. Ils ont également subi une attaque de quelques Ylsides et ne pourront pas résister à un nouvel assaut."

[king_player_1stmeet1]
string="Diantre... Eh bien je vous remercie pour cette information, étranger. Je n'ai pas l'honneur de vous connaître mais je vous adresse mes plus vifs remerciements au nom de tout mon royaume... Laissez-moi vous gratifier d'une substancielle récompense pour les risques que vous avez pris... Mais malheureusement, je ne vois pas bien comment pouvoir déblayer cet éboulement... C'est véritablement un problème épineux... Laissez-moi réfléchir..."

[king_player_1stmeet1bis]
string="Voilà ce que nous allons faire : portez donc ce message à Pog, le roi des trolls. Son peuple sera assez fort pour déblayer le passage et ils ont l'habitude des durs labeurs. Ils nous ont d'ailleurs aidé à aménager notre ville. Ils vivent juste à l'étage en dessous de celui-ci, peut-être en avez-vous déjà croisé ? Ils sont très reconnaissables vous savez : à peu près aussi laid qu'un gobelin et 5 fois plus gros... Mais nous avons de très bonnes relations avec les trolls car nos deux peuples haïssent profondément les hommes-rats. Je suis sûr qu'ils nous aideront tout de suite..."

[player_king_1stmeet2]
string="J'ai l'impression d'être d'une importance vitale pour ce pays... Bon, je vais vous aider mais j'attends d'être aidé moi aussi en retour."

[king_player_1stmeet2]
string="Ne vous inquiétez pas, vous serez rétribué pour cette tâche"

[player_king_1stmeet3]
string="Ce n'est pas ce que je veux... J'ai perdu toute ma mémoire et je dois la retrouver !"

[king_player_1stmeet3]
string="Je suis sûr que tout cela va vous revenir. Les gobelins ont dû vous rudoyer, voilà tout. Ne vous inquiétez pas, et maintenant, je vous en prie allez et demandez à parler à Pog, le roi des trolls..."

[king_player_1stmeet_misc]
string="Maintenant, je vous en conjure, Am Shagar, allez et parlez à Pog, le roi des trolls"
string2="Je suis sûr que votre mémoire vous reviendra petit à petit..."
string3="Bien je crois que vous n'avez plus grand chose à faire ici, non ?"
string4="Dépêchez-vous, mes hommes sont coincés à l'avant-poste !"

[king_player_rocksaway1]
string="Je vous remercie à nouveau étranger. Les rochers ont bien été retirés. Je vous prie d'accepter ceci comme récompense. D'ailleurs à mes yeux vous n'êtes plus vraiment un étranger et je vais sûrement pouvoir vous offrir bientôt une activité au sein de mon royaume... Je vais y réfléchir sérieusement..."

[king_player_rocksaway2]
string="Mmm... Très bien, que penseriez-vous de devenir..."

[Carlo_breaks_in1]
string="Majesté... Nous avons trouvé une autre trace de rituel..."

[king_player_rocksaway3]
string="Mmm, c'est le troisième en moins d'une semaine. Où s'est-il déroulé, cette fois-ci ?"

[Carlo_breaks_in2]
string="A côté du conduit d'aération, majesté, cela a peut-être à voir avec le meurtre de Falan Orbiplanax ?"

[king_player_rocksaway4]
string="Probablement... Je vais mettre mon nouvel ami sur l'affaire. Vous pouvez disposer Carlo."

[Carlo_breaks_in3]
string="Très bien, sire"

[king_player_rocksaway5]
string="Bien... Que pensez-vous de ceci : je vous propose d'enquêter sur cette secte de l'ombre qui a sûrement fait exécuter Falan Orbiplanax, notre ancien astronome. J'ai besoin d'une personne extérieure au château et qui n'ait pas froid aux yeux. Acceptez-vous de me prêter assistance ?"

[player_king_rocksaway1]
string="L'affaire semble confuse, majesté. Mais je peux toujours mener une petite enquête..."

[king_player_rocksaway6]
string="Je suis sûr que vous ne me décevrez pas. Vous serez libre d'interroger n'importe lequel de mes gens si vous avez le moindre besoin d'information... GARDES ! LAISSEZ A CET HOMME L'ACCES A TOUS LES QUARTIERS PRIVES DU CHATEAU. En outre, cher Am Shagar, voici la clé de l'une des chambres royales. C'est maintenant la vôtre. Vous pourrez vous y reposer, et y déposer quelques affaires si vous le souhaitez."

[player_king_rocksaway2]
string="C'est un beau geste de votre part..."

[king_player_rocksaway7]
string="N'en parlons plus ! Nous tiendrons un conseil dès que vous nous amènerez des indices sur ces évènements inquiétants."

[king_player_rocksaway_misc]
string="Nous nous verrons au conseil lorsque vous nous ramènerez des indices."
string2="Je suis content de pouvoir compter sur votre aide précieuse, Am Shagar."
string3="Est-ce que votre nouvelle chambre vous plait ?"
string4="Puissent les Dieux vous assister dans votre enquête."

//player gives Krahoz to king
[king_krahoz]
string="Enfin, Krahoz nous est rendu. Merci beaucoup pour votre honnêteté et votre dévouement, Am Shagar. ramenez-le immédiatement aux soeurs d'Edurneum. Elles seront heureuses de récupérer leur bien et ne m'ennuiront plus avec cela... Le royaume de Arx se souviendra toujours de votre courage."

// lorsque le joueur doit réunir la forte somme d'or pour le dragon.
[player_king_gold]
string="J'ai besoin de beaucoup d'or pour sauver Arx..."

[king_player_gold]
string="Notre royaume n'est pas richissime Am Shagar, mais eu égard à tout ce que vous avez déjà fait pour nous, je vous prie d'accepter cette modeste somme..."

// section nouvelle d'ambiance lors de l'arrivée du joueur en salle du trône.
