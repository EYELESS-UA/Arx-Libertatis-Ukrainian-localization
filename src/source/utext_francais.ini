[suiberis_greetings_player]
string="Je suis le nouvel astronome. J'étais l'assistant de ce pauvre Falan Orbiplanax, et depuis son décès je m'occupe au mieux de l'observatoire."

[player_observing_misc]
string="Les étoiles vous ont appris quelque chose ?"

[suiberis_nothing_stars]
string="Rien. Le ciel est voilé."

[suiberis_nothing_misc]
string="La configuration actuelle des astres est fascinante."
string2="Vous savez, mon travail exige beaucoup de concentration..."
string3="Excusez-moi mais j'ai vraiment beaucoup de calculs à vérifier et de nombreux horoscopes à préparer..."

//  If carlo has talked about rituals.  //

[player_rituals_suiberis]
string="Suiberis, que pouvez-vous me dire à propos de ces rituels ? Connaissez-vous l'assassin de Falan Orbiplanax ?"

[suiberis_dont_know_rituals]
string="Je ne sais pas vraiment de quoi vous parlez. Vous savez, je suis encore novice dans ma profession. De plus, je déteste la violence."

