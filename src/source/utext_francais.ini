[alia_bring_krahoz-zohark2]
string="La dernière fois que ces deux objets de pouvoir furent assemblés, ce fut par la main de mon grand-père, le roi Poxsellis..."

// cette réplique se met à la fin de la tirade du grand-père si elle a eu lieu à propos de Krahoz et Zohark ou après 'alia_bring_krahoz-zohark' dans l'autre cas.
[alia_let_shield]
string="Quand au bouclier des anciens, tu peux le garder maintenant..."

//when player gives krahoz to Alia
[Alia_thanks_krahoz] // chuchote presque sur la fin
string="Merci d'avoir fait ça pour nous Am Shagar. Tu sais... Je t'apprécie vraiment beaucoup, Am Shagar... Je t'en prie, reste un moment ici avec moi..."

[alia_nightmare]
string="Où vas-tu Am Shagar ? N'es-tu pas bien avec moi ? Je n'ignore pas l'importance de ta quête..."

[alia_nightmare2] // qui devient démoniaque
string="Mais je vais m'assurer que tu resteras auprès de moi A JAMAIS !!"

[alia_nightmare3]
string="Va, Am Shagar, et surtout prends bien soin de toi..."

[alia_revelations_father]
