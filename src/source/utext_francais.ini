[description_book_guardpost]
string="Journal de bord"

[book_guardpost_content]
string="- An 266, saison blanche, semaine du rat, troisième jour.*Aujourd'hui une petite troupe de gobelins a essayé d'attaquer notre avant-poste. Ils étaient ivres et inefficaces. Nous en avons donc déduit que cette escarmouche n'était pas planifiée et qu'elle découlait de leur trop grande absorption d'alcool. Nous avons repoussé cette offensive sans trop de mal, souffrant tout de même de notre coté d'une perte contre cinq chez les gobelins.*-An 266, saison blanche, semaine de la taupe, deuxième jour.*Un tremblement de terre a secoué notre avant-poste pendant au moins dix minutes. Il n'y a pas eu de dégâts mais j'ai remarqué plusieurs fissures dans la galerie qui mène à notre cité.**- An 266, saison verte, semaine du boeuf, quatrième jour.*Un étrange combattant nous a attaqué ce matin. Il portait une lourde armure d'une facture inconnue et semblait invincible. Tous ces gestes étaient précis et d'une rapidité inégalée. Il semblait ne pas connaître la pitié puisqu'il a tué un de mes hommes et sérieusement blessé deux autres avant de tout simplement repartir comme il était venu. Sa manière de procéder m'a fait penser à un simple test de nos forces.*Je pense que ce guerrier n'est que le premier signe visible d'une force qui est en train de grandir dans l'ombre et qui un jour pourra tous nous anéantir.***-An 266, saison verte, semaine de l'aigle, premier jour.*L'étrange guerrier est revenu. Il a tué trois de mes hommes avant que j'arrive enfin à l'abattre. C'est alors qu'agonisant il s'est mis à éclater d'un rire puissant et démoniaque. J'ai tout de suite pressenti quelque chose et ai ordonné à mes hommes de reculer vivement. Il y a eu une forte et puissante explosion qui dispersa ses restes.*Il ne restait plus de trace de lui à part son épée sur le sol.***- An 266, saison jaune, semaine du serpent, premier jour.*Un tremblement de terre nous a réveillé bien tôt ce matin. Un de mes hommes m'a dit que ce séisme a occasionné un éboulement dans la galerie qui mène au château. Je pense que des secours ne tarderont pas, je préfère attendre un peu avant d'envoyer un de mes hommes auprès de notre bien-aimé roi. Ils doivent bien se douter que l'éboulement peut avoir des conséquences sur nous...*Puissent les dieux veiller sur nous."
////////////////////////////////////////////////
[description_book_beloved]
string="Mon bien-aimé Akbaa"

[book_beloved_content]
string="Ces écrits sont en honneur de mon bien-aimé maître et Dieu :*Akbaa.***********Akbaa est la source de la connaissance à travers l'univers et toutes les dimensions connues. Croiser dans sa vie son culte est une révélation importante qui peut se traduire comme un point de non-retour : adores Akbaa ou péris.**Parce qu'Akbaa est un Dieu, qu'il symbolise également le pouvoir de la destruction de chaque chose. Il sait récompenser les plus fidèles de ses adorateurs par de grands pouvoirs. Il punit sans pitié les autres. Il est absolument immortel et il a besoin d'âmes pour maintenir sa puissance sur les univers connus et être ainsi capable de répandre sa parole partout.**Un bon moyen de plaire à Akbaa est de lui fournir des âmes impures qui lui refusent obéissance. Même si les incroyants sont nos cibles préférées, certains d'entre nous, pressés d'entrer en communion avec Akbaa s'offrent aussi parfois en sacrifice. Cela m'arrivera sûrement un jour aussi, quand je m'en estimerai digne. Après tout, la mort ne représente rien face aux années de joie et d'élévation spirituelle que j'ai pu obtenir grâce à lui.**Je préfère encore un jour de ma vie plutôt que 1000 années de la vie d'un incroyant.**Car grâce à Akbaa, j'ai vu des choses qui m'ont fait comprendre des fondements même de notre univers. Des choses qui seront voilées à jamais à tous les incroyants."
////////////////////////////////////////////////
[description_book_iserbius]
string="Journal personnel d'Iserbius"

[book_iserbius_content]
string="Je tiens à faire ce récit de ma vie, car si les choses tournent mal pour moi, ce journal aidera mon successeur à bien servir la cause de l'ordre.**J'ai décidé de dédier mon entière vie à mon bien-aimé dieu Akbaa. Depuis que j'ai pris connaissance de son existence et jusqu'à mon dernier souffle, je l'adorerai.**Akbaa m'a donné ce dont n'importe quel homme rêve.**Je me souviens encore de ce jour béni où j'ai rencontré le seigneur Long.*C'était en l'an 240.**Nous avons tout de suite ressenti une puissante affinité lorsque nos regards se sont croisés. Il était comme un deuxième père pour moi, comme je crois avoir incarné le fils qu'il n'eut jamais.*Quelques temps après, alors que je faisais vraiment mon entrée dans le culte, il m'a signifié que je serai son successeur.**Alors que je n'étais encore qu'un novice, il me révéla tout sur le culte et sur Akbaa lui-même.*Il m'apprit que le but ultime du culte était bien sûr de faire venir Akbaa sur notre dimension, qu'il avait commencé tous les préparatifs nécessaires à ce rituel d'invocation mais que malheureusement, il ne le verrait pas s’accomplir.**Dans sa grande clairvoyance, il avait déjà contemplé l’heure de sa mort.*Il me supplia de continuer ces préparatifs pour accomplir le dessein d'Akbaa.**Quand il mourut l'année suivante comme il l’avait lui-même dit, ses paroles prophétiques résonnèrent en moi et tout juste promu initié, je devins le grand prêtre du culte. Ce jour vit alors ma plus grande peine et ma plus grande joie. La peine incommensurable de perdre son mentor et son père et la joie indicible de savoir que la venue de notre Dieu était proche.**Une longue période de recherche commença alors pour moi.**Je devins de plus en plus proche d'Akbaa : aussi proche qu'un humain puisse l'être d'un Dieu. Je vis ce qui ne peut être vu, entendis ce qui ne fait pas de bruit et ressentis ce que nul ne sait accueillir. Akbaa me donna de plus en plus de pouvoir, une certaine puissance physique bien sûr, mais aussi une grande maîtrise des arts magiques.**Akbaa est plus qu'un Dieu pour moi : il est mon soleil, mon air, ma nourriture, il est tout et en tout lieu. Grâce à son inspiration surnaturelle, j'ai repris d'une main de fer les rênes de son culte.**En premier lieu, j'ai purgé notre ordre de tous ses membres inutiles : cela leur faisait courir autant de risques qu'à nous pour un résultat insatisfaisant.*Après cette tâche ingrate, j'ai eu beaucoup de temps pour planifier sans faille la venue d'Akbaa. Notre ordre devait rester d'une discrétion absolue jusqu'à ce qu'il soit trop tard pour faire la moindre chose contre nous.**C'est alors que j'appris que Falan Orbiplanax avait deviné mon plan et qu'il espérait bien contrer la venue d'Akbaa avec l'aide du Noden.*Pour éviter toute réaction du Noden, je pris deux décisions majeures : premièrement, j'envoyai un assassin tuer Orbiplanax qui devenait trop dangereux pour nous.**Deuxièmement, j'ai avancé la date d'arrivée d'Akbaa. Tout n'était pas encore prêt pour lancer son invocation, mais j'ai donné ordre d'augmenter la fréquence des  sacrifices des incroyants en enlevant un grand nombre d'entre eux.*Tout m'aura été bon pour ce faire : femmes, enfants, je ne pouvais plus être regardant...*J'ai fait également augmenter l'intensité de nos prières envers Akbaa, favorisant de plus en plus les sacrifices personnels des membres du culte pour qu'Akbaa entende enfin nos suppliques.**Ce faisant, jour après jour j'ai été émerveillé par la somme de connaissance et de pouvoir qu'Akbaa a mis à ma disposition. Le plus stupéfiant reste encore qu'il a promis de m'en donner bien davantage lors de son arrivée, et notamment il laissera la destinée d'Arx entre mes mains."
////////////////////////////////////////////////
[description_book_cook]
string="La cuisine pour les gobelins. Par Durey Palua"

[book_cook_content]
string="La recette pour faire des Ciambels.** Mélangez le sucre avec la farine.**Rajoutez une mesure d'eau et malaxez la pâte pour obtenir quelque chose d'homogène. **Lorsque c'est fait mettez au four en faisant bien attention de ne pas brûler le tout.**Une fois que c'est cuit, prenez un oeuf de poule et mélangez bien le jaune et le blanc.**Etalez cette mixture sur votre gâteau cuit et remettez au four pour un tout petit moment."
////////////////////////////////////////////////
[description_book_music]
string="Une note de musique. Par Fazzi."

[book_music_content]
string="La flûte est probablement l'un des instruments des plus subtils.**Vous verrez qu'il est aisé d'apprendre à en jouer mais que par contre, en devenir un virtuose n'est pas chose aisée.*Voici votre première leçon si vous désirez vous familiariser avec cet instrument.**Il y a différents types de flûtes de par le monde mais la plus courante fonctionne comme suit.*Elle comprend les 4 notes basiques plus 4 notes modifiées par l'obstruction du trou du bas de le flûte lorsque l'on joue les 4 notes basiques.*Nous les appellerons 1, 2, 3, 4 pour les quatre premières notes et #1, #2, #3 et #4 pour les quatre notes modifiées.**Un morceau de musique très facile pour s'entraîner est ce que j'ai appelé "L'hymne de Fazzi", il se joue comme suit : 1 1 #1 3 4 1 1 2."
////////////////////////////////////////////////
[description_book_weapon]
string="La théorie de l'arme ultime. Par Kartok."

[book_weapon_content]
string="J'ai parcouru de nombreuses contrées pour rechercher une arme ultime.*J'y ai passé nombre de mes jeunes années et n'ai pas ménagé mes efforts, jusqu'à ce que je réalise que mes efforts étaient vains.*Vains car la seule façon d'obtenir une arme ultime est de la créer.**Pour créer une arme de la sorte, il faut trouver le meilleur métal qui sera forgé dans la meilleure forge et ensuite enrichi magiquement par le meilleur enchantement.*Pour ce qui est du métal, cela est très important de choisir le meilleur métal parce qu'il ne représente pas seulement la finesse de l'arme ou sa solidité mais il faut qu'il soit en plus capable de recevoir puis de stocker une grande énergie magique.**En outre le poids du métal conditionnera la maniabilité de l'arme et l'efficacité de sa puissance de pénétration.**La plupart des gens utilisent le fer pour forger leurs armes, parce que le fer est le métal le plus commun.*Mais le meilleur métal connu à ce jour (et à mon sens le seul à employer si l'on veut forger une arme ultime) est le mithril, le plus résistant et le plus dur jamais découvert. Il peut en outre produire le meilleur alliage s'il est mélangé à un autre composant.**Il faut toutefois choisir le composant à mélanger au mithril avec soin, n'employer que les matériaux les plus rares et qui renferment une valeur mystique intrinsèque.*Malheureusement le mithril (pourtant indispensable) est pratiquement impossible à trouver. Néanmoins, si un morceau de ce fabuleux métal pouvait être découvert l'étape suivante est d'aller voir le meilleur forgeron pour façonner l'arme.*Je n'entrerai pas dans de longs débats philosophiques et vous exposerai ici mon avis le plus éclairé : à mon sens, les meilleurs forgerons font partie du peuple nain.**Toute leur tradition repose sur le travail de la pierre et du métal et ils en sont arrivés à une telle maîtrise dans leur artisanat que même les outils qu'ils emploient pour leurs forges n'ont plus rien à voir avec ceux des autres races. Ce sont les seuls capables dans leurs forges de créer les plus aiguisées et léthales des armes.**La forge est une étape importante car l'arme devra être, une fois achevée très réceptive à la toute première magie portée dessus puis pouvoir la conserver en elle éternellement.**Car justement, la dernière étape est l'enchantement.**Plusieurs choses peuvent magiquement améliorer une arme, le tout est de choisir avec soin le composant que l'on lie avec l'arme au moment de l'enchantement.*Je donne ici quelques exemples des enchantements les mieux connus, la qualité ultime de l'arme reposant plus sur le métal employé et sa forge que sur le choix du composant à lier...*Voici quelques exemples, mais notez bien qu'un objet ne peut etre enchanté qu'une fois:**-l'ail confère une plus grande maniabilité à une arme.*-De la poudre d'os accroît la puissance d'une arme, la plus efficace des poudres d'os est celle des os de dragon.*- La pierre d'Amikar procure à une arme une résistance hors du commun. Une fois enchantée, la lame semble indestructible.*-un oeuf de dragon permet à une arme d'augmenter les dégâts aux objets qui sont dans son matériau, ainsi une arme d'acier enchantée fera plus de dégâts sur les objets en acier "
////////////////////////////////////////////////
[description_book_noden]
string="Les règles du Noden, la dimension des dieux. Par le libre penseur Aran Salar, archives (Tome 1)."

[book_noden_content]
string="Le Noden, royaume des dieux existe sur une dimension qui est bien loin de la nôtre.*Toutefois de temps en temps des ponts entre cette dimension et la nôtre sont créés permettant le voyage de l'une à l'autre. Cela peut arriver lors de conjonctions astrales favorables comme des éclipses ou de grands cataclysmes naturels comme des raz de marée.**La dimension du Noden fonctionne comme suit : il existe une énergie ambiante et résiduelle qui se dégage de toutes les dimensions des univers connus et qui converge vers le Noden.*Cette énergie représente la puissance de l'inconscient collectif des personnes pensantes qui peuplent ces dimensions. Elle renferme les désirs, les peurs et plus généralement toutes les croyances de ces êtres.**Ainsi à chaque fois qu'un être croit en une divinité, lui donnant un nom, une cristallisation de cette entité se forme sur le Noden.*Au début, ce dieu nouveau-né est très faible et totalement sans défense, mais au plus il aura de croyants et au plus il gagnera en subsistance à l'intérieur du Noden.**Ces dieux sont souvent priés en attente de quelque chose de bien précis de la part de leurs adeptes. Suivant son bon vouloir et la puissance que ce dernier a acquise, il peut récompenser ses adeptes par de la puissance matérielle et des pouvoirs variés, ce qui renforce la foi que l'on peut avoir en lui.**Par contre, si plus personne ne croit en un dieu donné, ce dernier commence à décliner pour être réduit à son ultime stade en une petite forme ectoplasmique, faible reflet de sa gloire passée.**Il est à considérer que Krahoz et Zohark ont tous deux une place de choix au sein du Noden, eu égard à l'adoration qu'ils continuent de susciter parmi nous.**Le Noden comprend une organisation 'administrative' qui gère l'attribution des résidences des dieux selon leurs adorateurs, qui vérifie que les dieux n'outrepassent pas leurs droits et qui archive les croyances drainées des autres dimensions.*Cette organisation comprend elle aussi une hiérarchie et au sommet de celle-ci se trouve la race des Sybartas, les penseurs.**Sylib Nurath, qui gère les interférences entre le Noden et les autres dimensions est l'un d'entre eux.**Une autre race, celle des Volks existe, ceux que l'on pourrait appeler les serviteurs des Sybartas, n'accomplissent généralement que des tâches répétitives et subalternes."

////////////////////////////////////////////////
[description_book_noden_v2]
string="Les règles du Noden, la dimension des dieux. Par le librepenseur Aran Salar, archives (Tome 2)."

[book_noden_content_v2]
string="Les lois du Noden sont implacables et nul (même un dieu) ne doit les transgresser.**La première d'entre toutes, la plus importante est qu'aucun dieu ou prince-démon ne doit quitter la dimension du Noden (article 1, chapitre 1) parce que les conséquences de la présence d'un dieu ou d'un prince-démon dans une quelconque autre dimension seraient terribles pour l'équilibre des univers.*Un dieu qui réussirait une telle chose gagnerait un pouvoir quasi-infini et pourrait agir dans tous les niveaux de l'existence et de la réalité de chaque dimension à mesure que son pouvoir grandirait.**C'est pourquoi les dieux et princes-démons peuvent interagir avec les dimensions où on les adore en y envoyant des signes, des rêves et parfois en y inspirant un humain à qui ils confèrent des pouvoirs variés, mais ils ne peuvent en aucun cas s'y rendre directement.**Les quelques dieux à avoir voulu tenter une incursion dans une autre dimension croupissent maintenant dans d'immenses cristaux appelés 'Gemmes du Noden' où ils ont été enfermés par les gardiens qu'a dépêché Sylib Nurath pour les ramener.*Les gardiens sont en effet des êtres supérieurs créés par les Sybartas et mandatés par le Noden qui leur fait traverser les dimensions.*Ce ne sont pas des dieux mais ils représentent une sorte de 'milice des dieux' chargée de faire respecter dans les dimensions les règles du Noden.**Au départ, les Sybartas les avaient dotés de très grands pouvoirs pour ramener au plus vite les quelques dieux qui voulaient accomplir 'le grand saut', mais constatant également les dégâts que leur débauche de pouvoirs pouvaient causer sur les dimensions où ils étaient envoyés, ils convinrent rapidement de ne les doter que des stricts pouvoirs minimum nécessaire à l'accomplissement de leur mission.**Ils sont par contre dotés d'une très grande capacité d'adaptation et d'apprentissage qui leur permet d'employer au mieux toutes les ressources qu'ils pourraient avoir à leur disposition.*Cette limitation de puissance des gardiens permet également de prévenir une tentative de déification de ces derniers une fois arrivés dans la dimension qu'ils doivent sauver.**L'accessibilité à la dimension du Noden est impossible aux mortels et un dieu qui veut traverser les dimensions a besoin d'un corps d'accueil.*Généralement ces derniers utilisent celui de leur invocateur qui est bien souvent heureux de s'offrir ainsi en sacrifice.**Le Noden garde enfin toute trace de dieux existant ou ayant existé :*les légendes d'autres dimensions mentionnent ainsi Akbaa, Ftaghn-Nayak, Zeus, Zlardos le vil, THrn-Glrn, Alador et bien d'autres..."
////////////////////////////////////////////////
[description_book_war_magic]
string="La guerre des mages. Par Ourfas Befed"

[book_war_magic_content]
string="Lorsque les humains vivaient à l'extérieur, la magie était enseignée dans des écoles de magie qui inculquaient à leurs élèves les différentes pratiques possibles de cet art.**Certains utilisaient la magie des éléments, d'autres se trouvaient des affinités avec les illusions et même quelques nécromants pouvaient y apprendre leurs pratiques en de rares endroits spécialisés.**Les styles de magie étaient très variés et chacun comprenait sa propre philosophie, croyance et tabous.*Inévitablement, ces théories de la vie s'affrontèrent et certains mages essayèrent d'imposer leur façon de voir les choses à d'autres utilisateurs de magie.**Cela déboucha sur une guerre terrifiante.**En effet, aucune des tendances développée n'était véritablement plus forte qu'une autre, de sorte que chaque bataille était très équilibrée.*Et au fil des affrontements, chaque faction se mit principalement à utiliser un même sort pour vaincre ses ennemis. Le sort permettant de drainer le mana de son adversaire était effectivement le sort ultime puisque laissant un ennemi exsangue incapable de former la moindre rune contre vous...**Les mages se retrouvèrent alors dans une impasse, les batailles ne se résumant plus qu'à un affrontement de rapidité entre deux jeteurs de drain de mana.**C'est alors que l'ordre des soeurs de l'Ederneum aida le collège magique royal en lui fournissant un objet de grande puissance.**Cet objet se constituait de deux éléments qui, une fois assemblés permettaient à un sorcier de conserver toute son énergie magique, même si on tentait de la lui drainer.**Ces deux éléments furent appelés Krahoz et Zohark en la mémoire de deux dieux anciens.**Aussitôt que cet objet fut utilisé, le conflit cessa, tous les opposants admettant la supériorité du porteur de l'artefact.*Krahoz et Zohark furent alors donnés au roi d'Arx et depuis sont transmis à sa descendance." 
////////////////////////////////////////////////
[description_book_day]
string="Le jour où il vint."

[book_day_content]
string="Ces faits sont relatés par le seigneur Long, créateur et haut prêtre de l'ordre noir, année 199.***********Au moment où c'est arrivé, j'étais un brillant ambassadeur au service du royaume d'Arx.*Nous vivions alors encore à l'extérieur où le soleil brillait de tout son éclat.**Le 37 ème jour de l'année 216, j'étais à l'observatoire lorsqu'il y eut une éclipse solaire et je vis une météorite qui tomba du ciel en direction de notre région.*Quand elle heurta le sol, il y eut un terrible tremblement de terre. J'ai tout de suite pensé que c'était la fin du monde, puis comme les choses se calmèrent, je suis allé à l'endroit de l'impact.**A l'instant où mes doigts se sont posés sur la pierre extra-terrestre, une vision m'assaillit et me jeta dans l'inconscience.*Et quelque chose commença à me parler durant cette période d'inconscience.*La voix m'expliqua qu'il était ici pour sauver notre monde, et qu'il allait me montrer le chemin de la connaissance.**Je sentis des mains géantes me saisir et j'entendis des murmures s'adresser à moi dans une voix profonde et gutturale. Depuis, je vis de nombreuses choses allant du début des âges à maintenant, je connus son nom, le nom de mon Dieu : Akbaa, seigneur incontesté d'Arx.**A ce moment je sus quelle était ma mission : aider Akbaa à trouver des adeptes qui croient en sa puissance.*Au plus je trouverai d'adeptes, au plus la force de mon Dieu sera grande. Il pourra alors se tranférer sur Arx et faire de moi le maître du monde.**J'ai donc créé un temple en son honneur, dans des souterrains non loin de notre ville en son honneur et pour répandre sa religion. Il me fallut aussi transformer la météorite de Kolkt en focus d'énergie.**Le seul moyen de satisfaire mon Dieu était de lui offrir des sacrifices d'êtres pensants. Certains d'entre eux étaient volontaires, les autres étaient des non-croyants. Mon adoration et mon amour envers lui furent récompensés par de nombreux pouvoirs et l'enseignement de sorts magiques, faisant de moi bien plus qu'un simple humain.*Une puissance qui fit trembler bien des non-croyants..."
////////////////////////////////////////////////
[description_book_chicken]
string="Le pouvoir des poulets, par le seigneur Inut, fermier de Liukalau"

[book_chicken_content]
string="J'ai consacré toute ma vie à l'étude de ce stupéfiant animal : le poulet.**J'ai peine à croire que des horribles sorciers puissent sans vergogne utiliser si souvent ces merveilleuses créatures pour effectuer de noirs rituels, les sacrifiant ainsi à leur magie.*Je suis persuadé que les poulets sont les animaux les plus intelligents de notre monde, qu'ils sont nantis de beaucoup d'intuition et d'humour.**La race des poulets comprend 57 espèces différentes, toutes plus étonnantes les unes que les autres avec chacune sa propre culture et ses habitudes de vie.**J'ai passé 8 ans, nuit et jour au contact des poulets pour essayer de les comprendre. J'ai même commencé à apprendre à marcher comme eux pour leur montrer mon respect.**Après beaucoup de concentration et quelques rituels, j'ai développé un moyen de me métamorphoser moi-même en poulet. Je suis donc en quelque sorte un poulet-garou et je me transforme en poulet lorsque la lune m'est favorable.*Cette nouvelle capacité a bien évidemment beaucoup favorisé mon étude. J'ai ainsi pu vivre avec les poulets, manger ce qu'ils mangent, ressentir ce qu'ils ressentent danser et même discuter avec eux...**Leur langage est d'ailleurs extrêmement complexe. Je vous livre ici quelques exemples de traduction du poulet à l'humain :**Cot veut dire bonjour ;*Coot ?! signifie Qu'est-ce que tu fais ? ;*Cot ! indique que ce qu'on s'apprête à faire est interdit.*Coootcot marque un intérêt prononcé.**Je pourrais bien sûr entrer plus en détail dans les traductions pour vous signifier toutes les nuances des coot mais je pense que ce simple aperçu devrait suffire à l'intelligence d'un être humain normal.**Ce que j'ai découvert à propos de l'intelligence des poulets est à quel point leur sens de l'altruisme est prononcé.*Dans une communauté de poulets, le mâle dominant recherche aux alentours s'il ne se trouve pas de nourriture. Puis, lorsqu'il en a trouvé, il se met sur une seule patte et lance un grand 'cooooooot', qui attire le reste de la communauté vers la nourriture pour se sustenter, lui-même observe tout cela d'un oeil bienveillant et ne se sert qu'en dernier.**Dans mes expériences, j'ai essayé de pondre un oeuf depuis des années toujours sans succès... Une récente étude me fait penser que ça viendrait de mon sexe masculin mais je ne peux me résoudre à une explication aussi simpliste. C'est pourquoi j'espère encore..."
////////////////////////////////////////////////
[description_book_mine_log]
string="Carnet de bord des mines, par Isep Ethan, contremaître"

[book_mine_log_content]
string="Rapport 87 - année 266, saison brune, troisième jour de la semaine de l'aigle.**Après des semaines et des semaines de dur labeur nous avons enfin découvert une veine de mithril.*Les compagnons ont tous explosé de joie, les larmes aux yeux devant son affleurement.*Elle est située loin à l'est.*Comme elle est assez loin de la salle de broyage, nous avons construit une voie d'accès par des chariots qui transportera le minerai directement en salle de broyage.*********Rapport 88 - Année 266, saison brune, deuxième jour de la semaine du rat.**Après la découverte de la veine nous avons creusé un peu dans toutes les directions à partir de sa position initiale.*Lorsque nous avons miné vers le nord, nous avons découvert une cavité étrange. Elle semble à la fois naturelle et pourtant artificiellement creusée. Il y avait une forte odeur de fauve qui en émanait et je crois que cela doit être la tanière de quelque animal.**Comme nous sommes la semaine du rat, j'ai un peu peur de ce que l'avenir nous réserve..."
////////////////////////////////////////////////
[description_book_forge_manual]
string="Manuel d'utilisation de la forge"

[book_forge_manual_content]
string="Le façonnage d'objet metallique nécessite l'emploi de deux machines. Tout d'abord vous devez utiliser le façonneur de lingots : cet appareil fondra votre minerai pour obtenir un lingot calibré. Voici les différentes étapes pour obtenir un lingot :**1) Placer une pierre de pouvoir dans la machine pour lui fournir l'énergie.**2) Mettre deux morceaux de minerai de bonne taille dans le four. Bien faire attention à ne pas mettre deux types différents de minerai.**3) Ajouter un réactif éventuel si le besoin s'en fait sentir pour le lier au métal.**4) Actionner le levier pour obtenir le lingot.*****Ensuite la fonderie minute doit être employée comme suit :**1) Placer une pierre de pouvoir dans la machine pour lui fournir l'énergie.**2) Placer le moule correspondant à l'objet à former dans le fondeur.**3) Placer le lingot dans le four.**4) Actionner le levier pour obtenir l'objet désiré."
////////////////////////////////////////////////
[description_book_art_of_making_potions]
string="La magie des potions. Par Cyro Besali"

[book_art_of_making_potions_content]
string="Concocter ses propres potions est à la fois simple et facile.*Cela nécessite simplement rigueur et patience.**Vous devez tout d'abord vous munir d'une fiole. Ensuite il vous faut le réactif spécifique à chaque potion.*Quand vous l'avez obtenu, vous devez le réduire en poudre dans un mortier, c'est ensuite que vous pourrez le mettre dans une fiole.*Il vous faut alors distiller la mixture.*La potion est prête.**Voici une liste de réactifs connus et reconnus :**pour des potions de mana utilisez de la poudre de lys (poudre bleue) ;**pour des anti-poisons efficaces utilisez des herbes médicinales (poudre violette) ;**pour une potion d'invisibilité, utilisez des perce-neige (poudre blanche) ;**pour faire du poison employer des fougères (poudre verte) ;**enfin pour des potions de soin, employez de la poudre de nénuphar (poudre orange)."

////////////////////////////////////////////////
[description_book_codex]
string="Le codex de l'ordre"

[book_edurneum_codex]
string="Ainsi va la peau du grand serpent, ainsi va la vie des reines - une renaissance doit être accomplie pour permettre à une nouvelle reine de venir - une femme de sang royal car seul le sang royal peut rendre honneur au Grand Serpent. - Par la troisième lune d'Ixos, le rituel de la révélation royale pourra être."
////////////////////////////////////////////////
[description_book_the_order]
string="L'ordre d'Edurneum. Par Efan Dirscue." 

[book_the_order_content]
string="On en sait très peu sur les soeurs de l'Edurneum. Même l'origine de ces créatures mi-femmes, mi-serpents nous est inconnue. Leur peau est par endroit couverte d'écailles.**Sont-elles d'une espèce d'une race très ancienne ou simplement des femmes victimes d'une mutation ?*Personne à part elles ne pourrait lever le voile du mystère.*Elles semblent adorer un dieu serpent mais rien ne nous est connu sur ce dieu et tous les secrets relatifs à son culte sont jalousement gardés par la sororité.*On suppose que les arts magiques ont été transmis à l'ordre par ce dieu mais sans en avoir de certitude absolue, comme aucune des autres informations que nous avons sur l'ordre...**Certaines légendes disent que l'adoration de ce dieu donnerait à ses servantes de forts pouvoirs magiques en même temps que cette mutation qui les transforme en serpent.*Mais ce fait n'a jamais été prouvé.**Depuis le déclin du soleil d'Arx, les soeurs ont été les meilleures alliées que les humains aient jamais eu. Quand notre race commença à devoir s'installer sous terre, elles offrirent leurs services en magie au roi pour faire naître une nouvelle variété de plante capable de pousser sans la lumière de l'astre solaire pour permettre de nourrir les humains et le bétail.**La population d'Arx a un grand respect pour les soeurs de l'ordre d'Ederneum et lui sera toujours reconnaissante pour ce qu'elles ont fait."
////////////////////////////////////////////////
[description_book_history_arx]
string="L'histoire d'Arx. Par Maioo Kasmadian." 

[book_history_arx_content]
string="Cinq tribus humaines vivaient sur le plus grand continent de notre monde.*Ces tribus étaient constamment en guerre et le fait de se structurer davantage n'a rien changé, bien au contraire.*Après des années et des années de guerres et d'accumulation de haine, un homme du nom de Poxsellis vint et réussit à unifier tous ces groupes.*Il devint le premier roi des humains.**Après la dernière bataille des boucliers brisés, en l'an 170, Arx vécut sa plus longue période de paix et de prospérité.**Durant le règne de Poxsellis en effet, la seule période noire furent les guerres philosophiques du conflit appelé 'La guerre des mages'.*Mais même si ce conflit fut brutal et mortel pour de nombreuses personnes, il dura en fait seulement quelques mois et n'eut pas d'influence sur le commandement politique de notre royaume.**Durant le reste du règne de Poxsellis, il eut à faire face à de nombreuses menaces.*Beaucoup d'invasions de gobelins furent repoussées alors que des hommes-rats commencèrent à s'installer dans les égouts de nos cités.**Les combats furent meurtriers et cette guerre injuste dura longtemps, mais les armées du royaume, menées par Poxsellis lui-même massacrèrent les ennemis.*Et à nouveau la paix régna sur Arx.**L'exploration des océans commença.**De nombreux bateaux de fort tonnage furent envoyés partout sur les océans pour trouver de nouvelles terres et de nouveaux trésors.*Mais en l'an 216, un météore tomba sur notre monde. Au départ, personne ne donna grand cas à ce phénomène mais certaines personnes visionnaires perçurent là que c'était un très mauvais présage pour le futur de Arx.**Et en effet, quelques années après ce désastre, notre soleil commença à décliner. La lumière se faisait de plus en plus rare et la température chuta dangereusement.*Notre tout jeune roi, Lunshire, le fils de Poxsellis, ordonna le déménagement de toute notre ville dans une ancienne mine naine proche.**Les travaux furent énormes mais tout le monde savait qu'il travaillait à son propre salut et personne jamais ne s'est plaint.**Un traité de paix avait été signé avec toutes les autres races, sauf les hommes-rats avec lesquels il est impossible de discuter mais dont les agressions se firent bien plus rares.**Tous s'activèrent au sauvetage d'Arx, au sauvetage de la vie.*Un traité fut signé, accordant à chaque race un niveau de l'ancienne mine en échange du travail fourni.**Tout cela dura cinq années pendant lesquelles le soleil finit de mourir. Tout fut fait pour sauver la population d'Arx mais beaucoup perdirent la vie.**Au départ, plus aucune nouvelle ne parvint des autres cités du continent, au plus pouvait-on légitimement penser que la plupart d'entre elles avait agi de même. Ce ne fut que bien plus tard, par la guilde des voyageurs que des nouvelles fraîches arrivèrent.**D'autres forteresses existaient bien, disséminées sur tout le continent, prisonnières d'une carapace de glace.**La guilde des voyageurs est maintenant la seule chose qui puisse relier ces cités et faire transiter parfois certains produits de luxe de l'une à l'autre.*A part ces contacts sporadiques, Arx vit en totale autarcie."
////////////////////////////////////////////////
[description_book_ancient_gods]
string="Les dieux anciens. Par Abdul Al Raïf." 

[book_ancient_gods_content]
string="Au commencement les dieux étaient tout-puissants. Ils régnèrent durant des éons sur Arx avant que les humains ne firent leur première apparition.**On sait très peu de choses sur les dieux d'alors car ils semblèrent être courroucés de la prolifération des humains et disparurent de la surface du monde.**Certains écrits très anciens relatent que cette disparition a été causée par le manque de foi que les premiers mortels leur avait témoigné.*Deux des dieux d'alors restèrent un peu plus longtemps que les autres avant de disparaître, il se nommaient Zohark et Krahoz.**Zohark était le plus puissant des deux : il était le tonnerre, il était les éclairs, il était les tremblements de terre, les tempêtes, les ouragans tout ce qui représentait les forces brutales de la nature.*Mais sa puissance ne pouvait se libérer que grâce à Krahoz.**Elle était la déesse de l'équité, gardienne de l'équilibre et de l'égalité.*Chacun avait besoin de l'autre, peut-être que c'est pour cela qu'ils restèrent présents plus longtemps que les autres dieux, mais finalement ils disparurent comme les autres.*Les temps modernes jeta à bas les anciennes croyances, les hommes, qui pouvaient produire de la magie par eux-mêmes contrôlaient à leur tour la terre et les éclairs.**L'homme entrait dans une nouvelle conception des choses où il croyait plus facilement en ses propres capacités et s'en remettait aux dieux seulement pour des choses accessoires, telles la fertilité ou les plaisirs.*Ils vénéraient également des dieux des négociations, de l'or, de la chance et même des dieux pour les démunis mais les premiers dieux, ceux des forces brutales de la création : ceux-là n'avaient plus de place au panthéon.**Depuis ces nouveaux temps et ce changement de foi, les dieux les plus puissants ont donc regagné leur propre dimension appelée le Noden où ils attendent de nouveaux adorateurs pour leur retour."
////////////////////////////////////////////////
[description_book_kings_arx]
string="Les rois d'Arx. Par Greenonic Warmhill." 

[book_kings_arx_content]
string="Poxsellis a été notre premier roi. Il a été le premier à unifier les cinq tribus humaines qui vivaient sur notre continent en l'an 170.**Ces tribus se comattaient sans cesse les unes les autres depuis toujours mais aucune n'était assez puissante pour asseoir sa suprématie sur les autres.*Poxsellis était bon et courageux et il défia et remporta un duel contre chaque chef de toutes les autres tribus durant ce que l'histoire a retenu comme étant la bataille des boucliers brisés.**Car avant de défier les chefs, Poxsellis s'était aventuré dans un temple abandonné dans la montagne des mines hurlantes. De ce temple, il avait ramené un bouclier enchanté qui lui permit de vaincre tous les chefs.**Dès qu'il fut lui-même le chef des cinq tribus, Poxsellis se proclama lui-même roi d'Arx. Après cela il régna sur le nouveau royaume d'Arx avec sagesse, équité et magnificence.**Il eut un règne long et prospère malgré des escarmouches avec les gobelins et les hommes-rats que son génie militaire parvint toujours à juguler.**Il n'eut toutefois pas vraiment beaucoup de chance avec sa descendance puisque ses deux premiers fils, Elios et Nickus, qui furent de bons combattants moururent du vivant de Poxsellis.**Heureusement à sa mort en 212 il lui restait un dernier fils, Lunshire pour lui succéder mais ce dernier était encore trop jeune.*Le seigneur Poncet prit alors la régence du royaume mais intrigua pour écarter Lunshire du trône. Il ne fut pas très populaire et ses manigances échouèrent puisque Lunshire succéda enfin à Poxsellis en l'an 215 à l'âge de 16 ans.**Le roi Lunshire eut tout de suite fort à faire puisque le soleil commençait à décliner sur notre monde.*Il fut donc l'instigateur de la migration souterraine de la population. Il fit vraiment tout ce qui était en son pouvoir pour sauver autant de population que les mines naines pouvaient en recevoir.**Son intelligence diplomatique fut aussi de signer un traité avec toutes les autres races de Arx, sans lesquelles le déménagement aurait pu prendre bien plus de temps et même être remis en question par la période glaciaire qui se rapprochait.**Le roi Lunshire honora la mémoire de son père en transférant son cercueil dans la nouvelle crypte souterraine, battie sur les fondations de l'ancien tombeau des mineurs de la forteresse naine pour que les gens gardent le respect de ce grand roi et ne l'oublient jamais."
////////////////////////////////////////////////
[description_book_great_inventions]
string="Les grandes inventions d'Arx. Par Edric Arol." 

[book_great_inventions_content]
string="L'imagination humaine a toujours apporté de fantastiques inventions à notre société. Tout le monde se rappelle des gigantesques ballons gonflables propulsés à l'air chaud qui nous donnèrent de grandes capacités d'exploration.*Ils nous donnèrent également un excellent système contre les invasions puisqu'ils permettaient une surveillance parfaite à des lieues et des lieues de distance.**Une autre des plus fabuleuses inventions jamais conçue fut celle du bateau sous-marin. **Ce genre de merveilleux bâtiment nous apporta de nouveaux moyens pour combattre les pirates et les flottes gobelines. Cela nous donna une supériorité navale durant la sombre période des troubles et des conflits.**Le seigneur Marko, créateur de cette invention sans prix est l'un des héros les plus reconnus de Arx. Mais la plus grande des inventions humaines reste sans conteste celle du royaume souterrain de Arx.*Ce n'est pas véritablement une invention mais la reconversion d'une construction préexistante. A la base, une ancienne mine naine avec un très performant système d'aération central.**Bien que ce soit déjà une construction splendide, elle devint encore plus impressionnante grâce à l'agencement que les humains en ont fait...*L'ancienne mine devint un véritable monde totalement autonome utilisant tout l'espace disponible. Chacune des races connue s'est vue octroyer un niveau, conformément au traité signé en l'année 217. Ce royaume est la démonstration flagrante de ce que la volonté humaine peut accomplir."
////////////////////////////////////////////////
[description_book_race_arx_content]
string="Les races d'Arx, Par Cebrafi Nin." 

[book_race_arx_content]
string="Les relations envers les différentes races d'Arx ont toujours été difficiles.**Les gobelins étaient la plus répandue de toutes les races, cela étant en partie dû à leur grand potentiel de fécondité. Mais comme ils n'arrivèrent jamais à s'organiser eux-mêmes en un royaume uni, ils perdirent petit à petit leur position prédominante.*A la base, les gobelins ne sont pas très intelligents. Ils possèdent leur propre langage et baragouinent généralement le langage humain. Ils cherchent toujours querelle, irritant constamment leur interlocuteur.*Ils sont aussi menteurs, lâches, arrogants et paresseux.*Le seul moment où les gobelins furent les alliés des humains fut pendant la période du grand traité. Ils aidèrent à la construction du royaume souterrain laissant leur agressivité naturelle et leurs mauvaises manières de côté. Mais après que le travail fut fait et une fois installés, ils revinrent à leur comportement passé.*Il semble que le commerce des gemmes soit la seule activité pacifique qui persiste entre les humains et les gobelins qui tolèrent ce genre de transaction.**Les trolls sont sensiblement différents.*Même s'il semble que leur origine soit liée à celle des gobelins, ils sont totalement différents de ces derniers. Leur volonté est très faible et ce sont des créatures qui semblent vivre au ralenti.*Ils ne sont pas agressifs et le plus souvent bienveillants. Mais leur force monstrueuse et leur endurance légendaire en font autant des alliés de poids que des adversaires mortels.*Leur vie est faite de choses simples comme trouver de quoi se nourrir ou encore un endroit pour dormir. A cause de leur faible mental, ils peuvent être facilement bernés, mais il vaut mieux en ce cas qu'ils ne s'en aperçoivent pas car leurs colères sont légendaires.**Les hommes-rats ont eux toujours eu très peu de contacts avec les autres races de Arx.*Ils ne communiquent pas à l'aide de mots mais plutôt par signes qu'ils agrémentent parfois de couinements.*Les hommes-rats sont particulièrement agiles, ce sont de redoutables adversaires en combat. Certains d'entre eux sont les plus grands assassins d'Arx. Ils sont très discrets et rapides, ils utilisent bien souvent des armes empoisonnées.*Ils vivaient généralement sous terre et dans les égouts des cités quand les humains vivaient à l'extérieur. Le fait de se nourrir de déchets et d'excréments semble tout à fait leur convenir.*Jusqu'à présent, toutes les rares confrontations avec les hommes-rats se sont avérées courtes et violentes. Ils firent quelques incursions dans les cités humaines pour fouiller les poubelles en quête de nourriture et d'objets rudimentaires. Depuis qu'ils se sont terrés dans la forteresse d'Arx, ils ont lentement perdu le contact avec toutes les autres races et se montrent d'une discrétion exemplaire.**Les nains ont une passion pour la mécanique et l'artisanat d'objet ainsi que dans l'ingénierie ; ce sont également les meilleurs forgerons que l'on ait jamais vu. Ils vivaient dans la forteresse souterraine bien avant que chaque race ne vienne sous terre.*Ils sont les seuls à savoir construire des mines et les exploiter correctement, et ils font souvent commerce des produits minés avec les humains.*Ils ont toujours eu des rapports détestables avec les gobelins et ils firent de nombreuses guerres dans le but d'éliminer cette race, mais sans succès.*Une de leur plus grande mine fut choisie comme refuge pour l'installation de la nouvelle Arx. Ils aidèrent énormément à construire toutes les infrastructures de base sur place et conduisirent bon nombre de travaux (hormis dans la partie gobeline). Eux-mêmes habitués aux profondeurs, ils déménagèrent plus profondément sous la surface du sol pour continuer à exploiter leurs mines.**L'origine des soeurs de l'Edurneum est inconnue.*Elles ressemblent à des hybrides de femmes et de serpent. Leur peau est couverte d'écailles.*On ne leur connait pas de représentants masculins. On ne sait rien non plus sur leur mode de reproduction.*Elles ont une considérable capacité à utiliser et à manipuler la magie, faisant d'elles les meilleures magiciennes d'Arx. Selon certaines légendes, elles seraient d'ailleurs à l'origine de la magie. Elles ont toujours été très proches de la race humaine, les aidant à chaque moment difficile de leur histoire.*Durant la migration, les soeurs firent le serment d'aider le roi des humains et firent pousser des plantes sous terre pour nourrir toutes les populations et le bétail.**On connait très peu de choses à propos des dragons. Toutefois, les érudits ont pû remarquer que chaque spécimen étudié présentait invariablement 4815 écailles."
////////////////////////////////////////////////
[description_book_known_gods]
string="Connaître les dieux et les démons. Par Bracconus, théologiste." 

[book_known_gods_content]
string="Alador, créé sur Omnys, dieu du bien.*Semble s'être retiré après avoir donné le libre-arbitre aux humains de sa dimension et surtout la capacité à contrôler leur destinée.*On le suppose très puissant, il n'a pourtant jamais fait étalage de sa puissance avant de quitter la dimension d'Omnys.**Xarm, créé sur Omnys, dieu mauvais :*exactement le contraire du précédent.*Xarm en a voulu énormément à Alador de l'indépendance donnée aux humains. Voyant qu'il ne pouvait la leur retirer, il entreprit de tous les mettre sous sa coupe en les réduisant en esclavage.**Akbaa, créé sur Koltk, dieu mauvais :*Appelé le dieu de la destruction parce qu'il a totalement détruit Koltk, il fut initialement adoré pour aider ses adeptes durant leurs guerres et leurs conflits.**Tirkio, créé sur Arx, dieu du bien :*déteste la futilité des gens riches. Il vaut mieux vous défaire de votre or avant de négocier quoi que ce soit avec lui."
////////////////////////////////////////////////
[description_book_landscapes]
string="Paysages du monde extérieur" 

[book_landscapes_content]
string="Paysages de monde extérieur"
////////////////////////////////////////////////
[book_calpal_journal] 
string="Année 238, saison verte, 2 ème jour de la semaine de l'araignée :*Carlo m'a demandé de suivre la reine. Etrange mission ; il a essayé de me faire le coup du bon vieux temps où j'étais mercenaire pour le royaume mais cette fois-ci j'ai réclamé de l'argent pour faire ça.**Année 238, saison verte, 5 ème jour de la semaine du chat :*en suivant la reine, je l'ai vue laisser tomber une lettre derrière la statue proche de la crypte. J'ai attendu qu'elle parte avant de recopier rapidement ce qu'il y avait d'écrit...*Je suis sûr que Carlo sera enchanté de ma découverte.**Année 238, saison verte, 6 ème jour de la semaine du chat :*mission accomplie ; la reine est morte et tout le monde pense que les coupables sont ce groupe de rebelles qui a kidnappé l'héritier royal."

//** this book is in the human library now
[description_book_traveler_guild]
string="La guilde des voyageurs. Par le sage Dormal"

[book_traveler_guild_content]
string="La guilde des voyageurs fut la première institution créée à la chute du soleil de Arx.*Son origine tient à quelques survivants irréductibles qui n'avaient pas voulu rejoindre les profondeurs de la terre dans les forteresses où la quasi-totalité de la population s'était réfugiée. Ces rares survivants développèrent des techniques de résistance au froid renforcée par l'absorption de drogues alchimiques.**Ils se construisirent leurs propres abris faits de glace et élevèrent des chiens qui eux aussi savaient résister au froid.*Ils furent rejoints par d'autres hommes et femmes qui n'avaient pas peur d'avoir froid et qui voulaient à nouveau s'aventurer à l'extérieur ou rejoindre d'autres cités.**De ces voyages fut née la guilde des voyageurs, qui est maintenant le seul lien qui subsiste entre les cités enfouies. Ils sont toujours respectés et attendus avec impatience dans toutes les cités car ce sont les seuls à pouvoir amener des nouvelles de l'extérieur."

