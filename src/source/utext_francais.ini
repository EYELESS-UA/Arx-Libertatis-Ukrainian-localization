[insanity_choose_difficulty]
string="Choisissez le niveau de difficulté des combats:"

[insanity_button_difficulty_normal]
string="Normal"

[insanity_desc_difficulty_normal]
string="Une expérience tranquille pour les nouveaux joueurs. Les dommages et stats des ennemis sont réduits. La récupération de Santé est activée et les potions/objets sont plus puissants."

[insanity_button_difficulty_insanity]
string="Insanity"

[insanity_desc_difficulty_insanity]
string="Challenge accru pour les joueurs expérimentés. Les ennemis infligent des dommages accrus et sont plus perceptifs, leurs stats sont améliorées. Plus d’ennemis, la récupération de santé est désactivée et les potions/objets sont moins efficaces."

[insanity_button_difficulty_nightmare] //secret difficult
string="Cauchemardesque"

[insanity_desc_difficulty_nightmare]
string="Une expérience secrète dans une difficulté extrême (Non recommandé lors de la première exploration du jeu). Les ennemis infligent des dommages démesurés, sont extremement perceptifs et sont rapides, stats hardcore. Encore plus d'ennemis, la récupération de santé est désactivée et les potions/objets sont moins efficaces."

[insanity_desc_immersive_mode]
string="Activez ce mode seulement si vous voulez jouer en immersion ou avoir un écran épuré, cachant tous les éléments de l’ATH excepté l'essentiel tel que l'inventaire, les livres et l'icône de changement de niveau. Le mode immersif peut être activé ou désactivé à tout moment dans le menu des options (Configuration vidéo)."

