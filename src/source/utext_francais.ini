[player_alia_real_introduce_05A]
string="N'aies crainte, je ne te trahirai pas."

[player_alia_real_introduce_05B]
string="Quel est cet objet que tu veux que je retrouve ?"

[Alia_real_introduce_06]
string="Une vieille légende parle d'un objet appelé 'le bouclier des anciens'. Ce bouclier fut enterré avec un grand guerrier il y a de nombreuses années. J'ai envoyé quelques expéditions à la crypte pour le récuperer mais aucune n'est revenue. Ramène-le moi et je te donnerai Krahoz."

[player_alia_real_introduce_06]
string="Je vais voir ce que je peux faire pour ramener ce bouclier."

[Alia_real_introduce_misc]
string="N'oublie pas que je te fais confiance, Am Shagar."
string2="Ramène moi ce bouclier et Krahoz sera à toi"
string3="Tu vois, ces fameux rebelles ne sont pas si terribles que ça, finalement..."

// when player comes back with the shield
[Alia_player_with_shield_01]
string="Mes espions m'ont dit que tu me ramènes le bouclier ?"

[Player_Alia_back_with_shield_01]
string="Le voilà."

[Alia_player_back_with_shield_02]
string="Merci infiniment, Am Shagar. C'est bien plus qu'un bouclier pour moi, car il a appartenu à mon grand-père, le roi Poxsellis..."

// les répliques back_with_shield qui suivent sont les fameuses qui peuvenrt être dites indifféremment lorsque c'est le bouclier ou Krahoz qui est amené à Alia. Par contre, on ne les dit qu'une fois (pour Krahoz ou le bouclier).
[Player_Alia_back_with_shield_02]
string="Grand-père... Alors tu es..."

[Alia_player_back_with_shield_03]
string="Alia, fille du roi Lunshire et de la reine Florence, princesse d'Arx..."

[Player_Alia_back_with_shield_03]
string="Pourquoi rester cachée ? Pourquoi ces gens t'ont-ils enlevée à ton père ?"

[Alia_player_back_with_shield_04A]
string="Ces 'gens' comme tu dis sont mes protecteurs. Ils forment 'L'Epée Sacrée', un ordre secret fondé par le roi Poxsellis lui-même dont la mission est de protéger le royaume d'Arx et la royauté."

[Alia_player_back_with_shield_04B]
string="Ce ne sont pas les assassins de ma mère. Ils m'ont retrouvée près de son cadavre, peu après ma naissance. Son meurtrier nous est toujours inconnu."

// dans le cas où l'affaire du fantôme de Florence a été rondement menée et le meurtrier arrêté ou tué => 2 répliques en plus.
[Player_Alia_back_with_news]
string="Son assassin a été identifié et a payé pour son geste."

[Alia_player_back_with_news]
string="J'en suis soulagée..."

[Player_Alia_back_with_shield_04]
string="Mais pourquoi te caches-tu ?"

[Alia_player_back_with_shield_05]
string="Les femmes-serpents de l'ordre d'Edurneum veulent me supprimer, pour une raison qui m'est encore inconnue. L'ordre de l'Epée Sacrée le savait déjà avant ma naissance. Ses membres ont procédé à mon enlèvement pour protéger la descendance du royaume. Avoir recours à la guilde des voyageurs pour m'éloigner d'Arx et de ces femmes-serpents aurait été inutile: leur ordre a des ramifications partout..."

[Player_Alia_back_with_shield_05]
string="Ton père est au courant de tout cela ?"

[Alia_player_back_with_shield_06A]
string="Non, il ne sait même pas que je suis encore en vie ! Et pour lui l'ordre de l'épée sacrée n'est qu'un ramassis de rebelles. Je préfère d'ailleurs, pour sa propre sécurité que cela continue ainsi... Ne lui dis rien de notre conversation."

[Alia_player_back_with_shield_06B]
string="Comme promis je vais te laisser aller chercher Krahoz qui est conservé dans notre donjon. Les gardes te laisseront passer. J'espère que tu en feras bon usage."

// Dans le cas où le joueur veut donner Krahoz ou Zohark à Alia avant d'avoir les deux.
[alia_player_bring_krahoz]
string="Ce geste est très généreux Am Shagar, mais je crois que tu auras besoin de cet objet dans ta propre quête..."

//if player stole krahoz
[alia_krahoz_stolen]
string="Si nous mettons la main sur le misérable qui a volé Krahoz, nous lui enseignerons le véritable sens de la souffrance. Pourrais-tu te joindre à nos efforts Am Shagar ? Si tu trouves le coupable ou que tu nous ramènes Krahoz, je te récompenserai personnellement..."

[alia_krahoz_stolen_misc]
string="S'il te plait, ramène-nous Krahoz..."
string2="Apporte-moi la tête du voleur..."

// if player brings stolen krahoz back
[player_bring_stolen_krahoz]
string="J'ai trouvé et exécuté le coupable. Voilà Krahoz..."

// Cette réplique sert aussi s'il rapporte le bouclier alors qu'il a volé Krahoz sans se faire voir. En ce cas on enchaîne par la suite sur les répliques où elle parle de son grand-père.
[alia_stolen_krahoz_thanks]
string="Tu es vraiment capable de tous les exploits, Am Shagar. Voici de l'or pour ta peine..."

[player_bring_stolen_krahoz2]
string="Je fais ce qui me semble juste..."

// 2 répliques
// ces répliques ont un lien avec l'histoire du grand-père. Elle se déclenche si le joueur (qui n'a pas donné le bouclier à Alia) lui donne zohark & Krahoz. A ce moment, elle a cette réplique puis on enchaine sur les Player_Alia_back_with_shield_02 et suivantes. Ces répliques ne seront pas redites si le joueur lui donne le bouclier car elle le refusera.
