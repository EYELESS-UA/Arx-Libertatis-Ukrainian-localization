//  final fight  //
///////////////////

[Iserbius_akbaa_final_fight] //Voix qui change progressivement pour passer de celle d'Iserbius à Akbaa
string="Vous arrivez juste quelques secondes trop tard : je peux maintenant vous faire face, gardien... Je ne retournerai jamais sur le Noden, mais toi, par contre, tu vas y retourner tout de suite !"
// Then, the cinematic will stop and the player will take control of the game again.

[akbaa_final_fight]
string="Vous arrivez juste quelques secondes trop tard : je peux maintenant vous faire face, gardien... Je ne retournerai jamais sur le Noden, mais toi, par contre, tu vas y retourner tout de suite !"

