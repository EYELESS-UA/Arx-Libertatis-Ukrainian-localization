// lorsque le joueur arrive, le roi est avec Felnor et Carlo discute avec lui, lui apportant une bien triste nouvelle...
[carlo_statue_guard_post_attack]
string="Majesté, notre avant-poste a été attaqué par les Ylsides. Cette fois-ci, il n'y a pas eu de survivants. De plus, nous n'avons pas retrouvé tous les corps. Peut-être ont-ils été enlevés..."

[king_statue_damned_where]
string="Diantre ! Où donc ont-ils pu être emmenés ?"

[carlo_statue_dont_know]
string="Nous n'en savons rien. Ils ont été rapides et impitoyables, ils sont redoutables sire."

[king_statue_supposed_linked]
string="Je suppose que ces Ylsides font partie du culte d'Akbaa..."

[player_statue_you_mean]
string="Sous les ordres d'Iserbius ?"

[king_statue_no_proof]
string="Je n'ai pas vraiment de preuves, mais on a commencé à entendre parler d'eux avec l'apparition du culte d'Akbaa... Et il y a autre chose : Suiberis a quitté le royaume récemment. Il a dû sentir que nous allions découvrir toute la vérité sur lui..."

[player_statue_what_truth]
string="Quelle vérité ?"

[felnor_statue_have_figured]
string="Suiberis et Iserbius ne font qu'un... C'est lui le commanditaire du meurtre de Falan..."

[player_statue_why_iserbius]
string="Je comprends maintenant pourquoi Iserbius m'attendait au temple ! Il savait que j'allais venir !"

[king_statue_so_am_shagar]
string="Alors, vous l'avez combattu ! Enfin une bonne nouvelle... Am Shagar, dites-moi que vous avez définitivement détruit la source du mal."

[player_statue_sorry]
string="Non. Je n'ai pas pu détruire la statue. C'était comme si elle drainait mes forces..."

[king_statue_damned]
string="Diantre ! Comment cela est-il possible ! Felnor, Comment expliquez-vous cela ?"

[felnor_statue_mhh]
string="Mhh, je redoutais cette hypothèse... La pierre est maintenant en résonnance avec Akbaa et le canal de puissance draine votre énergie magique et physique pour la transmettre à Akbaa... En fait, en la touchant vous avez envoyé une partie de votre propre énergie à notre pire ennemi..."

[king_statue_damned2]
string="Mais il doit y avoir une solution pour empêcher cela tout de même..."

[felnor_statue_mhh2]
string="Lors de la terrible guerre des mages, voilà bien longtemps, les drains d'énergie étaient courants et il existait des moyens de prévenir ces désagréments..."

[king_statue_can_guess]
string="Je crois comprendre Felnor, mais même mes meilleurs hommes ont toujours échoué dans cette quête."

[felnor_statue_not_best_man]
string="Am Shagar n'est pas votre meilleur homme sire, il est un gardien, un envoyé des dieux..."

[player_statue_apreciate_explanation]
string="Même si mes chances de réussir sont infimes, je détruirai cette statue..."

[felnor_statue_your_only_chance]
string="Votre seule chance est de ne pas subir le drain d'énergie vitale et magique occasionné par le météore. Pour ce faire, lors de la guerre des mages, le royaume de Arx avait reçu un objet magique de grande puissance de la part de l'ordre d'Edurneum. Sans lui, nous aurions probablement perdu cette guerre. Cet artefact légendaire était constitué de deux parties : Krahoz et Zohark. Un magicien en possession de ces deux parties était capable de résister à n'importe quelle tentative de drain d'énergie. C'est grâce à cette protection que la guerre fut gagnée."

[player_statue_where_the_problem]
string="Bien, il suffit alors de me donner cet objet..."

[felnor_statue_more_complicated]
string="C'est là que réside toute la complexité de la chose... En effet, lorsque cet objet nous fut confié, un traité fut signé par Poxsellis, le père de notre actuel roi, avec l'ordre d'Edurneum. Ce pacte stipulait que nous devions rendre l'artefact à l'ordre lorsqu'ils le réclameraient..."

[player_statue_fair_enough]
string="Et alors ?"

[king_statue_20_years]
string="Alors, il y a de cela 20 ans, un groupe de rebelles, surgi d'on ne sait où, a tué ma femme et enlevé ma fille qui venait juste de naître."

[felnor_statue_steal_krahoz]
string="Ils eurent également le temps d'emporter Krahoz avec eux. Heureusement, nous les empêchâmes de voler Zohark. L'ordre intervint quelques heures après et réclama la restitution de l'objet entier. Nous ne pûmes que leur donner Zohark et depuis les femmes-serpents nous réclament d'honorer notre pacte et de retrouver Krahoz. Nous n'avons jamais localisé ces rebelles ; nous ne savons même pas s'ils sont encore dans Arx car ce fut la seule fois où l'on entendit parler d'eux. Toutefois l'ordre nous a assuré qu'ils sentaient encore la présence de Krahoz dans la forteresse..."

[player_statue_good_news]
string="Je trouverai Krahoz et Zohark..."

[king_statue_now_go_save_misc]
string="Maintenant allez, Am Shagar : et sauvez-nous du démon. Retrouvez Krahoz et Zohark et détruisez cette maudite statue..."
string2="Vous devez retrouver Krahoz et Zohark qui sont le seul moyen pour vous de détruire cette statue."
string3="Trouvez Krahoz et Zohark, Am Shagar. ensuite vous serez enfin capable de détruire la statue..."

[felnor_statue_now_go_save_misc]
string="Am Shagar, mettez-vous en quête de Krahoz et Zohark"
string2="Hâtez-vous de retrouver Krahoz et Zohark pour détruire le météore."
string3="Trouvez Krahoz et Zohark, Am Shagar. Pour sauver le royaume."

