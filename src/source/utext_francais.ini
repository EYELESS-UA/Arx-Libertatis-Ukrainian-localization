////////////////////////////////////////

[ready_tuto_1]
string="Rappel: les objets dont vous aurez besoin pour accomplir votre quête auront un description terminant par '(Objet de quête)'. Ne perdez pas ces objets !."

[ready_tuto_2]
string="Rappel: votre puissance d'attaque dépend du temps préparé pour frapper."

[ready_tuto_3]
string="Si vous pressez une direction pendant que vous préparez votre attaque, vous ferez des mouvements différents. Pour l'instant, allez à gauche avant de charger l'attaque pour trancher votre adversaire."

[ready_tuto_4]
string="À part le sort d'extinction, vous pouvez éteindre une flamme en utilisant une bouteille d'eau dessus. De la, pour remplir une bouteille, trouvez juste un bassin d'eau et utilisez votre bouteille vide dessus."

[ready_tuto_5]
string="Si vous devez donner de l'argent à quelqu'un, votre bourse d'or est trouvable dans votre onglet d'inventaire."

[ready_tuto_5b]
string="Certains endroits sont trop sombres ? N'oubliez pas de transporter sur vous torches/lampes et de les utiliser pour éclairer votre chemin."

[ready_tuto_6]
string="Les vendeurs d'armes peuvent aussi réparer les vôtres. Donnez leur vos armes endommagées et ils les répareront pour une somme d'argent."

[ready_tuto_7]
string="Pour réparer une arme vous-même, utilisez votre arme endommagée sur une enclume et, dépendant de votre talent compétence manuelle, les réparations seront plus ou moins efficaces."

[ready_tuto_8]
string="Pour pêcher trouvez une canne à pêche (ou fabriquez en une en utilisant un morceau de bois et de la corde) et allez près d'une rivière ou d'un lac, de la servez-vous de votre canne à pêche."

[ready_tuto_9]
string="Achetez un porte-clé aussi vite que possible ! Ça vous permettra de réunir toutes vos clefs en un seul objet."

[ready_tuto_10]
string="Avez vous essayé de forger une arme ?. Trouvez une lame non forgée, mettez- la dans le feu, actionnez le soufflet et frappez la lame avec le marteau ! Son efficacité dépendra de votre talent Mécanique."

[ready_tuto_11]
string="Saviez vous que vous pouvez remplir votre carquois ? Pour ce faire, combinez votre carquois sur un vendeur d'armes et il remplira ton carquois pour un faible coût."

[ready_tuto_12]
string="Saviez vous que vous pouvez empoisonner vos armes en utilisant une potion de poison dessus ? Le résultat dépendra de votre compétence manuelle."

[ready_tuto_13]
string="Saviez vous que vous pouvez miner des gemmes ? Trouvez juste une pioche et utilisez-la sur un bloc de gemmes que vous pouvez trouver incrustées dans les murs."

[ready_tuto_14]
string="N'hésitez pas à expérimenter différentes choses. Un problème peut avoir différentes solutions selon vos talents et les objets que vous possédez."

[ready_tuto_15]
string="Souvenez vous qu'une tarte aux pommes bien préparée vous donnera plus de santé qu'un champignon et ça vous nourrira plus facilement."

[ready_tuto_16]
string="Attention à ne pas trop boire de vin ou vous finirez ivre !"

[ready_tuto_17]
string="Vous avez tué quelqu'un qui vous serait utile plus tard ? Pas d'inquiétude: votre quête n'est pas finie. Il y a d'autres moyens de procéder si une personne importante est morte."

[ready_tuto_18]
string="Si vous voulez arrêter un sort actif, sélectionnez le mode curseur et choisissez quel sort vous souhaitez stopper, double cliquez le symbole du sort trouvable dans le coin en haut à droite ou pressez simplement le bouton Arrêt défil ou '6' (default)."

[ready_tuto_19]
string="Saviez vous que vous pouviez poignarder vos ennemis directement dans la gorge ? Cela les tueras instantanément, pour faire ça vous devez les attaquer par derrière seulement quand ils ne sont pas alerté par votre présence, cela demande un haut rang en Discrétion pour accéder à cette technique spéciale d'assassin."

[ready_tuto_20]
string="Pendant votre combat soyez attentif quand vous tapez: si votre arme atteint une pierre, un mur ou un autre objet dur, elle s'endommagera."

[ready_tuto_21]
string="Avez vous déjà lancé une boule de feu sur un poulet ?"

[ready_tuto_21b]
string="Les runes exotiques donneront accès à des augmentations et capacités additionnelles aux sorts. Pour lancer un sort amélioré, vous aurez besoin de chacune des runes en version exotiques."

[ready_tuto_22]
string="N'oubliez pas que vous pouvez assigner un raccourci à vos antidotes, potions de mana et potion de soin ! Par exemple, avoir une potion de soin liée à un raccourci peut s'avérer utile pendant que vous combattez, utilisez les en appuyant respectivement sur 'G', 'H' ou 'Y' (Par défaut)."

[ready_tuto_23]
string="Saviez vous que vous pouvez utiliser de la contre magie ? Par exemple, utilisez le sort d'extinction pendant qu'un ennemi lance un sort de boule de feu. Si votre talent Magie est supérieur à celui de votre ennemi vous éteindrez sa boule de feu."

[ready_tuto_24]
string="Si vous avez plus de 50 points dans votre compétence Discrétion vous serez capable de voler une personne. Quand vous êtes proche d’une personne, si une bourse apparaît dans le coin en bas à gauche de votre écran cela veut dire que vous pouvez la voler. Ouvrez juste votre inventaire (Double clic droit) et vous verrez le sien aussi. Pour être en mesure de voir et voler de bien plus précieux objets, vous devrez investir bien plus de points en Discrétion."

[ready_tuto_25]
string="Avez vous vu toutes les souris et autres petits rats qui courent dans les cavernes ? Déposez un peu de fromage, viande ou toute autre nourriture pour charognards près d’eux… ils seront contents."

[ready_tuto_26]
string="Saviez vous que les différentes armures portées font différents bruits quand vous marchez ? Porter une armure en cuir ne fera pas le même bruit que de porter une cotte de maille. Pensez-y avant de vous faufiler dans les ombres."

[ready_tuto_27]
string="Saviez vous que vous pouvez enchanter armes, armures et anneaux ? Utilisez le bon réactif sur eux, puis lancez le sort d’enchantement ! Le résultat dépendra de votre talent Magie."

[ready_tuto_28]
string="Saviez vous que les bassins d’eau peuvent être empoisonnés ? Cela peut être utile..."

[ready_tuto_29]
string="Si vous voulez vous faire un nouvel ami, n'hésitez pas à nourrir le chien !"

[ready_tuto_30]
string="N’oubliez pas de trouver et d’utiliser les runes exotiques, elles amélioreront l’efficacité de vos sorts et vous accéderez à de nouvelles fonctionnalités. Par exemple, améliorez le sort de vision nocturne pour voir à travers une porte, identifier les ennemis proches ou trouver des objets, cela peut être très utile pour rester discret..."

[ready_tuto_31]
string="Si vous avez besoin d'or, n'hésitez pas à rendre visite à l’arène de combat de Miguel, vous pouvez recevoir des récompenses périodiquement si vous participez aux paris ou tournois."

[ready_tuto_32]
string="Vous pouvez écouter les conversations des PNJ du moment qu’ils ne vous repèrent pas. Vous pouvez apprendre d'importantes informations et indices qui peuvent vous aider."

[ready_tuto_33]
string="Saviez vous qu’éteindre les torches peut se révéler utile ? Lancez le sort d’extinction ou utilisez une bouteille d’eau sur le feu. Ainsi vous pourrez vous faufiler dans les ombres plus aisément."

[ready_tuto_33B]
string="Saviez vous qu’éteindre les torches peut se révéler utile ? Lancez le sort d’extinction ou utilisez une bouteille d’eau sur le feu. Ainsi vous pourrez vous faufiler dans les ombres plus aisément."

[ready_tuto_34]
string="Vous pouvez brasser vos propres potions: utilisez juste un mortier et un pilon pour réduire les herbes à l’état de poudre. Puis utilisez la poudre sur une bouteille vide. Enfin vous aurez besoin d’un appareil pour brasser la potion."

[ready_tuto_35]
string="TRAPPES: double cliquez sur les trappes pour accéder au cabanes, toits ou chemins alternatifs."

[ready_tuto_35b]
string="TRAPPES: double cliquez sur les trappes pour accéder au cabanes, toits ou chemins alternatifs."

[system_fire_creative]
string="Vous pouvez activer des pièges créatifs si vous êtes poursuivi par de nombreux ennemis, tenez-vous près de décombres inflammables et lancez le sort Étincelle pour enflammer les ennemis pendant un temps limité, attention, faites ça prudemment."

[tutorial_stealth_mod]
string="JOUEZ À VOTRE FAÇON 2: De nombreuses approches telles que la discrétion peuvent être utilisées de maintes manières**-Utilisez le mode Discrétion pour adoucir vos pas et vous faufiler dans les ombres (Touche par défaut 'C').*-Rester caché pendant que vous écoutez les conversations peut vous aider à découvrir des informations ou des lieux clés.*-Faites des meurtres furtifs, attaquant seulement les ennemis dans le dos (Requis: 30 Discrétion, exclusivement avec les dagues ou armes courtes).**L'efficacité de Discrétion dépendra du nombre de points investis dans cette compétence."

[tutorial_access_mod]
string="JOUEZ À VOTRE FAÇON 3: Expérimentez et essayez des alternatives. Vous pouvez passez une porte verrouillée en:**-Cherchant la clé.*-Trouver un chemin alternatif.*-Utiliser un outil de crochetage pour forcer la serrure.*-Donnant un pôt-de-vin aux autorités pour obtenir l’accès.**Tout problème à toujours différentes solutions."

[tutorial_rooftops_mod]
string="HAUTEURS ET TOITS: Utilisez les hauteurs, toits et cabanes pour:**-Trouver un chemin alternatif.*-Vous cacher ou éviter vos ennemis.*-Effectuer une attaque en chute (Non létal), en sautant sur vos ennemis depuis une certaine hauteur les rendant inconscients."

[system_no_lever]
string="Trouvez un morceau de bois et combinez le avec une base de levier pour le réparer."



