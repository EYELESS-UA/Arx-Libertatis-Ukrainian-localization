// system spells descriptions

[system_spell_description_magic_sight]
string="Améliore la vision du lanceur de sort."

[system_spell_description_magic_projectile]
string="Projection d'énergie magique."

[system_spell_description_ignit]
string="Allume tout matériel inflammable, comme les torches, dans un périmètre."

[system_spell_description_douse]
string="Eteint toute flamme sur un matériel inflammable. Permet de réduire l'intensité d'une attaque à base de flamme, comme une boule de feu."

[system_spell_description_activate_portal]
string="Les téléporteurs de l'Edurneum doivent être activés avec ce sort."

[system_spell_description_heal]
string="Soigne le lanceur de sort ainsi que les créatures présentes dans un périmètre. Attention, ce sort peut aussi soigner vos ennemis."

[system_spell_description_harm]
string="Crée un champ de douleur dans un périmètre autour du lanceur de sort."

[system_spell_description_detect_trap]
string="Emet un avertissement lorsqu'un danger, ou un piège, est proche du lanceur de sort."

[system_spell_description_armor]
string="Augmente la défense de la cible du sort."

[system_spell_description_curse]
string="Diminue la force, la précision, la constitution et l'intelligence de la cible du sort."

[system_spell_description_lower_armor]
string="Diminue l'armure de la cible du sort."

[system_spell_description_speed]
string="Augmente la vitesse de la cible du sort."

[system_spell_description_reveal]
string="Dissipe les illusions et l'invisibilité."

[system_spell_description_fireball]
string="Lance un projectile de flamme."

[system_spell_description_create_food]
string="Crée un champ d'énergie qui appaise la faim des créatures se trouvant à l'intérieur."

[system_spell_description_Ice_projectile]
string="Lance un projectile de glace paralysant et blessant toute cible se trouvant sur la trajectoire."

[system_spell_description_sanctify]
string="Augmente la force, la précision, la constitution et l'intelligence de la cible du sort."

[system_spell_description_dispell_field]
string="Dissipe un champ de force."

[system_spell_description_Fire_protection]
string="Réduit les effets des attaques de feu ainsi que de la chaleur."

[system_spell_description_Cold_protection]
string="Réduit les effets des attaques de glace et du froid."

[system_spell_description_telekinesis]
string="Permet au lanceur de sort d'utiliser, ou de prendre, des objets à distance."

[system_spell_description_rune_guarding]
string="Une fois lancé, le piège n'est visible que par le lanceur du sort."

[system_spell_description_levitate]
string="Permet au lanceur de sort de se déplacer par lévitation."

[system_spell_description_ice_field]
string="Crée une barrière de glace."

[system_spell_description_paralyse]
string="Paralyse la cible du sort."

[system_spell_description_cure_poison]
string="Soigne le lanceur de sort d'un empoisonnement ainsi que les créatures présentes dans un périmètre. Attention, ce sort peut aussi soigner vos ennemis."

[system_spell_description_repel_undead]
string="Permet de faire fuir certains mort-vivants."

[system_spell_description_poison_projection]
string="Projection d'une substance empoisonnée."

[system_spell_description_slowdown]
string="Provoque un ralentissement de tous les mouvements de la cible du sort."

[system_spell_description_raise_dead]
string="Invoque un mort-vivant. Ce sort n'est valide qu'au-dessus d'un sol en terre."  

[system_spell_description_create_field]
string="Crée un champ de force."

[system_spell_description_disarm_trap]
string="Désarme tout piège à l'intérieur d'un périmètre."

[system_spell_description_flying_eye]
string="Le lanceur de sort peut explorer des zones sans être vu, grâce à un oeil volant."

[system_spell_description_fire_field]
string="Dresse un mur de flamme devant le lanceur de sort."

[system_spell_description_Lightning_strike]
string="Lance un éclair."

[system_spell_description_confuse]
string="Provoque une confusion sur la cible du sort."

[system_spell_description_invisibility]
string="Permet au lanceur de sort de se rendre invisible. Le sort cesse d'être efficace lorsque le lanceur de sort attaque une cible, tente d'utiliser, d'activer ou d'équiper un objet."

[system_spell_description_mana_drain]
string="Draine la mana des cibles se trouvant à l'intérieur du périmètre du sort."

[system_spell_description_life_drain]
string="Draine la vie des cibles se trouvant à l'intérieur du périmètre du sort."

[system_spell_description_explosion]
string="Provoque de lourds dégâts dû aux multiples impacts."

[system_spell_description_enchant_weapon]
string="Attribue des propriétés magiques à l'objet ciblé par le sort, en accord avec les ingrédients présents à côté de cet objet."

[system_spell_description_summon_creature]
string="Ce sort permet d'invoquer un démon. Une fois la créature invoquée, son comportement reste aléatoire."

[system_spell_description_negate_magic]
string="Provoque une interdiction de tout évenement magique à l'intérieur d'un périmètre autour du lanceur de sort."

[system_spell_description_incinerate]
string="Provoque une intense combustion sur la cible du sort."

[system_spell_description_mass_paralyse]
string="Paralyse toute les cibles présentes dans un périmètre autour du lanceur de sort."

[system_spell_description_mass_lightning_strike]
string="Lance plusieurs éclairs dans la zone affectée par le sort."

[system_spell_description_control_target]
string="Le lanceur de sort peut contrôler un démon préalablement invoqué."

[system_spell_description_freeze_time]
string="Le temps est ralenti, sauf pour le lanceur de sort."

[system_spell_description_mass_incinerate]
string="Provoque une intense combustion sur toutes les cibles présentes dans la zone affectée par le sort."

// quest log goals

[system_Quest_log_escape_gobs]
string="Je me suis retrouvé dans cette cellule dans le quartier de détention des gobelins. Il faut que je m'en échappe et que j'essaie de retrouver la mémoire."

// newlog
[system_Quest_log_escape_gobs_done]
string="J'ai réussi à m'échapper de la prison des gobelins, mais je n'ai toujours pas d'indications sur ce que je fais ici."

[system_Quest_log_gob_authorization]
string="Le champion gobelin gardant l'accès menant au second niveau des gobelins me réclame une autorisation signée ainsi qu'une patente de marchand de gemme."

// newlog
[system_Quest_log_gob_authorization_done]
string="Je peux maintenant avoir accès au second niveau des gobelins."

[system_Quest_log_message_ortiern]
string="Il me faut rencontrer le roi d'Arx pour que je puisse lui transmettre des nouvelles de l'avant-poste."

[system_Quest_log_greu_gift]
string="J'ai fait la connaissance d'un troll qui veut que je devienne son ami et qui aimerait un cadeau pour son anniversaire..."

// newlog
[system_Quest_log_greu_gift_done]
string="J'ai offert le livre à Greu. Il semblait très content et m'a donné une amulette. Je me suis fait un nouvel ami."

[system_Quest_log_fallen_rocks]
string="Le roi veut que je transmette un message à Pog, roi des trolls, afin de lui demander de déblayer les rochers qui bloque l'accès à l'avant-poste."

[system_Quest_log_troll_idol]
string="L'idole des trolls a été volé. Ils ne m'aideront pas tant que cet objet ne leur sera pas rendu. Je devrais jeter un oeil chez les gobelins."

//newlog
[system_Quest_log_troll_idol_done]
string="Le passage vers l'avant-poste devrait être dégagé maintenant."

[system_Quest_log_rituals]
string="Des sacrifices rituels sont pratiqués depuis peu dans le royaume. Lunshire veut que j'enquête à ce sujet. Apparemment, ces sacrifices seraient en relation avec la mort de Falan Orbiplanax. Il va falloir que je pose quelques questions aux gens du royaume."

[system_Quest_portal]
string="Chinkash m'a montré le sort secret qui permet de se téléporter en utilisant les portes d'Edurneum: Mega Spacium."

[system_Quest_log_shanny]
string="La fille de Maria, Shany, a récemment disparu. Elle m'a demandé de la retrouver. Il se peut qu'elle soit en danger." 

//newlog
[system_Quest_log_shanny_done]
string="Shany est saine et sauve. Je suis arrivé à temps avant qu'elle ne soit sacrifiée."

[system_Quest_log_access_temple]
string="Je dois trouver l'accès au temple secret d'Akbaa et détruire le météore."

[system_Quest_log_know_password]
string="Erzog m'a avoué que le temple d'Akbaa se trouve sous la taverne et il m'a révélé le mot de passe pour y accéder."

[system_Quest_log_destroy_meteor_for_good]
string="Le météore a resisté à mon contact, il est plus puissant que prévu. Je dois en parler à Felnor et voir ce qu'il en pense."

[system_Quest_log_krahoz_zohark]
string="Il faut que je trouve Krahoz et Zohark afin d'éviter que ma mana soit drainée par le météore. C'est la seule façon de le détruire et d'empêcher l'arrivée d'Akbaa sur Arx."

[system_Quest_log_krahoz]
string="Krahoz a été volé par un groupe de rebelles, les mêmes qui ont assassiné la reine et kidnappé la fille de Lunshire. Je dois absolument rentrer en contact avec eux."

[system_Quest_log_zohark]
string="Zohark se trouve chez l'Ordre d'Edurneum. Je vais essayer de traiter avec elles, je suis certain qu'elles comprendront l'importance de ma quête."

[system_Quest_log_Shield]
string="J'ai rencontré la fille que j'ai sauvé dans le temple d'Akbaa. J'ai été surpris d'apprendre qu'elle est le chef des rebelles qui ont volé Lunshire. Mais cela n'a que très peu d'importance car elle me donnera Krahoz si je lui rapporte un bouclier. Apparemment, ce bouclier des anciens, comme elle l'appelle, se trouve quelque part dans le second niveau de crypte."

//newlog
[system_Quest_log_Shield_done]
string="J'ai enfin le mythique bouclier des Anciens."

//newlog
[system_Quest_log_mythril_done]
string="Je possède l'arme ultime."

//newlog
[system_Quest_log_krahoz_done]
string="Je possède Krahoz."

//newlog
[system_Quest_log_zohark_done]
string="Je possède Zohark."

[system_Quest_log_Meteor_time]
string="Maintenant que j'ai en ma possession Krahoz et Zohark, il est temps de retourner dans le temple d'Akbaa et d'en finir une fois pour toute avec ce météore."

[system_Quest_log_Meteor_destroyed]
string="Le météore est détruit. J'ai réussi à ruiner les plans d'Akbaa. Curieusement, Sylib Nurath ne me rappelle pas. Je vais retourner au royaume pour voir si je ne peux pas trouver un moyen de regagner le Noden."

[system_Quest_log_save_kingdom]
string="Les sujets du royaume d'Arx sont retenus prisonnier par les Ylsides. Je vais essayer de me faufiler jusqu'au quartier de détention du château pour me faire une idée de la situation. Je ne peux pas quitter Arx et rejoindre le Noden en les abandonnant aux mains de ces brutes."

[system_Quest_log_super_weapon]
string="Le piège tendu par Iserbius est un échec, j'ai réussi à libérer le royaume. Maintenant je sais pourquoi je n'ai pas encore été rappelé sur le Noden. Ma mission n'est pas totalement accomplie. Akbaa a eu le temps de se procurer assez d'énergie avant que je ne détruise le météore. La destruction de cette maudite pierre a été une victoire dans la mesure où Akbaa n'est pas aussi puissant qu'il l'aurait espéré. Il est probablement en train de fusionner avec Iserbius. C'est un processus assez long et Iserbius sera invulnérable à la plupart des armes durant cette union. Il faut que je forge l'arme ultime avant de pouvoir affronter Akbaa."

[system_Quest_log_mythril]
string="Le livre traitant de l'arme ultime recommande de forger la lame avec du mithril. En effet, c'est le seul métal qui semble accepter les alliages avec des minerais instables, comme peut l'être cette poudre de Koltk. J'espère que c'est la vérité."

[system_Quest_log_Dragon_egg]
string="Il me faut un oeuf de dragon pour enchanter l'arme ultime."

[system_Quest_log_final_meeting]
string="L'heure est venue pour moi de remplir ma mission. Je dois me rendre dans le repère des Ylsides et détruire Iserbius...ou devrais-je dire Akbaa."

[system_Quest_log_key_bank]
string="J'ai trouvé une clé scellée chez Alicia. Si seulement je pouvais trouver quelque chose pour faire un moule, je serai en mesure de fabriquer un double de la clé..."

//newlog
[system_Quest_log_key_bank_done]
string="J'ai fait un double de la clé que j'ai trouvé dans la maison d'Alicia."

[system_Quest_log_olivier]
string="Dans la taverne, je suis tombé sur une rumeur à propos d'une chasse au trésor organisée par un ermite appelé 'Olivier'. Apparement, l'astuce pour y participer c'est de déposer une émeraude dans le coffre de ce type."

//newlog
[system_Quest_log_olivier_done]
string="J'ai trouvé le trésor d'Olivier l'ermite."

[system_Quest_log_Florence]
string="J'ai croisé le fantôme d'une femme. Elle me demande de trouver qui sont les responsables de sa mort. Elle m'a certifié qu'elle était un personnage très important du royaume et que son assassin n'a qu'un oeil."

//newlog
[system_Quest_log_Florence_done]
string="Le mystère du fantôme a été élucidé. Carlo a commandité le meurtre de la reine Florence."

[system_Quest_log_dragon_scale]
string="Il faut absolument que je me renseigne sur le nombre d'écailles que possède un dragon."

[system_Quest_water_clan]
string="Les gobelins du clan de l'eau m'ont demandé d'éliminer ceux du clan de la terre. En échange, ils doivent me donner un objet magique."

//newlog
[system_Quest_water_clan_done]
string="J'ai massacré le clan de la terre !"

[system_Quest_earth_clan]
string="Les gobelins du clan de la terre m'ont demandé d'éliminer ceux du clan de l'eau. En échange, ils doivent me donner de l'or provenant de leur trésor."

//newlog
[system_Quest_earth_clan_done]
string="J'ai éliminé le clan de l'eau !"

[system_not_enough_gold]
string="Pas assez d'or pour cela."

