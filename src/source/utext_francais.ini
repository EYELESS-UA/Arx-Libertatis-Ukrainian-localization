[system_tutorial_bricks]
string="Trouvez et empilez les briques afin de créer une plate-forme acceptable pour vous échapper de la cellule."

[player_shadowkill]
string="SHADOW KILL!!!!!"

[player_adrenaline]
string="ADRENALINE ATTACK!!!!!"

[system_tutorial_food_rats]
string="Certains rats et souris sont amicaux. Vous pouvez placer certains types de nourriture près d'eux, sûrs qu'ils aimeront.*Note: Pas tous les rats seront amicaux et encore moins en groupes."

[tutorial_stealth]
string="JOUEZ À VOTRE FAÇON:***-Vous pouvez tuer instantanément tes ennemis en les attaquant dans le dos du moment que vous ne vous faites pas repérer pendant l'acte. Tu dois avoir au moins 30 en discrétion et avoir une dague ou une épée courte équipée pour faire ça.**-Vous pouvez écouter les conversations des personnages du moment qu'ils ne vous détectent pas, pendant que vous les écoutez, vous pouvez découvrir et accéder à des informations qui peuvent se révéler utiles pour votre quête.**-Les PNJ peuvent vous entendre, donc faites attention au bruit de vos pas. Vous pouvez essayer de jeter un objet loin de vous, cela pourrait rediriger un PNJ hostile dans cette direction. Notez que l'icône de discrétion en bas à gauche de l'écran apparaît lorsque vous êtes cachez."

[tutorial_stealth2]
string="JOUEZ À VOTRE FAÇON:***-Vous pouvez tuer instantanément tes ennemis en les attaquant dans le dos du moment que vous ne vous faites pas repérer pendant l'acte. Tu dois avoir au moins 30 en discrétion et avoir une dague ou une épée courte équipée pour faire ça.**-Vous pouvez écouter les conversations des personnages du moment qu'ils ne vous détectent pas, pendant que vous les écoutez, vous pouvez découvrir et accéder à des informations qui peuvent se révéler utiles pour votre quête.**-Les PNJ peuvent vous entendre, donc faites attention au bruit de vos pas. Vous pouvez essayer de jeter un objet loin de vous, cela pourrait rediriger un PNJ hostile vers la. Note que l'icône de discrétion en bas à gauche de l'écran apparaît lorsque vous vous cachez."

[tutorial_torchi]
string="JOUEZ À VOTRE FAÇON: Vous pouvez surmonter un obstacle de différentes manières.**-Combinez la bouteille d'eau avec la torche pour vous cacher.*-Interagissez avec votre environnement (distrayez ou verrouillez l'ennemi avec la herse).*-Libère le prisonnier durant le combat.*-Attaquez ou évitez les ennemis directement.**Expérimentez des combinaisons, au fur et à mesure tu apprendras de nouvelles techniques, et plus de choix seront disponibles pour vous."

[tutorial_torch2]
string="Bien joué, rappelez vous que lorsque vous vous cachez l'icône de discrétion apparaîtra dans le coin en bas à gauche, plus il est éclairé, plus il sera difficile pour vous de vous faire détecter. Note: Les points mis sur la compétence discrétion influent sur votre capacité à vous cacher."

[tutorial_transparency_door]
string="Si vous activez le sort de Vision nocturne près d'une porte, vous pouvez voir au travers pendant un court moment, faire cela consomme de l'énergie magique."

[tutorial_exotic_rune_single]
string="Vous avez trouvé votre première rune exotique, utiliser cette dernière améliorera vos sorts. Pour lancer un sort spécial, il vous faudra toutes les runes requises dans sa version de base (Runes bleues) et dans sa version exotique (Runes noires).**Ce ne sont que des améliorations des runes de base, donc elles n’augmentent pas les runes dans le grimoire, cependant, si vous utilisez une rune exotique avant de posséder la rune de base, la rune précédemment utilisée sera effective quand vous récupérerez la rune de base respective."

[tutorial_exotic_rune_plural]
string="Vous avez trouvé vos premières runes exotiques, utiliser ces dernières améliorera vos sorts. Pour lancer un sort spécial, il vous faudra toutes les runes requises dans sa version de base (Runes bleues) et dans sa version exotique (Runes noires).**Ce ne sont que des améliorations des runes de base, donc elles n’augmentent pas les runes dans le grimoire, cependant, si vous utilisez une rune exotique avant de posséder la rune de base, la rune précédemment utilisée sera effective quand vous récupérerez la rune de base respective.."

[tutorial_exotic_runes]
string="Félicitations, vous êtes en possession d'une rune éxotique, ce genre de rune va améliorer les sorts qui requièrent l'usage de cette rune, débloquant ainsi des nouvelles fonctions ou améliorer ces dernières."

[system_break_door]
string="Frappez la herse rouillée pour la casser."

[system_break_box]
string="Vous pouvez frapper les caisses pour les détruire, certaines d'entre elles peuvent contenir des objets dedans."

[system_shrunken_player]
string="Prenez garde de ne pas vous approcher trop près des Pnjs quand vous êtes rétréci, ils pourraient vous tuer facilement sans vous détecter, même si ce sont des alliés."

[system_dummy3]
string="Vous pouvez attaquer discrètement les ennemis dans leurs dos et ainsi les tuer instantanément en poignardant leurs cous, gardez en tête que cette technique requiert au moins 50 points en discrétion, s'ils vous détectent, votre attaque spéciale sera annulée."

[system_fire_creative]
string="Vous pouvez activer des pièges créatifs si vous êtes poursuivi par de nombreux ennemis, tenez-vous près de décombres inflammables et lancez le sort 'étincelle' pour enflammer les ennemis pendant un temps limité, attention, faites ça prudemment."

[system_player_note]
string="Merci beaucoup de supporter ce projet.*Suivez les futures mises à jour sur le site web.**Nous continuerons de développer et d’améliorer le mod, vous êtes la motivation de continuer !**Si vous aimez Arx, n’hésitez pas à rejoindre la communauté Arx Insanity sur Discord:**https://discord.gg/mxTKk52"

[system_supporter_note]
string="Merci beaucoup de supporter ce projet.**En retour, vous pouvez obtenir quelques récompenses exclusives pour les donateurs: un aperçu des armes alchimiques en plus d’obtenir des objets supplémentaires.**Suivez les futures mises à jour sur le site web.**Nous continuerons de développer et d’améliorer le mod, vous êtes la motivation de continuer !**Si vous aimez Arx, n’hésitez pas à rejoindre la communauté Arx Insanity sur Discord:**https://discord.gg/mxTKk52"


