[system_charsheet_skin]
string="Changez votre apparence."

[system_charsheet_quickgenerate]
string="Cette option vous permet de distribuer automatiquement les points afin de créer aléatoirement un personnage."

[system_charsheet_done]
string="Commencez votre aventure sur Arx."

[system_charsheet_strength]
string="FORCE. Détermine vos bonus aux dégâts pour les combats ainsi que votre habileté à manier des armes lourdes. La force a une influence sur la compétence manuelle et les compétences de combat."

[system_charsheet_intel]
string="MENTAL. Détermine votre niveau de mana (énergie magique) ainsi que votre résistance à la magie. Le mental a une influence sur lien psychique, magie, mécanique, intuition et compétence manuelle."

[system_charsheet_consti]
string="CONSTITUTION. Détermine votre vitalité (points de vie), votre résistance aux poisons et votre capacité à porter des armures lourdes. Constitution a une influence sur la défense."

[system_charsheet_mecanism]
string="MECANIQUE. Cette compétence vous permet de crocheter les serrures verrouillées et de désactiver les pièges."

[system_charsheet_intuition]
string="INTUITION. C'est une sorte de sixième sens qui vous aide à détecter les objets cachés comme les passages secrets ou encore les pièges. Intuition augmente aussi votre capacité à marchander, vous permettant de conclure de meilleures affaires."

[system_charsheet_etheral_link]
string="LIEN PSYCHIQUE. Ce lien vous met en garde contre la présence de créatures hostiles et vous donne une indication sur l'état physique de votre adversaire durant un combat. Cette compétence détermine aussi votre vitesse de régénération en point de mana."

[system_charsheet_objknoledge]
string="COMPETENCE MANUELLE. Ceci est utilisé pour réparer votre équipement, pour faire des potions, pour empoisonner des armes et pour identifier certains objets."

[system_charsheet_casting]
string="MAGIE. Cette compétence vous permet d'accéder à différents niveaux de sorts. Il y a dix niveaux de magie. Magie détermine aussi votre capacité à vous protéger de la magie que certains utiliseront contre vous."

[system_charsheet_projectile]
string="ATTAQUE A DISTANCE. Vous donne des bonus pour toucher et infliger des dégâts avec l'arc en combat."

[system_charsheet_closecombat]
string="COMBAT CORPS A CORPS. Vous donne des bonus pour toucher et infliger des dégâts lorsque vous utilisez des armes de corps à corps en combat."

[system_charsheet_defense]
string="DEFENSE. Cette compétence détermine votre habileté à utiliser des boucliers, augmente votre classe d'armure et réduit le nombre de points de dégât qui vous sont infligés en combat."

