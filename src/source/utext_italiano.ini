string2="Ma gli umani non sono altro che una razza di ladri?"
string3="Ora ti insegnerò qualcosa che non sei ancora riuscito ad afferrare bene: il rispetto..."

[player_well_actually]//{~00~27
String="Sono qui perché mi serve un uovo di drago..."

[dragon_grrrr_human]//~27
String="RRRRAAAGGHH, Guardiano... quale impresa ti è stata assegnata dal Noden, che richiede il sacrificio della mia discendenza?..."

[player_understand_surprise]//~00
String="Devo salvare Arx e i suoi abitanti. Akbaa, il dio della distruzione, sta per..."

[dragon_enough_grrrr]//~27
