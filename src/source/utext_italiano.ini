[note_garrett_content]
string="C’è un nuovo ordine di Garrett, una gemma speciale è sepolta nelle catacombe goblin, fai attenzione nelle prigioni, non lasciare che ti prendano o rovinerai il piano."

[note_expedit_content]
string="Sei giorni sono già passati e temo che la spedizione sia fallita, dopo quello che ci è costato sgattaiolare in queste rovine, vale la pena di continuare a rischiare per l'enigma. Abbiamo scoperto un accampamento goblin vicino al campo di spedizione, ci sono anche dei fastidiosi ratti, dobbiamo stare molto attenti."

[note_exgob_content]
string="Tu entrato qui, tu essere ladro, tu marcire con vermi. Questa tua spazzatura, me povero e miserabile, me spera che ladro mai implori per cibo, come me fare."

[note_immersives_content]
string="Durante questa spedizione abbiamo trovato un'antica cassaforte, sfortunatamente era vuota e pesava troppo ma funzionava ancora, così ci ho messo dentro alcuni oggetti. Aprirla è stato semplice, due numeri erano stati incisi sul retro, il terzo, invece, era illegibile ma non dovrebbe essere un gran problema."

