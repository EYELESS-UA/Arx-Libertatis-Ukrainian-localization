[insanity_desc_normal_start]
string="Caratterizzazione iniziale del personaggio abilitata. Puoi cominciare velocemente anche senza creare il tuo personaggio assegnando solo i punti che vuoi, o senza assegnarne nessuno; potrai assegnare i punti inutilizzati più tardi."

[insanity_button_hardcore_start]
string="Campagna Hardcore"

[insanity_desc_hardcore_start]
string="Caratterizzazione iniziale del personaggio disabilitata. Non sarai in grado di assegnare punti all’inizio della partita. Dopo tutto sarà come al solito e continuerai a guadagnare punti attributi ed abilità ogni volta che salirai di livello."

