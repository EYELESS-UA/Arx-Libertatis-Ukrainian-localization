[ready_tuto_1]
string="Ricorda: gli oggetti necessari per portare a termine la tua missione hanno la descrizione '(Oggetto di Missione)' alla fine. Stai attento a non perderli!"

[ready_tuto_2]
string="Ricorda: la forza del tuo attacco dipende da quanto a lungo carichi il colpo."

[ready_tuto_3]
string="Se ti sposti in una direzione mentre carichi il colpo, farai mosse diverse. Ad esempio se ti sposti verso sinistra mentre carichi il colpo, tirerai un fendente."

[ready_tuto_4]
string="A parte l'incantesimo 'Spegni Fuoco', puoi estinguere una fiamma usando una bottiglia d'acqua. Per poi riempire nuovamente la bottiglia  ti basta trovare un catino e usare su di esso una bottiglia vuota."

[ready_tuto_5]
string="Se hai bisogno di dare dei soldi a qualcuno, la tua borsa con l'oro si trova a destra dell’inventario, sopra il tuo tomo."

[ready_tuto_5b]
string="Alcuni luoghi sono troppo bui? Non dimenticare di portare con te torce o lampade per illuminare la via."

[ready_tuto_6]
string="I negozianti che vendono le armi possono anche riparare le tue armi danneggiate. Ti basta dargli la tua arma danneggiata e loro la ripareranno dietro giusto compenso."

[ready_tuto_7]
string="Per riparare la tua arma da solo, usala con un doppio click del tasto sinistro del mouse con un'incudine, in base al tuo livello in Conoscenza degli Oggetti, la riparazione sarà più o meno efficace."

[ready_tuto_8]
string="Per pescare trova o compra una canna da pesca (puoi anche crearla da solo combinando una corda con una canna), vai vicino a un fiume o un lago e usala."

[ready_tuto_9]
string="Compra un portachiavi il prima possibile! Ti permetterà di mettere insieme tutte le tue chiavi in un singolo oggetto."

[ready_tuto_10]
string="Hai mai provato a forgiare una spada da solo? Trova la lama di una spada non ancora forgiata, mettila su un fuoco, aziona il mantice, quando la lama diventerà incandescente, colpiscila  con un martello da fabbro. L'efficacia della forgiatura varia in base alla tua Conoscenza degli Oggetti."

[ready_tuto_11]
string="Sapevi che puoi riempire la tua faretra? Per fare ciò ti basta darla a un negoziante che vende anche le armi (proprio come si ripara un'arma danneggiata), il negoziante la riempirà dietro giusto compenso."

[ready_tuto_12]
string="Sapevi che puoi avvelenare le tue armi? Ti basta usare su di essa una pozione avvelenata. Il risultato varia in base alla tua Conoscenza degli Oggetti."

[ready_tuto_13]
string="Sapevi che puoi estrarre le gemme? Basta trovare o comprare un piccone e usarlo su una gemma incastonata nel muro."

[ready_tuto_14]
string="Non esitare a sperimentare strategie diverse. Un problema può avere più soluzioni in base alle tue abilità e agli oggetti che possiedi."

[ready_tuto_15]
string="Ricorda che una torta di mele ben preparata ti darà più salute rispetto a un fungo e ti sazierà più in fretta"

[ready_tuto_16]
string="Presta attenzione a non bere troppo o finirai per ubriacarti!"

[ready_tuto_17]
string="Hai ucciso qualcuno di cui avevi bisogno più avanti nel gioco? Non preoccuparti: la tua missione non è fallita. C'è sempre un altro modo per andare avanti anche se un personaggio importante è morto."

[ready_tuto_18]
string="Se vuoi interrompere un incantesimo in corso, ti basterà usare la modalità Cursore e selezionare l'incantesimo che vuoi interrompere, fai doppio click con il tasto sinistro del mouse sull'icona corrispondente nell'angolo in alto a destra, o semplicemente premi il tasto ‘scroll’ o '6' (Tasto di Default)."

[ready_tuto_19]
string="Sapevi che puoi pugnalare un tuo nemico direttamente al collo? Questo lo ucciderà all'istante. Per fare ciò devi attaccarlo alle spalle solo quando non si sarà ancora accorto della tua presenza. Hai bisogno di un alto punteggio in Furtività per accedere a questa speciale abilità da assassino."

[ready_tuto_20]
string="Mentre combatti presta attenzione quando colpisci: se la tua arma urtasse una roccia, un muro o altri oggetti duri, verrà danneggiata."

[ready_tuto_21]
string="Hai mai provato a lanciare l'incantesimo 'Palla di Fuoco' su un pollo?"

[ready_tuto_21b]
string=""Le Rune esotiche conferiscono bonus aggiuntivi ad abilità ed incantesimi. Per lanciare una magia migliorata avrai bisogno di tutte le rune per quell’incantesimo, nella loro versione esotica."

[ready_tuto_22]
string="Non dimenticare che puoi assegnare una scorciatoia alla pozione vitale, alla pozione mana e alla pozione di antidoto al veleno! Per esempio avere una scorciatoia della pozione vitale durante uno scontro può essere davvero molto utile, per usarla premi il Tasto di Default 'G' per la vita, 'H' per il mana e 'Y' per l'antidoto)."

[ready_tuto_23]
string="Sapevi di poter lanciare contro-incantesimi?. Per esempio, usa l'incantesimo 'Spegni Fuoco' mentre un nemico lancia l'incantesimo 'Palla di Fuoco'. Se la tua abilità magica è più alta di quella del tuo avversario, spegnerai la sua palla di fuoco."

[ready_tuto_24]
string="Se possiedi più di 50 punti in Furtività potrai rubare agli alle altre persone. Quando stai vicino a qualcuno, se la sua sacca comparirà nell'angolo in basso a sinistra potrai derubarlo. Ti basterà aprire il tuo inventario (doppio click con il tasto destro del mouse) e vedrai il suo. Per essere capace di vedere e rubare oggetti più grandi o più preziosi, avrai bisogno di una quantità maggiore di punti Furtività."

[ready_tuto_25]
string="Hai mai visto tutti quei topolini e ratti mansueti correre in giro per le caverne? Lancia un po' di formaggio, carne o altri tipi di cibo nelle loro vicinanze... ne saranno molto compiaciuti."

[ready_tuto_26]
string=Sapevi che indossando differenti tipi di armatura i tuoi passi produrranno diversi rumori mentre cammini? Indossando un'armatura di cuoio non produrrà lo stesso rumore di un’armatura di maglie. Pensa a questo mentre ti nascondi furtivamente nell'ombra."

[ready_tuto_27]
string="Sapevi che puoi incantare armi, armature e anelli? Usa il reagente giusto su di esse, poi lancia l'incantesimo 'Incanta Oggetto'! Il risultato varierà a seconda delle tue abilità magiche."

[ready_tuto_28]
string="Sapevi che puoi avvelenare i catini d'acqua? Potrebbe tornarti utile..."

[ready_tuto_29]
string="Se vuoi farti un nuovo amico non esitare a dar da mangiare a un cane!"

[ready_tuto_30]
string="Non dimenticarti di trovare e usare le rune esotiche, queste miglioreranno l'efficacia dei tuoi incantesimi e ti permetteranno di accedere a nuovi contenuti. Per esempio, puoi migliorare l'incantesimo  'Visione Notturna' per vedere attraverso una porta, identificare i nemici vicini o trovare oggetti, questo potrebbe tornarti utile per la Furtività..."

[ready_tuto_31]
string="Se hai bisogno di un po' d'oro, non esitare a visitare l'arena di combattimento di Miguel, potresti ricevere ricompense periodiche se partecipi alle scommesse o ai tornei."

[ready_tuto_32]
string="Puoi origliare le conversazioni dei PNG finchè non ti rilevano. Potresti scoprire informazioni importanti e accedere ad indizi che potrebbero aiutarti.."

[ready_tuto_33]
string="Sapevi che le torce spente possono tornarti molto utili? Usa l'incantesimo 'Spegni Fuoco' o usa una bottiglia d'acqua su una torcia. Questo ti permetterà di nasconderti facilmente nell'ombra."

[ready_tuto_33B]
string="Non dimenticare che le torce spente possono tornarti molto utili. Usa l'incantesimo 'Spegni Fuoco' o usa una bottiglia d'acqua su una torcia. Questo ti permetterà di nasconderti facilmente nell'ombra.”

[ready_tuto_34]
string="Puoi miscelare da solo le pozioni: basta usare un pestello e un mortaio sulle erbe per polverizzarle. Poi usa la polvere su una bottiglia vuota. Quindi usa la bottiglia con la polvere su un alambicco per miscelare la tua pozione."

[ready_tuto_35]
string="BOTOLE: fai doppio click su una botola per accedere a gallerie, tetti o percorsi alternativi."

[ready_tuto_35b]
string="BOTOLE: fai doppio click su una botola per accedere a gallerie, tetti o percorsi alternativi."

[system_fire_creative]
string="Puoi attivare trappole creative se sei inseguito da numerosi nemici, stai accanto a macerie infiammabili e usa l'incantesimo 'Accendi Fuoco' incendiando i nemici per un breve lasso di tempo. Attento, gestisci queste trappole con cautela."

[tutorial_stealth_mod]
string="GIOCA A MODO TUO 2: Molti approcci come la Furtività possono essere usati in modi diversi.**-Usa la Furtività per alleggerire i tuoi passi e scivolare silenziosamente nell'ombra (Tasto di Default 'C').*-Stare nascosto mentre origli le conversazioni potrebbe aiutarti a scoprire molte notizie e informazioni importanti.*-Esegui uccisioni istantanee nell'ombra, attaccando solo ignari nemici alle spalle (Richiesti 30 punti Furtività, usare esclusivamente pugnali o armi corte).**L'efficacia della tua furtività dipende da quanti punti assegni a quest'abilità."

[tutorial_access_mod]
string="GIOCA A MODO TUO 3: Sperimenta e cerca modi alternativi. Puoi attraversare una porta bloccata in vari modi:**-Cercando la chiave.*-Trovando un percorso alternativo.*-Usando un set di strumenti per scassinare la serratura.*-Corrompendo un'autorità per ottenere l'accesso.**Ogni problema ha sempre più soluzioni"

[tutorial_rooftops_mod]
string="RIALZI E TETTI: Usa i punti sopraelevati, i tetti e le rimesse per: **-Trovare un percorso alternativo.*-Nasconditi o alleggerisci i tuoi passi.*-Esegui un attacco dall'alto (NON letale), saltando sui tuoi nemici dalle altezze lasciandoli privi di conoscenza."

[system_no_lever]
string="Trova un pezzo di legno e combinalo con il meccanismo di una leva per riparala."



