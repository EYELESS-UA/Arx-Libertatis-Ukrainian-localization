[tutorial_transparency_door]
string="Se attivi l’incantesimo esotico ‘Visione Notturna’ vicino a una porta, sarai in grado di guardarci attraverso per un breve periodo di tempo, in aggiunta all’essere in grado di vedere meglio i personaggi quando l’incantesimo è in atto."

[tutorial_exotic_rune_single]
string="Hai trovato la tua prima runa esotica, utilizzandola potrai migliorare i tuoi incantesimi. Per lanciare un incantesimo potenziato dovrai possedere tutte le rune per quell’incantesimo, sia la versione base (Rune Blu), sia le rune esotiche (Rune Nere).**Queste rune sono solo un miglioramento delle rune di base, quindi non aumenteranno il numero delle rune nel Libro Magico; comunque, se ottieni una certa runa esotica, prima di possederne la versione base, la runa esotica avrà effetto solo quando avrai in tuo possesso la sua rispettiva runa base."

[tutorial_exotic_rune_plural]
string="Hai trovato le tue prime rune esotiche, utilizzandole potrai migliorare i tuoi incantesimi. Per lanciare un incantesimo potenziato dovrai possedere tutte le rune per quell’incantesimo, sia la versione base (Rune Blu), sia le rune esotiche (Rune Nere).**Queste rune sono solo un miglioramento delle rune di base, quindi non aumenteranno il numero delle rune nel Libro Magico; comunque, se ottieni una certa runa esotica, prima di possederne la versione base, la runa esotica avrà effetto solo quando avrai in tuo possesso la sua rispettiva runa base."

