// system spell descriptions

[system_spell_description_magic_sight]
string="Migliora la vista dell'incantatore."

[system_spell_description_magic_projectile]
string="Incantesimo d'attacco."

[system_spell_description_ignit]
string="Dà fuoco ai materiali infiammabili, come le torce, entro un determinato raggio."

[system_spell_description_douse]
string="Spegne i materiali infiammabili - può anche ridurre alcuni attacchi di fuoco."

[system_spell_description_activate_portal]
string="I teletrasportatori di Edurneum devono essere attivati con questo incantesimo."

[system_spell_description_heal]
string="Guarisce chi si trova entro un determinato raggio dall'incantatore. Attenzione: puoi guarire anche i tuoi nemici."

[system_spell_description_harm]
string="Crea un campo che infligge dolore a chi si trova entro un determinato raggio dall'incantatore."

[system_spell_description_detect_trap]
string="Mette in guardia da trappole e pericoli."

[system_spell_description_armor]
string="Aumenta le difese del bersaglio."

[system_spell_description_curse]
string="Riduce forza, precisione, costituzione e intelligenza del bersaglio."

[system_spell_description_lower_armor]
string="Diminuisce la classe d'armatura del bersaglio."

[system_spell_description_speed]
string="Aumenta la velocità del bersaglio."

[system_spell_description_reveal]
string="Annulla le illusioni e l'invisibilità."

[system_spell_description_fireball]
string="Scaglia una palla di fuoco."

[system_spell_description_create_food]
string="Crea un campo di nutrimento per domare la fame."

[system_spell_description_Ice_projectile]
string="Lancia un raggio di gelo che congela e ferisce chiunque si trovi sul suo percorso."

[system_spell_description_sanctify]
string="Aumenta la forza, la precisione, la costituzione e l'intelligenza."

[system_spell_description_dispell_field]
string="Dissipa il campo di protezione."

[system_spell_description_Fire_protection]
string="Riduce l'effetto degli attacchi di fuoco e calore."

[system_spell_description_Cold_protection]
string="Riduce l'effetto degli attacchi di ghiaccio e freddo."

[system_spell_description_telekinesis]
string="Consente all'incantatore di prendere e usare oggetti a distanza."

[system_spell_description_rune_guarding]
string="Una volta lanciato questo incantesimo, la trappola è visibile solo all'incantatore."

[system_spell_description_levitate]
string="Consente all'incantatore di spostarsi a mezz'aria."

[system_spell_description_ice_field]
string="Crea una barriera di ghiaccio."

[system_spell_description_paralyse]
string="Paralizza un nemico."

[system_spell_description_cure_poison]
string="Guarisce dagli effetti del veleno chi si trova entro un determinato raggio dall'incantatore. Attenzione: puoi curare anche i tuoi nemici."

[system_spell_description_repel_undead]
string="Alla vista dell'incantatore, alcuni non morti fuggiranno."

[system_spell_description_poison_projection]
string="Diffonde un gas velenoso."

[system_spell_description_slowdown]
string="Rallenta i movimenti delle creature a cui è diretto."

[system_spell_description_raise_dead]
string="Evoca un non morto. Attenzione: questo incantesimo funziona solo se si è in piedi sul suolo."

[system_spell_description_create_field]
string="Crea un campo protettivo."

[system_spell_description_disarm_trap]
string="Disattiva le trappole che si trovano entro un certo raggio."

[system_spell_description_flying_eye]
string="Consente all'incantatore di controllare un occhio invisibile, grazie al quale potrà andare in esplorazione senza essere visto."

[system_spell_description_fire_field]
string="Innalza un muro di fuoco davanti all'incantatore."

[system_spell_description_Lightning_strike]
string="Scaglia una saetta davanti all'incantatore."

[system_spell_description_confuse]
string="Confonde l'avversario."

[system_spell_description_invisibility]
string="Rende invisibili. L'effetto dell'incantesimo cessa se l'incantatore attacca o tenta di usare, attivare o raccogliere un oggetto."

[system_spell_description_mana_drain]
string="Esaurisce il mana di chi si trova entro un determinato raggio dall'incantatore."

[system_spell_description_life_drain]
string="Esaurisce la salute di chi si trova entro un determinato raggio dall'incantatore."

[system_spell_description_explosion]
string="Danneggia pesantemente ciò che circonda l'incantatore."

[system_spell_description_enchant_weapon]
string="Conferisce proprietà magiche a un oggetto che si trova davanti all'incantatore, a seconda delle sostanze reagenti che si trovano nelle sue vicinanze."

[system_spell_description_summon_creature]
string="Evoca un demone. Ricorda che una volta evocato un demone, non sarà possibile prevedere il suo comportamento."

[system_spell_description_negate_magic]
string="Impedisce che l'incantesimo abbia effetto entro un certo raggio dall'incantatore."

[system_spell_description_incinerate]
string="Lancia un'ondata inceneritrice davanti all'incantatore."

[system_spell_description_mass_paralyse]
string="Diffonde un'onda gelata paralizzante attorno all'incantatore."

[system_spell_description_mass_lightning_strike]
string="Fulmini e saette hanno origine attorno all'incantatore."

[system_spell_description_control_target]
string="L'incantatore può comandare un demone, ma solo i demoni evocati possono essere controllati in questo modo."

[system_spell_description_freeze_time]
string="Il tempo rallenta per tutti tranne che per l'incantatore."

[system_spell_description_mass_incinerate]
string="Riduce in cenere tutte le creature che si trovano entro un certo raggio dall'incantatore."

// quest log goals

[system_Quest_log_escape_gobs]
string="Mi sono ritrovato in questa prigione goblin. Devo fuggire da qui e scoprire chi sono!"

// newlog
[system_Quest_log_escape_gobs_done]
string="Sono riuscito a fuggire dalla base goblin, ma non ho ancora la più pallida idea di cosa ci faccio qui..."

[system_Quest_log_gob_authorization]
string="L'ufficiale goblin a guardia dell'accesso al secondo livello dei goblin mi ha chiesto un'autorizzazione scritta e una licenza come mercante di gemme."

// newlog
[system_Quest_log_gob_authorization_done]
string="Sono riuscito a superare l'ufficiale goblin a guardia del regno goblin"

[system_Quest_log_message_ortiern]
string="Devo parlare con il Re di Arx e portargli le notizie dall'avamposto umano."

[system_Quest_log_greu_gift]
string="Oggi ho incontrato un troll: vuole che diventiamo amici e gli piacerebbe ricevere un regalo per il suo compleanno..."

// newlog
[system_Quest_log_greu_gift_done]
string="Ho regalato un libro a Greu. Era così felice! In cambio, mi ha dato un amuleto troll. Oggi ho trovato un nuovo amico."

[system_Quest_log_fallen_rocks]
string="Il Re vuole che porti un messaggio a Pog, re dei troll, chiedendogli di sgombrare dalle rocce il passaggio che porta all'avamposto."

[system_Quest_log_troll_idol]
string="È stato sottratto un idolo ai troll. Non mi aiuteranno finché quest'oggetto non tornerà nelle loro mani. Mi metterò alla sua ricerca nel territorio dei goblin."

//newlog
[system_Quest_log_troll_idol_done]
string="Ora il passaggio per l'avamposto degli umani dovrebbe essere sgombro."

[system_Quest_log_rituals]
string="Ultimamente, nei pressi del castello, sono stati celebrati riti sacrificali. Il re vuole che indaghi su tali eventi. Sembra che possano essere collegati all'omicidio di Falan Orbiplanax. Devo interrogare i sudditi del reame."

[system_Quest_portal]
string="Chinkash mi ha mostrato l'incantesimo segreto del teletrasporto attraverso i portali di Edurneum: Mega Spacium."

[system_Quest_log_shanny]
string="La figlia di Maria, Shany, è scomparsa. Maria mi ha pregato di trovarla - potrebbe essere in pericolo."

//newlog
[system_Quest_log_shanny_done]
string="Shany è in salvo, sono arrivato appena in tempo per sottrarla al sacrificio."

[system_Quest_log_access_temple]
string="Ora devo trovare il passaggio segreto per entrare nel Tempio di Akbaa e distruggere la meteora."

[system_Quest_log_know_password]
string="Erzog mi ha detto che il Tempio di Akbaa si trova sotto la taverna e mi ha rivelato la parola segreta per accedervi."

[system_Quest_log_destroy_meteor_for_good]
string="La meteora ha resistito al mio attacco. È più forte di quanto pensassi. Devo chiedere spiegazioni a Felnor e raccontargli cosa è accaduto."

[system_Quest_log_krahoz_zohark]
string="Devo trovare Krahoz e Zohark per riuscire a fermare la meteora, che sta risucchiando il mana dal mio corpo. È l'unico modo per distruggerla e impedire che Akbaa si reincarni e torni ad Arx."

[system_Quest_log_krahoz]
string="Krahoz è stato rubato da un gruppo di ribelli. Sono le stesse persone che hanno ucciso la Regina e rapito la figlia del Re. Devo trovare un modo per scovarli."

[system_Quest_log_zohark]
string="Zohark è nelle mani dell'Ordine degli Edurneum. Devo tentare di appellarmi a loro - sono sicuro che comprenderanno l'importanza vitale della mia missione."

[system_Quest_log_Shield]
string="Ho incontrato Alia, la ragazza che ho salvato nel Tempio di Akbaa. Mi sono stupito nello scoprire che in realtà è lei a capo dei ribelli. Ma questo non ha importanza. Tutto ciò che mi interessa è che mi consegnerà Krahoz se le porterò uno scudo. Si chiama Scudo degli Antichi e si trova nel secondo livello della cripta."

//newlog
[system_Quest_log_Shield_done]
string="Il potente Scudo degli Antichi è mio."

//newlog
[system_Quest_log_mythril_done]
string="L'arma definitiva è finalmente mia."

//newlog
[system_Quest_log_krahoz_done]
string="Krahoz è mio."

//newlog
[system_Quest_log_zohark_done]
string="Zohark è mio."

[system_Quest_log_Meteor_time]
string="Ora che sia Krahoz che Zohark sono nelle mie mani, è giunto il momento di tornare al Tempio di Akbaa e distruggere la meteora una volta per tutte."

[system_Quest_log_Meteor_destroyed]
string="La meteora è stata distrutta e il piano di Akbaa è finito. Eppure, stranamente, Sylib Nurath non mi ha richiamato al Noden. Devo tornare nel Regno e cercare di scoprire un modo per tornare al Noden."

[system_Quest_log_save_kingdom]
string="La gente del regno di Arx è tenuta prigioniera dagli Ylsides. Devo andare alla prigione e scoprire cosa sta succedendo prima di abbandonare Arx e tornare al Noden."

[system_Quest_log_super_weapon]
string="Il regno è salvo. La trappola di Iserbius è fallita. Ora so perché non sono tornato al Noden: la missione non è ancora conclusa. Akbaa ha raccolto energia a sufficienza prima che distruggessi la meteora. Distruggerla è stata comunque la cosa migliore, e Akbaa non è forte come crede. Probabilmente in questo momento si sta fondendo con Iserbius. È un processo molto lungo e la maggior parte delle armi non avrà effetto su Iserbius mentre è in corso. Devo creare l'arma definitiva per poter fronteggiare Akbaa."

[system_Quest_log_mythril]
string="Il tomo dell'arma definitiva dice che devo costruire un'arma di mithril, poiché è l'unico metallo in grado di fondersi con strane leghe come la polvere di Koltk. Mi auguro che sia vero."

[system_Quest_log_Dragon_egg]
string="Devo trovare un uovo di drago per fare un incantesimo sull'arma."

[system_Quest_log_final_meeting]
string="È giunto il momento di portare a termine la mia missione: entrerò nel rifugio degli Ylsides e distruggerò Iserbius... o dovrei piuttosto dire Akbaa..."

[system_Quest_log_key_bank]
string="Ho trovato una chiave con un sigillo nella casa di Alicia. Se solo riuscissi a trovare un modo per forgiare uno stampo, potrei fabbricarne una copia..."

//newlog
[system_Quest_log_key_bank_done]
string="Ho fabbricato una copia della chiave che si trova nella casa di Alicia..."

[system_Quest_log_olivier]
string="Circolano voci alla taverna secondo le quali un eremita di nome Oliver sta organizzando una caccia al tesoro. Pare che per dare il via alla caccia, sia necessario mettere uno smeraldo nella sua cassa."

//newlog
[system_Quest_log_olivier_done]
string="Ho risolto la caccia al tesoro organizzata da Oliver."

[system_Quest_log_Florence]
string="Oggi ho incontrato un fantasma, che mi ha pregato di trovare i responsabili della sua morte. Dice che era una persona molto importante qui ad Arx. Poi ha aggiunto che il suo assassino ha un solo occhio."

//newlog
[system_Quest_log_Florence_done]
string="Il mistero del fantasma è stato risolto. Fu Carlo l'istigatore dell'omicidio della regina Florence."

[system_Quest_log_dragon_scale]
string="Quante scaglie può avere un drago? Devo scoprirlo."

[system_Quest_water_clan]
string="Il Clan dell'Acqua dei goblin mi ha chiesto di uccidere il Clan della Terra. In cambio, mi ricompenseranno con un oggetto magico."

//newlog
[system_Quest_water_clan_done]
string="Ho eliminato il Clan della Terra."

[system_Quest_earth_clan]
string="Il Clan della Terra dei goblin mi ha chiesto di uccidere il Clan dell'Acqua. In cambio, mi ricompenseranno con parte dell'oro del loro tesoro."

//newlog
[system_Quest_earth_clan_done]
string="Ho eliminato il Clan dell'Acqua."

[system_not_enough_gold]
string="Quest'oro non è abbastanza per quello che ho fatto."

[player_dbldmg]
String="DANNO DOPPIO!!!"

[player_backstab]
String="COLPO ALLE SPALLE!!!"

