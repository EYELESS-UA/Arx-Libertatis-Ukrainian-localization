[dragon_leave_place_misc]//~27
String="Un umano... Vattene da qui, essere patetico, e risparmierò la tua insignificante piccola vita... E non provare neanche a pensare di portarmi via qualcosa o morirai..."
string2="RRRRAARRGGH... Vattene dalla mia tana, misero essere, se non vuoi perdere la tua misera vita. E se pensi di riuscire a portarti via qualcosa, ti sbagli!"
string3="Penoso essere umano, girati e vattene, se vuoi conservare quel barlume di calore che ancora c'è in te! E non dimenticare che sto tenendo d'occhio quelle tue manacce di ladro..." 

// if the player has picked up anything from the dragon's lair
[dragon_told_you_misc]//~27
