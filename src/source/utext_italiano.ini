[Gladivir_challenge]//~25@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Dietro questa porta c'è la via che ti condurrà allo scudo. Pensi di esserne degno? È un oggetto di grande potere, e solo un essere di intelligenza superiore potrà portarmelo via..."

[player_doubts_riddle]//~00@TO BE TIMED ACCORDING TO ENGLISH VERSION.
