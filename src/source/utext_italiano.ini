[player_because_only_way]//~00
String="Solo con un uovo di drago potremo lanciare un incantesimo abbastanza potente da distruggere la reincarnazione di Akbaa."

//** grassini new
// additional dialogues for the quest for golden pieces
[dragon_not_want]//~27
String="Se osi chiedere a un drago di sacrificare la sua prole, anche se per salvare il mondo intero, vuol dire che non ci conosci affatto..."

[player_not_want]//~00
String="Che dovrei fare, allora?"

[dragon_well_then]//~27
String="In primo luogo, dimostrami che ne sei degno."

[player_what_fight]//~00
String="Devo scontrarmi con te?"

[dragon_ah_ah]//~27
String="Aha... RRRAAGGHH. Perché no?... Ma non sarebbe giusto nei tuoi confronti... No, intendo un valore di altro tipo, umano, il valore di tutte le cose, piccole o grandi. Per esempio, sapresti regalarmi tanti pezzi d'oro quante sono le scaglie di un drago?"

// if the player has not read the book about Arx races
[player_not_how]//~00
String="Non so quante scaglie abbia un drago..."

[dragon_not_how]//~27
