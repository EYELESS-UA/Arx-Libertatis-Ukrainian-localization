[insanity_choose_difficulty]
string="Scegli il livello di difficoltà di combattimento:"

[insanity_button_difficulty_normal]
string="Normale"

[insanity_desc_difficulty_normal]
string="Un’esperienza casuale per i nuovi giocatori. Il danno dei nemici e le statistiche sono diminuiti. La rigenerazione della salute è abilitata e le pozioni e gli oggetti hanno un maggiore effetto."

[insanity_button_difficulty_insanity]
string="Insanity"

[insanity_desc_difficulty_insanity]
string="Una sfida maggiore per i giocatori più esperti. I nemici infliggono danni maggiori e sono più percettivi, le statistiche sono aumentate. Maggior numero di nemici, la rigenerazione della salute è disabilitata e le pozioni e gli oggetti hanno un effetto minore."

[insanity_button_difficulty_nightmare] //secret difficult
string="Incubo"

[insanity_desc_difficulty_nightmare]
string="Un’esperienza brutale e una difficoltà segreta (Non raccomandato al primo playthrough). I nemici infliggono danni estremi, sono estremamente percettivi e veloci, statistiche hardcore. Numero spropositato di nemici, la rigenerazione della salute è disabilitata e le pozioni e gli oggetti non hanno effetto."

[insanity_desc_immersive_mode]
string="Abilita questa modalità solo se cerchi un immersione totale o uno schermo pulito, nascondendo tutti gli elementi HUD tranne quelli essenziali come l’inventario, i libri e l’icona di cambio livello. La Modalità Immersiva può essere abilitata o disabilitata in qualsiasi momento nel menù, cliccando su Opzioni e Impostazioni di Interfaccia."

