// if the player has read the book about Arx races 
[player_yes_know]//}~00
String="Sì... penso di averlo letto in qualche tomo..."

[dragon_leave_egg_misc]//~27
String="Non stare troppo vicino alle mie uova: a loro non piace il caldo..."
string2="Non provare neanche ad attuare il tuo insano proposito di rubarmi un uovo, chiaro? Non sarai così sconsiderato, hmmm?"
string3="Se anche solo tocchi una delle mie uova, ti distuggo sull'istante!"

// general sentence for when the dragon is waiting for his payment in gold 
[dragon_gold_misc]//~27
String="Allora, mi hai portato l'oro?"
string2="Che stai facendo, Guardiano? Mi stai contando le scaglie? Non pensi che ci possa essere un altro modo per sapere quante scaglie ha un drago? Non sai leggere?"

// when the player has brought a sum of gold pieces, depending on whether it is the right amount (or above) or not enough.
