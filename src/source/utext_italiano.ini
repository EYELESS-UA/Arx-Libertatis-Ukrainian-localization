[system_charsheet_strength]
string="Forza. Determina il tuo bonus danni in combattimento e la tua capacità di usare armi pesanti. La Forza influisce sull'abilità Conoscenza degli oggetti e su quelle di combattimento."

[system_charsheet_intel]
string="Intelligenza. Determina la tua quantità di mana (energia magica) e la resistenza alla magia. L'Intelligenza influisce su abilità quali Legame etereo, Magia, Capacità tecniche, Intuito e Conoscenza degli oggetti."

[system_charsheet_consti]
string="Costituzione. Determina la tua quantità di salute, la resistenza ai veleni e la capacità di indossare armature pesanti. La Costituzione influisce sulla Difesa."

[system_charsheet_mecanism]
string="Abilità tecnica. Ti consente di eseguire operazioni quali aprire porte chiuse a chiave e disattivare le trappole. "

[system_charsheet_intuition]
string="Intuizione. È una sorta di sesto senso che ti aiuta a scovare gli oggetti nascosti, come i passaggi segreti e le trappole. Inoltre, affina il tuo senso commerciale, consentendoti così di concludere affari migliori."

[system_charsheet_etheral_link]
string="Legame etereo. Ti avverte della presenza di creature ostili e ti fornisce informazioni sullo stato dei tuoi nemici nel corso dei combattimenti. Quest'abilità determina anche la tua velocità nel riguadagnare mana."

[system_charsheet_objknoledge]
string="Conoscenza degli oggetti. È utilizzata per eseguire operazioni come riparare oggetti, preparare pozioni, avvelenare le armi e identificare gli oggetti."

[system_charsheet_casting]
string="Magia. Ti consente di accedere ai dieci diversi livelli di incantesimi disponibili. Inoltre, determina la tua capacità di proteggerti dalla magia."

[system_charsheet_projectile]
string="Proiettile. Ti assegna dei bonus se colpisci e danneggi l'avversario utilizzando armi a lunga gittata durante un combattimento."

[system_charsheet_closecombat]
string="Corpo a corpo. Ti assegna dei bonus se colpisci e danneggi l'avversario utilizzando armi per il combattimento corpo a corpo."

[system_charsheet_defense]
string="Difesa. Determina la tua capacità di usare uno scudo, aumenta la classe della tua armatura e riduce la quantità di danni subiti in combattimento."

