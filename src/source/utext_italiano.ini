[player_king_1stmeet1]//{~00~01
String="Mi chiamo Am Shaegar. Sono fuggito da una prigione goblin e sono stato mandato da Ortiern. È intrappolato nell'avamposto con i suoi uomini. Dice di aver bisogno di aiuto per riaprire la via verso il castello, bloccata da una frana. Inoltre sono stati attaccati da una pattuglia di Ylsides e non potranno resistere a un altro attacco."

///FGE
[king_player_1stmeet1]//~01
String="Santo cielo! Che brutte notizie, Am Shaegar. Hai reso un grande servizio al nostro regno e hai la nostra più profonda gratitudine. Verrai ricompensato in proporzione ai rischi che hai corso per portarci queste notizie. Il crollo, però, non è un problema da poco e dovremo pensarci a fondo."

///FGE
[king_player_1stmeet1bis]//~01
String="Ho deciso: porterai questo messaggio a Pog, il re dei troll. I suoi sudditi sono minatori molto abili: hanno persino aiutato a costruire questo villaggio. I troll vivono a un livello sotto di noi, forse ne hai già incontrati... sono brutti come i goblin, ma cinque volte più grandi. Tuttavia le relazioni tra i nostri due regni sono eccellenti. Abbiamo condiviso l'odio per gli uomini topo. Sono certo che ci presteranno subito aiuto."

///FGE
[player_king_1stmeet2]//~00
String="Sembra che non possa evitare di farmi coinvolgere... Beh, ti aiuterò, ma mi aspetto il tuo aiuto in cambio."

[king_player_1stmeet2]//~01
String="Non temere, sarai ben ricompensato per questo compito."

///FGE
[player_king_1stmeet3]//~00
String="L'oro mi servirà a poco se non riesco a ritrovare la memoria!"

///FGE
[king_player_1stmeet3]//~01
String="Sono sicuro che la recupererai. I goblin devono averti dato una brutta botta sulla testa, ecco tutto. Non ti preoccupare. E ora ti scongiuro, porta questo messaggio a Pog, re dei troll, come emissario del regno..."

[king_player_1stmeet_misc]//}~01
String="Ora ti prego, Am Shaegar, vai a parlare a Pog, il re dei troll."
string2="Sono sicuro che ti tornerà la memoria, poco alla volta."
string3="Beh, non vedo alcuna ragione perché tu rimanga ancora qui."
string4="Corri! I miei uomini sono intrappolati nell'avamposto!"

///FGE
[king_player_rocksaway1]//~01
String="Grazie ancora, Am Shaegar. Le rocce sono state rimosse. Ti sei guadagnato di nuovo la nostra riconoscenza e questo premio. Ti sei dimostrato un elemento valido per il regno e dovrò prendere in considerazione di assegnarti un ruolo ufficiale..."

///FGE
[king_player_rocksaway2]//{~01~11
String="Ah, sì... ti piacerebbe se ti nominassi..."

///FGE
[Carlo_breaks_in1]//~11
String="Vostra Maestà... Abbiamo scoperto tracce di un altro di quei rituali ..."

///FGE
[king_player_rocksaway3]//~01
String="Ehmm. Il terzo, in meno di una settimana. Dove, questa volta?"

[Carlo_breaks_in2]//~11
String="Proprio vicino al condotto di aerazione, Vostra Maestà. Pensate che possa essere collegato con l'omicidio di Falan Orbiplanax?"

[king_player_rocksaway4]//~01
String="Probabilmente... incaricherò il mio nuovo amico di occuparsene. Grazie, Carlo, puoi andare!"

[Carlo_breaks_in3]//}~11
String="Molto bene, Sire."

///FGE
[king_player_rocksaway5]//{~01~00
String="Beh, allora... Cosa ne pensi? Vorrei che tu indagassi su questa setta oscura: sono quasi certo che sia responsabile dell'esecuzione di Falan Orbiplanax, il nostro vecchio astronomo. Mi serve qualcuno che non sia noto come agente del Re, un uomo senza paura. Vuoi assumerti questo incarico per me?"

///FGE
[player_king_rocksaway1]//~00
String="È tutto un po' confuso, Vostra Maestà. Ma posso certamente indagare..."

///FGE
[king_player_rocksaway6]//~01
String="So che non mi deluderai. Sarai libero di interrogare tutti i miei sudditi, nelle tue indagini. Guardie, quest'uomo ha libero accesso agli appartamenti privati del castello! Inoltre, caro Am Shaegar, ecco la chiave di una delle camere reali, ora è tua. Ti prego di considerarla la tua nuova casa."

[player_king_rocksaway2]//~00
String="È un gesto molto cortese..."

///FGE
[king_player_rocksaway7]//~01
String="Prego, prego! Terremo una riunione del Consiglio non appena ci portrai notizie di questi sgradevoli eventi."

///FGE
[king_player_rocksaway_misc]//}~01
String="Terremo una riunione del Consiglio non appena avrai scoperto qualche indizio."
string2="Sono felice di poter contare sul tuo aiuto, Am Shaegar."
string3="Ti piace la tua nuova stanza?"
string4="Che gli dei ti aiutino nelle tue indagini."

//player gives Krahoz to the King
[king_krahoz]//~01
String="Finalmente, abbiamo di nuovo Krahoz. Molte grazie per la tua onestà e la tua devozione, Am Shaegar. Portalo immediatamente alle Sorelle di Edurneum. Saranno felici di riavere questo loro prezioso oggetto e non mi seccheranno più con questa faccenda... Il Regno di Arx non dimenticherà mai il tuo coraggio."

//** grassini new: when the player has to collect the large sum of gold for the dragon.
[player_king_gold]//{~00~01
String="Mi serve molto oro per salvare Arx..."

///FGE
[king_player_gold]//}~01
String="Il nostro regno è tutt'altro che ricco, Am Shaegar, ma dato tutto quello che hai fatto per noi e quello che intendi fare, come potrei rifiutarti questa modesta somma..."

