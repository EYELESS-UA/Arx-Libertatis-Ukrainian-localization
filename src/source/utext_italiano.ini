string3="Penso che faresti meglio ad andartene, il freddo dev'essere insopportabile per te"

// The player comes to see the dragon before they need a dragon's egg. The dragon explains the player's role as Guardian to them...
[dragon_explain_guardian]//~27
String="Beh, Guardiano, non ti senti congelato fin nelle viscere?"

// If the player turned up not knowing that he was the Guardian...
[dragon_explain_guardian2]//{~27~00
String="So chi sei, e non meravigliartene: me ne accorsi già la prima volta che ci incontrammo. Devi scoprire la tua identità da solo..."

[player_miserabilis]//~00
String="Allora perché mi hai trattato come un umano qualunque?"

[dragon_explain_guardian3]//~27
String="Ah ah... le tradizioni vanno rispettate..."

[dragon_explain_guardian4]//~27
String="È passato molto tempo dall'ultima volta che ho visto un inviato del Noden! Sono contento che non hai faticato molto a farti tornare la memoria... Essere Guardiani ha i suoi vantaggi, ma a volte ha anche i suoi inconvenienti..."

[player_question_dragon]//~00
String="Come?"

[dragon_explain_guardian5]//~27
String="Beh, sembra che un Guardiano sviluppi una sorta di preveggenza, una capacità di muoversi nel tempo che gli permette di avere un nuovo punto di vista su situazioni critiche che altrimenti porterebbero a vicoli ciechi o alla sconfitta. Devi essere riuscito ad accorgertene, anche se non sapevi di che si trattava. Sappi questo: tu sei destinato a riuscire, quindi non esitare a fare uso di questa capacità, che ti sarà di grande aiuto..."

[player_question_dragon2]//~00
String="Ho altri poteri che ancora non conosco?"

[dragon_explain_guardian6]//}~27
String="Non penso. È passato molto tempo da quando i sovrani del Noden hanno assegnato grandi poteri ai loro Guardiani... Talvolta la cura è peggiore del male... Il che mi porta a parlare del tuo principale punto debole: come creatura del Noden, hai un aspetto umano e non sei originario di questa dimensione. Sei libero di fare molto, ma non tutto: le cose che ignori di questa dimensione, oltre a quello che il Noden ti ha istillato e di cui probabilmente non hai memoria, ti porteranno spesso fuori strada; forse alcune conversazioni non avranno la piega sperata, le parole che dirai non sempre corrisponderanno a quello avresti voluto dire. Non preoccuparti, Guardiano. Sarai sempre uno straniero ad Arx, e non godrai molto del rispetto degli umani."

// Dragon asked for advice depending on different points in the scenario: the number refers to the particular scenario point in question
// Grassini new

[player_dragon6]//{~00~27
String="Devo trovare l'entrata del tempio..."

[dragon_scenar6]//}~27
String="Ma bene, trattenuto da una semplice porta?... Dove sono finiti i Guardiani di una volta?... Non restare qui troppo a lungo, o prenderai freddo..."

[player_dragon8]//{~00~27
String="Non sono riuscito a distruggere la meteora toccandola..."

[dragon_scenar8]//}~27
String="Non sempre le cose sono semplici come si pensa... Ti sei messo contro un dio, Guardiano, un possente avversario! Ti serve un oggetto con poteri magici di protezione... Mi sembra di ricordare che un oggetto del genere fosse nelle mani degli umani non molto tempo fa..."

[player_dragon12]//{~00~27
String="Gli Ylsides hanno fatto prigionieri tutti gli umani del regno..."

[dragon_scenar12]//}~27
String="Dal poco che so degli Ylsides, faresti meglio a non affrontarli faccia a faccia, amico mio... Prova con l'astuzia: è difficile combattere con un nemico che non puoi vedere..."

[player_dragon14]//{~00~27
String="Cerco il nascondiglio segreto dei seguaci di Akbaa..."

[dragon_scenar14]//}~27
String="Non hai ancora provato tutto... È giunto il momento del confronto finale, amico mio, dove il destino di un membro del Noden ha la meglio su quello di un altro. Devi fare appello a tutto il tuo coraggio e alla tua determinazione, mostrare tutto quello che sai del nemico e abbatterlo..."

[player_dragon_ghost]//{~00~27
String="Il fantasma di una donna mi ha chiesto di vendicare la sua morte..."

[dragon_scenar15]//}~27
String="I fantasmi sono anime tormentate, incapaci di riposare dopo la morte. Spesso, per dar loro la pace, può bastare trovare chi ne ha provocato la morte e fare piena luce sugli avvenimenti..."

