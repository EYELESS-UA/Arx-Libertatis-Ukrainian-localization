[system_tutorial_0]
string="Guarda nella cassa della bottega, prendi gli oggetti che vuoi acquistare o lascia quelli che vuoi vendere."

[system_tutorial_0bis]
string="Consegna le armi o l'armatura danneggiate al fabbro perché le ripari."

[system_tutorial_1]
string="Fai clic con il pulsante destro per passare dalla 'MODALITÀ CURSORE' alla 'MODALITÀ MOUSELOOK'."

[system_tutorial_1_new]
string="Fai clic con il pulsante destro su questo messaggio per chiuderlo."

[system_tutorial_1_new2]
string="I messaggi delle esercitazioni si trovano nella sezione diario del tomo delle missioni (tasto predefinito 'F4')."

[system_tutorial_2_new]
string="Fai doppio clic su un oggetto immobile per attivarlo."

[system_tutorial_2bis]
string="Premi 'APRI TOMO' (tasto 'BACKSPACE') o fai clic sull'icona del TOMO per aprire il tomo delle missioni."

[system_tutorial_2tris]
string="Premi 'APRI INVENTARIO' (tasto predefinito 'I') o fai clic sull'icona CINTURA per aprire il tuo inventario."

[system_tutorial_3bis]
string="Prendi l'osso (tasto predefinito 'INVIO' o 'F')."

[system_tutorial_3bis_new]
string="Premi 'ARMA PRONTA' (tasto 'TAB') per passare alla 'MODALITÀ COMBATTIMENTO'."

[system_tutorial_3bis_new2]
string="Premi 'AZIONE' per sferrare un colpo; più a lungo tieni premuto il pulsante, più forte sarà il tuo colpo."

[system_tutorial_3]
string="Fai doppio clic su un personaggio per parlare con lui."

[system_tutorial_4]
string="Premi 'ARMA PRONTA' (tasto 'TAB') per uscire dalla 'MODALITÀ COMBATTIMENTO'. *Fai doppio clic sui cadaveri per aprire i rispettivi inventari."

[system_tutorial_4_new]
string="Fai clic con il pulsante sinistro sugli oggetti e trascinali nell'inventario.*Per usare un oggetto premi 'INVIO' o 'F'."

[system_tutorial_5]
string="Quando sei in modalità mouselook, premi 'AZIONE' per combattere."

[system_tutorial_5bis]
string="Durante un combattimento, premi e tieni premuto 'AZIONE', quindi rilascia il tasto per colpire. Più a lungo tieni premuto il pulsante, più forte sarà il tuo colpo."

[system_tutorial_6]
string="Hai appena trovato la tua prima runa. Aggiungila al tuo tomo (tasto predefinito 'INVIO' o 'F')."

[system_tutorial_6bis]
string="Ora che possiedi le prime rune, apri il tomo e lancia il tuo primo incantesimo."

[system_tutorial_7]
string="Chinati premendo il tasto relativo (tasto 'X') e distruggi la trappola di legno."

[system_tutorial_8]
string="Fai doppio clic sulla fune nel tuo inventario, una volta che l'avrai trovata. Poi, fai clic sul meccanismo elevatore per legarla."

[system_tutorial_9]
string="Fai clic con il pulsante sinistro del mouse sull'icona di un incantesimo per leggerne la formula che, per tuo riferimento, rimarrà sullo schermo quando chiudi il tomo."

[system_tutorial_10]
string="Premi e tieni premuto 'MODALITÀ MAGICA' (tasto 'Ctrl') per passare alla modalità Magica e pescare le rune, una alla volta, con il pulsante sinistro del mouse. Poi, rilascia il tasto 'MODALITÀ MAGICA' per lanciare l'incantesimo."

[system_tutorial_11]
string="Il teletrasportatore è attivato; non potrai viaggiare attraverso i portali finché non saranno attivati altri teletrasportatori."

[system_tutorial_12]
string="Prova ad accendere il camino e poi avvicina il cibo al fuoco per cuocerlo."

[system_tutorial_13]
string="Prova a lanciare l'incantesimo Accendi fuoco sulle torce per illuminare il corridoio."

[system_tutorial_14]
string="Fai clic con il pulsante destro del mouse su una Pergamena magica per memorizzare l'incantesimo"

[system_tutorial_15]
string="Ora l'incantesimo è pronto. Quando decidi di lanciarlo, fai doppio clic su 'AZIONE', sul simbolo dell'incantesimo che appare sullo schermo in basso."

[system_tutorial_16]
string="Fai clic sull'icona Scala per cambiare livello."

[system_tutorial_level_01]
string="Congratulazioni! Il livello del tuo personaggio è aumentato! Fai clic sulla croce rossa per assegnargli ulteriori punti esperienza."

[system_tutorial_level_02]
string="Aggiungi punti facendo clic sull'icona di una caratteristica; il puntatore del mouse ti indicherà il numero di punti rimanenti."

[tutorial_bag]
string="Fai clic con il pulsante destro sull'inventario per vedere cosa contengono le tue sacche."

[tutorial_bag_02]
string="Puoi riorganizzare il tuo inventario facendo doppio clic sull'icona CINTURA."

[tutorial_lever]
string="Per ripare i meccanismi fai doppio clic sulla leva appena trovata e poi fai clic con il pulsante sinistro sulla base della leva sul muro vicino."

[tutorial_shop]
string="Ora stai commerciando, ATTENTO: la transazione diventa effettiva non appena raccogli o lasci un oggetto nelle casse del bottegaio. Se decidi di non comperare un oggetto non verrai risarcito."

[tutorial_mode_01]
string="Sei in modalità cursore."

[tutorial_mode_02]
string="Sei in modalità esplorazione."

[tutorial_stealth]
string="I PNG possono sentirti: cammina con attenzione. Prova a lanciare un oggetto lontano da te, i PNG ostili andranno verso l'oggetto.*Ricorda che l'icona furtività compare nell'angolo inferiore sinistro quando sei nascosto."

[tutorial_steal]
string="Sapevi di poter rubare alla gente? Hai bisogno di almeno 50 in Furtività. Ti basta entrare in contatto con qualcuno e vedrai la sua icona INVENTARIO nell'angolo in basso a sinistra dello schermo. Fai clic con il pulsante sinistro e guarda cosa puoi rubare. Ma attento: non farti scoprire."

