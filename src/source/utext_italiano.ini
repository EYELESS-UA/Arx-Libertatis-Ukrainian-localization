[description_note_ellie]
string="Questa lettera è per te, la donna della mia vita, la mia amata Ellie Rowse. Ti penso sempre, tutto il giorno, tutta la notte... Tramonti, brezze, tutto mi ricorda di te, persino il freddo delle caverne. Se solo avessi il coraggio di dichiararti i miei sentimenti, lo farò presto... lo farò alla fine del mio turno."

[description_book_cells]
string="Registrazione Prigionieri"

[book_cells_content]
string="Registrazione e prigionieri. **Anno 266, stagione del ratto, criminali:: **CELLE D’ISOLAMENTO:**Cella 1: Umano da vendere. Note: 'Umano cattivo, trovato a livello 2, dormina, molto strano.'*Cella 2: Umano da vendere. Note: 'Azuk portato me questo umano, me non sa niente, lui è umano calvo, umano ridicolo ma sembrare gustoso, gnam'.**STANZA DEI GIUDIZI IN SOSPESO:**Cella 1: Goblin cattivo 'Polsius', Accusa: attacco e blasfemia contro Alotar.*Cella 2: Prigioniero Goblin 'Bolson', Accusa: omicidio di due Goblin - Io uccido lui, ordine Re.*Cella 3: Prigioniero Goblin 'Zurok', Accusa: cattivo Goblin, lui ladro.*Cella 4: Prigioniero umano, Accusa: accesso non autorizzato a camera proibita, scappato, Re arrabbiato molto con me.*Cella 5: Prigioniero umano, Accusa: cattivo umano, attaccato amico Koltor, ubriaco e pericoloso umano in cella ora."


[note_aldaner]
string="Capo, catturato noi umano in avamposto, setta fatto ordine urgente, venduto abbiamo per 40 monete d’oro.**Toloneo."

[description_book_celly]
string="Rapporti carcerari."

[book_celly_content]
string="Anno 266, sesto giorno della stagione del ratto, prove e rapporti d’accusa per buon Re:: **Venduto noi 3 umani circa... Nah, me strappa questa pagina e scrive storie fantastiche ma prima mangio torta io, se stai leggendo tu ora, Re puzza... Me annoiato..."

[description_book_color_code]
string="L'arte dei maghi: le pergamene, di Enselme Tricher"

[book_color_code_content]
string="Sin dalla scoperta della magia, se ne è sempre cercata la migliore interpretazione possibile consentendo al mago di averne una profonda e più completa percezione. La magia che puoi imparare è di un tipo molto speciale- è la magia di Edurneum.**Le pergamene sono sigillate con delle banderuole colorate che mostrano quanto sono potenti. Il codice dei colori è il seguente, maggiore è il livello, maggiore è l'efficacia:**Livello 1: Grigio.*Livello 2: Giallo.*Livello 3: Arancione.*Livello 4: Verde.*Livello 5: Ciano.*Livello 6: Rosso.*Livello 7: Viola.*Livello 8: Blu scuro.*Livello 9: Marrone.*Livello 10: Nero."


