[Ortiern_welcome]//{~09~00@badly wounded
String="Un civile?... Sono Ortiern, capitano dell'esercito del Re e comandante di questo avamposto. Sei un mercenario? Possiamo contare sul tuo aiuto?"

[Player_welcome_ortiern]//~00
String="Mercenario? Forse... Per ora ho solo messo un po' di distanza tra me e un paio di goblin. Cosa ti è successo?..."

[Ortiern_briefing1]//~09@badly wounded
String="Siamo stati attaccati da un gruppetto di Ylsides; hanno ferito me e preso tre dei miei uomini..."

[Player_ortiern1]//~00
String="Gli Ylsides?"

///FGE
[Ortiern_briefing2]//~09@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Due ore fa, tre di loro si sono infiltrati nell'avamposto. Hanno attaccato senza preavviso o provocazioni. Gli Ylsides hanno fama di guerrieri feroci e inarrestabili, e l'ho constatato di persona. La loro rapidità è incredibile: in un lampo hanno disarmato e bloccato tre dei miei... E dovresti vedere cosa hanno fatto a Karnok... Non so perché l'hanno fatto, ma so che presto ritorneranno."

[Player_ortiern2]//~00
String="Trova qualcun altro che ti aiuti... Io ho già i miei problemi..."

///FGE
[Ortiern_briefing3]//~09@badly wounded
String="Sei la mia unica speranza! Non mi posso fidare della marmaglia della taverna! Faccio meglio a fidarmi di uno straniero."

[Player_ortiern3]//~00
String="Ti ho appena detto che..."

///FGE
[Ortiern_briefing4]//~09@badly wounded
String="Devi andare al castello e dire al Re cosa è successo qui! È di vitale importanza! Dall'ultimo terremoto la via verso il castello è stata bloccata da un crollo e non siamo riusciti a superarlo. Devi dirgli che gli Ylsides ci hanno dichiarato guerra!..." 

[Player_ortiern4]//~00
String="Ma è ridicolo! Hai appena detto che la via per il castello è bloccata!"

///FGE
[Ortiern_briefing5]//~09@badly wounded
String="Dovresti riuscire a passare attraverso le caverne dei goblin, due livelli più giù, e ritrovare la strada per questo livello. È una deviazione pericolosa, ma non abbiamo scelta! Se trovi una strada per risalire dall'altra parte, dovresti ritrovarti nel regno degli umani."

///FGE
[Player_ortiern5]//~00
String="Impossibile, sono appena fuggito da una prigione goblin!"

///FGE
[Ortiern_briefing6]//~09@badly wounded
String="Ecco qualcosa che ti potrà aiutare: è una licenza di mercante di gemme. Se penseranno che sei un venditore e tu non li attaccherai, probabilmente ti lasceranno in pace. Io devo stare qui. Sei la nostra unica speranza, coraggioso mercenario!"

///FGE
[Ortiern_repeat_briefing]//}~09@badly wounded
String="Ti ho già detto che sei la nostra unica speranza?"
string2="Hai capito? Bene... Entra nelle caverne dei goblin con la licenza che ti ho dato e trova la strada per il castello del Re."
string3="Se riesci ad incontrarlo, il Re saprà come spianare la via e mandare rinforzi per scacciare gli Ylsides..."
string4="Se non vuoi fare questo per me, fallo per il regno, coraggioso mercenario!"

[Ortiern_repeat_briefing_caves]
String="Ti ho già detto che sei la nostra unica speranza?"
string2="Se riesci ad incontrarlo, il Re saprà come spianare la via e mandare rinforzi per scacciare gli Ylsides..."
string3="Se non vuoi fare questo per me, fallo per il regno, coraggioso mercenario!"

[Ortiern_misc_hi]//~09
String="Leale per sempre!"
string2="Ancora una volta, grazie per il tuo aiuto, mercenario!"

