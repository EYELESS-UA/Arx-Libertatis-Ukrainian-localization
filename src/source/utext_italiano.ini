[system_charsheet_Dex]
string="Destrezza. Determina la tua precisione nei combattimenti e aumenta la tua capacità di segnare colpi decisivi quando combatti. La Destrezza influisce sulle abilità tecniche, la furtività, le abilità di combattimento e la Conoscenza degli oggetti; oltre a consentirti scatti ancora più veloci e per periodi più lunghi, migliora inoltre la rigenerazione dello scatto. Inoltre anche l’Adrenalina accelera."

[system_charsheet_stealth]
string="Furtività. Rende i tuoi passi più leggeri, questo vuol dire che potrai nasconderti meglio nell’ombra, per attaccare i tuoi nemici alle spalle, per derubarli o per eseguire uccisioni istantanee nell’ombra. Quando i tuoi punti Furtività sono estremamente elevati non potrai essere rilevato."

