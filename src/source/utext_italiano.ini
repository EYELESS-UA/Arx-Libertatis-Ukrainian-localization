[description_book_guardpost]
string="diario."

[book_guardpost_content]###
string="- Anno 266, Stagione Bianca, Settimana del ratto, Giorno Terzo.*Oggi, una piccola banda di goblin ha tentato di attaccare il nostro avamposto. Erano ubriachi ed è stato facile sconfiggerli. Abbiamo dunque dedotto che non si è trattato di un attacco programmato, ma semplicemente istigato dall'enorme quantità di alcol ingerita. Abbiamo respinto l'attacco senza difficoltà, tuttavia abbiamo perso uno dei nostri uomini, contro le cinque perdite da parte goblin.*- Anno 266, Stagione Bianca, Settimana della Talpa, Giorno Secondo.*Un terremoto ha scosso il nostro avamposto fino alle fondamenta, durando per almeno dieci minuti. Non sono stati riportati danni, ma ho osservato numerose crepe nel passaggio che porta alla nostra città.**- Anno 266, Stagione Verde, Settimana della Mucca, Giorno Quarto.*Uno strano aggressore ci ha attaccati questa mattina. Indossava una pesante armatura, diversa da tutte quelle che conosco, e sembrava invincibile. Ogni suo movimento era estremamente preciso e la sua velocità senza uguali. Non ha mostrato alcune pietà: ha ucciso uno dei miei uomini e ne ha feriti gravemente altri due, prima di voltarsi e scomparire con la stessa velocità con cui era arrivato. Il suo comportamento mi fa sospettare che sia stato inviato per valutare la nostra forza. *Credo che questo guerriero sia il primo segno tangibile di una forza che sta crescendo nelle ombre, al sicuro, e che un giorno sarà così potente da annientare tutti noi.***- Anno 266, Stagione Verde, Settimana dell'Aquila, Giorno Primo.*Lo strano guerriero è tornato. Ha ucciso tre dei miei uomini prima che finalmente riuscissi ad eliminarlo. Poi, mentre giaceva tra gli spasmi della morte, è scoppiato in una forte risata demoniaca. Ho subito sospettato qualcosa e ho ordinato ai miei uomini di ritirarsi il più in fretta possibile. C'è stata un'enorme esplosione che ha scagliato i suoi resti ovunque, a grande distanza.*Non ne è rimasta alcuna traccia, tranne il suo pugnale, abbandonato sul suolo.***- Anno 266, Stagione Gialla, settimana del Serpente, Giorno Primo.*Un terremoto ci ha svegliati presto questa mattina. Uno dei miei uomini mi ha informato che la scossa ha provocato una frana nel passaggio che porta al castello. Sono sicuro che arriveranno presto i soccorsi. Preferisco aspettare un po' prima di mandare uno dei miei uomini a portare la notizia al nostro amato Re. Probabilmente sanno che la frana avrà gravi conseguenze per noi...*Che gli dei veglino su di noi."
////////////////////////////////////////////////
[description_book_beloved]
string="Mio amato Akbaa."

[book_beloved_content]
string="Questi scritti sono in onore del mio maestro e signore:*Akbaa.***********Akbaa è la fonte della conoscenza in tutto l'universo e le dimensioni conosciute. Conoscere il suo culto è stato un momento fondamentale per le nostre genti e ha segnato un punto di non ritorno. Adora Akbaa o muori.**Poiché Akbaa è un dio, che simboleggia anche il potere di distruggere tutto ciò che esiste al mondo, sa come ricompensare i suoi servi più leali con grandi poteri e punire gli altri senza alcuna pietà. Akbaa è immortale, ma ha bisogno di anime per conservare il suo potere sull'universo conosciuto. Raccogliere anime gli consente di diffondere la sua saggezza ovunque.**Un ottimo modo per compiacere Akbaa è offrirgli anime sacrileghe che rifiutano di obbedirgli. Sebbene i non credenti siano il nostro obiettivo preferito, alcuni di noi desiderano ardentemente entrare in comunione con Akbaa e si offrono come vittime sacrificali. Dopotutto, la morte non significa nulla in confronto a un'eternità di gioia e illuminazione spirituale.**Un solo giorno della mia vita vissuto come credente vale più di mille giorni di vita da infedele.**Grazie ad Akbaa, ho visto cose che mi hanno fatto comprendere i meccanismi fondamentali del nostro universo. Cose che saranno per sempre fuori dalla portata dei non credenti."
////////////////////////////////////////////////
[description_book_iserbius]
string="Diario personale di Iserbius."

[book_iserbius_content]
string="È importante per me raccontare la storia della mia vita in queste pagine: se dovesse succedermi qualcosa, aiuteranno il mio successore a servire al meglio la causa dell'Ordine.**Ho deciso di dedicare tutta la mia vita al mio amato Akbaa. Dal momento in cui ho scoperto la sua esistenza fino al mio ultimo respiro, sarò il suo devoto servo.***Akbaa mi ha dato ciò che nessun uomo è in grado di immaginare.**Ricordo ancora il giorno benedetto in cui incontrai Lord Long.*Correva l'anno 240.**I nostri occhi si incontrarono immediatamente, era evidente l'estrema intesa fra i noi. Era per me un secondo padre e sono certo che, per lui, ero il figlio che non aveva mai avuto.*Qualche tempo dopo, quando abbracciai realmente la setta per la prima volta, mi disse che sarei stato il suo successore.**Mentre ero ancora un novizio, mi raccontò tutto della setta e di Akbaa stesso.*Mi spiegò che lo scopo della setta era invocare Akbaa affinché giungesse nella nostra dimensione e che aveva posto le basi perché tale invocazione rituale potesse avvenire. Purtroppo, non sarebbe vissuto abbastanza a lungo da vedere realizzato il suo progetto.**Grazie alla sua potente chiaroveggenza, aveva già visto il momento della propria morte.*Mi pregò di continuare i preparativi necessari per realizzare il grande piano di Akbaa.**Quando morì l'anno seguente, proprio come aveva predetto, le sue parole profetiche mi risuonarono nella mente. Non appena fui accettato come membro a tutti gli effetti della setta, fui nominato Gran sacerdote. Quel giorno segnò il mio più grande dolore e la mia più grande gioia. Il dolore profondo per aver perso il mio maestro e padre, e l'incredibile gioia data dal sapere che la venuta del nostro Signore era imminente.**Iniziò per me un lungo periodo di ricerca.**Mi avvicinai sempre più ad Akbaa; tanto quanto un mortale può avvicinarsi a un dio. Vidi cose che non possono essere viste, udii cose che non hanno suono e provai sensazioni che nessun uomo potrebbe sperare di provare. Akbaa mi diede sempre più potere, in parte potere fisico, certo, ma anche una grande abilità nelle arti magiche.**Akbaa è più di un dio per me, è il mio sole, la mia aria e il mio nutrimento; è tutto per me. Grazie alla sua ispirazione soprannaturale, presi le redini della sua setta con grande fermezza.** Iniziai eliminando i membri che non erano più utili. I risultati insoddisfacenti erano diventati pericolosi per questo mio compito fondamentale, avevo tempo sufficiente per pianificare attentamente l'arrivo di Akbaa, fin nel minimo dettaglio. Era fondamentale che il nostro Ordine rimanesse assolutamente segreto fino al momento in cui nulla avrebbe più potuto fermarci.**Questo fu il momento in cui appresi che Falan Orbiplanax aveva scoperto i miei veri intenti e intendeva opporsi alla venuta di Akbaa con l'aiuto del Noden.*Per impedire che il Noden fosse coinvolto, presi alcune importanti decisioni. Innanzitutto, incaricai un sicario di uccidere Orbiplanax, che rappresentava ormai una minaccia troppo grande.**Poi, anticipai la data dell'arrivo di Akbaa. Tuttavia, non era ancora tutto pronto per l'invocazione. Ordinai dunque di aumentare la frequenza dei sacrifici dei non credenti, raccogliendone grandi quantità.*Anche le donne e i bambini, non avevamo tempo per fare differenze...*Inoltre, aumentai l'intensità delle nostre preghiere, incoraggiando sempre più membri della setta a offrirsi come vittime sacrificali, così che Akbaa finalmente ci ascoltasse.**Giorno dopo giorno, restavo esterrefatto dalla quantità di conoscenze e potere che Akbaa mi concedeva. Con mia grande sorpresa, Akbaa promise di darmene ancora di più al momento della sua venuta e che il destino di Arx sarebbe stato messo nelle mie mani."
////////////////////////////////////////////////
[description_book_cook]
string="Cucina per Goblin, di Durey Palua."

[book_cook_content]
string="Ricetta per ciambella.** Mescolare zucchero e farina.**Aggiungere acqua quanto basta e impastare fino a che la pasta avrà assunto una consistenza uniforme.**A questo punto, infornare, facendo attenzione a non bruciare l'impasto.**A cottura ultimata, prendere un uovo di gallina e sbattere insieme il bianco e il rosso.**Spennellare il composto sulla torta e rimetterla in forno per circa un minuto."
////////////////////////////////////////////////
[description_book_music]
string="Due parole sulla musica, di Fazzi."

[book_music_content]
string=" Il flauto è probabilmente uno dei più raffinati strumenti esistenti.**È facile imparare ad usarlo, ma diventarne un vero virtuoso è tutt'altro che semplice.*Ecco la prima lezione, per prendere confidenza con questo strumento.**Esistono due tipi di flauto nel mondo, ma il più diffuso funziona nel modo seguente.*È costituito da quattro note di base e quattro note modificate, che si ottengono ostruendo il foro che si trova in basso sul flauto mentre si suonano le quattro note di base.*Le prime quattro si chiamano 1, 2, 3, 4, mentre quelle modificate si chiamano #1, #2, #3, e #4.**Un pezzo molto facile per iniziare è quello che io ho chiamato 'Inno di Fazzi', che fa così: 1 1 #1 3 4 1 1 2."
////////////////////////////////////////////////
[description_book_weapon]
string="La teoria dell'arma definitiva, di Kartok."

[book_weapon_content]
string=" Ho viaggiato in lungo e in largo per molte terre alla ricerca dell'arma definitiva.*Ho trascorso buona parte della mia gioventù per trovarla, sprecando molte energie, fino al giorno in cui ho capito che tutti i miei sforzi erano vani.*Vani perché l'unico modo per trovare l'arma definitiva è crearla.**Per realizzare un'arma di questo genere, ci vuole il metallo più raffinato, forgiato nella fucina più perfetta, e poi è necessario potenziarla con l'incantesimo più sofisticato che esista.*È importantissimo usare il metallo migliore, non solo perché determina la sottigliezza e la resistenza della lama, ma anche perché dev'essere in grado di ricevere e conservare una grande quantità di energia magica.**Inoltre, il peso del metallo determina la manovrabilità dell'arma e la capacità di stoccata e penetrazione.**Molti usano il ferro per forgiare le loro armi, perché è il metallo più facilmente reperibile.*Ma il metallo più raffinato a noi noto (e, secondo me, l'unico adatto a creare l'arma definitiva) è il mithril, il metallo più forte e resistente mai scoperto. Con il mithril è inoltre possibile creare leghe raffinatissime, se fuso con altri elementi.**Tali elementi devono però essere scelti con la massima cura. Devono essere usati solo i materiali più rari, che possiedono un valore magico intrinseco nella loro essenza.*Purtroppo il mithril, componente essenziale, è quasi impossibile da trovare. Se fosse possibile trovare un pezzo di questo straordinario metallo, bisognerebbe poi rintracciare il fabbro più abile e chiedergli di forgiare l'arma.*Non mi addentrerò in complesse discussioni filosofiche, ma vi dirò chiaramente la mia opinione: i fabbri migliori, secondo me, sono i nani.**Tutta la loro tradizione si fonda sulla lavorazione della pietra e del metallo, e hanno raggiunto un grado di competenza tale nel loro mestiere che persino gli strumenti di lavoro che usano sono superiori a quelli di qualsiasi altra razza. Sono gli unici in grado di creare nelle loro fucine le armi più affilate e letali esistenti.**La forgiatura è un momento fondamentale; una volta pronta, l'arma deve essere in grado di assorbire il primo incantesimo magico lanciato su di essa e di conservarlo per sempre.**Ovviamente, la fase finale è l'incantamento dell'arma.**Molte cose possono potenziare magicamente un'arma, l'essenziale è scegliere l'elemento con cui legare l'arma al momento dell'incantamento.*Ecco alcuni esempi dei migliori incantamenti conosciuti.*Tuttavia, la qualità dell'arma dipende più dal metallo scelto e dalla fucina usata che dall'elemento con cui viene combinata...*Ecco alcuni esempi, ma ricordate che una volta che un'arma è stata incantata, non può essere cambiata:**-l'aglio la rende più maneggevole*-la polvere d'osso ne aumenta la potenza, maggiore se si tratta di osso di drago.*-la roccia di Amikar le conferisce incredibile resistenza. Una volta incantata, la lama sembra indistruttibile*-un uovo di drago le consente di danneggiare l'elemento di cui è fatta. Ad esempio, un'arma di ferro incantata danneggerà di più gli oggetti di ferro."
////////////////////////////////////////////////
[description_book_noden]
string="Le regole del Noden, la dimensione degli dei, del pensatore Aran Salar, archivi (Volume 1)."

[book_noden_content]
string=" Il Noden, regno degli dei, esiste in una dimensione molto lontana dalla nostra.*Ma di tanto in tanto, viene creato un ponte tra la nostra dimensione e la loro, che consente il passaggio tra le due. Questo può avvenire in caso di convergenze astrali favorevoli, come le eclissi, o di gravi cataclismi naturali, come i grandi maremoti.**La dimensione del Noden funziona in questo modo: esiste un'energia ambientale residua che proviene da tutte le direzioni dell'ambiente conosciuto ed è attratta dal Noden.*Quest'energia rappresenta il potere dell'inconscio collettivo delle persone pensanti che vivono in queste dimensioni. Contiene i desideri, le paure e, in generale, tutte le credenze di tali esseri.**Così, ogni volta che un essere crede in un dio e gli assegna un nome, una cristallizzazione di questa entità si forma nel Noden.*All'inizio, questo nuovo dio è molto debole e senza alcuna difesa, ma man mano che più credenti iniziano ad adorarlo, la sua energia nel Noden cresce.**Queste divinità spesso ricevono le preghiere dei loro seguaci per un motivo molto specifico. A seconda della loro volontà e alla potenza che hanno raccolto, possono ricompensare i loro seguaci con poteri materiali e di altro genere. Questo, a sua volta, rafforza la fede dei loro seguaci.**Se però nessuno crede in un dio, la sua energia inizierà a ridursi fino a diventare una piccola forma di ectoplasma, una fragile ombra della sua gloria passata.**È importante notare che Krahoz e Zohark godono di un posto nel cuore stesso del Noden, grazie all'ammirazione che continuano a suscitare tra noi.**Il Noden dispone anche di un organo amministrativo, che gestisce le residenze attribuite ai diversi dei del Noden in base al numero dei loro seguaci, si accerta che gli dei non superino i propri confini e tiene un archivio delle credenze assorbite dalle altre dimensioni.*Questa organizzazione è strutturata in forma di gerarchia, culminante nella razza dei Sybartas.**Sylib Nurath, che si occupa delle interferenze tra il Noden e le altre dimensioni, ne fa parte.**Esiste poi un'altra razza, i Volks. Potrebbero essere definiti i servi dei Sybartas. Generalmente svolgono solo compiti ripetitivi e d'importanza minore."
////////////////////////////////////////////////

[description_book_noden_v2]
string="Le regole del Noden, la dimensione degli dei, del pensatore Aran Salar, archivi (Volume 2)."

[book_noden_content_v2]
string=" Le leggi del Noden sono implacabili e nessuno (nemmeno gli dei) possono infrangerle.**La prima e la più importante regola prevede che nessun dio o principe demone può lasciare il Noden, (Articolo 1, Capitolo 1). Le conseguenze della presenza di un dio o di un principe demone in qualsiasi altra dimensione metterebbero in seria crisi l'armonia dell'universo.*Un dio che riuscisse ad abbandonare il Noden acquisirebbe potere infinito e potrebbe agire a qualsiasi livello di realtà e dimensione.**Questo è il motivo per cui gli dei e i principi demoni possono solo interagire nelle dimensioni in cui sono adorati da simboli, sogni o devoti umani a cui conferiscono diversi poteri. Tuttavia, non possono, in alcuna forma, passare a tale dimensione.**Le poche divinità che hanno osato rischiare una fuga in altre dimensioni ora marciscono all'interno di enormi cristalli detti 'Gemme del Noden', dove sono stati intrappolati dai Guardiani che li hanno riportati indietro.*I Guardiani sono esseri superiori creati dai Sybartas e inviati dal Noden per creare collegamenti tra le dimensioni.*Non sono divinità, ma piuttosto la 'polizia degli dei' a cui è stato affidato il compito di garantire che le regole del Noden siano rispettate in tutte le dimensioni.**All'inizio, i Sybartas erano soliti concedere loro grandi poteri, affinché potessero riportare indietro gli dei erranti più rapidamente. Non appena si resero conto, però, dei danni che avrebbero potuto causare usando tali poteri, decisero di limitarli a quanto necessario per completare le missioni.**Fu concessa loro un'incredibile capacità di adattamento alle nuove situazioni e grande rapidità di apprendimento, in modo che potessero sfruttare al meglio le risorse a loro disposizione.*Limitando i poteri dei Guardiani, sono stati evitati tentativi di deificazione.**Nessun mortale può esistere nel Noden e gli dei che desiderano collegare le dimensioni hanno bisogno di un corpo che li ospiti.*Generalmente, viene usato il corpo del mortale che ha invocato la venuta della divinità, spesso felice di offrirsi in sacrificio.**Il Noden tiene un registro di tutti gli dei esistenti o mai esistiti.*Per questo, le leggende di altre dimensioni narrano di Akbaa, Ftaghn-Nayak, Zeus, Zlardos il Vile, Thrn-Glrn, Alador e molti altri..."
////////////////////////////////////////////////

[description_book_war_magic]
string="La guerra dei maghi, di Ourfas Befed."

[book_war_magic_content]
string=" All'epoca in cui gli umani vivevano in superficie, la magia era insegnata nelle scuole. Gli studenti imparavano i diversi modi possibili per praticare i loro poteri. **Alcuni usavano la magia elementare, altri le illusioni e, in rare occasioni e in settori molto specializzati, persino a qualche negromante era consentito esercitarsi.**Gli stili di magia variavano enormemente e ognuno portava con sé una filosofia, credenze e tabù specifici.*Inevitabilmente, queste filosofie erano in contrasto l'una con l'altra e alcuni maghi tentavano di imporre il proprio modo di vedere le cose agli altri praticanti.**Questa situazione diede origine a una terribile guerra.**In realtà, nessun metodo era più forte di un altro, così ogni battaglia era combattuta in perfetto equilibrio.*Con il proseguire degli scontri, ogni fazione iniziò a dipendere da un unico incantesimo per sconfiggere i propri avversari. L'incantesimo che consente di risucchiare tutto il mana dell'avversario era l'incantesimo più potente, poiché rendeva l'oppositore incapace di lanciare persino l'incantesimo più debole...**I maghi si trovavano a un punto morto, le battaglie si erano ridotte a semplici scontri tra due persone che lanciavano incantesimi per esaurire il mana dell'avversario.**Fu allora che le Sorelle di Edurneum aiutarono il Reale Istituto di Magia, regalandogli un potente oggetto magico.**Tale oggetto era costituito da due elementi che, una volta uniti, consentivano a uno stregone di conservare tutta la sua energia magica, anche se qualcuno avesse tentato di risucchiarla.**Questi due elementi erano chiamati Krahoz e Zohark, in memoria di due antiche divinità.**Non appena quest'oggetto veniva usato, il conflitto cessava e le parti in causa decidevano che la persona più potente era quella che possedeva tale manufatto.*Krahoz e Zohark furono consegnati al re di Arx e, da allora, sono stati tramandati ai suoi discendenti."
////////////////////////////////////////////////

[description_book_day]
string="Il giorno della sua venuta."

[book_day_content]
string=" Questi fatti furono narrati da Lord Long, creatore e gran sacerdote dell'Ordine Oscuro, nell'anno 199.***********Quando arrivò, ero un brillante ambasciatore al servizio del regno di Arx.*All'epoca, vivevamo ancora in superficie, dove il sole splendeva in tutta la sua potenza.**Il 37° giorno dell'anno 216, mi trovavo nell'osservatorio, quando ci fu un'eclissi solare e vidi una meteora cadere dal cielo, diretta verso la nostra regione.*Quando toccò il suolo, ci fu un terribile terremoto. Pensai immediatamente che fosse arrivata la fine del mondo, ma con l'assestarsi della situazione, decisi di andare a osservare il punto dell'impatto.**Appena le mie dita toccarono quella roccia extraterrestre, una visione mi apparse facendomi perdere i sensi.*Mentre giacevo svenuto, qualcosa iniziò a parlarmi.*La voce mi spiegò che era arrivata per salvare il mondo e che mi avrebbe mostrato il cammino verso l'illuminazione.**Sentii due mani enormi afferrarmi e udii mormorii indirizzati a me, una voce profonda e gutturale. Poi vidi un lungo susseguirsi di immagini, dall'inizio dei tempi fino a ora. Scoprii il suo nome, il nome del mio dio: Akbaa, indiscusso re di Arx.**In quel momento sapevo che la mia missione nella vita era aiutare Akbaa a trovare seguaci che credessero nel suo potere.*Più seguaci avessi trovato, maggiore sarebbe stato il potere del mio Dio, che così sarebbe stato in grado di reincarnarsi su Arx rendendomi padrone del mondo.**Costruii un tempio nei tunnel sotterranei, non lontano dalla nostra città, per onorarlo e diffondere la parola della sua religione. Resi inoltre il meteorite Koltk il fulcro a cui dirigere tutte le nostre energie.**L'unico modo per soddisfare il mio dio era offrirgli in sacrificio esseri pensanti. L'adorazione e l'amore che avevo per lui furono ricompensati con molti poteri e la conoscenza degli incantesimi magici, che mi hanno reso molto più potente di un semplice umano.*Un potere che incuteva timore a centinaia di non credenti..."
////////////////////////////////////////////////

[description_book_chicken]
string="Il potere dei polli, di Lord Inut, il contadino di Liukalau"

[book_chicken_content]
string=" Ho dedicato tutta la mia vita allo studio di questo straordinario animale: il pollo.**È difficile credere che orribili stregoni usino senza alcuno scrupolo queste meravigliose creature per eseguire i loro crudeli rituali, sacrificandoli per le loro magie.*Sono convinto che i polli siano dotati di grande intuito e senso dell'umorismo.**La razza dei polli si compone di 57 specie differenti, ognuna più incredibile dell'altra e ognuna con la propria cultura e filosofia di vita.**Ho trascorso 8 anni, giorno e notte, a contatto con i polli, per comprenderli a fondo. Ho persino imparato a camminare come loro per dimostrare il mio rispetto.**Dopo molti esercizi di concentrazione, sono riuscito a trasformarmi in un pollo. Si potrebbe forse dire che sono una sorta di 'pollo mannaro', che si trasforma in pollo quando la luna è favorevole.*Questa mia nuova abilità, come è facile intuire, ha avuto un effetto straordinario sui miei studi. Ero in grado di vivere con i polli, mangiare con loro e persino dialogarvi...**Il loro linguaggio è, in effetti, molto complesso. Darò alcuni esempi di traduzione dal pollese nella lingua umana:**Bok significa Ciao;*Brok?! significa Cosa stai facendo?;*BokBok! indica che ciò che si sta per fare è proibito. *Baaawwwwk esprime un profondo interesse in qualcosa.**Potrei addentrarmi in ulteriori dettagli e dimostrare con queste traduzioni tutte le sfumature del chiocciare dei polli, ma credo che un semplice esempio sia abbastanza per l'intelligenza di un normale essere umano.**Ciò che ho scoperto dell'intelligenza dei polli mostra che essa è accompagnata a un pronunciato senso dell'altruismo.*In una comunità di polli, il maschio dominante si reca nelle aree circostanti alla ricerca di cibo, se non ve ne è di disponibile. Non appena ne trova, lo pesta con un piede ed esplode in un forte 'Braaawwwk' che richiama il resto della comunità a nutrirsi.*Li osserva con occhi affettuosi e mangia solo una volta che gli altri hanno avuto la loro parte.**Nell'ambito dei miei esperimenti, ho cercato di deporre un uovo, per ora senza successo...*Un recente studio suggerisce che forse questo è dovuto al fatto che sono maschio, ma non riesco ad abbracciare una spiegazione tanto semplicistica.*Ecco perché continuo a sperare ancor oggi..."
////////////////////////////////////////////////
[description_book_mine_log]
string="Diario delle miniere, di Isep Ethan, caporeparto."

[book_mine_log_content]
string=" Rapporto 87 - Anno 266, Stagione Marrone, Giorno Terzo della Settimana dell'Aquila.**Dopo settimane e settimane di duro lavoro, abbiamo finalmente scoperto una vena di mithril.*Quando i minatori si sono trovati di fronte al punto in cui il mithril affiorava in superficie, si è sollevato un grido di gioia, e lacrime sono comparse nei loro occhi.*La vena si trova all'estremo est.*Visto che è piuttosto lontana dalla sala di macinazione, abbiamo costruito un binario su cui viaggeranno alcuni vagoni, portando il minerale direttamente alla macinazione.*********Rapporto 88 - Anno 266, Stagione Marrone, Giorno Secondo della Settimana del Ratto.**Da quando la vena è stata scoperta, abbiamo scavato in tutte le direzioni dal punto in cui inizia.*Scavando verso nord, siamo incappati in una strana cavità. Sembra essere naturale e artificiale allo stesso tempo. Emanava un odore molto forte e abbiamo pensato che fossero gli escrementi di qualche animale selvatico.**Visto che siamo nella Settimana del Ratto, sono piuttosto ansioso di vedere ciò che il futuro ci riserva..."
////////////////////////////////////////////////
[description_book_forge_manual]
string="Fucina - Manuale di istruzioni."

[book_forge_manual_content]
string=" Per realizzare un oggetto metallico, è necessario usare due macchinari. Innanzitutto, è richiesta una lingottiera: questa macchina consente di fondere il minerale per ottenere un lingotto calibrato. I passaggi seguenti illustrano come realizzare un lingotto:**1) Posizionare una pietra energetica nella macchina per fornirle energia.**2) Adagiare due grossi pezzi di minerale nel forno. Accertarsi di non usare due pezzi di minerali differenti contemporaneamente.**3) Qualora sia necessario legare il metallo, aggiungere un reagente alla miscela.**4) Tirare la leva per creare il lingotto. *****Successivamente, usare la fucina nel modo seguente:**1) Posizionare la pietra energetica nella macchina per fornire energia.**2) Inserire lo stampo dell'oggetto che si desidera realizzare nella fonditrice**3) Adagiare il lingotto nel forno**4) Tirare la leva per creare l'oggetto desiderato."
////////////////////////////////////////////////

[description_book_art_of_making_potions]
string="La magia delle pozioni, di Cyro Besali."

[book_art_of_making_potions_content]
string=" Preparare pozioni è molto facile.*Basta essere un po' meticolosi e pazienti.**Innanzitutto, è necessario procurarsi una bottiglia vuota. Poi, bisogna disporre del reagente specifico per ogni pozione.*A questo punto, ridurlo in una fine polvere usando un pestello e un mortaio, quindi riporre la polvere in una fiala vuota.*Riscaldare la miscela con un alambicco.*Ora la pozione è pronta.**Ecco un elenco di reagenti noti e riconosciuti:**per le pozioni mana, usare polvere di giglio (blu);**per efficaci antidoti contro il veleno, usare erbe medicinali (viola);**per le pozioni di invisibilità, usare la polvere di fiori di bucaneve (bianca);**per i veleni, usare le felci (polvere verde)**e per le pozioni curatrici, usare la polvere di ninfea (arancione)."
////////////////////////////////////////////////
[description_book_codex]
string="La Farmacopea dell'Ordine."

[book_edurneum_codex]
string="Come la pelle di un serpente, così è la vita di una regina**solo con la rinascita avverrà la venuta di una nuova regina**una donna di sangue reale**poiché solo il sangue reale può onorare il Grande Serpente.**Solo alla Terza Luna di Ixos sia celebrato il rituale di rivelazione reale."
////////////////////////////////////////////////
[description_book_the_order]
string="L'Ordine di Edurneum, di Efan Dirscue."

[book_the_order_content]
string="Si sa molto poco delle Sorelle di Edurneum. Persino l'origine di queste creature, mezze donna e mezze serpente, ci è ignota. In alcune zone, la loro pelle è coperta di scaglie.**Sono forse una razza discendente da tempi remoti, o semplicemente donne vittime di una forma di mutazione?*Nessuno, se non esse stesse, è in grado di svelare questo mistero.*Pare che adorino un dio serpente, ma non sappiamo nulla di questa divinità e tutti i segreti sul suo culto sono gelosamente conservati dalla congregazione.*Supponiamo che questo dio abbia concesso loro i poteri magici che possiedono, ma, come per tutte le altre informazioni che abbiamo sull'Ordine, non possiamo affermarlo con certezza...**Alcune leggende raccontano che non solo i loro poteri magici derivano dall'adorazione di questo dio, ma anche la loro trasformazione in serpenti.*Tuttavia, non esistono prove.**Da quando il sole di Arx è calato, i membri della congregazione sono stati i più stretti alleati degli umani.*Quando la nostra razza dovette iniziare a vivere nelle cavità della terra, le Sorelle offrirono doni magici al Re, grazie ai quali fu data vita a una nuova pianta in grado di crescere senza la luce dei raggi solari e che servì da nutrimento per gli umani e i loro animali.**Il popolo di Arx nutre un profondo rispetto per le Sorelle dell'Ordine di Edurneum e sarà loro eternamente grato per ciò che hanno fatto."
////////////////////////////////////////////////
[description_book_history_arx]
string="La storia di Arx, di Maioo Kasmadian."

[book_history_arx_content]
string=" In tempi lontani, cinque tribù umane abitavano il più vasto continente del nostro mondo.*Queste tribù erano costantemente in guerra, e più le loro strutture diventavano sofisticate, più la situazione peggiorava.*Dopo anni di conflitti e odio accumulato, un uomo di nome Poxsellis intervenne, riuscendo a unire questi gruppi separati.*Diventò il primo re degli umani.**Dopo l'ultima Battaglia degli Scudi infranti, nell'anno 170, Arx visse il più lungo periodo di pace e prosperità mai conosciuto.**Durante il regno di Poxsellis, l'unico periodo di guerra fu rappresentato dalle lotte filosofiche che chiamiamo 'la Guerra dei Maghi'.*Nonostante si trattò di una guerra feroce che contò molte vittime, durò solo pochi mesi e non ebbe alcuna conseguenza sul potere politico del nostro reame.**Nel corso del resto del suo regno, Poxsellis dovette affrontare numerose minacce.*Molte invasioni goblin furono sventate, all'epoca in cui gli uomini ratto iniziarono a vivere nelle fogne della città.**Le battaglie furono sanguinose e quest'iniqua guerra durò a lungo. Le truppe reali, tuttavia, capeggiate da Poxsellis in persona, massacrarono i nemici.*Ancora una volta, la pace tornò a regnare su Arx.**Iniziò l'esplorazione degli oceani.**Molte solide navi furono messe in mare, per attraversare gli oceani e scoprire nuove terre e nuovi tesori.*Ma, nel 216, una meteora cadde sul suolo del nostro mondo. In un primo momento, nessuno si occupò di questo fenomeno, ma alcune persone lungimiranti sentirono che si trattava di un cattivo auspicio per il futuro di Arx.**Alcuni anni dopo, il nostro sole iniziò a spegnersi. La luce diventò sempre più fioca e le temperature scesero a livelli davvero pericolosi.*Il nostro re Lunshire, figlio di Poxsellis, allora molto giovane, ordinò che l'intera città migrasse all'interno di una miniera nanica ormai in disuso.**Fu un impresa titanica, ma tutti sapevano che era essenziale per la propria salvezza e nessuno si lamentò.**Fu firmato un trattato di pace con tutte le altre razze, a eccezione degli uomini ratto, con cui è impossibile dialogare.*Tuttavia, i loro attacchi si fecero sempre più rari.**Tutti erano occupati a salvare Arx, a salvare la propria vita.*Fu poi stipulato un accordo che assegnava a ogni razza un livello della miniera, in cambio del lavoro svolto.**Questa armonia durò per cinque anni, durante i quali il sole si spense definitivamente. Fu fatto tutto il possibile per salvare gli abitanti di Arx, eppure molti persero la vita.**Inoltre, non si sapeva nulla delle altre città del continente e si giunse così alla logica conclusione che avessero agito nello stesso modo.**Solo molto più tardi giunse la notizia, portata dalla Corporazione dei Viandanti,**Esistevano ancora alte fortezze, sparse in tutto il continente, imprigionate in uno spesso guscio di ghiaccio.**La Corporazione dei Viandanti è l'unico strumento rimasto per comunicare da una fortezza all'altra e scambiarsi, di tanto in tanto, prodotti di lusso.*A parte questi sporadici contatti, Arx è del tutto autosufficiente."
////////////////////////////////////////////////
[description_book_ancient_gods]
string="Gli antichi dei, di Abdul Al Raïf."

[book_ancient_gods_content]
string=" In origine, gli dei erano onnipotenti. Regnarono su Arx per un lunghissimo tempo prima che gli umani facessero la loro prima comparsa.**Sappiamo molto poco degli dei, a parte il fatto che la proliferazione degli umani li riempì di collera e per questo abbandonarono la superficie terrestre.**Alcuni scritti molto antichi fanno intuire che questa scomparsa fu causata dalla poca fede che i primi umani dimostrarono in loro.*Due divinità rimasero più a lungo delle altre prima di scomparire. I loro nomi erano Zohark e Krahoz.**Zohark era il più potente tra gli dei, era tuono, fulmine e terremoto. Era tormenta, uragano e tutto ciò che rappresentava la forza brutale della natura.*Ma il suo potere poteva essere liberato solo da Krahoz.**Krahoz era la dea dell'equità, guardiana dell'equilibrio e dell'uguaglianza.*Avevano bisogno l'uno dell'altra, e questo può spiegare perché restarono più a lungo degli altri dei, poi scomparvero come tutti gli altri.*I tempi moderni hanno visto l'abbandono delle antiche credenze e fu il turno degli umani, anch'essi in grado di fare magie, di controllare la terra e il fulmine.**Gli umani entrarono in una nuova era concettuale, caratterizzata da una maggiore fiducia nelle proprie capacità e dal ruolo marginale assunto dagli dei, relegati ormai ad ambiti secondari come la fertilità o l'edonismo.*Onoravano gli dei della negoziazione, dell'oro e della fortuna, persino gli dei della povertà, ma gli dei originali, gli dei delle forze selvagge della creazione, non avevano spazio in questo pantheon.**Dall'inizio della nuova era e del cambiamento di fede, gli dei più potenti si sono trasferiti nella propria dimensione, il Noden, in attesa di nuovi adoratori che consentano loro di ritornare."
////////////////////////////////////////////////
[description_book_kings_arx]
string="I re di Arx, di Greenonic Warmhill."

[book_kings_arx_content]
string=" Poxsellis fu il nostro primo re. Fu il primo che, nell'anno 170, riuscì a riunire in un'unica comunità le cinque tribù umane del nostro continente.**Queste tribù erano state costantemente in guerra l'una con l'altra, fin dall'inizio dei tempi, ma nessuna era abbastanza potente da stabilire la propria supremazia sugli altri.*Poxsellis era buono e coraggioso e sfidò e sconfisse il capo di ogni tribù in quella che divenne nota come la Battaglia degli Scudi infranti.**Prima di sfidare i capi delle tribù, Poxsellis si era avventurato in un tempio abbandonato nelle Montagne della Miniera Gemente. Da questo tempio tornò con uno scudo incantato che gli consentì di sconfiggere tutti i capi tribù.**Non appena assunse il comando di tutte le tribù, Poxsellis si investì del titolo di Re di Arx. Regnò sul nuovo reame di Arx con saggezza, giustizia e magnanimità.**Il suo regno fu lungo e prospero, nonostante gli scontri con i goblin e gli uomini ratto che, grazie al suo genio militare, riuscì sempre a piegare.*Ebbe meno fortuna con i suoi discendenti.*I suoi due primi figli, Elois e Nickus, entrambi ottimi guerrieri, morirono mentre Poxsellis era ancora in vita.**Fortunatamente, al momento della sua morte, nel 212, il suo figlio minore, Lunshire, gli succedette, seppure fosse troppo giovane.*Lord Poncet ricevette l'incarico di reggente fino a che il giovane non avesse raggiunto la maggiore età. Tramò per impedire a Lunshire di accedere al trono, ma non fu mai molto amato e il suo piano meschino fallì. Lunshire salì al trono nel 215, all'età di 16 anni.**Re Lunshire si trovò subito di fronte a un difficile compito, poiché il sole aveva iniziato il suo declino.*Fu lui a ordinare la migrazione del popolo sottoterra. Fece tutto ciò che era in suo potere per salvare tutti coloro che la miniera nanica poteva ospitare.**Ebbe inoltre l'intelligenza diplomatica di firmare un trattato con le altre razze di Arx, senza le quali l'impresa sarebbe durata molto più a lungo, e forse non sarebbe nemmeno giunta a termine, visto il rapido avvicinarsi dell'era glaciale.**Re Lunshire rese onore alla memoria del padre trasferendo la sua bara in una nuova cripta, costruita sulle fondamenta della tomba del minatore, così che questo grande re non fosse dimenticato e non perdesse mai il rispetto del suo popolo."
////////////////////////////////////////////////
[description_book_great_inventions]
string="Le grandi invenzioni di Arx, di Edric Arol."

[book_great_inventions_content]
string=" L'immaginazione umana è sempre stata fonte di straordinarie invenzioni per la nostra società. Tutti ricordano gli enormi palloni tenuti in cielo dall'aria calda che ci hanno consentito di avventurarci nelle grandi esplorazioni del passato.*Gli umani ci hanno regalato un eccellente sistema di sorveglianza contro le invasioni, grazie al quale possiamo osservare da grandi distanze.**Un'altra strabiliante invenzione è stata il sottomarino.**Questa meravigliosa costruzione ci ha fornito un nuovo mezzo per scacciare i pirati e le flotte goblin, assicurandoci la supremazia navale durante gli anni oscuri del caos e della disperazione.**Lord Marko, creatore di questa inestimabile invenzione, è uno degli eroi più celebrati in tutta Arx. Ma l'invenzione umana più mirabolante è certamente il regno sotterraneo di Arx.*Forse non è tanto un'invenzione, quanto piuttosto la trasformazione di una struttura esistente. Alla sua origine vi è un'antica miniera nanica dotata di un sistema di ventilazione particolarmente efficace.**Era già una splendida struttura, ed è diventata ancora più sorprendente grazie al modo in cui gli umani l'hanno organizzata...*L'antica miniera è diventata un mondo realmente autonomo, sfruttando tutto lo spazio disponibile. Ad ogni razza nota è stato assegnato un livello, in conformità con il trattato firmato nel 217. Il regno che è stato costruito è la dimostrazione vivente di ciò che la determinazione umana è in grado di realizzare."
////////////////////////////////////////////////
[description_book_race_arx_content]
string="Le razze di Arx, di Cebrafi Nin."

[book_race_arx_content]
string=" I rapporti tra le diverse razze di Arx sono sempre stati difficili.**La razza dei goblin è sempre stata la più popolosa, grazie anche all'alto grado di fertilità. Tuttavia, poiché non sono mai stati in grado di organizzarsi in un regno unito, hanno gradualmente perso la propria posizione predominante.*In linea generale, i goblin non sono molto intelligenti. Hanno un proprio linguaggio e il più delle volte parlano una versione storpiata della lingua umana. Sono costantemente alla ricerca di cose da criticare e infastidiscono spesso i propri interlocutori.*Sono bugiardi, arroganti, codardi e incredibilmente pigri.*L'unico periodo in cui sono stati alleati degli umani fu al tempo del grande trattato. All'epoca, contribuirono alla costruzione del regno sotterraneo, contenendo temporaneamente la loro naturale aggressività e le cattive maniere. Ma non appena l'opera fu terminata, tornarono alle loro vecchie abitudini.*Sembra che il commercio di gemme sia l'unica attività pacifica che persino la più tollerante delle razze riesce a sopportare da parte dei goblin.**I troll sono di tutt'altra pasta.*Sebbene sembri che le loro origini siano simili a quelle dei goblin, sono radicalmente diversi. Non hanno una forte volontà e sembrano vivere al rallentatore.*Non sono aggressivi e, il più delle volte, sono molto benevolenti. Tuttavia, la loro forza mostruosa e la loro leggendaria fibra li rendono potenti alleati ma anche avversari letali.*La loro esistenza si fonda sulle cose più semplici della vita, come trovare qualcosa di cui cibarsi o un luogo per dormire. Data la loro debole intelligenza, è facile ingannarli, ma povero colui che viene scoperto, perché la loro rabbia è sconfinata.**Gli uomini ratto hanno sempre preferito avere poco a che fare con le altre razze.*Comunicano a gesti invece che con le parole, accompagnandoli talvolta con suoni gutturali.*La loro estrema agilità li rende temibili avversari in combattimento. Alcuni tra loro sono i più grandi assassini di Arx. Sono molto furbi e agili; spesso fanno uso di armi avvelenate.*Vivevano già sottoterra, nelle fogne della città, quando gli umani erano ancora in superficie. Nutrirsi degli scarti e degli escrementi sembra essere di loro gradimento.*Fino a oggi, i pochi scontri avuti con gli uomini ratto sono stati brevi ma sanguinosi. Hanno fatto qualche occasionale incursione nelle città umane per frugare tra i bidoni della spazzatura alla ricerca di cibo e strumenti rudimentali. Da quando sono stati relegati sottoterra, nella fortezza di Arx, hanno gradualmente perso ogni tipo di contatto con le altre razze e si muovono con discrezione esemplare.**I nani nutrono una grande passione per tutto ciò che ha a che fare con la meccanica, i mestieri manuali e l'ingegneria, oltre a essere i migliori fabbri del mondo. Abitano nella fortezza sotterranea da molto prima che tutte le altre razze vi si trasferissero.*Sono gli unici a sapere come costruire miniere e sfruttarle correttamente, e spesso vendono il prodotto delle loro estrazioni agli umani.*Hanno sempre avuto un bruttissimo rapporto con i goblin e hanno lanciato numerose guerre contro di loro nel tentativo di eliminarli definitivamente.*Una delle loro miniere più grandi è stata scelta come rifugio e sito per la costruzione della nuova città di Arx. Anche loro hanno contribuito alla costruzione delle infrastrutture di base e hanno partecipato a diversi lavori, tranne che al livello dei goblin. Poiché già avvezzi a vivere nelle viscere della terra, si sono spostati ancora più in profondità, continuando a sfruttare le miniere.**L'origine delle Sorelle di Edurneum è avvolta dal mistero.*Il loro aspetto è quello di un ibrido tra una donna e un serpente e la loro pelle è coperta di scaglie.*Pare che non ci siano uomini all'interno della loro razza e non si sa nulla dei loro metodi riproduttivi.*Sono molto abili nell'uso della magia: sono in effetti i maghi più dotati di Arx. Secondo alcune leggende, ebbero a che fare con l'origine vera e propria della magia. Sono sempre state molto vicine alla razza umana, che hanno assistito in una fase molto difficile del suo sviluppo.*Nel corso della migrazione, le Sorelle promisero di aiutare i re degli uomini e diedero vita a una pianta sotterranea che avrebbe nutrito il loro sudditi e i loro animali.**Sono pochissime le notizie che si hanno sui draghi. Tuttavia, gli studiosi hanno contato 4815 scaglie su ogni specie analizzata."

////////////////////////////////////////////////
[description_book_known_gods]
string="Conosci gli dei e i demoni, del teologo Bracconus."

[book_known_gods_content]
string=" Alador, creato su Omnys, dio benevolo:*Pare essersi ritirato dopo aver concesso piena libertà d'azione agli uomini nella sua dimensione, dando loro, in particolare, la capacità di controllare il proprio destino.*Si pensa che sia stato molto potente, seppur non abbia mai mostrato i suoi pieni poteri prima di abbandonare la dimensione di Omnys.**Xarm, creato su Omnys, dio malvagio:*l'esatto opposto del dio precedente.*Xarm era molto in collera con Alador per aver concesso tanta indipendenza agli umani. Non potendola più sottrarre loro, tentò di soggiogarli al suo potere riducendoli in schiavitù.**Akbaa, creato su Koltk, dio malvagio:*detto il dio della distruzione poiché distrusse completamente Koltk, fu inizialmente adorato dai suoi seguaci visto l'aiuto che offriva loro durante le guerre e i conflitti.**Tirkio, creato su Arx, dio benevolo:*disprezza la superficialità dei ricchi. È consigliabile disfarsi di tutto il proprio oro prima di avere a che fare con lui."
////////////////////////////////////////////////
