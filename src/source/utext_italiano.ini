string="Paesaggi del mondo esterno."

[book_landscapes_content]
string=" Paesaggi del mondo esterno."
////////////////////////////////////////////////

[book_calpal_journal]
string=" Anno 238, Stagione Verde, Giorno Secondo della Settimana del Ragno:*Carlo mi ha chiesto di seguire la Regina. Strana missione; ha cercato di convincermi con la storia dei 'bei vecchi tempi', di quando ero mercenario al servizio del regno, ma questa volta mi sono assicurato che sarò pagato per il mio lavoro.**Anno 238, Stagione Verde, Giorno Quinto della Settimana del Gatto:*mentre stavo seguendo la Regina, l'ho vista lasciar cadere una lettera dietro alla statua accanto alla cripta. Ho aspettato che se ne andasse prima di trascrivere rapidamente ciò che vi era scritto...*Sono certo che Carlo sarà molto soddisfatto della mia scoperta.**Anno 238, Stagione Verde, Giorno Sesto della Settimana del Gatto:*missione compiuta; la regina è morta e tutti pensano che il colpevole sia il gruppo di ribelli che aveva rapito l'erede reale."

//** this book is now in the human library
[description_book_traveler_guild]
string="La Corporazione dei Viandanti, del saggio Dormal."

[book_traveler_guild_content]
string=" La Corporazione dei Viandanti fu la prima istituzione a essere creata dopo l'estinzione del sole di Arx.*A darle origine furono un gruppo di robusti sopravvissuti che non vollero unirsi al resto della popolazione sotterranea. Questi rari sopravvissuti svilupparono alcune tecniche per resistere alla morsa del freddo ingerendo sostanze alchemiche.**Costruirono i propri rifugi ricavandoli dal ghiaccio e allevarono cani, anch'essi resistenti al freddo.*A loro si unirono altri uomini e donne che non temevano il gelo e desideravano avventurarsi in altre città.**Da questi viaggi nacque la Corporazione dei Viandanti, che oggi rappresenta l'unico mezzo di comunicazione tra città sotterranee. I suoi membri sono sempre rispettati e accolti calorosamente, poiché sono gli unici in grado di portare notizie dall'esterno."

