[Fallan_intro_1]//{~02~11~09@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Ascoltatemi, Esseri di Luce, e prendete nota di quanto devo dirvi. Questa è Arx, una volta una città come molte altre, orgogliosamente distesa sotto la maestà del sole. Il nostro re, Poxsellis, era giusto e sapeva come trattare le occasionali schermaglie con i goblin e gli uomini-topo. Molti anni dopo la morte di Poxsellis, nel fatale anno 226, il sole cominciò a declinare e un eterno inverno cadde sul nostro mondo... Re Lunshire, nobile figlio di Poxsellis, decise di spostare tutta la città sotto terra, in una delle miniere abbandonate dai nani. A questo punto i conflitti tra le diverse razze di Arx sparirono. Non solo gli umani, ma anche nani, troll e goblin lavorarono insieme per sopravvivere. Questa migrazione verso le viscere della terra fu completata in cinque anni, durante i quali il sole scomparve del tutto. Tutte le razze costruirono le loro case nel nuovo ambiente e, un po' per volta, i rapporti tra le razze tornarono uguali a prima. Ma oggi, il male sta bussando alla porta..."

