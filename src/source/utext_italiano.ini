[garlic_attack]
string="Attacco all'aglio!!!!"

// shany sub quest
[note_5000_sons]
string="Ora che hai trovato una preziosa oblazione per il nostro dio, possiamo eseguire il rituale. Ti aspetterò presso il pilastro dei serpenti al 4° livello, alle dieci in punto di domani mattina. Da lì, ti condurrò alla stanza segreta, dove evocheremo i cinquemila figli della Bestia. Fai molta attenzione a non farti seguire."

[note_alotar_threat_content]
string="Ricorda: se non mi porterai le gemme domani sera, morirai. La Confraternita dei Mercanti di gemme."

[note_for_pog_content]
string="Pog, Io: Lunshire, serve aiuto. Percorso per avamposto umano bloccato: enormi massi. Se troll sbloccano passaggio: io soddisfatto. - L."

[note_dwarf_mithril]
string="Akanor, temo che le nostre scorte di mithril stiano per esaurirsi. La situazione peggiora di giorno in giorno e non riesco a trovare neanche un grammo di mithril nelle nostre miniere. Dobbiamo trovare immediatamente una soluzione. Oredak."

[note_jail_contain]
string="Io venire te sostituire dopo che io mangiare. Attenti umani, fare attenzione a nuovo, lui sembrare pericoloso.* Anatole."

[description_note_fallan_content]
string="Felnor,**Ho scoperto l'esistenza di una setta che intende evocare Akbaa perché venga su Arx. Akbaa è un potente diavolo, è il dio della distruzione che questa setta sta evidentemente tentando di invocare e riportare su Arx. Lasciare che questo atto sia perpetrato sarebbe uno spergiuro, oltre a un disastro incommensurabile per tutte le creature viventi di questo pianeta...*Da qualche parte, nella fortezza, si raduna una setta che recita preghiere sacrileghe in onore di un frammento di meteorite, costituito interamente da un materiale chiamato Koltk. Si dice che questa roccia provenga dal pianeta su cui nacque Akbaa... Di solito questa sostanza è indistruttibile.*Le empie preghiere dei sacerdoti e i loro orribili sacrifici sono raccolti e assorbiti dalla meteora, che diventa un canale di energia che giunge fino ad Akbaa, il quale, una volta che ne avrà a sufficienza, sarà in grado di reincarnarsi e tornare su Arx. Se questo dovesse accadere, la distruzione e la sofferenza si abbatteranno su di noi. Dobbiamo trovare e distruggere il meteorite a ogni costo. In verità, Felnor, solo un Guardiano del Noden può riuscirvi... Questa sera, mi rivolgerò al Noden e chiederò il loro aiuto.**Falan."

[note_king_bedroom_contain]
string="O, Re, ricorda - mai, MAI bere vino - tu è allergico a vino. Se tu bere vino, tu moooooolto malato... - Il suo fidato farmacista."

[note_glavasias]
string="Fratello Glavasias, se mai avessi bisogno di disattivare il sistema di sicurezza, ricorda che il tuo codice di accesso è 113. Il campo di forza protettiva non dovrebbe causare problemi. Fratello Patrizio e Fratello Pasquale ti aiuteranno a disinserire gli altri sistemi di sicurezza. - Lord Iserbius."

[note_Patrizio]
string="Fratello Patrizio - questo cuore è una delle chiavi per il sistema di sicurezza. Conservalo con cura. - Lord Iserbius."

[note_Pasquale]
string="Fratello Pasquale - ricorda: il primo blocca il secondo. - Lord Iserbius."

[note_gob_guardpost_contain]
string="Miei cari amici goblin, visto che il nostro accordo, così sembra, continuerà ad essere valido, vorrei confermare il mio ordine di altri due umani, da sacrificare al nostro amato Akbaa. Riceverete 1000 pezzi d'oro ciascuno, al momento della consegna. Vi porterò io stesso questa somma principesca. - Lord Iserbius."

[note_mike_lost]
string="Caro Oliver, mi dispiace, ma non sono in grado di risolvere il quarto enigma. Non sapresti darmi un suggerimento? - Mike."

[note_maria_love]
string="Maria, è passato molto tempo dall'ultima volta che ci siamo visti, e se solo la situazione fosse diversa, farei qualsiasi cosa al mondo pur di essere al tuo fianco. Tuo, - L."

[note_key_brother_treasure]
string="1-3-1 è il codice per aprire i tesori dei miei fratelli."

[note_treasure_hunt_hint#4]
string="Sono molto colpito dai progressi che hai compiuto, forestiero. Ecco il quarto indizio (... usato come indizio...). Per avere il prossimo indizio, trova l'isola di lava e osservala attentamente."

[player_stone_riddle_first]
string="Viaggiatore, se vuoi partecipare alla mia caccia al tesoro, ti servirà uno smeraldo per aprire il mio scrigno. OLIVER."

[player_note_riddle_second]
string="Aha, vedo che si è aggiunto un nuovo giocatore. Benvenuto, forestiero. Ecco il primo indizio: (La chiave del tesoro...). Per trovare il prossimo indizio, recati alle miniere dei troll e cerca la nota sotto le pietre."

[note_carlo_sacred_sword]
string="L'Operazione Pugnale sacro avrà luogo domani. Preparati. Mi accerterò che le guardie non siano nei paraggi al tuo arrivo e, cosa ben più importante, che il re dorma profondamente. Non sospetterà nulla. Porta a termine il tuo compito e la nostra causa sarà salva. - F."

[note_carlo_calpal]
string="Nota #1- Enoill, La Regina Florence è diventata un pericolo per il Regno. Seguila senza farti vedere e fammi sapere cosa riesci a scoprire. - Carlo."

[note_carlo_calpal2]
string="Nota #2 - La lettera che hai trovato conferma i miei sospetti. La Regina sta tramando per assassinare il Re. Vorrei quindi che organizzassi un modo per farla sparire. Tempi e luoghi sono a tua discrezione. È ovvio che riceverai una lauta ricompensa per questo lavoro. Brucia questo messaggio dopo averlo letto. - Carlo."

[note_carlo_calpal3]
string="Nota #3 - Devi completare la tua missione stasera. Occupati della Regina il più in fretta possibile, dopo la nascita di suo figlio. Io stesso penserò alla sicurezza del Re. - Carlo."

[player_note_riddle_third]
string="Complimenti, forestiero. Ecco il secondo indizio (... è al livello...). Per avere il prossimo indizio, prova a vedere ciò che non può essere visto nella stanza sotto alle prigioni goblin."

[note_dear_mike_sorry]
string="Caro Mike. Mi dispiace, ma non sarebbe corretto nei confronti degli altri giocatori darti un indizio per risolvere l'enigma n°4. Ti auguro comunque buona fortuna. - Oliver l'eremita."

[note_at_last]
string="Finalmente, il momento è giunto. Presto il mio corpo accoglierà Akbaa e insieme, come una cosa sola, regneremo su Arx. Lascio questa nota in caso mi dovesse succedere qualcosa, affinché qualcun altro possa continuare la mia opera per il bene di Arx. - Iserbius."

[note_Darkthorn]
string="Nessuno nel Regno conosce la mia missione. Il Re mi ha scelto perché sono il miglior cacciatore di zombie esistente. So che il mio compito non sarà facile, ma ho raccolto tutti gli strumenti che mi servono per annientare questi esseri abominevoli! Le mummie sono avversari formidabili, ma è facile distruggerle, visto che i loro cadaveri viventi bruciano con grande facilità. Gli altri non morti sono più difficili da eliminare: hanno la fastidiosa abitudine di rialzarsi quando si pensa di averli sconfitti. L'incantesimo che li fa fuggire funziona solo per un breve periodo di tempo, e non li uccide. Il modo migliore, e l'unico che conosco, è piantare profondamente un picchetto nel corpo del non morto prima che si rialzi. Così sarà distrutto per sempre. Non credo che l'equipaggiamento che ho con me sia sufficiente. Fortunatamente, il mio prestigioso predecessore mi ha lasciato alcuni strumenti molto utili. Mi auguro di riuscire a ripulire questo luogo sacro, così che sia possibile tornarvi per rendere omaggio ai propri morti. Sono già stato in ricognizione al primo livello della cripta, ma devo fare attenzione ai pericoli che mi circondano. Che gli dei siano con te. - Azrael Darkthorn."

[note_fallan_code]
string="6 diventa 4 quando sottrai il primo. Il primo moltiplicato per il secondo è uguale all'ultimo e l'ultimo moltiplicato per il primo è uguale a 16."

[note_warning_golem]
string="Non riesco a raggiungere la tomba di Poxsellis. L'enigma posto dal custode per proteggere il sepolcro è troppo difficile. Lascerò il tesoro di Poxsellis a qualcun altro."

[note_miguel_calpale_key]
string="Ecco la copia che hai ordinato, Enoill. Visto che non ci sei, la infilerò sotto la porta. Passa dalla bottega per regolare il tuo conto. Miguel."

[note_twin]
string="Ecco la mappa che indica come scovare il nascondiglio della donna serpente. Ho trovato moltissimi oggetti che riusciremo a vendere in seguito a ottimi prezzi."

[note_bad_snake_woman]
string="Il Guardiano sta per dare una nuova regina a Zalnashh e ai suoi seguaci. Devi fermarlo a ogni costo. La stirpe di Zalnashh deve estinguersi."

[note_troops_for_jail]
string="Re Alotar, prigionieri fuggiti dalla prigione. Necessarie altre truppe. X."

[note_bad_snake_woman2]
string="Ci vediamo alla Caverne di cristallo. Abbiamo nuove informazioni da darti. Stai molto attento, qualcuno potrebbe essere a conoscenza dei nostri piani."

[note_gem_dealer_licence]
string="Licenza per mercante di gemme: Numero #256B - Ufficialmente rilasciata da Re Lunshire e da Sua maestà il Re Alotar -"

