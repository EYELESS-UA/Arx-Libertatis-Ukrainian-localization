[system_tutorial_food_rats]
string="Alcuni ratti e topi sono amichevoli. Puoi mettere certi tipi di cibo vicino a loro; sicuramente lo apprezzeranno..*NOTA: Non tutti i ratti saranno amichevoli, lo saranno ancora di meno in gruppo."

[tutorial_stealth]
string="GIOCA A MODO TUO:***- Puoi uccidere istantaneamente i tuoi nemici attaccandoli alle spalle senza farti notare. Hai bisogno di almeno 40 punti in Furtività e devi avere equipaggiato una spada corta o un pugnale.**-Puoi anche origliare i discorsi degli altri personaggi finchè non ti rilevano, mentre ascolti puoi scoprire ed accedere a informazioni interessanti che potrebbero tornarti utili durante le tue missioni.**-I PNG possono sentirti quindi occhio ai tuoi passi. Puoi provare a lanciare un oggetto lontano e i PNG andranno verso di esso allontanandosi. NOTA: L'icona della furtività compare nell'angolo in basso a sinistra mentre ti stai nascondendo."

[tutorial_stealth2]
string="GIOCA A MODO TUO:***- Puoi uccidere istantaneamente i tuoi nemici attaccandoli alle spalle senza farti notare. Hai bisogno di almeno 40 punti in Furtività e devi avere equipaggiato una spada corta o un pugnale.**-Puoi anche origliare i discorsi degli altri personaggi finchè non ti rilevano, mentre ascolti puoi scoprire ed accedere a informazioni interessanti che potrebbero tornarti utili durante le tue missioni.**-I PNG possono sentirti quindi occhio ai tuoi passi. Puoi provare a lanciare un oggetto lontano e i PNG andranno verso di esso allontanandosi. NOTA: L'icona della furtività compare nell'angolo in basso a sinistra mentre ti stai nascondendo."

[tutorial_torchi]
string="GIOCA A MODO TUO 1: Puoi superare un ostacolo in molti modi diversi.**-Combina una bottiglia d'acqua con una torcia per nasconderti.*-Interagisci con l'ambiente circostante (distrai o blocca i tuoi nemici con le saracinesche).*-Libera i prigionieri durante i combattimenti.*-Attacca direttamente o evita i tuoi nemici.**Sperimenta combo, mano a mano che migliori le tue abilità più opzioni saranno disponibili."

[tutorial_torch2]
string="Ben fatto, ricorda che mentre ti stai nascondendo l'icona di furtività compare nell'angolo in basso a sinistra, più il colore è intenso maggiore è la possibilità di non essere rilevati. NOTA: I tuoi punti Furtività influenzano la tua capacità di nasconderti."

[tutorial_exotic_runes]
string="Congratulazioni, possiedi una runa esotica, questo tipo di runa aggiorna gli incantesimi the utilizzano la runa corrente, sboccando ulteriori funzioni o rendendole più utili."

[system_break_door]
string="Colpisci la saracinesca arrugginita per buttarla giù."

[system_break_box]
string="Puoi colpire le casse per distruggerle, alcune possono contenere oggetti all'interno."

[system_shrunken_player]
string="Sii cauto, non avvicinarti troppo ai PNG mentre sei rimpicciolito, potrebbero ucciderti facilmente senza rilevarti anche se sono tuoi alleat
ringraziamento, ecco qualche oggetto esclusivamente per i donatori: Una sbirciata alle nuove armi alchemiche


Sostituisci con


i."

[system_dummy3]
string="Puoi attaccare furtivamente i tuoi nemici alle spalle eseguendo un uccisione istantanea pugnalandoli al collo, tieni bene a mente che quest'abilità richiede almeno 40 punti furtività, se essi ti rilevano il tuo attacco speciale sarà annullato."

[system_fire_creative]
string="Puoi attivare trappole creative se sei inseguito da numerosi nemici, mettiti accanto a macerie infiammabili e lancia l'incantesimo 'Accendi Fuoco', questo brucerà i tuoi nemici per un tempo limitato, attenzione, usalo con cautela."

