[garlic_attack]
string="¡¡¡¡Ataque con ajo!!!!"

// shany sub quest
[note_5000_sons]
string="Ahora que has encontrado una magnífica ofrenda para nuestro dios, podemos practicar el ritual. Te espero en el pilar de la serpiente en el cuarto nivel a las diez mañana por la mañana. Te conduciré a la cámara secreta donde invocaremos a los cinco mil hijos de la Bestia. Mantente alerta, no permitas que te sigan."

[note_alotar_threat_content]
string="Recuerda: si no nos traes las gemas mañana por la noche, morirás. La Hermandad de Comerciantes de gemas."

[note_for_pog_content]
string="Pog, Yo: Lunshire, ayuda. Camino a puesto avanzado de humanos bloqueado: grandes rocas. Si trols poder desbloquear camino: yo contento. L."

[note_dwarf_mithril]
string="Akanor, creo que estamos a punto de quedarnos sin mithril. La situación es cada día más alarmante y no puedo encontrar ni una onza de mithril en nuestras minas. Tenemos que encontrar una solución ya. Oredak."

[note_jail_contain]
string="Yo reemplazar tú después de yo comer. Tú vigila humanos, tú tener cuidado con el nuevo. Parecer peligroso.*Anatole."

[description_note_fallan_content]
string="Felnor,**he descubierto la existencia de una secta que quiere invocar a Akbaa en Arx. Akbaa es un demonio poderoso, el dios de la destrucción al que esta secta está claramente intentando invocar y volver a traer a Arx. Sería una blasfemia permitir que este acto fuera perpetrado, y un desastre total para cualquier ser vivo de este planeta...*En algún lugar de la fortaleza hay una secta que reza oraciones impías a un fragmento de meteorito compuesto por un material llamado Koltk. Dicen que esta roca procede del lugar en el que nació Akbaa... El material que la compone es indestructible.*El meteorito es el centro de las oraciones impías y los horribles sacrificios. Esto proporciona un canal de energía a Akbaa, y cuando haya reunido la suficiente podrá completar su encarnación en Arx. Si eso sucede se desatará la destrucción y el sufrimiento sobre nosotros. Debemos encontrar y destruir el meteorito cueste lo que cueste. En realidad, Felnor, sólo un Guardián del Noden puede destruirlo... Esta noche me pondré en contacto con el Noden para pedirles ayuda.**Falan."

[note_king_bedroom_contain]
string="Majestad, tener que recordar: nunca JAMÁS beber vino; tú ser alérgico al vino. Si beber vino, tener muuucho dolor...Tu más ferviente boticario."

[note_glavasias]
string="Hermano Glavasias, si alguna vez debieras apagar el sistema de seguridad, tu código de acceso es 113. El campo de fuerza de protección no te causará ningún problema. El hermano Patrizio y el hermano Pasquale te ayudarán a apagar los demás sistemas de seguridad. Lord Iserbius."

[note_Patrizio]
string="Hermano Patrizio, este corazón es una de las llaves del sistema de seguridad. Cuídala bien. Lord Iserbius."

[note_Pasquale]
string="Hermano Pasquale; recuerda: la primera cierra la segunda. Lord Iserbius."

[note_gob_guardpost_contain]
string="Mis queridos amigos duendes, como nuestro acuerdo parece determinado a seguir en pie, me gustaría confirmar el pedido de dos humanos más para sacrificarlos para nuestro querido Akbaa. A la entrega de los mismos recibiréis 1.000 monedas de oro por cabeza. Yo mismo os llevaré esta espléndida suma en persona. Lord Iserbius."

[note_mike_lost]
string="Querido Oliver, lo siento, pero soy incapaz de solucionar el cuarto acertijo. ¿Podrías darme una pista? Mike."

[note_maria_love]
string="María, hace mucho tiempo que no nos hemos podido ver y si las cosas no estuvieran como están, haría cualquier cosa en el mundo por estar junto a ti. Tuyo, L."

[note_key_brother_treasure]
string="1-3-1 es la clave para abrir el tesoro de mis hermanos."

//Jowood version 
[note_treasure_hunt_hint#4]
string="Estoy muy impresionado con el progreso que has hecho, forastero. Así que aquí tienes la cuarta pista (...usada para encontrar pista...). Para la siguiente pista, encuentra la isla de lava y obsérvala de cerca."

[player_stone_riddle_first]
string="Viajero, si quieres formar parte de mi búsqueda del tesoro, necesitarás una esmeralda para abrir mi arcón . OLIVER."

[player_note_riddle_second]
string="Ajá, veo que tenemos un nuevo jugador. Bienvenido, forastero. Aquí tienes la primera pista: (la clave para el tesoro...). Para la siguiente pista, ve a las minas de los trols y encuentra la nota debajo de las piedras."

[note_carlo_sacred_sword]
string="La operación Daga Sagrada tendrá lugar mañana. Estate preparado. Me aseguraré de que los guardias no estén por ahí cuando llegues, y lo que es más importante aún, de que el Rey se duerma rápidamente. No sospechará nada. Haz tu trabajo bien y nuestra causa estará protegida. F."

[note_carlo_calpal]
string="Nota nº1: Enoill, la reina Florence se ha convertido en un peligro para el reino. Por favor, síguela sin que te vean y cuéntame lo que averigües. Carlo."

[note_carlo_calpal2]
string="Nota nº2: la carta que encontraste confirma mis sospechas. La Reina está conspirando para asesinar al Rey. Quiero que organices su desaparición; te dejo decidir cuándo y dónde. Por supuesto, se te recompensará muy bien por el trabajo. Quema este mensaje cuando lo hayas leído. Carlo."

[note_carlo_calpal3]
string="Nota nº3: debes cumplir la misión esta noche. Ocúpate de la Reina tan pronto como puedas después de que nazca su hijo. Yo mismo me encargaré de la seguridad del Rey. Carlo."

[player_note_riddle_third]
string="Bien hecho, forastero. Aquí tienes la segunda pista (... está en el nivel...). Para la siguiente pista, intenta ver lo que no se puede ver en la cámara debajo de las prisiones de los duendes."

[note_dear_mike_sorry]
string="Querido Mike: lo siento, pero no sería justo para los demás jugadores que te diera una pista para el acertijo 4. De todas formas, buena suerte. Oliver, el ermitaño."

[note_at_last]
string="Por fin ha llegado la hora. Pronto mi cuerpo será poseído por Akbaa y reinaremos juntos sobre Arx. Por si me pasara algo, quiero dejar esta nota para que otro continúe mi trabajo por el bien de Arx. Iserbius."

[note_Darkthorn]
string="Nadie en el reino sabe nada de mi misión. El Rey me escogió porque soy el mejor cazador de zombis que existe. Sé que mi trabajo no es fácil, pero he reunido todo lo necesario para destrozar a esos seres repugnantes. Las momias son grandes adversarios, pero muy fáciles de eliminar, porque sus cadáveres vivientes prenden muy bien. Los otros muertos vivientes son más difíciles de destruir porque tienen la dichosa costumbre de volverse a levantar cuando crees que has acabado con ellos. El hechizo para echarlos sólo funciona un rato, y no los mata. De hecho la mejor y única manera que conozco es clavarles una estaca muy hondo en el cuerpo antes de que se vuelvan a levantar; así se les destruye para siempre. No creo que me baste con el equipo que tengo. Afortunadamente, mi prestigioso predecesor me dejó cosas muy útiles. Espero poder limpiar este sagrado lugar para que la gente pueda volver a venir a rendir homenaje a sus muertos. Ya he estado en una misión de reconocimiento en el primer nivel de la cripta. Pero tengo que estar alerta de los peligros que me rodean. Que los dioses te acompañen. Azrael Darkthorn."

[note_fallan_code]
string="6 es 4 cuando le quitas el primero. El primero multiplicado por el segundo son el último, y el último multiplicado por el primero son 16."

[note_warning_golem]
string="No puedo llegar a la tumba de Poxsellis. El acertijo que puso el vigilante que protege el coche fúnebre es muy difícil. Le dejo el tesoro de Poxsellis a otro."

[note_miguel_calpale_key]
string="Aquí tienes la copia que pediste, Enoill. Como no estás te la meto por debajo de la puerta. Pásate por la tienda para solucionar la cuenta. Miguel."

[note_twin]
string="Éste es el mapa que muestra el camino a la guarida de las mujeres serpiente. Encontré un gran número de objetos diferentes que podremos vender a un buen precio."

[note_bad_snake_woman]
string="El Guardián está a punto de darle una nueva reina a Zalnashh y a sus seguidores. Detenlo cueste lo que cueste. El linaje de Zalnashh debe extinguirse."

[note_troops_for_jail]
string="Rey Alotar, los prisioneros se han escapado. Necesitamos más tropas. X."

[note_bad_snake_woman2]
string="Nos vemos en las Cuevas de Cristal. Tenemos nuevas instrucciones para darte. Y ten cuidado, puede que alguien conozca nuestros planes."

[note_gem_dealer_licence]
string="Permiso de comercio de gemas: Número 256B. Entregado oficialmente por el rey Lunshire y el todopoderoso rey Alotar -"

[note_goblin_authorization_unsigned]
string="Autorisación. Dueño poder entrar reino duendes. Entregado por:"

[note_goblin_authorization_signed]
string="Autorisación. Dueño poder entrar reino duendes. Entregado por: Anatole. X"

[note_end_demo]
string="Enhorabuena,**Acabas de terminar la demo de Arx Fatalis."

