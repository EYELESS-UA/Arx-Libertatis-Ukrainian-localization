[system_tutorial_0]
string="Mira en el arcón de la tienda, coge objetos que quieras comprar 
o deja objetos que quieras vender."

[system_tutorial_0bis]
string="Entrega tus armas estropeadas o la armadura al herrero para que las repare."

[system_tutorial_1] //Jowood version
string="Haz clic en el botón derecho del ratón para alternar de 'MODO CURSOR' a 'MODO PUNTO DE VISTA DEL RATÓN'."

[system_tutorial_1_new]
string="Haz clic en este mensaje con el botón derecho del ratón para 
cerrarlo."

[system_tutorial_1_new2]
string="Los mensajes del tutorial se encuentran en la sección diario de 
tu libro de búsqueda (tecla predeterminada: 'F4')."

[system_tutorial_2_new]
string="Haz doble clic en cualquier objeto estático para activarlo."

[system_tutorial_2bis]
string="Pulsa 'ABRIR LIBRO' (tecla predeterminada: 'RETROCESO') o haz 
clic en el icono del LIBRO para abrir tu libro de búsqueda."

[system_tutorial_2tris]
string="Pulsa 'ABRIR INVENTARIO' (tecla predeterminada: 'I') o haz clic en el icono del CINTURÓN para abrir el inventario."

[system_tutorial_3bis] //Jowood Version
string="Equipar el hueso (tecla predeterminada: 'Intro' o 'F')."

[system_tutorial_3bis_new]
string="Pulsa 'ARMA PREPARADA' (tecla predeterminada: 'TABULADOR') para pasar a 'MODO COMBATE'."

[system_tutorial_3bis_new2]
string="Haz clic en 'ACCIÓN' para golpear; cuanto más tiempo mantengas 
el botón pulsado, más fuerte golpearás."

[system_tutorial_3]
string="Haz doble clic en cualquier personaje para hablar con él."

[system_tutorial_4]
string="Pulsa 'ARMA PREPARADA' (tecla predeterminada: 'TABULADOR') para salir del 'MODO COMBATE'.*Haz doble clic en los muertos 
para abrir sus inventarios."

[system_tutorial_4_new] //Jowood version
string="Haz clic para arrastrar objetos a tu inventario.*Para usar un objeto 
pulsa 'INTRO' o 'F'."

[system_tutorial_5]
string="Haz clic en 'ACCIÓN' cuando estés en punto de vista del ratón 
para luchar."

[system_tutorial_5bis]
string="Cuando estés luchando, mantén pulsado 'ACCIÓN' y 
suelta para pegar. Cuanto más tiempo mantengas el botón pulsado, 
más 
fuerte pegarás."

[system_tutorial_6] //JoWood Version
string="Acabas de encontrar tus primeras runas. Ponlas en tu libro 
(tecla predeterminada: 'Intro' o 'F')."

[system_tutorial_6bis]
string="Ahora que ya tienes tus primeras runas, abre el libro y lanza tu primer hechizo."

[system_tutorial_7]
string="Agáchate pulsando 'AGACHARSE' (tecla predeterminada: 'X'), y 
rompe la trampa de madera."

[system_tutorial_8]
string="Haz clic dos veces en la cuerda de tu inventario, una vez la 
hayas encontrado, luego haz clic en el mecanismo del elevador para 
atarla."

[system_tutorial_9]
string="Haz clic en un icono de hechizo para ver su fórmula. La fórmula 
permanecerá en la pantalla como referencia cuando cierres el libro."

[system_tutorial_10]
string="Mantén pulsado el 'MODO MÁGICO' (tecla predeterminada: 
'Ctrl') para pasar a modo mágico y arrastra runas, de una en una, con el 
ratón; suelta el 'MODO MÁGICO' para lanzar el hechizo."

[system_tutorial_11]
string="Teletransportador activado; no podrás viajar a través de los 
portales hasta que se hayan activado otros teletransportadores"

[system_tutorial_12]
string="Intenta encender la chimenea y luego coloca alimentos 
crudos cerca del fuego para cocinarlos"

[system_tutorial_13]
string="Intenta lanzar el Hechizo para Encender sobre las antorchas para iluminar el pasillo"

[system_tutorial_14]
string="Pulsa 'INTRO' o 'F' en un Pergamino Mágico para memorizar el 
hechizo"

[system_tutorial_15]
string="El hechizo está preparado. Cuando quieras lanzarlo, haz doble clic en 'ACCIÓN' en el símbolo de hechizo que acaba de aparecer en la parte inferior de la pantalla"

[system_tutorial_16]
string="Haz clic en el icono de la Escalera para cambiar de nivel."

[system_tutorial_level_01]
string="¡Enhorabuena! ¡El nivel de tu personaje ha aumentado! Haz clic 
en la cruz roja para repartir puntos extra de experiencia."

[system_tutorial_level_02]
string="Suma puntos haciendo clic en un icono de atributos; el puntero 
del ratón indicará el número de puntos que quedan."

[tutorial_bag] //Jowood version
string="Haz clic en el cinturón de inventario con el botón derecho del 
ratón para mostrar el contenido de tus bolsas."

[tutorial_bag_02] //Jowood version
string="Puedes reorganizar tu inventario haciendo doble clic en el 
icono de cinturón de inventario."

[tutorial_lever] //Jowood version
string="Para reparar el mecanismo haz doble clic en la palanca que 
acabas de encontrar y luego haz clic en el soporte de palancas de la pared de al lado."

[tutorial_shop] //Jowood version
string="Estás en modo de transacción. CUIDADO: realizas una transacción en el momento que coges o dejas un objeto en el arcón del tendero. No 
puedes cambiar de opinión y no hay devoluciones."

[tutorial_mode_01] //Jowood version
string="Estás en modo cursor."

[tutorial_mode_02] //Jowood version
string="Estás en modo punto de vista del ratón."

[tutorial_steal] //Jowood version
string="¿Sabías que puedes robar? Para ello debes tener al menos 50 puntos de sigilo. Choca con alguien para ver su icono de inventario en la esquina 
inferior izquierda de la pantalla. Después haz clic 
en este icono y decide qué te gustaría robar. ¡Pero ten cuidado, que no te 
pillen con las manos en la masa!"

[system_Quest_log_save_kingdom]
string="Los Ylsides tienen prisioneros a los habitantes del reino de Arx. Tengo que ir a la prisión a averiguar qué está pasando antes de marcharme 
de Arx y regresar al Noden."

[system_Quest_log_gladivir] //XBOX version
string="Un fantasma llamado Gladivir me dijo que debía dejar la piedra antigua apropiada en el pilar apropiado de la cripta."

[system_Quest_log_krahoz_zohark]
string="He de encontrar el Krahoz y el Zohark para impedir que el 
meteorito me consuma el maná del cuerpo. Es la única manera de destruir el meteorito y de impedir que Akbaa se reencarne en Arx."

[system_Quest_log_Shield]
string="Me encontré con la chica que rescaté en el Templo de Akbaa. Me 
sorprendió descubrir que es la líder de los rebeldes. Pero esto es lo 
de menos. 
Lo importante es que me dará el Krahoz si le encuentro un 
escudo. Se llama el Escudo de los Antiguos y se encuentra en el 
segundo nivel de la cripta."


