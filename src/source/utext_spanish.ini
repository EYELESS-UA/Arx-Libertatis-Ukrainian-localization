// Kingdom Council //
/////////////////////

[king_council_come_start]//{~01~02~04~00~20~03~11~09
String="Muy bien, ahora que todos los miembros del Consejo están presentes, ¡empecemos! Felnor, ¿qué has encontrado en las notas de Orbiplanax?"

[felnor_council_see_note]//~02@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="A ver... Aaaah, Falan dice algo del guardia, Erzog. Dice que le vio practicar rituales oscuros en los que se sacrificaban animales. Quizá sea Erzog el que está detrás del asesinato de Falan... O quizá fue el sumo sacerdote de la Secta de Akbaa. Ah, escuchad esto: “He descubierto la existencia de una secta que quiere invocar a Akbaa en Arx.”"

[king_council_take_erzog]//~01
String="Nunca me fié de Erzog. ¡GUARDIAS! ¡Echad a Erzog a las celdas!"

[player_council_mentioned_akbaa]//~00
String="Felnor, ¿quién es ese Akbaa del que te he oído hablar?"

[kacelbem_council_akbaa_demon]//~04
String="Akbaa es un demonio poderoso, el dios de la destrucción al que esta secta claramente está intentado invocar y volver a traer a Arx. Sería una blasfemia permitir que este acto fuera perpetrado, y un desastre total para cualquier ser vivo de este planeta..."

[felnor_council_contact_noden]//~02
String="Sí, sí, y escuchad el siguiente trozo: “Esta noche me pondré en contacto con el Noden para pedirles ayuda.”"

[King_council_noden]//~01
String="¿¿El Noden??"

///FGE
[felnor_council_yes_noden]//~02
String="El Noden es la dimensión que regula la existencia de los dioses. Ellos mantienen el equilibrio universal evitando el desequilibrio en el poder de los dioses."

[kacelbem_council_fallan_really]//~04
String="Si Falan pudo ponerse en contacto con el Noden, es posible que hayan enviado un emisario aquí para detener la llegada de Akbaa..."

//** grassini new text
[King_council_gardian]//~01
String="¿Un emisario?"

///FGE
[felnor_council_gardian]//~02
String="Los emisarios son criaturas de energía pura cuando están en el Noden. Se les envía para cortar los canales de energía que podrían conducir a los dioses fuera de sus dimensiones. He oído historias alucinantes de emisarios que tienen la fuerza de 100 hombres, o que pueden practicar magia del más alto nivel, y otros que son invencibles. A estos emisarios se les llama Guardianes..."

[kacelbem_council_cinematic_cult]//~04@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="En algún lugar de la fortaleza hay una secta que reza oraciones impías a un fragmento de un meteorito que está totalmente hecho de un material llamado Koltk. Dicen que esta roca procede del lugar en el que nació Akbaa... Normalmente esta sustancia es indestructible. En realidad, Felnor, sólo un Guardián del Noden puede destruir este meteorito..."

///FGE
[suiberis_council_how_guardian_stop]//~03
String="¿Cómo puede uno de estos Guardianes detener la encarnación de un dios simplemente destruyendo un trozo de roca?"

///FGE
[kacelbem_council_prayer_heretics]//~04
String="El meteorito es el centro de las oraciones impías y los horribles sacrificios. Esto le da a Akbaa un canal de energía, y cuando haya reunido la suficiente podrá completar su encarnación en Arx. Si eso sucede, se desatará la destrucción y el sufrimiento sobre nosotros. Debemos encontrar y destruir el meteorito cueste lo que cueste."

[player_council_how_find_guardian]//~00
String="¿Cómo encontraremos al Guardián?"

///FGE
[felnor_council_Koltk_sample]//~02
String="Tengo un fragmento de Koltk en mi laboratorio; puede que sea de gran ayuda para encontrarle."

[king_council_here_situation]//~01
String="Seamos claros respecto a una cosa: sabemos que la Secta de Akbaa tiene una gran presencia en Arx, y que está ganando poder. Afortunadamente hemos podido detener a Erzog, el sumo sacerdote de la secta, antes de que fuera demasiado tarde. Pero otros adoradores de Akbaa aún pueden invocarlo. Debemos encontrar al famoso Guardián del Noden cuanto antes."

///FGE
[carlo_council_also_war]//~11
String="Además, la guerra con los Ylsides es muy perturbadora, Su Majestad. ¿Qué debemos hacer al respecto?"

[king_council_shall_brief]//~01
String="Carlo, necesitamos un plan sólido de defensa. Temo lo peor. Nadie sabe exactamente qué son los Ylsides ni bajo las órdenes de quién actúan. ¡GUARDIAS! ¡Traedme el fragmento de Koltk!"

///FGE
[king_council_while_army]//~01
String="Am Shaegar, mientras nuestro ejército se enfrenta a los Ylsides, necesitaremos que nos ayudes a encontrar al legendario Guardián... No puedo negar que esta tarea será dura y larga. De hecho, no tenemos ni idea de cómo será el Guardián, o ni siquiera de si ya está entre nosotros. Pero confío en tu capacidad."

[guard_council_here_sample]//~09
String="Aquí tiene la piedra, Su Majestad."

[king_council_put_table]//~01
String="Bien. Ponla sobre la mesa."

[king_council_take_sample]//~01
String="Coge la piedra, Am Shaegar. Es pequeña, pero el Guardián es el único que puede destruir este fragmento de meteorito. Sobre todo, cuídate mucho..."

[carlo_council_aaahhh]//~11
String="¡Aaaahh!"

[king_council_amazing]//~01
