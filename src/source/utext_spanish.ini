///FGE
[Fallan_intro_1]//{~02~11~09@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Escuchadme, Seres de Luz, y tomad nota de lo que he de decir. Esto es Arx, que antaño fue una ciudad como muchas otras, que se extendía orgullosa bajo la majestuosidad del sol. Nuestro rey, Poxsellis, fue un rey justo que sabía tratar con las escaramuzas esporádicas que teníamos con los duendes o con los hombres rata. Muchos años después de la muerte de Poxsellis, en el fatídico año 226, nuestro sol empezó a entrar en decadencia y cayó sobre nuestro mundo el invierno eterno... Su majestad Lunshire, noble hijo de Poxsellis, decidió trasladar la ciudad de Arx bajo tierra, a una de las minas abandonadas de los enanos. En este momento, los conflictos entre las diferentes razas de Arx desaparecieron. No sólo los humanos, sino también los enanos, los trols y los duendes trabajaron juntos para una supervivencia común. Esta migración bajo tierra llevó cinco años, durante los cuales el sol desapareció completamente de nuestros cielos. Todas las razas construyeron sus casas en este nuevo entorno, y las relaciones entre razas volvieron, poco a poco, a retroceder a como siempre habían sido. Pero hoy en día, el mal está llamando a las puertas..."

