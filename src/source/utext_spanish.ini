[system_tutorial_bricks]
string="Encuentra ladrillos y apilalos hasta crear una plataforma adecuada para salir de la celda."

[player_shadowkill]
string="¡¡¡¡¡ASESINATO DE LAS SOMBRAS!!!!!"

[player_adrenaline]
string="¡¡¡¡¡ATAQUE DE ADRENALINA!!!!!"

[system_tutorial_food_rats]
string="Algunas ratas y ratones son amistosos. Puedes colocar cierta comida cerca de ellas, seguro les encantará.*Nota: No todas las ratas serán amistosas y mucho menos en grupos."

[tutorial_stealth]
string="JUEGA A TU MANERA:***-Puedes asesinar enemigos instantáneamente atacándolos por detrás siempre y cuando no te descubran en el acto. Necesitas tener al menos 30 de sigilo y tener equipada una daga o una espada corta para hacer esto.**-Puedes escuchar conversaciones de personajes siempre y cuando no te detecten, mientras escuchas, puedes descubrir y acceder a información que puede ser útil en tus búsquedas.**-Los personajes pueden escucharte, así que cuida tus pasos. Puedes intentar tirar objetos lejos de ti y esto hará mover a los personajes hacia él. Nota: el ícono de sigilo se muestra en la esquina inferior inquierda de la pantalla cuando estás escondido."

[tutorial_stealth2]
string="JUEGA A TU MANERA:***-Puedes asesinar enemigos instantáneamente atacándolos por detrás siempre y cuando no te descubran en el acto. Necesitas tener al menos 30 de sigilo y tener equipada una daga o una espada corta para hacer esto.**-Puedes escuchar conversaciones de personajes siempre y cuando no te detecten, mientras escuchas, puedes descubrir y acceder a información que puede ser útil en tus búsquedas.**-Los personajes pueden escucharte, así que cuida tus pasos. Puedes intentar tirar objetos lejos de ti y esto hará mover a los personajes hacia él. Nota: el ícono de sigilo se muestra en la esquina inferior inquierda de la pantalla cuando estás escondido."

[tutorial_torchi]
string="JUEGA A TU MANERA 1: Puedes superar un obstáculo de diferentes maneras.**-Combina la botella de agua con la antorcha para esconderte.*-Interactúa con tu entorno (Abre una celda: distrae o encierra al enemigo con el rastrillo).*-Libera al prisionero durante la pelea.*-Ataca o evita directamente al enemigo.**Experimenta, a medida que obtengas nuevas capacidades, tendrás disponibles más opciones."

[tutorial_torch2]
string="Bien hecho, recuerda que mientras estés escondido aparecerá el icono de sigilo en la esquina inferior izquierda, cuanto más intenso sea este, más difícil será que te detecten. Nota: tus puntos de sigilo influirán en la habilidad que tengas para esconderte."

[tutorial_transparency_door]
string="Si activas el hechizo de visión nocturna cerca de una puerta, podrás ver a travéz de ella por un breve tiempo además de poder ver mejor a los personajes mientras el hechizo esté activo."

[tutorial_exotic_rune_single]
string="Has encontrado tu primer runa exótica, consumirlas mejorarán los hechizos. Para lanzar un hechizo especial, necesitarás todas las runas requeridas tanto en su versión base (Runas azules) como en su versión exótica (Runas negras).**Estas sólo son mejoras para las runas base, por lo que no incrementan las runas en el libro mágico, sin embargo, si consumes cierta runa exótica antes de poseer su runa base, las runas consumidas previamente tendrán sus efectos cuando consigas sus runas base respectivamente."

[tutorial_exotic_rune_plural]
string="Has encontrado tus primeras runas exóticas, consumirlas mejorarán los hechizos. Para lanzar un hechizo especial, necesitarás todas las runas requeridas tanto en su versión base (Runas azules) como en su versión exótica (Runas negras).**Estas sólo son mejoras para las runas base, por lo que no incrementan las runas en el libro mágico, sin embargo, si consumes cierta runa exótica antes de poseer su runa base, las runas consumidas previamente tendrán sus efectos cuando consigas sus runas base respectivamente."

[tutorial_exotic_runes]
string="Felicidades, ahora posses una runa exótica, este tipo de runas mejorarán los hechizos que usen la runa actual, desbloquear características especiales o hacerlos más poderosos."

[system_break_door]
string="Golpea el rastrillo oxidado para derrumbarlo."

[system_break_box]
string="Puedes golpear cajas para destruirlas, algunas pueden contener objetos dentro."

[system_shrunken_player]
string="Ten cuidado de no acercarte demasiado a alguien mientras estás encogido, podrían matarte fácilmente sin detectarte, incluso si son aliados."

[system_dummy3]
string="Puedes atacar enemigos sigilosamente por detrás y causar una muerte instantanea acuchillando sus cuellos, ten en cuenta que esta habilidad requiere por lo menos 30 puntos de sigilo, si te detectan en el acto, tu ataque especial se cancelará."

[system_fire_creative]
string="Puedes activar trampas creativas si te persiguen enemigos numerosos, sitúate cerca de escombros inflamables y activa el hechizo 'encender', achicharra enemigos por un tiempo limitado, aviso, usarse cuidadosamente."

[system_player_note]
string="Muchas gracias por apoyar este proyecto.*Busca más actualizaciones en el sitio web.**Continuaremos desarrollando y mejorando el mod, ¡eres nuestra motivación para continuar!.**Si te gusta Arx, no dudes en unirte a la comunidad de Arx Insanity en Discord:**https://discord.gg/mxTKk52"

[system_supporter_note]
string="Muchas gracias por apoyar este proyecto.**En agradecimiento, aquí tienes algunos objetos exclusivos para los donadores: un vistazo a las armas de alquimia además de otros objetos.**Busca más actualizaciones en el sitio web.**Continuaremos desarrollando y mejorando el mod, ¡eres nuestra motivación para continuar!**Si te gusta Arx, no dudes en unirte a la comunidad de Arx Insanity en Discord:**https://discord.gg/mxTKk52"


