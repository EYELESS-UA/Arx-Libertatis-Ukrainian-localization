// system spell descriptions

[system_spell_description_magic_sight]
string="Mejora la visión del hechicero."

[system_spell_description_magic_projectile]
string="Hechizo ofensivo."

[system_spell_description_ignit]
string="Enciende materiales inflamables, como antorchas, en un radio determinado."

[system_spell_description_douse]
string="Sofoca materiales inflamables; incluso puede reducir ataques de fuego."

[system_spell_description_activate_portal]
string="Los teletransportadores de Edurneum deben ser activados con este hechizo."

[system_spell_description_heal]
string="Cura en un radio alrededor del hechicero. Cuidado, pues también curará a tus enemigos."

[system_spell_description_harm]
string="Crea un campo de daño en un radio alrededor del hechicero."

[system_spell_description_detect_trap]
string="Avisa de trampas y peligros."

[system_spell_description_armor]
string="Aumenta las defensas."

[system_spell_description_curse]
string="Disminuye la fuerza, la precisión, la constitución y la inteligencia."

[system_spell_description_lower_armor]
string="Disminuye la clase de armadura."

[system_spell_description_speed]
string="Aumenta la velocidad."

[system_spell_description_reveal]
string="Disipa ilusiones e invisibilidad."

[system_spell_description_fireball]
string="Lanza un proyectil de fuego."

[system_spell_description_create_food]
string="Crea un campo alimenticio para atenuar el hambre."

[system_spell_description_Ice_projectile]
string="Lanza un rayo de frío, que hiela y hiere a quien se cruza en su camino."

[system_spell_description_sanctify]
string="Aumenta la fuerza, la precisión, la constitución y la inteligencia."

[system_spell_description_dispell_field]
string="Disipa el campo de protección."

[system_spell_description_Fire_protection]
string="Reduce los efectos de los ataques de fuego y del calor."

[system_spell_description_Cold_protection]
string="Reduce los efectos de los ataques de hielo y del frío."

[system_spell_description_telekinesis]
string="Permite al hechicero coger y usar objetos desde cierta distancia."

[system_spell_description_rune_guarding]
string="Crea una trampa mortal, una vez lanzado el hechizo, la trampa sólo es visible para la persona que lo lanza."

[system_spell_description_levitate]
string="Permite al hechicero moverse por el aire."

[system_spell_description_ice_field]
string="Crea una barrera de hielo."

[system_spell_description_paralyse]
string="Paraliza a un enemigo."

[system_spell_description_cure_poison]
string="Cura los efectos del veneno en un radio alrededor del hechicero. Atención: también curará a tus enemigos."

[system_spell_description_repel_undead]
string="Algunos de los muertos vivientes huirán cuando vean al que lanza este hechizo."

[system_spell_description_poison_projection]
string="Lanza un gas venenoso."

[system_spell_description_slowdown]
string="Ralentiza los movimientos de la criatura a la que va destinado."

[system_spell_description_raise_dead]
string="Llama un muerto viviente. Ten en cuenta que este hechizo sólo funciona estando de pie en la tierra."

[system_spell_description_create_field]
string="Crea un campo de protección."

[system_spell_description_disarm_trap]
string="Desmonta cualquier trampa en un radio determinado."

[system_spell_description_flying_eye]
string="Permite al hechicero controlar un ojo invisible para explorar lugares sin ser visto."

[system_spell_description_fire_field]
string="Levanta una pared de fuego delante del hechicero."

[system_spell_description_Lightning_strike]
string="Lanza un rayo delante del hechicero."

[system_spell_description_confuse]
string="Confunde al oponente."

[system_spell_description_invisibility]
string="Hace invisible a una persona. El hechizo dejará de funcionar si la persona que lo lanza ataca o intenta usar, activar o coger un objeto."

[system_spell_description_mana_drain]
string="Consume el maná de la gente en un radio determinado alrededor del hechicero."

[system_spell_description_life_drain]
string="Consume la salud de la gente en un radio determinado alrededor del hechicero."

[system_spell_description_explosion]
string="Causa daños considerables alrededor del hechicero."

[system_spell_description_enchant_weapon]
string="Da propiedades mágicas a un objeto delante del hechicero, según las sustancias reactivas que haya cerca del objeto."

[system_spell_description_summon_creature]
string="Invoca a un demonio. Ten en cuenta que una vez invocado el demonio, su comportamiento es imprevisible."

[system_spell_description_negate_magic]
string="Impide que funcione cualquier magia en un radio determinado alrededor del hechicero."

[system_spell_description_incinerate]
string="Lanza una onda de incineración delante del hechicero."

[system_spell_description_mass_paralyse]
string="Lanza una onda helada paralizadora alrededor del hechicero."

[system_spell_description_mass_lightning_strike]
string="Se crearán rayos alrededor del hechicero."

[system_spell_description_control_target]
string="La persona que lanza el hechizo puede controlar a un demonio, aunque sólo los demonios que han sido invocados se pueden controlar de esta forma."

[system_spell_description_freeze_time]
string="Se ralentiza el tiempo para todo el mundo menos para el hechicero."

[system_spell_description_mass_incinerate]
string="Incinera a cualquier criatura en un radio determinado alrededor del hechicero."

// quest log goals

[system_Quest_log_escape_gobs]
string="Heme aquí, en esta prisión de duendes. ¡Tengo que escapar y averiguar quién soy!"

// newlog
[system_Quest_log_escape_gobs_done]
string="He conseguido escapar del puesto avanzado de los duendes; todavía no tengo ni idea de qué hago aquí..."

[system_Quest_log_gob_authorization]
string="El duende lord que vigila el acceso al segundo nivel de los duendes me ha pedido una autorización escrita y un permiso de comercio de gemas."

// newlog
[system_Quest_log_gob_authorization_done]
string="He pasado al duende lord que vigila la zona del reino de los duendes"

[system_Quest_log_message_ortiern]
string="Tengo que hablar con el rey de Arx y llevarle noticias del puesto avanzado de los humanos."

[system_Quest_log_greu_gift]
string="Hoy he conocido a un trol; quiere que sea su amigo y le gustaría que le diera un regalo por su cumpleaños..."

// newlog
[system_Quest_log_greu_gift_done]
string="Le he regalado un libro a Greu y se ha puesto contento; me ha dado un amuleto trol. Hoy he hecho un nuevo amigo."

[system_Quest_log_fallen_rocks]
string="El Rey quiere que le lleve un mensaje a Pog, el rey de los trols, pidiéndole ayuda para despejar las rocas del pasadizo al puesto avanzado."

[system_Quest_log_troll_idol]
string="Han robado uno de los ídolos de los trols. No me ayudarán hasta que no les sea devuelto. Lo buscaré en la zona de los duendes."

//newlog
[system_Quest_log_troll_idol_done]
string="El pasadizo al puesto avanzado humano ya debería estar despejado."

[system_Quest_log_rituals]
string="Ha habido sacrificios rituales últimamente en el castillo. El Rey quiere que averigüe más al respecto. Parece que podría estar relacionado con el asesinato de Falan Orbiplanax. Debo interrogar a la gente del reino."

[system_Quest_portal]
string="Chinkash me enseñó el hechizo secreto para teletrasportarse a través de las puertas de Edurneum: Mega Spacium."

[system_Quest_log_shanny]
string="La hija de María, Shany, ha desaparecido. María me pidió que la encontrara; puede que esté en peligro."

//newlog
[system_Quest_log_shanny_done]
string="Shany está a salvo, he llegado justo antes de que la sacrificaran."

[system_Quest_log_access_temple]
string="Ahora debo encontrar el camino secreto al Templo de Akbaa y destruir el meteorito."

[system_Quest_log_know_password]
string="Erzog me dijo que el Templo de Akbaa se sitúa debajo de la taberna y me dijo la palabra secreta para entrar."

[system_Quest_log_destroy_meteor_for_good]
string="El meteorito resistió mi ataque. Es más fuerte de lo que esperaba. Tengo que preguntarle a Felnor sobre esto y explicarle lo que pasó."

[system_Quest_log_krahoz_zohark]
string="He de encontrar el Krahoz y el Zohark para impedir que el meteorito me consuma el maná del cuerpo. Es la única manera de destruir el meteorito y de impedir que Akbaa se reencarne en Arx."

[system_Quest_log_krahoz]
string="Un grupo de rebeldes ha robado el Krahoz. La misma gente que mató a la Reina y raptó a la hija del Rey. Debo encontrarlos."

[system_Quest_log_zohark]
string="La Orden de Edurneum guarda el Zohark. Tengo que hablar con ellos; estoy seguro de que entenderán la vital importancia de mi búsqueda."

[system_Quest_log_Shield]
string="Me encontré con la chica que rescaté en el Templo de Akbaa. Me sorprendió descubrir que es la líder de los rebeldes. Pero esto es lo de menos; lo importante es que me dará el Krahoz si le encuentro un escudo. Se llama el Escudo de los Antiguos y se encuentra en el segundo nivel de la cripta."

//newlog
[system_Quest_log_Shield_done]
string="Tengo el poderoso Escudo de los Antiguos."

//newlog
[system_Quest_log_mythril_done]
string="La mejor arma es mía."

//newlog
[system_Quest_log_krahoz_done]
string="Tengo el Krahoz."

//newlog
[system_Quest_log_zohark_done]
string="Tengo el Zohark."

[system_Quest_log_Meteor_time]
string="Ahora que tengo el Krahoz y el Zohark, es hora de volver al Templo de Akbaa y destruir el meteorito de una vez por todas."

[system_Quest_log_Meteor_destroyed]
string="El meteorito ha sido destruido: se acabaron las maquinaciones de Akbaa. Sin embargo, Sylib Nurath no me ha llamado para que vuelva al Noden. He de regresar al Reino y ver si encuentro la forma de volver al Noden."

[system_Quest_log_save_kingdom]
string="Los Ylsides tienen prisioneros a los ciudadanos de Arx. Debo ir a la prisión a averiguar qué está pasando antes de irme de Arx y volver al Noden."

[system_Quest_log_super_weapon]
string="El reino está restaurado. La trampa que preparó Iserbius ha fallado. Ahora sé por qué no me habían pedido que volviera al Noden: todavía no he cumplido mi misión. Akbaa tuvo tiempo de reunir energía suficiente antes de que yo destruyera el meteorito. Aun así, destruir el meteorito era la mejor opción, ya que Akbaa no estará tan fuerte como esperaba; probablemente en este mismo momento se esté fusionando con Iserbius. Es un largo proceso y la mayoría de las armas no afectarán a Iserbius durante el mismo. He de crear la mejor arma antes de poder enfrentarme a Akbaa."

[system_Quest_log_mythril]
string="El libro de la mejor arma dice que debo fabricar un arma de mithril, ya que es el único metal que se puede mezclar con aleaciones extrañas como los polvos de Koltk. Espero que sea verdad."

[system_Quest_log_Dragon_egg]
string="Tengo que encontrar un huevo de dragón para hechizar el arma."

[system_Quest_log_final_meeting]
string="Ha llegado la hora de cumplir mi misión: Ahora iré al búnker de los Ylside y destrozaré a Iserbius... ¿o debería decir Akbaa?"

[system_Quest_log_key_bank]
string="Encontré una llave sellada en casa de Alicia. Si pudiera hacerle un molde, podría hacer una copia de la llave..."

//newlog
[system_Quest_log_key_bank_done]
string="Hice una copia de la llave encontrada en casa de Alicia..."

[system_Quest_log_olivier]
string="En la taberna oí un rumor sobre una búsqueda de tesoro organizada por un ermitaño llamado Oliver. Al parecer, para empezar la búsqueda hay que dejar una esmeralda en su arcón."

//newlog
[system_Quest_log_olivier_done]
string="Solucioné la búsqueda del tesoro que organizó Oliver."

[system_Quest_log_Florence]
string="Hoy he conocido a un fantasma. Me pidió que encontrara a la gente responsable de su muerte. Dice que fue una persona muy importante en Arx. También dijo que su asesino sólo tenía un ojo."

//newlog
[system_Quest_log_Florence_done]
string="El misterio del fantasma se ha resuelto. Carlo fue el responsable del asesinato de la reina Florence."

[system_Quest_log_dragon_scale]
string="¿Cuántas escamas puede tener un dragón? Tengo que encontrar información."

[system_Quest_water_clan]
string="El clan de agua de los duendes me pidió que matara al clan de tierra. A cambio me darán un objeto mágico."

//newlog
[system_Quest_water_clan_done]
string="Maté al clan de tierra."

[system_Quest_earth_clan]
string="El clan de tierra de los duendes me pidió que matara al clan de agua. A cambio me darán oro de su tesoro."

//newlog
[system_Quest_earth_clan_done]
string="Maté al clan de agua."

[system_not_enough_gold]
string="Este oro no es suficiente"

