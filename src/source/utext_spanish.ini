[description_book_guardpost]
string="diario de navegación."

[book_guardpost_content]
string="- Año 266, Estación Blanca, Semana de la Rata, Tercer Día.*Hoy, una pequeña banda de duendes ha intentado atacar nuestro puesto avanzado. Estaban borrachos y han sido fáciles de derrotar. En consecuencia hemos concluido que no ha sido un ataque planeado, sino consecuencia de la cantidad de alcohol que habían consumido. Hemos combatido este ataque sin demasiada dificultad, pero hemos perdido a uno de nuestros hombres. El bando de los duendes, en cambio ha sufrido cinco pérdidas.*- Año 266, Estación Blanca, Semana del Topo, Segundo Día.*Un terremoto ha sacudido el puesto avanzado por los cimientos durante al menos diez minutos. No hubo daños, pero vi unas cuantas grietas en el pasadizo que lleva a nuestra cuidad.**- Año 266, Estación Verde, Día de la Vaca, Cuarto Día.*Un extraño agresor nos ha atacado esta mañana. Llevaba armadura pesada trabajada como nunca habíamos visto antes, y parecía invencible. Cada movimiento que hacía era increíblemente preciso y su velocidad era inigualable. No conoce la piedad, porque ha matado a uno de mis hombres y ha herido gravemente a dos antes de que se giraran, y se ha ido tan rápido como había aparecido. Su comportamiento me ha hecho pensar que fue enviado para determinar nuestra fortaleza.*Creo que este guerrero es simplemente la primera señal visible de una fuerza que está creciendo en la seguridad de las sombras y que un día será lo suficientemente poderosa como para aniquilarnos a cada uno de nosotros.***- Año 266, Estación Verde, Día del Águila, Primer Día.*El extraño guerrero ha vuelto. Ha matado a tres de mis hombres antes de que, finalmente, yo consiguiera matarlo. Y entonces, mientras estaba tumbado agonizando, se ha empezado a reír con una risa poderosa y demoníaca. En seguida he sospechado algo y he ordenado a mis hombres que se retiraran tan rápido como pudieran. Ha habido una explosión inmensa que ha esparcido sus restos por todas partes.*No ha quedado ni rastro de él, tan sólo su daga en el suelo.***- Año 266, Estación Amarilla, Semana de la Serpiente, Primer Día.*Esta mañana un terremoto nos ha despertado temprano. Uno de mis hombres me ha informado de que el terremoto ha provocado un derrumbamiento en el pasadizo que lleva al castillo. Estoy seguro de que la ayuda no tardará en llegar. Prefiero esperar un poco antes de enviar a uno de mis hombres a llevarle las nuevas a nuestro querido Rey. Probablemente ya sean conscientes de que el derrumbamiento tendrá consecuencias para nosotros...*Que los dioses nos protejan."
////////////////////////////////////////////////
[description_book_beloved]
string="Mi querido Akbaa."

[book_beloved_content]
string="Estos escritos están creados en honor a mi amo y señor:*Akbaa.***********Akbaa es la fuente de conocimiento a través del universo y de todas las dimensiones conocidas. El haber establecido contacto con su culto es una momento trascendental para nuestra gente y marca el punto sin retorno. Venerar a Akbaa o morir.**Porque Akbaa es un dios que también simboliza el poder de la destrucción de todo en este mundo. Sabe cómo recompensar a los más fieles de sus sirvientes con grandes poderes y castiga a todos los demás sin compasión. Akbaa es inmortal. Sin embargo, necesita almas para tener poder sobre el universo conocido; coleccionar almas le permite difundir su sabiduría por todas partes.**Una buena manera de complacer a Akbaa es ofrecerle almas impías que se niegan a obedecerle. Aunque los no creyentes son nuestros objetivos preferidos, algunos de nosotros tenemos ganas de entrar en comunión con Akbaa y nos ofrecemos en sacrificio. Después de todo, la muerte no es nada comparado con una eternidad de júbilo e iluminación espiritual.**Un simple día de mi vida como creyente vale más que 1.000 años de vida como no creyente.**Porque, gracias a Akbaa, he visto cosas que me han hecho comprender el funcionamiento fundamental de nuestro universo. Cosas que siempre estarán fuera del alcance de los no creyentes."
////////////////////////////////////////////////
[description_book_iserbius]
string="Diario personal de Iserbius."

[book_iserbius_content]
string="Es importante para mí dejar constancia de la historia de mi vida en estas páginas, porque si me pasa algo ayudará a mi sucesor a servir bien a la causa de la Orden.**He decidido dedicar mi vida entera a mi querido Akbaa. Desde el momento en que supe que existía hasta mi último aliento, le veneraré.***Akbaa me ha dado lo que un hombre jamás podrá soñar.**Todavía recuerdo el bendito día en que conocí a Lord Long.*Fue en el año 240.**Inmediatamente después de que nuestras miradas se cruzaran, una poderosa afinidad entre nosotros se hizo evidente. Fue como un segundo padre para mí, y estoy seguro de que para él fui el hijo que nunca tuvo.*Un tiempo después, cuando entré de verdad en la secta, me hizo saber que yo debía ser su sucesor.**Cuando sólo era un novato, me contó todo sobre la secta y sobre el propio Akbaa.*Me dijo que el objetivo primordial de la secta era invocar a Akbaa a nuestra dimensión, que había establecido todas las bases para que este ritual tuviera lugar, pero que, desgraciadamente, él no viviría para ver el día en que se llevara a cabo.**Gracias a su poderosa clarividencia ya había visto la hora de su muerte.*Me rogó que continuara las preparaciones necesarias para satisfacer el gran plan de Akbaa.**Cuando murió al año siguiente, tal y como él había predicho, sus palabras proféticas me resonaron en la cabeza. Y cuando acababa de ser aceptado como miembro definitivo de la secta, me nombraron sumo sacerdote. Fue el día de mi mayor dolor y mi mayor júbilo. El inconmensurable dolor de perder a mi mentor y padre, y el indescriptible júbilo de saber que la llegada de nuestro señor era inminente**Un largo periodo de investigación empezó para mí en aquel momento.**Cada vez me unía más a Akbaa; todo lo unido que puede estar un simple mortal a un dios. Vi lo que no se puede ver, oí cosas que no hacían ruido y sentí cosas que ningún hombre puede imaginar sentir. Akbaa me dio cada vez más poder, algo de poder físico, claro, pero sobre todo una gran maestría en el arte de la magia**Akbaa es más que un dios para mí, es el sol, el aire y la comida; lo es todo para mí. Gracias a su inspiración supernatural, cogí las riendas de su culto con mano de hierro.**Empecé purgando el culto de miembros que ya no nos resultaban útiles. Los resultados insatisfactorios resultaron ser tan peligrosos para estos individuos como su mal rendimiento lo era para nosotros.*Después de completar esta tarea esencial, tuve tiempo de planear cada aspecto de la llegada de Akbaa, hasta el más nimio de los detalles. Era primordial que nuestra secta permaneciera encubierta, hasta que fuera demasiado tarde para detenernos.**En ese momento me enteré de que Falan Orbiplanax había adivinado mi propósito real y de que quería oponerse a la llegada de Akbaa con la ayuda del Noden.*Para impedir que el Noden se involucrara, tomé varias decisiones importantes: en primer lugar, mandé a un asesino a matar a Orbiplanax, quien se había convertido en un gran peligro.**En segundo lugar, adelanté la fecha de la llegada de Akbaa. Sin embargo, no estaba todo en su sitio para invocarle, así que ordené que aumentáramos la frecuencia de los sacrificios de los no creyentes reuniéndolos en grandes números.*Mujeres y niños servirían, no tenía tiempo de discriminar...*También aumenté la intensidad de nuestras oraciones, alentando a cada vez más miembros de la secta a entregarse en sacrificio para que Akbaa pudiera, por fin, oír nuestras oraciones.**Cada día me sorprendía por la cantidad de conocimiento y poder que Akbaa me había concedido. Para mi sorpresa, Akbaa me prometió darme incluso más cuando llegara, y dejar el destino de Arx en mis manos."
////////////////////////////////////////////////
[description_book_cook] //XBOX Version
string="Cocina para duendes, por Durey Palua. (Objeto de búsqueda)"

[book_cook_content]
string="Receta de ciambels.** Mezcla azúcar y harina.**Añade la cantidad necesaria de agua y trabaja la masa hasta que tenga una consistencia homogénea.**A continuación, pon la masa en el horno, con cuidado de no quemarla.**Una vez que esté cocida, coge un huevo de gallina y mezcla la yema y la clara.**Esparce esta mezcla por encima del pastel y ponlo otra vez en el horno durante aproximadamente un minuto."
////////////////////////////////////////////////
[description_book_music]
string="Una nota en música, por Fazzi."

[book_music_content]
string="La flauta probablemente sea uno de los instrumentos más sutiles que existen.**Verás lo fácil que es aprender, pero, por otro lado, ser un virtuoso de la flauta no es nada sencillo.*Aquí tienes tu primera lección si te quieres familiarizar con este instrumento.**Hay diferentes tipos de flauta en todo el mundo, pero la más común funciona de la siguiente manera.*Está compuesta de cuatro notas básicas y cuatro modificadas, que se crean al tapar el agujero de la parte inferior de la flauta mientras se tocan las cuatro notas básicas.*A las cuatro primeras notas les llamamos 1, 2, 3, 4 y a las modificadas nº1, nº2, nº3, y nº4.**Una pieza musical muy fácil para empezar es lo que yo he llamado “El Himno de Fazzi” y es así: 1 1 nº1 3 4 1 1 2."
////////////////////////////////////////////////
[description_book_weapon] //XBOX Version
string="La teoría de la mejor arma, por Kartok. (Objeto de búsqueda)"

[book_weapon_content]
string="He viajado a lo largo y ancho de muchas tierras en busca de la mejor arma.*Me pasé gran parte de mi juventud luchando por esta meta sin resultados, hasta que me di cuenta de que todos mis esfuerzos eran en vano.*En vano, porque la única forma de encontrar la mejor arma es creándola.**Para hacer un arma así, tienes que encontrar el metal de mejor calidad, hecho en la forja de mejor calidad, y después encantarla con el hechizo de mejor calidad que existe.*Es muy importante seleccionar el metal de mejor calidad, no sólo porque determina lo afilada que está la hoja o su fuerza, sino porque también ha de ser capaz de recibir y, en consecuencia, almacenar una gran cantidad de energía mágica.**Además, el peso del metal determinará la maniobrabilidad del arma y la eficiencia de su estocada y penetración.**La mayoría de la gente usa el hierro para forjar sus armas, porque es el metal que siempre está disponible.*Pero el metal de mejor calidad que se conoce hasta hoy (y para mí el único que se debe usar si se tiene que crear la mejor arma) es el mithril, el metal más duro y resistente que jamás se haya descubierto. También puede producir una aleación de gran calidad si se mezcla con otro elemento.**Sin embargo el elemento que mezcles ha de ser elegido con cuidado, y sólo deben usarse los materiales menos comunes, que en su esencia llevan un valor mágico intrínseco.*Desgraciadamente, el mithril (que es un componente clave) es casi imposible de encontrar. No obstante, si fuera posible localizar una pieza de este fantástico metal, el siguiente paso es llevarlo al mejor herrero y pedirle que forje el arma.*No voy a entrar en un debate filosófico largo y pesado, pero sí daré mi clara opinión: para mí, los mejores herreros del mundo son enanos.**Toda su tradición está basada en trabajar piedra y metal y han llegado a dominar este arte hasta tal punto que incluso las herramientas que utilizan para hacer su oficio son, con mucho, superiores a las de cualquier otra raza. Son los únicos capaces de crear en sus forjas las armas más letales y afiladas que existen.**La forja es una fase importante; en el momento que está completada, el arma ha de poder absorber el primer hechizo que se le haga y conservarlo en ella para toda la eternidad.**De hecho, la última fase es el encantamiento del arma.**Muchas cosas pueden mejorar un arma mágicamente; la clave está en escoger el elemento con el que el arma se ligará en el momento del encantamiento.*Os daré algunos de los hechizos más conocidos.*Sin embargo, la calidad del arma depende, en última instancia, más del metal elegido y la forja usada que del elemento con el que se combine...*Aquí tienes varios ejemplos, pero ten en cuenta que una vez el arma ha sido hechizada, ya no la puedes cambiar:**-El ajo confiere al arma una mayor facilidad de manejo.*-Hueso en polvo le da más poder al arma, e incluso son más eficaces si los huesos son de dragón.*-La roca de Amikar le da al arma una maravillosa resistencia. Una vez hechizada, la hoja parece indestructible.*-Un huevo de dragón permite que el arma dañe al elemento del que está hecha, por ejemplo, un arma de hierro hechizada hará más daño a los objetos de hierro."
////////////////////////////////////////////////
[description_book_noden]
string="Las leyes del Noden, las dimensiones de los dioses, por el pensador Aran Salar, archivos (Volumen 1)."

[book_noden_content]
string="El Noden, reino de dioses, existe en una dimensión lejana, muy lejos de la nuestra.*Sin embargo, cada cierto tiempo, se crea un puente entre esta dimensión y la nuestra, permitiendo el paso entre ambas. Esto puede suceder debido a convergencias astrales favorables como eclipses, o a grandes cataclismos naturales como los maremotos.**La dimensión que es el Noden funciona así: allí existe una energía residual ambiental que llega de todas las direcciones del universo conocido y es atraída hacia el Noden.*Esta energía representa el poder del inconsciente colectivo de la gente pensante que vive en estas dimensiones. Contiene sus deseos, miedos y por lo general las creencias de estos seres.**Así pues, cada vez que un ser cree en un dios, y le da un nombre, se forma en el Noden una cristalización de esta entidad.*En un principio, este nuevo dios es débil y completamente indefenso, pero cuantos más creyentes empiecen a adorarlo, más crecerá su energía en el Noden.**A estos dioses normalmente sus seguidores les rezan por motivos muy específicos. De acuerdo con su deseo y el poder que han amasado, los dioses pueden recompensar a sus adoradores con poderes materiales y de otros tipos, lo que, a cambio, refuerza la fe de sus seguidores en ellos.**Sin embargo, si nadie cree en un dios determinado, la última energía empezará a disminuir y se reducirá, en las fases finales, a una forma minúscula de ectoplasma, una sombra frágil de su antigua gloria.**Vale la pena destacar que tanto Krahoz como Zohark tienen el lugar de honor en el corazón del Noden, gracias a la adoración que nos siguen inspirando.**El Noden también tiene un cuerpo “administrativo” que maneja las residencias atribuidas a los distintos dioses del Noden en función del número de seguidores que tengan, que se asegura de que los dioses no se están pasando de la raya, y que archiva las creencias que se cuelan de otras dimensiones.*Esta organización también tiene jerarquía y su pináculo es la raza Sybartas, los pensadores.**Sylib Nurath, que trata las interferencias entre el Noden y las demás dimensiones, es uno de ellos.**Otra raza, los Volks, también existe allí. Se les podría llamar los sirvientes de los Sybartas. Normalmente sólo hacen tareas repetitivas y de poca importancia."
////////////////////////////////////////////////

[description_book_noden_v2]
string="Las leyes del Noden, las dimensiones de los dioses, por el pensador Aran Salar, archivos (Volumen 2)."

[book_noden_content_v2]
string="Las leyes del Noden son implacables y nadie (ni siquiera los dioses) puede romperlas.**La primera y la más importante es que ningún dios o demonio príncipe abandonará nunca el Noden (Artículo 1, Capítulo 1); las consecuencias de que un dios o demonio príncipe vaya a una dimensión ajena serían extremadamente perjudiciales para la armonía del universo.*Un dios que lograse salir del Noden ganaría poder infinito y podría actuar en todos los niveles de realidad y dimensión.**Por eso los dioses y los demonios príncipes sólo deben interactuar en dimensiones donde son adorados por revelaciones, sueños o dotando a humanos de diferentes poderes. Sin embargo, no deben pasar a esa dimensión en ningún tipo de forma.**Los pocos dioses que han osado arriesgarse a hacer una excursión a otras dimensiones se están pudriendo en enormes cristales llamados las “Gemas del Noden”, atrapados por los Guardianes Sylib Nurath que fueron enviados en su busca para devolverlos al Noden.*Los Guardianes son, de hecho, seres superiores creados por los Sybartas y enviados por el Noden, para tender puentes entre las dimensiones.*No son dioses, sino más bien la “policía de los dioses”, a los que se les ha encomendado asegurarse de que las leyes del Noden se respetan en todas las demás dimensiones.**En un principio, los Sybartas les solían dar grandes poderes para que pudieran devolver a los dioses descarriados más rápidamente, pero en cuanto se dieron cuenta del daño que su riqueza de poderes podía causar, convinieron en darles el poder justo para cumplir su misión.**Sin embargo, tenían el don de una increíble capacidad de adaptación a nuevas situaciones y de una gran velocidad de aprendizaje, que les permitía hacer mejor uso de cualquier recurso que tuvieran a su disposición.*Al limitar los poderes que poseen los Guardianes, se han evitado intentos de deificación.**Ningún mortal puede existir en el Noden y cualquier dios que quiera crear un puente entre las dimensiones necesita un cuerpo receptor.*Por lo general, esos dioses utilizan el cuerpo del mortal que ha invocado su llegada, y estos mortales a menudo están encantados de ofrecerse en sacrificio.**El Noden hace un seguimiento de todos los dioses que existen, o que han existido.*Leyendas de otras dimensiones cuentan de Akbaa, Ftaghn-Nayak, Zeus, Zlardos el Vile, Thrn-Glrn, Alador y muchos otros..."
////////////////////////////////////////////////

[description_book_war_magic]
string="La Guerra de la Magia, por Ourfas Befed."

[book_war_magic_content]
string="En la época en la que los humanos vivían en el exterior, la magia se enseñaba en las escuelas de magia, en las los alumnos aprendían las distintas maneras de practicar su arte.**Algunos usaban magia elemental, otros ilusiones, y en raras ocasiones y en zonas altamente especializadas, incluso se podía practicar la extraña necromancia.**Los estilos de magia variaban enormemente, cada uno con su propias filosofías, creencias y tabúes.*Inevitablemente, estas filosofías chocaron unas con otras y ciertos magos intentaron imponer su forma de ver las cosas en los otros profesionales de la magia.**Esto dio paso a una guerra espantosa.**De hecho, ningún método era verdaderamente más fuerte que otro, por lo que cada batalla estaba muy igualada.*Conforme avanzaban los enfrentamientos, cada facción empezó a confiar en un solo hechizo para derrotar a su adversario. El hechizo para consumir todo el maná del rival era, de hecho, el mejor hechizo, puesto que dejaba al adversario consumido e incapaz de conjurar ni siquiera el más débil de los hechizos contra ti...**Los magos estaban en tablas, con las batallas reducidas a una rápida confrontación entre dos personas lanzando un hechizo para consumir el maná del otro.**Fue entonces cuando las Hermanas de Edurneum ayudaron a la escuela real de magia dándoles un objeto mágico muy poderoso.**Este objeto estaba compuesto por dos elementos que una vez unidos permitían al mago conservar toda su energía mágica, incluso si alguien estaba intentando consumírsela.**Estos dos elementos se llamaban Krahoz y Zohark en recuerdo de dos dioses antiguos.**En cuanto se usó este objeto, el conflicto cesó, al estar todos los adversarios de acuerdo en que la persona que poseía este artefacto era la más poderosa.*El Krahoz y el Zohark fueron entregados al rey de Arx y desde entonces han ido pasando a sus descendientes."
////////////////////////////////////////////////

[description_book_day]
string="El día en que llegó."

[book_day_content]
string="Estos hechos han sido relatados por Lord Long, creador y sumo sacerdote de la Orden Negra, en el año 199.***********Cuando llegó, yo era un brillante embajador que servía al reino de Arx.*En aquella época, todavía vivíamos en la superficie, donde el sol brillaba con todo su poder.**El día 37 del año 216, estaba en el observatorio estudiando un eclipse solar y vi un meteorito que caía del cielo y se dirigía a nuestra región.*Cuando chocó con la tierra, hubo un gran terremoto. Inmediatamente pensé que sería el fin del mundo, pero cuando las cosas se tranquilizaron, fui a ver el lugar del impacto.**En cuanto mis dedos tocaron la roca del espacio, una visión me golpeó y me hizo perder el conocimiento.*Mientras estaba inconsciente, algo me empezó a hablar.*La voz me explicó que estaba aquí para salvar nuestro mundo y que me enseñaría el camino a la iluminación.**Noté que me agarraban dos manos enormes y oí susurros dirigidos a mí en una voz profunda y gutural. Entonces vi muchas imágenes del principio de los tiempos hasta el presente. Aprendí su nombre, el nombre de mi dios: Akbaa, el indiscutible señor de Arx.**En aquel momento supe que mi cometido en la vida era ayudar a Akbaa a encontrar seguidores que creyeran en su poder.*Cuantos más seguidores encontrara, más grande sería el poder de mi Dios. Entonces podría reencarnarse en Arx y hacerme el amo del mundo.**Así que construí un templo en su honor en los túneles subterráneos, no muy lejos de nuestro pueblo, para honrarle y difundir la palabra de su religión. También tuve que hacer del meteorito Koltk el centro de todas nuestras energías.**La única manera de satisfacer a mi dios era sacrificando seres pensantes. La adoración y el amor que yo le llevaba se veían recompensados con numerosos poderes y con el conocimiento de hechizos mágicos, que me hacían mucho más poderoso que a un simple humano.*Poder que aterrorizaba a cientos de no creyentes..."
////////////////////////////////////////////////

[description_book_chicken]
string="El poder de las gallinas, por lord Inut, el granjero de Liukalau (Volumen 1)."

[book_chicken_content]
string="Me he dedicado toda la vida al estudio de este extraordinario animal: la gallina.**Es difícil de creer que los horrorosos magos usaran descaradamente a estas maravillosas criaturas muy a menudo para realizar su malvados rituales, sacrificándolas por su magia.*Estoy convencido de que las gallinas están dotadas de gran intuición y humor.**La raza de gallinas se compone de 57 especies diferentes, cada una más extraordinaria que la anterior y con una cultura propia y un modo de vida distintos.**Me pasé 8 años, día y noche, en contacto con las gallinas intentando entenderlas. Incluso aprendí a andar como ellas, para mostrarles mi respeto.**Después de muchísima concentración, conseguí transformarme en una gallina. Podríamos decir, entonces, que soy un “hombre gallina”, que me convierto en gallina cuando la luna es favorable.*Esta nueva capacidad, como es comprensible, tuvo un efecto maravilloso en mis estudios. Podía vivir con las gallinas, comer con ellas, sentir lo que ellas sentían, bailar con ellas e incluso hablar con ellas...**Su lengua, de hecho, es muy compleja. Aquí pongo algunos ejemplos de traducción de gallina a humano:**Bok significa hola;*¡¿Brok?! significa ¿qué haces?;*¡Bokbok! indica que lo que uno está a punto de hacer está prohibido. *Booooook muestra un gran interés en algo.**Y podría entrar en más detalles con la traducción para enseñaros todos los matices del cloqueo de las gallinas, pero creo que con un único ejemplo bastará para la inteligencia de un ser humano normal.**Lo que averigüé de la inteligencia de las gallinas es cuán pronunciado tienen el sentido de altruismo. *En una comunidad de gallinas, el gallo dominante saldrá a buscar alimento si no lo hay en el corral. En cuanto el gallo lo encuentra, pone una pata sobre el alimento y suelta un gran 'brooook' que llama al resto de la comunidad a ir a comer.*Les observa con cariño, y sólo come cuando los demás se han hartado.**Como parte de mi experimento, llevo años intentando poner un huevo y todavía no lo he conseguido...*Un estudio reciente me sugirió que quizás esto se deba a que soy macho, pero yo no puedo aceptar a una explicación tan simplista.*Por eso vivo lleno de esperanza..."
////////////////////////////////////////////////
[description_book_mine_log]
string="Diario de la mina, por Isep Ethan, capataz."

[book_mine_log_content]
string="Informe 87 - Año 266, Estación Marrón, Tercer día de la Semana del Águila.**Después de semanas y semanas de duro trabajo, por fin hemos descubierto una veta de mithril.*Se ha oído un grito de júbilo de los trabajadores y tenían lágrimas en los ojos al observar el principio de la veta.*Está lejos, hacia el este.*Como está bastante lejos de la sala de afilar, hemos construido una vía sobre la que los vagones lo transportarán directamente hasta la sala.*********Informe 88 - Año 266, Estación Marrón, Segundo Día de la Semana de la Rata.**Desde que descubrimos la veta, hemos excavado en todas las direcciones posibles, desde su punto de inicio.*Cuando estábamos cavando en dirección norte, hemos descubierto una extraña cavidad. Parece a la vez natural y cavada artificialmente. Salía un fuerte olor animal de ella y hemos pensado que debe de tratarse de la guarida de alguna bestia salvaje.**Como estamos en la Semana de la Rata, siento cierto temor acerca de lo que nos deparará el futuro..."
////////////////////////////////////////////////
[description_book_forge_manual] //XBOX Version
string="Forja: manual de instrucciones. (Objeto de búsqueda)"

[book_forge_manual_content]
string="Para construir un objeto de metal, debes usar dos máquinas. Primero has de usar un elaborador de lingotes: esta máquina fundirá el metal para obtener un lingote calibrado. Los siguientes pasos describen cómo hacer un lingote:**1) Pon una piedra poderosa en la máquina para darle energía.**2) Mete dos piezas largas de metal en el horno. No metas dos tipos diferentes de metal en el horno a la vez.**3) Si surge la necesidad de unir el metal, añade reactivo a la mezcla.**4) Tira de la palanca para hacer el lingote.*****Luego la fundición debe usarse como sigue:**1) Pon la piedra de energía en la máquina para activarla.**2) Pon el molde del objeto que desees fabricar en el vaciador**3) Mete el lingote en el horno**4) Tira de la palanca para producir el objeto deseado."
////////////////////////////////////////////////

[description_book_art_of_making_potions]
string="La magia de las pociones, por Cyro Besali."

[book_art_of_making_potions_content]
string="Hacer tus propias pociones es sencillo.*Lo único que hace falta es meticulosidad y paciencia.**Primero tienes que encontrar un frasco vacío. Luego necesitas el reactivo específico para cada pócima.*Una vez lo tienes, tritúralo con el mortero hasta hacerlo polvo fino y luego ponlo en un tarro vacío.*Calienta la mezcla con un alambique.*La pócima ya está.**A continuación listo una serie de reactivos conocidos y reconocidos:**para pociones de maná, usa lirio en polvo (polvos azules);**para antídotos eficaces contra veneno, usa hierbas medicinales (polvos morados);**para una poción de invisibilidad, usa campanilla de invierno en polvo(polvos blancos);**para veneno, usa helechos (polvos verdes)**y para pociones curativas, usa nenúfar en polvo (polvos naranjas)."
////////////////////////////////////////////////
[description_book_codex]
string="La farmacopea de Orden."

[book_edurneum_codex]
string="Como la piel de una serpiente, la vida de una reina**debe suceder el renacimiento para permitir la llegada de una nueva reina**una mujer de sangre real**ya que sólo la sangre real puede honrar a la Gran Serpiente como se merece.**Sólo bajo la Tercera Luna de Ixos puede tener lugar el ritual de la revelación real."
////////////////////////////////////////////////
[description_book_the_order]
string="La Orden de Edurneum, por Efan Dirscue."

[book_the_order_content]
string="Se sabe muy poco de las Hermanas de Edurneum. Incluso los orígenes de estas criaturas mitad mujer, mitad serpiente nos son desconocidos. En algunos lugares, su piel está cubierta de escamas.**¿Son una raza que data de la antigüedad, o son simplemente mujeres víctimas de algún tipo de mutación?*Sólo ellas pueden revelar la respuesta a ese misterio.*Parece que adoran a un dios serpiente, pero no sabemos nada acerca de este dios y todos los secretos de su culto están celosamente vigilados por la hermandad.*Imaginamos que este dios les dio los poderes mágicos que tienen, pero, igual que con los demás datos que tenemos sobre la Orden, no podemos estar seguros...**Algunas leyendas alegan que esta veneración al dios no sólo es responsable de sus poderes mágicos, sino también de que se transformen en serpientes.*Sin embargo, no hay pruebas de esto.**Desde que el sol de Arx entró en decadencia, los miembros de la hermandad han sido los aliados más grandes que los humanos jamás han tenido.*Cuando nuestra raza tuvo que empezar a hacerse una vida subterránea, las Hermanas le ofrecieron sus dones de magia al Rey para dar vida a una nueva variedad de planta que pudiera vivir sin la luz del sol, para que los humanos y sus animales pudieran encontrar alimento.**La población de Arx les tiene un gran respeto a las Hermanas de la Orden de Edurneum y les estará eternamente agradecida por lo que han hecho."
////////////////////////////////////////////////
[description_book_history_arx]
string="La historia de Arx, por Maioo Kasmadian."

[book_history_arx_content]
string="Antiguamente, cinco tribus humanas habitaban el continente más grande del mundo.*Estas tribus estaban siempre en guerra, y cuanto más estructuradas se hacían, peor.*Después de años de guerra y de odio crecido, llegó un hombre llamado Poxsellis y consiguió unir a estos diferentes grupos.*Se convirtió en el primer rey de los humanos.**Después de la última batalla de los Escudos Destrozados, en el año 170, Arx disfrutó del período más largo de paz y prosperidad de su historia.**Durante el reinado de Poxsellis, el único período bélico fueron, de hecho, las guerras filosóficas del conflicto que llamamos “la Guerra de la Magia”.*Sin embargo, a pesar de que esta guerra fue brutal y de que mucha gente murió en ella, sólo duró unos meses y no tuvo repercusión en el liderazgo político de nuestro reino.**Durante el resto de su reinado, Poxsellis se enfrentó a varias amenazas.*Un gran número de invasiones de duendes fueron rechazadas, ya que los hombres rata empezaron a vivir en las alcantarillas de las ciudades.**Las batallas fueron sangrientas y esta injusta guerra duró mucho tiempo, pero el ejército del reino, guiado por el propio Poxsellis, masacró a sus enemigos.*Y una vez más la paz volvió a reinar en Arx.**Empezaron las exploraciones de los océanos.**Muchos barcos fuertes salieron a surcar los océanos en busca de nuevas tierras y tesoros.*Pero en 216, cayó un meteorito en nuestro mundo. En un principio, nadie pensó nada sobre este fenómeno, pero algunos visionarios presintieron que era un mal augurio para el futuro de Arx.**De hecho, pocos años después, nuestro sol empezó a morir. La luz era cada vez más escasa y las temperaturas descendieron a niveles peligrosos.*Nuestro joven rey, Lunshire, hijo de Poxsellis, ordenó que la ciudad entera se trasladara a una mina cercana en desuso que había pertenecido a los enanos.**Costó muchísimo trabajo, pero la gente sabía que trabajaba por su propia salvación, y ni un alma protestó.**Se firmó un tratado de paz con el resto de las razas, menos con los hombres rata, con los que es imposible hablar.*Sin embargo, en esta época sus ataques eran menos frecuentes.**Todos estaban muy ocupados salvando Arx, salvando sus propias vidas.*Se firmó un acuerdo en el que se les concedía un nivel de la mina a cada raza por el trabajo realizado.**Esta armonía duró cinco años, tiempo en el cual nuestro sol pereció. Se hizo todo por salvar a los habitantes de Arx, pero muchos perdieron sus vidas.**Además, no se supo nada de las otras ciudades del continente, y se llegó a la conclusión lógica de que habían hecho lo mismo.**Las noticias llegaron mucho después, llevadas por los miembros del Gremio de los Viajeros.**Existían otras fortalezas, esparcidas por todo el continente, encerradas por una maciza estructura de hielo.**El Gremio de los Viajeros es lo único que, hoy en día, permite que fluya la comunicación y el esporádico comercio de artículos de lujo entre ellas.*Aparte de estos contactos aislados, Arx es totalmente autosuficiente."
////////////////////////////////////////////////
[description_book_ancient_gods]
string="Los dioses antiguos, por Abdul Al Raïf."

[book_ancient_gods_content]
string="En un principio, los dioses eran omnipotentes. Reinaban en Arx millones de años antes de que los humanos aparecieran por primera vez.**Sabemos muy poco de los dioses, aparte de que parece que montaron en cólera por la proliferación de los humanos y desaparecieron de la superficie de la tierra.**Algunas escrituras antiguas muestran que esta desaparición se debe a la falta de fe que los primeros humanos mostraron tener en ellos.*Dos dioses estuvieron más tiempo que los demás, antes de desaparecer. Se llamaban Zohark y Krahoz.**Zohark era el más poderoso de todos los dioses; era los truenos, rayos y terremotos. Era tormentas, huracanes y todo lo que representaba la fuerza brutal de la naturaleza.*Pero su poder sólo se podía liberar por medio de Krahoz.**Krahoz era la diosa de la equidad, guardiana del equilibrio y la igualdad.*Ambos se necesitaban, lo que podría ser una de las razones por las que se quedaron más que los otros dioses, aunque al final, desaparecieron como los demás.*Los tiempos modernos vieron el abandono de las antiguas creencias, y a los humanos, que podían crear magia, les tocaba controlar la tierra y la iluminación.**Los humanos entraron en una nueva era conceptual en la que creían más en sus propias aptitudes y sólo se dirigían a los dioses para pequeñas cosas como la fertilidad o el hedonismo.*Veneraban a los dioses de las negociaciones, el oro y la suerte e incluso a los dioses de los pobres. Los primeros dioses –los dioses de las fuerzas brutales de la creación– no tenían lugar en el panteón.**Desde el principio de esta nueva era y del cambio de fe, los dioses más poderosos se han retirado a su propia dimensión, llamada el Noden, donde esperan nuevos adoradores que les permitan volver."
////////////////////////////////////////////////
[description_book_kings_arx]
string="Los Reyes de Arx, por Greenonic Warmhill."

[book_kings_arx_content]
string="Poxsellis fue nuestro primer rey. Fue el primero que unió a las cinco tribus que vivían en nuestro continente en el año 170.**Estas tribus habían estado en conflicto constante entre ellas desde el principio, pero ninguna de ellas era lo suficientemente poderosa como para establecer la supremacía sobre las otras.*Poxsellis era bueno y valiente y retó y derrotó a cada uno de los otros líderes en lo que se llamó la batalla de los Escudos Destrozados.**Antes de retar a los líderes de las tribus, Poxsellis se había aventurado en un templo abandonado en las Montañas de las Minas Gimientes. De este templo se trajo un escudo encantado que le permitió derrotar a todos los líderes.**En cuanto se convirtió en el líder de todas las tribus, se autoproclamó Rey de Arx y reinó con sabiduría, justicia y generosidad.**Tuvo un largo y próspero reinado, a pesar de algunas escaramuzas con los duendes y los hombres rata, las cuales siempre logró dominar gracias a su genio militar.**Fue menos afortunado con sus descendientes.*Sus dos primeros hijos, Elois y Nickus, ambos grandes guerreros, murieron en vida de Poxsellis.**Afortunadamente, cuando le llegó la muerte en 212, su hijo pequeño, Lunshire, quedó para sucederle, pero todavía era muy joven.*Lord Poncet actuó de regente hasta que el niño tuvo edad para reinar, pero Poncet conspiró para impedir que Lunshire accediera al trono. Nunca fue demasiado popular y su pequeño plan fracasó, puesto que Lunshire llegó al trono en 215, a los 16 años.**El rey Lunshire se enfrentó a una tarea difícil desde el principio ya que el sol empezó su decadencia en nuestro mundo.*Fue el instigador de la emigración del pueblo bajo tierra. Hizo todo lo que estaba en su poder para salvar a tanta gente como las minas de los enanos podían hospedar.**Tuvo la inteligencia diplomática de firmar un acuerdo con las demás razas de Arx, sin el cual el traslado hubiese tardado mucho más, e incluso puede que hubiese sido detenido por la era glacial que se aproximaba.**El rey Lunshire honró la memoria de su padre al transportar su ataúd a una nueva cripta, construida en los cimientos de la tumba de los mineros, para que la gente nunca perdiera el respeto ni olvidara a su gran rey."
////////////////////////////////////////////////
[description_book_great_inventions]
string="Grandes inventos de Arx, por Edric Arol."

[book_great_inventions_content]
string="La imaginación humana siempre ha dotado a nuestra sociedad de grandes inventos. Todos nos acordamos de los globos gigantes que permanecían en el aire por medio de aire caliente y que nos dieron la gran capacidad de explorar.*También sirvieron como excelente sistema de seguridad contra invasiones, al permitirnos vigilar desde grandes distancias.**Otro de los más fabulosos inventos jamás concebido fue el submarino.**Esta maravillosa construcción nos aportó nuevos medios para combatir a los piratas y a las flotas de duendes. Nos otorgó supremacía naval durante los años oscuros de caos y desesperación.**Lord Marko, creador de este inestimable invento, es uno de los héroes más célebres en todo Arx. Pero el invento humano más grande de todos es, sin duda, el reino subterráneo de Arx.*Quizá no sea tanto un invento como una conversión de una estructura ya existente; su origen es una antigua mina de enanos con un sistema de ventilación particularmente eficaz.**Ya era una estructura espléndida, pero ahora es todavía más impresionante gracias a la manera en que los hombres la han organizado...*La vieja mina se convirtió en un mundo verdaderamente autónomo, que usa todo el espacio disponible. A cada raza conocida se le concedió un nivel, de acuerdo con el tratado firmado en el año 217. Este reino es una prueba viviente de lo que puede lograr la determinación humana."
////////////////////////////////////////////////
[description_book_race_arx_content]
string="Las razas de Arx, por Cebrafi Nin. (Objeto de búsqueda)"

[book_race_arx_content]
string="Las relaciones entre las diferentes razas de Arx siempre han sido difíciles.**Los duendes eran la raza con más población, debido, en parte, a su alta tasa de natalidad. Sin embargo, como nunca fueron capaces de organizarse en un reino unido, gradualmente fueron perdiendo su posición predominante.*Básicamente, los duendes no son muy inteligentes. Tienen su propio idioma, y en su mayoría hablan una versión simplificada de la lengua humana. Siempre están buscando algo que criticar, y están constantemente fastidiando a la persona con la que hablan.*Son mentirosos, arrogantes, cobardes y extremadamente vagos.*La única época en que los duendes fueron aliados de los humanos fue en la época del gran tratado. Durante este tiempo ayudaron a construir el reino subterráneo, dejando al margen su agresividad y mala educación natural. Sin embargo, en cuanto se completó el trabajo y ya estaban totalmente instalados, volvieron a sus viejos modales.*Parece ser que el comercio de gemas es la única actividad pacífica que hasta los más tolerantes de cada raza pueden soportar.**Los trols son harina de otro costal.*Aunque parezca que sus orígenes son parecidos a los de los duendes, son totalmente distintos. Tienen muy poca fuerza de voluntad y parece que vivan a cámara lenta.*No son agresivos, y muy a menudo son benevolentes. Pero su fuerza sobrehumana y su legendaria resistencia les hacen tanto aliados de peso como adversarios letales.*Su existencia se basa en las cosas simples de la vida, como encontrar algo que comer, o algún sitio donde dormir. Como son mentalmente débiles, son bastante fáciles de engañar, pero pobre del que lo haga si se enteran, porque su ira es legendaria.**Los hombres rata siempre han preferido tener poco contacto con las demás razas.*Se comunican por medio de signos, en lugar de con palabras; a veces incluyen sonidos de arrullo.*Los hombres rata son extremadamente ágiles, lo que les convierte en unos adversarios formidables en combate. Algunos de ellos son los mayores asesinos de Arx. Son muy sigilosos y rápidos. A menudo usan armas envenenadas.*Vivían en las alcantarillas de las ciudades cuando los humanos aún vivían en el exterior. Parece ser que les va muy bien alimentarse de desechos y excrementos.*Hasta ahora, los pocos roces que hemos tenido con los hombres rata han sido cortos pero sangrientos. Hicieron incursiones esporádicas en las ciudades humanas para robar en las basuras en busca de alimento y herramientas rudimentarias. Desde que se han ocultado bajo tierra en la fortaleza de Arx, poco a poco han perdido todo el contacto con las demás razas y se han movido con una discreción ejemplar.**Los enanos tienen pasión por todo lo que sea mecánico o artesanal y por todo lo que tenga que ver con ingeniería; también son los mejores herreros del mundo. Vivían en la fortaleza subterránea mucho antes de que el resto de razas se fuera a vivir allí también.*Son los únicos que saben cómo construir minas y explotarlas adecuadamente, y a menudo venden los productos que extraen a los humanos.*Siempre han tenido una espantosa relación con los duendes y han librado numerosas guerras contra ellos, tratando de eliminarlos por completo.*Se eligió una de sus minas más grandes como refugio y emplazamiento de la nueva ciudad de Arx. También ayudaron a construir las infraestructuras básicas en el lugar y realizaron muchos trabajos (menos los del nivel de los duendes). Como estaban acostumbrados a vivir en las profundidades, se trasladaron más adentro y continuaron explotando sus minas.**El origen de las Hermanas de Edurneum es un misterio.*Parecen híbridos entre mujeres y serpientes. Tienen la piel cubierta de escamas.*Parece que no hay ningún macho en su raza y no sabemos nada de cómo se reproducen.*Están muy dotadas en el uso de la magia, lo que les hace las mejores magas de Arx. Según cierta leyenda, estuvieron implicadas en los orígenes de la magia. Siempre han estado muy unidas a la raza humana, ayudándoles en cada etapa difícil de su desarrollo.*Durante la emigración, las Hermanas prometieron ayudar al rey de los humanos, y crearon plantas subterráneas para alimentar a los habitantes y a sus animales.**De los dragones se sabe muy poco. Sin embargo, los estudiosos han advertido que cada espécimen estudiado tiene 4.815 escamas."

////////////////////////////////////////////////
[description_book_known_gods]
string="Conoce a tus dioses y demonios, por el teólogo Bracconus."

[book_known_gods_content]
string="Alador, creado en Omnys, dios benevolente:*parece que se ha retirado después de haberles dado a los humanos carta blanca en su dimensión, y en concreto, la capacidad de controlar su propio destino.*Se supone que fue muy poderoso, pero nunca antes de abandonar la dimensión de Omnys expuso todos sus poderes.**Xarm, creado en Omnys, dios maligno:*el polo opuesto del dios anterior.*Xarm se enfadó mucho con Alador por la independencia que le había dado a los humanos. Al ver que no se la podía arrebatar, intentó ponerlos bajo su control reduciéndolos a la esclavitud.**Akbaa, creado en Koltk, dios maligno:*llamado dios de la destrucción porque destruyó Koltk por completo, ha empezado a ser adorado por sus seguidores por la ayuda que les proporcionó durante sus guerras y conflictos.**Tirkio, creado en Arx, dios benevolente:*desprecia la inutilidad de los ricos. Se recomienda deshacerse de toda moneda de oro antes de tratar con él."
////////////////////////////////////////////////
