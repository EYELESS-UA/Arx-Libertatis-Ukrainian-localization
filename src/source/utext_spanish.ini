[description_note_ellie]
string="Esta carta es para ti, la mujer de mi vida, mi amada Ellie Rowse. Siempre pienso en ti, todo el día, toda la noche... Los atardeceres, la brisa, todo me recuerda a ti, incluso el frío de las cavernas. Si tan sólo yo hubiera tenido el valor de declararte lo que siento, lo haré pronto... ¡lo haré en cuanto termine mi turno!."

[description_book_cells]
string="Registros de la prisión"

[book_cells_content]
string="Registro y prisioneros.**Año 266, temporada de la rata, criminales:: **SALA DE AISLAMIENTO:**Celda 1: Humano para vender. Nota: 'Humano malo encontrado en nivel 2, él dormir, demasiado extraño.'*Celda 2: Humano para vender. Nota: 'Azuk traerme este humano, yo no saber pero él ser humano calvo, humano ridículo verse rico, sabroso'.**SALA DE JUICIOS PENDIENTES:**Celda 1: Duende malo 'Polsius', Cargo: ataque y blasfemia contra Rey Alotar.*Celda 2: Duende prisionero 'Bolson', Cargo: matar a dos duendes - Lo he matado, ordenes del rey.*Celda 3: Duende prisionero 'Zurok', Cargo: duende malo, él ser ladrón.*Celda 4: Prisionero humano, Cargo: acceso sin autorización a cámara prohibida, él escapar, rey muy enfadado conmigo.*Celda 5: Prisionero humano, Cargo: humano malo atacar amigo Koltor, humano peligroso y borracho ahora en celda."


[note_aldaner]
string="Jefe, nosotros capturar humano en puesto avanzado, secta hacer orden urgente, vendido por 40 monedas de oro.**Toloneo."

[description_book_celly]
string="Reportes de la prisión."

[book_celly_content]
string="Año 266, sexto día de temporada de ratas, evidecias y reportes de cargos para buen rey:: **Nosotros vender como 3 humanos... Nooo, yo arrancar esta página y escribir historias fantásticas pero yo comer tarta primero, tú leer este reporte rey apestoso... Yo aburrido..."

[description_book_color_code]
string="El arte de la magia: pergaminos, por Enselme Tricher."

[book_color_code_content]
string="Desde el descubrimiento de la magia, se le ha dado la mejor interpretación posible a la misma, dando una profunda percepción al mago. La magia que aprenderas es de un tipo especial, se trata de la magia de Edurneum.**Los pergaminos se sellan con una serpentina codificada por colores que muestra que tan poderosos son. El código de colores es el siguiente, cuanto más alto el nivel, más alta la efectividad:**Nivel 1: gris.*Nivel 2: amarillo.*Nivel 3: naranja.*Nivel 4: verde.*Nivel 5: cian.*Nivel 6: rojo.*Nivel 7: morado.*Nivel 8: azul.*Nivel 9: marrón.*Nivel 10: negro."


