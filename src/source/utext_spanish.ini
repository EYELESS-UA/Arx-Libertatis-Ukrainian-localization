[book_calpal_journal]
string="Año 238, Estación Verde, Segundo Día de la Semana de la Araña:*Carlo me ha pedido que siguiera a la Reina. Extraña misión; ha intentado usar conmigo el truco de “por los viejos tiempos” de cuando fui un mercenario del reino, pero esta vez me he asegurado de que me pagara por hacerlo.**Año 238, Estación Verde, Quinto Día de la Semana del Gato:*mientras estaba siguiendo a la Reina, le he visto dejar una carta detrás de la estatua cerca de la cripta. He esperado a que se fuera antes de copiar rápidamente lo que ponía en ella...*Estoy seguro de que Carlo estará encantado con mi descubrimiento.**Año 238, Estación Verde, Sexto Día de la Semana del Gato:*misión cumplida; la Reina ha muerto y todo el mundo culpa al grupo de rebeldes que raptó a la heredera real."

//** this book is now in the human library
[description_book_traveler_guild]
string="El Gremio de los Viajeros, por el sabio Dormal."

[book_traveler_guild_content]
string="El Gremio de los Viajeros fue la primera institución creada después de la muerte del sol de Arx.*Sus orígenes provienen de un puñado de supervivientes acérrimos que no se quisieron unir al resto de la población bajo tierra. Estos extraños supervivientes desarrollaron técnicas para resistir el frío ingiriendo pociones de los alquimistas.**Construyeron sus propios refugios de hielo y criaron perros que también podían resistir el frío.*Se les unieron otros hombres y mujeres que no temían al frío y que también querían aventurarse a otras ciudades.**De estos viajes nació el Gremio de los Viajeros, que ahora es el único medio de comunicación que queda entre las ciudades subterráneas. Siempre se les respeta y recibe con entusiasmo ya que son los únicos capaces de traer noticias del exterior."

