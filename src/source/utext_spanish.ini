[Ortiern_welcome]//{~09~00@badly wounded
String="¿Civil?... Soy Ortiern, capitán del ejército del Rey y comandante de este puesto avanzado. ¿Eres mercenario? ¿Podemos contar con tu ayuda?"

[Player_welcome_ortiern]//~00
String="¿Mercenario? Quizás... De momento, acabo de poner cierta distancia entre un par de duendes y yo. ¿Qué te ha pasado?..."

[Ortiern_briefing1]//~09@badly wounded
String="Un grupito de Ylsides nos atacaron; me hirieron y se llevaron a tres de mis hombres..."

[Player_ortiern1]//~00
String="¿Los Ylsides?"

///FGE
[Ortiern_briefing2]//~09@TO BE TIMED ACCORDING TO ENGLISH VERSION.
String="Hace dos horas, tres de ellos se infiltraron en el puesto avanzado. Atacaron sin previo aviso ni provocación. Los Ylside se han ganado una reputación de guerreros fieros e imparables, y ahora lo he visto con mis propios ojos. Tienen una velocidad increíble, en un abrir y cerrar de ojos inutilizaron y se llevaron arrastrando a tres de mis hombres... Y tendrías que haber visto lo que le hicieron a Karnok... No sé por qué lo hicieron, pero sé que tardarán en volver."

[Player_ortiern2]//~00
String="Encuentra a otro para que te ayude... Tengo que ocuparme de mis propios problemas..."

///FGE
[Ortiern_briefing3]//~09@badly wounded
String="¡Eres mi única esperanza! ¡No me puedo fiar de la chusma de la taberna! Antes me fiaría de un completo desconocido."

[Player_ortiern3]//~00
String="Te lo acabo de decir..."

///FGE
[Ortiern_briefing4]//~09@badly wounded
String="¡Tienes que ir al castillo y contarle al Rey lo que ha pasado aquí! ¡Es de vital importancia! Desde el último terremoto el camino al castillo está bloqueado por un derrumbe y no hemos podido pasar. ¡Has de decirle que los Ylsides nos han declarado la guerra!..." 

[Player_ortiern4]//~00
String="¡Es ridículo! ¡Me acabas de decir que el camino que lleva al castillo está bloqueado!"

///FGE
[Ortiern_briefing5]//~09@badly wounded
String="Deberías poder llegar hasta allí por las cuevas de los duendes, dos niveles más abajo, y encontrar un camino de vuelta a este nivel. Es peligroso e indirecto, ¡pero no tenemos elección! Si encuentras un camino de vuelta aquí, te encontrarás de nuevo en el reino humano."

///FGE
[Player_ortiern5]//~00
String="¡Imposible, me acabo de escapar de una de las prisiones de los duendes!"

///FGE
[Ortiern_briefing6]//~09@badly wounded
String="Toma, esto te servirá; es un permiso de comercio de gemas. Siempre que les digas que eres un vendedor y que no les ataques probablemente te dejen en paz. Yo me tengo que quedar aquí. ¡Tú eres nuestra única esperanza, valiente mercenario!"

///FGE
[Ortiern_repeat_briefing]//}~09@badly wounded
String="¿Te he dicho ya que eres nuestra única esperanza?"
string2="¿Lo entiendes? Vale... Métete en las cuevas de los duendes con el permiso que te he dado, y encuentra un camino de vuelta para subir al castillo del Rey."
string3="Y una vez hayas visto al Rey, él despejará el camino y enviará refuerzos para luchar contra los Ylsides..."
string4="Si no lo haces por mí, ¡hazlo por el reino, valiente mercenario!"

[Ortiern_repeat_briefing_caves]
String="¿Te he dicho ya que eres nuestra única esperanza?"
string2="Y una vez hayas visto al Rey, él despejará el camino y enviará refuerzos para luchar contra los Ylsides..."
string3="Si no lo haces por mí, ¡hazlo por el reino, valiente mercenario!"

[Ortiern_misc_hi]//~09
String="¡Por siempre leal!"
string2="¡Una vez más, gracias por tu ayuda, mercenario!"

