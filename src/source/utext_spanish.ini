// If the player turned up not knowing that he was the Guardian...
[dragon_explain_guardian2]//{~27~00
String="Sé quién eres, y no te sorprendas, porque me di cuenta la primera vez que nos conocimos. Debes descubrir quién eres por voluntad propia..."

[player_miserabilis]//~00
