[player_dragon12]//{~00~27
String="Los Ylsides han hecho prisioneros a todos los humanos del reino..."

[dragon_scenar12]//}~27
String="Por lo poco que sé de los Ylsides, mejor que no te enfrentes con ellos cara a cara, amigo mío... Intenta ser astuto; es muy difícil luchar contra lo que no puedes ver.."

