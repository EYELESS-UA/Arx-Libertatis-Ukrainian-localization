[dragon_explain_guardian4]//~27
String="¡Hace mucho que no veía a uno de los enviados del Noden! Me alegro de que no te costara mucho recuperar la memoria... Ser un Guardián tiene sus ventajas, pero a veces también sus inconvenientes..."

[player_question_dragon]//~00
String="¿En qué sentido?"

[dragon_explain_guardian5]//~27
String="Bueno, parece ser que un Guardián desarrolla una especia de presciencia, una capacidad de moverse por el tiempo que le da una nueva visión de las situaciones críticas; así evita las encerronas y la derrota. Debes de haberlo percibido, aunque quizá inconscientemente. De hecho, has de saber que estás destinado a conseguir tus propósitos. No dudes en recurrir a esta capacidad, ya que te será de gran utilidad..."

[player_question_dragon2]//~00
String="¿Tengo más poderes que yo no sepa?"

[dragon_explain_guardian6]//}~27
String="No creo. Hace mucho tiempo que los líderes del Noden otorgaron grandes poderes a sus Guardianes... a veces es peor el remedio que la enfermedad... Lo que me lleva a tu debilidad principal: como criatura del Noden, pareces humano y no eres nativo de esta dimensión. Eres libre de hacer casi todo, pero no todo; tu desconocimiento de esta dimensión, junto con las cosas que el Noden te inculcó, las cuales probablemente no recuerdas, a menudo te harán perder el camino: quizá tengas conversaciones que no vayan como esperabas, las palabras que salgan de tu boca no serán las que tú hubieras elegido o ni siquiera las que tú hubieras querido decir. No te preocupes, Guardián. En Arx siempre serás un forastero, ajeno a los humanos."

