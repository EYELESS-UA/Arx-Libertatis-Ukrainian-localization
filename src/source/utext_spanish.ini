// Troll Pluk //translate 2
////////////////

[pluk_give_gem]//~19
String="Tú amigo de trols. Yo dejarte pasar si tú darme gema."

[pluk_friend]//~19
String="Tú buen humano, tú amigo."

////////////////
// Troll_king //
////////////////

[player_to_Pog01]//{~00~18
String="Hola. ¿El rey Pog, supongo? Sé que no te gustan los forasteros, pero traigo un mensaje del rey Lunshire. Tiene algo que pedirte..."

[Pog_asknote]//~18
String="Yo ser amigo de Lunshire. Tú darme nota..."
// examines the note

[Pog_readnote]//~18
String="Camino bloqueado... Mmmmm... Yo querer ayudar tu gente, pero primero humanos tener que ayudar trols a recuperar tesoro perdido."

[player_to_Pog03]//~00
String="Desde que me escapé, me he pasado el tiempo ayudando a otra gente, pero en este asunto no tengo elección, supongo... Y quizás me vaya bien para la memoria... Así que, cuéntame acerca de este tesoro perdido."

[Pog_briefing]//~18
String="Un ladrón malo robó nuestro ídolo. Ídolo proteger trabajo de trol: impedir cueva caer en nuestra cabeza, ahora no ídolo, los trols ya no trabajar para duendes."

[player_to_Pog04]//~00
String="¿Qué hacéis para los duendes?"

[Pog_explain]//~18
String="Reunir gemas en las minas. Duendes venden ellas y darnos un poco de oro."

[player_to_Pog11]//~00
String="¿Por qué no las vendéis vosotros?"

[Pog_explain2]//~18
String="Duendes venden ellas. Trols estúpidos para vender..."

[player_to_Pog05]//~00
String="*suspiro* Bueno, recuperaré el ídolo..."

[Pog_thanks]//~18
String="Gracias. Los trols recuperaremos el ídolo... Ídolo para trols cuando nosotros vivir fuera con el rey Nog."

[Pog_giveme_idol]//~18
String="Tú darme el ídolo cuando encontrarlo y yo ayudarte..."

[player_to_Pog07]//~00
String="Creo que ya es hora de que nos ayudemos mutuamente..."

[Pog_helpyou]//~18
String="Sí. Ahora te ayudamos... Mi gente quitar rocas del camino. ¡AROUGHH! ¡OUNTAAR! ¡GLOK! ¡UUUOORG!"

[player_to_Pog08]//~00
String="Deberías vender tus gemas tú mismo."

[Pog_notclever]//~18
String="Yo no suficiente listo. Yo no entender finanzas y ventas."

[Pog_finance]//~18
String="¿¿¿Libro de ventas y finanzas??? Entonces yo intentar aprender finanzas y hacerme listo. Pronto, ya no necesitar a duendes..."

[player_to_Pog10]//~00
String="Sé que serás un comerciante astuto, Pog. Después de esto, los duendes me despreciarán, pero no quiero tener nada que ver con una raza tan arrogante."

[Pog_nasty]//~18
String="Por tu culpa, trols ya no poder ganar dinero. Tú matar duendes. ¡Tú ya no ser amigo de trols!"

[player_to_Pog09]//~00
String="Me entristece ver cómo te tomas la liberación de la esclavitud, Pog..."

[Pog_friend]//}~18
String="Tú amigo verdadero de trols."

//** grassini new
// if the book about finance has been given to the trolls, it is now they, and not the goblins, who trade in gemstones. However, the rates are much more favorable for the player than when the goblins were in charge. 
