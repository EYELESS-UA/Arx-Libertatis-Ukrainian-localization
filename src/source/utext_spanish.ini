///////////////////
// Troll Burwaka //
///////////////////

[burwaka_explain_greu]//{~19~00
String="Yo amigo de Greu. Él no querer vivir con nosotros porque no querer trabajar para duendecillos..."

[burwaka_greu_gift]//~19
String="Greu, él nacer bajo tierra, él nunca ver mundo de fuera. Yo creer que Greu querer ver ilustraciones de fuera. Tú felicitar cumpleaños de Greu cuando verlo."

[burwaka_friend]//~19
String="Tú humano amable, tú amigo de Burwaka ahora."

[player_burwaka_greu]//~00
String="Burwaka, yo conozco a Greu. Le daré el regalo de cumpleaños."

[player_burwaka_sayhello]//~00
String="Sí, lo haré."

[player_burwaka_jobdone]//}~00
String="Le di el libro a Greu. Se puso contento."

////////////////
// Troll Greu //
////////////////

[Greu_introducing]//{~19~00
String="Yo Greu. Yo aquí porque dejé campamento trol. No querer trabajar para duendes. A mí no gustar duendes. Duendes pequeñitos. No poder fiarse de duendes. Duendes pensar trols estúpidos. Así que yo vivir aquí, solo con peces. Peces no dar órdenes y yo comerlos..."

[player_Greu_surprised]//~00
String="Mmmm, así que si lo he entendido bien, ¿los trols trabajan para los duendes?"

[Greu_introducing2]//~19
String="Pog, rey de Trols, acatar órdenes de duendes. Greu odiar duendes. Greu preferir estar aquí: libre, sin órdenes, no trabajando. Greu hacer música. Greu hacer estatua. Greu artista."

[Greu_birthday]//~19
String="Hoy cumpleaños de Greu... Pero Greu solo: no tener amigos. No tener regalos... Burwaka único amigo de Greu, allí arriba, él trabajar para duendes. Greu triste."

[player_Greu_friend]//~00
String="Bueno, quizá podamos ser amigos..."

[Greu_birthday2]//~19
String="¿De verdad? ¡¿Tú querer ser amigo de Greu?! ¡Yo tener nuevo amigo!... Bueno, amigo, ¿entonces qué tener para el cumpleaños de Greu?"

[player_Greu_know_gift]//~00
String="¿Un regalo? A ver qué puedo hacer..."

[Greu_birthday3]//~19
String="¡Hola, amigo mío! ¿Tú traer regalo para el cumpleaños de Greu?"

[player_Greu_check_gift]//~00
String="Mmmmm.... A ver qué tengo para ti..."

[player_Greu_offer_gift]//~00
String="¿Qué, te gusta esto?"

//// not the right gift ////
[Greu_disapointed_by_gift]//~19
String="Eso regalo no bueno. Greu todavía triste. Burwaka mejor amigo que Shaegar..."

//// the right gift ////
[Greu_happy_with_gift]//~19
String="¡¡¡¡Sí!!!! ¡A Greu gustar eso! ¡Tú muy simpático! Tú mejor amigo de Greu, tú saber cómo hacer a Greu feliz... Ahora Greu darte regalo de cumpleaños, también... Tomar eso: amuleto trol. Ningún trol atacarte cuando tener eso..."

[Greu_happy]//~19
String="¡Hola, amigo de Greu! ¡Yo contento de ver amigo de Greu!"

[Greu_happy2]//~19
String="¿A ti gustando música de Greu?"

[player_Greu_mauld]//~00
String="Greu, ¿cómo harías un molde de algo?"

[Greu_mauld]//}~19
String="Coger barro de Greu y usarlo en la cosa que querer hacer de nuevo."

