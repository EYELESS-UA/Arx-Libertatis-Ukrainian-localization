// Human_King //
//////////////////

[player_king_1stmeet1]//{~00~01
String="Me llamo Am Shaegar. Escapé de una de las prisiones de los duendes y me envía Ortiern. Él y sus hombres están atrapados en vuestro puesto avanzado. Dice que necesita ayuda para despejar el camino al castillo, que está bloqueado por un desprendimiento de tierra. Además, un pequeño grupo de Ylsides les ha atacado y no podrán resistir otro ataque."

///FGE
[king_player_1stmeet1]//~01
String="¡Cielos! Eso son nuevas de gravedad, Am Shaegar. Le has hecho un gran servicio al reino, y te lo agradecemos profundamente. Serás recompensado en función de los riesgos que hayas corrido para traernos estas noticias. Este derrumbamiento, sin embargo, no es un problema pequeño y solucionarlo llevará algunas cavilaciones."

///FGE
[king_player_1stmeet1bis]//~01
String="He decidido cómo voy a actuar. Tú le llevarás este mensaje a Pog, el rey de los trols. Su gente son mineros muy capaces, hasta ayudaron a construir este poblado. Los trols viven un nivel por debajo de nosotros, puede que ya te los hayas encontrado... son tan feos como los duendes, pero cinco veces más grandes. Con todo, las relaciones entre nuestros dos reinos son excelentes. Hemos compartido el odio por los hombres rata... Estoy seguro de que nos ayudarán inmediatamente."

///FGE
[player_king_1stmeet2]//~00
String="Parece que no puedo dejar de verme envuelto en los acontecimientos... Bueno, le ayudaré, pero espero que usted a cambio me ayude."

[king_player_1stmeet2]//~01
String="No temas, se te dará una buena recompensa por este cometido."

///FGE
[player_king_1stmeet3]//~00
String="¡El oro me servirá de poco, si no puedo recuperar la memoria!"

///FGE
[king_player_1stmeet3]//~01
String="Estoy seguro de que volverás a recordarlo todo. Los duendes te debieron de dar un buen golpe en la cabeza, eso es todo. No te preocupes. Y ahora, te ruego que, como emisario del reino, le lleves este mensaje a Pog, rey de los trols..."

[king_player_1stmeet_misc]//}~01
String="Ahora, te lo ruego, Am Shaegar, ve a hablar con Pog, el rey de los trols."
string2="Estoy seguro de que recuperarás la memoria, poco a poco."
string3="Bueno, no veo para qué quedarte por aquí más tiempo, ¿eh?"
string4="¡Rápido! ¡Mis hombres están atrapados en el puesto avanzado!"

///FGE
[king_player_rocksaway1]//~01
String="Gracias de nuevo, Am Shaegar. Ya se han quitado las rocas. Una vez más te has ganado nuestro agradecimiento y esta recompensa. Has demostrado ser muy valioso para al reino, y tendré que considerar un papel más oficial para ti aquí..."

///FGE
[king_player_rocksaway2]//{~01~11
String="Ah, sí... ¿te gustaría que te hiciera...?"

///FGE
[Carlo_breaks_in1]//~11
String="Su Majestad... Hemos descubierto señales de que ha habido otro ritual..."

///FGE
[king_player_rocksaway3]//~01
String="Mmm. Es el tercero en menos de una semana. ¿Dónde esta vez?"

[Carlo_breaks_in2]//~11
String="Simplemente en el conducto del aire, Su Majestad. ¿Cree que puede estar relacionado con el asesinato de Falan Orbiplanax?"

[king_player_rocksaway4]//~01
String="Probablemente... Le diré a mi nuevo amigo que le eche un vistazo. Gracias, Carlo, puedes retirarte."

[Carlo_breaks_in3]//}~11
String="Muy bien, señor."

///FGE
[king_player_rocksaway5]//{~01~00
String="Bueno... ¿Qué te parece esto? Sugiero que investigues a esta turbia secta; estoy casi seguro de que ejecutó a Falan Orbiplanax, nuestro viejo astrónomo. Necesito a alguien que no sea conocido como agente del Rey, un hombre que no tema a nada. ¿Me servirás en este papel?"

///FGE
[player_king_rocksaway1]//~00
String="Todo es un poco confuso, Su Majestad. Pero por supuesto que podría echarle un vistazo..."

///FGE
[king_player_rocksaway6]//~01
String="Sé que no me defraudarás. Serás libre de interrogar a mi gente en tus investigaciones. ¡Guardias, dadle a este hombre acceso libre a los aposentos privados del castillo! Y además, querido Am Shaegar, toma la llave de las cámaras reales; ahora es tuya. Por favor, considéralas tu nueva casa."

[player_king_rocksaway2]//~00
String="Es todo un detalle..."

///FGE
[king_player_rocksaway7]//~01
String="¡De nada! Celebraremos una reunión del Consejo en cuanto vuelvas con noticias sobre estos alarmantes acontecimientos."

///FGE
[king_player_rocksaway_misc]//}~01
String="Celebraremos una reunión del Consejo una vez que hayas desvelado algunas pistas."
string2="Estoy encantado de poder contar con tu ayuda, Am Shaegar."
string3="¿Te gusta tu nueva habitación?"
string4="Que los dioses te ayuden con las investigaciones."

//player gives Krahoz to the King
[king_krahoz]//~01
String="Por fin se nos ha devuelto el Krahoz. Muchas gracias por tu honestidad y lealtad, Am Shaegar. Llévaselo a las Hermanas de Edurneum inmediatamente. Estarán encantadas de volver a tener en su poder su preciado bien y no me molestarán más por ello... El reino de Arx nunca olvidará tu coraje."

//** grassini new: when the player has to collect the large sum of gold for the dragon.
[player_king_gold]//{~00~01
String="Necesito mucho oro para salvar Arx..."

///FGE
[king_player_gold]//}~01
String="Nuestro reino no es ni mucho menos rico, Am Shaegar, pero dado todo lo que has hecho por nosotros y lo que planeas hacer, cómo podríamos negarte esta modesta cantidad..."

//** grassini: scene-setting section when the player arrives in the throne room.

