////////////////////////////////////////
// GAME_READY TUTOS AND CURIOUS FACTS //
////////////////////////////////////////

[ready_tuto_1]
string="Recuerda que los objetos que necesitarás para llevar a cabo tu búsqueda tienen una descrpción que termina con '(Objeto de la búsqueda)'. ¡No pierdas estos objetos!."

[ready_tuto_2]
string="Recuerda que tu potencia de ataque depende del tiempo que has estado preparando tu golpe."

[ready_tuto_3]
string="Si presionas una dirección mientras estás preparando tu golpe harás diferentes movimientos. Por ejemplo, ve a la izquierda antes de cargar para acuchillar a tu adversario."

[ready_tuto_4]
string="Aparte de usar el hechizo para apagar llamas, puedes echar una botella de agua sobre las llamas para apagarlas. Luego, para rellenar la botella sólo tienes que buscar una pila de agua y meter la botella en ella."

[ready_tuto_5]
string="Si tienes que dar dinero a alguien, puedes encontrar tu monedero de oro en tu inventario."

[ready_tuto_5b]
string="¿Algunos lugares son muy oscuros?. No olvides cargar y usar antorchas/lámparas para iluminar tu camino."

[ready_tuto_6]
string="Los vendedores de armas también las pueden reparar. Sólo tienes que darles tu arma estropeada y la arreglarán por una pequeña cantidad."

[ready_tuto_7]
string="Para reparar tu arma, sitúa tu arma estropeada encima de un yunque y, dependiendo de tu destreza en el conocimiento de objetos, la reparación será más o menos efectiva."

[ready_tuto_8]
string="Para pescar busca una caña de pescar (o haz una usando un palo y una cuerda) y acércate a un río o un lago y después, usa la caña de pescar."

[ready_tuto_9]
string="¡Compra un llavero tan pronto como puedas!. Te permirtirá poner todas tus llaves en un solo objeto."

[ready_tuto_10]
string="¿Has intentado forjar un arma?. Busca una hoja de acero sin forjar, ponla al fuego, acciona el fuelle y golpea la hoja de acero con el martillo. La eficacia va de acuerdo a tus habilidades del conocimiento del objeto."

[ready_tuto_11]
string="¿Sabías que puedes rellenar tu carcaj?. Para hacerlo combina tu carcaj con un vendedor de armas y él te rellenará el carcaj por una módica cantidad."

[ready_tuto_12]
string="¿Sabías que puedes envenenar tus armas usando una poción venenosa?. El resultado depende de tu destreza en el conocimiento de los objetos."

[ready_tuto_13]
string="¿Sabías que puedes extraer piedras preciosas?. Sólo tienes que buscar un pico y aplicarlo sobre las planchas de piedras preciosas que encontrarás incrustadas en los muros."

[ready_tuto_14]
string="No dudes en probar varias cosas. Un problema puede tener diferentes soluciones dependiendo de tu habilidad y de los objetos que tengas."

[ready_tuto_15]
string="Recuerda que un pastel de manzana bien cocinado te dará más vida que una seta y te alimentará más rápido."

[ready_tuto_16]
string="¡Ten cuidado de beber demasiado vino o te emborracharás!."

[ready_tuto_17]
string="¿Has matado a alguien que necesitarás más tarde?. No te preocupes: no se ha acabado tu búsqueda. Siempre hay otro modo de continuar si se ha muerto una persona importante."

[ready_tuto_18]
string="Si quieres cancelar un hechizo activo, haz doble clic en el símbolo del hechizo que quieras cancelar en la esquina superior derecha o simplemente presiona la rueda del ratón o la tecla '6' (Predeterminado)."

[ready_tuto_19]
string="¿Sabías que puedes acuchillar directamente el cuello o un punto débil de tus enemigos? Esto acabará instantáneamente con ellos, para ello deberás atacarlos por la espalda sin ser detectado, requerirás de un valor de puntos suficientemente alto en sigilo para acceder a estos ataques especiales de asesino."

[ready_tuto_20]
string="Ten cuidado cuando golpees mientras luchas: si tu arma choca con una piedra, un muro o cualquier otro objeto duro, se dañará."

[ready_tuto_21]
string="¿Alguna vez has intentado lanzar una bola de fuego a un pollo?."

[ready_tuto_21b]
string="Las runas exóticas otorgarán mejoras y habilidades adicionales a los hechizos. Para conjurar un hechizo mejorado, necesitarás cada una de las runas de dicho hechizo en su versión exótica."

[ready_tuto_22]
string="¡No olvides que puedes asignar un atajo a tus pociones de vida y maná!. Por ejemplo, presionar las teclas 'G' o 'H' (Predeterminadas), puede ser útil en una pelea."

[ready_tuto_23]
string="¿Sabías que puedes contrarrestar la magia?. Por ejemplo, usa el hechizo para apagar llamas mientras un enemigo está lanzando una bola de fuego. Si tu destreza mágica es mayor que la de tu enemigo, apagarás su bola de fuego."

[ready_tuto_24]
string="Si tienes más de 50 puntos de sigilo podrás robar a los personajes controlados por la CPU. Cuando estés cerca de uno, si aparece un monedero en la parte inferior izquierda de la pantalla puedes robarle. Sólo presiona doble clic en el monedero del personaje para ver su inventario. Para poder ver y robar objetos más grandes o de más valor, necesitarás una cantidad de puntos de sigilo aún mayor."

[ready_tuto_25]
string="¿Has visto los ratones y pequeñas ratas mansas que corren por las cuevas?. Tira un poco de queso, carnes o cualquier alimento para carroñeros cerca de ellos... les gustará."

[ready_tuto_26]
string="¿Sabías que las diferentes armaduras que llevas puestas hacen un ruido diferente cuando andas?. Una armadura de cuero no te hará el mismo ruido que una armadura de malla. Ten en cuenta esto cuando te deslices entre las sombras."

[ready_tuto_27]
string="¿Sabías que puedes encantar armas, armaduras, anillos y objetos?. Usa el reactivo adecuado y luego ¡lanza el hechizo para encantar objetos! El resultado depende de tu destreza mágica."

[ready_tuto_28]
string="¿Sabías que se pueden envenenar las pilas de agua?. Puede ser útil..."

[ready_tuto_29]
string="Si quieres hacer nuevas amistades, ¡no dudes en dar de comer al perro!."

[ready_tuto_30]
string="No olvides usar runas exóticas, mejorarán la eficacia de tus hechizos y te darán acceso a nuevas características. Por ejemplo, mejora tu hechizo de visión mágica para ver a través de una puerta, identificar a todos tus enemigos cercanos o encontrar objetos, esto puede ser muy útil para el sigilo."

[ready_tuto_31]
string="Si necesitas dinero, no dudes en visitar la arena de peleas de Miguel, puedes recibir recompensas periodicamente si participas en apuestas o torneos."

[ready_tuto_32]
string="Puedes escuchar las conversaciones de los personajes siempre y cuando estos no te detecten. Mientras escuches escondido, puedes enterarte de aspectos importantes y acceder a información que puede ayudarte."

[ready_tuto_33]
string="¿Sabías que apagar las llamas o antorchas puede ser útil? Usa el hechizo para apagar llamas o haz doble clic en una botella llena de agua y combinala con el fuego. De este modo podrás deslizarte por las sombras más fácilmente o esconderte en algunos lugares sin ser detectado."

[ready_tuto_33B]
string="No olvides que apagar antorchas puede ser útil. Haz doble clic en una botella llena de agua y combinala con el fuego. De este modo podrás deslizarte por las sombras más fácilmente o esconderte en algunos lugares sin ser detectado."

[ready_tuto_34]
string="Puedes elaborar tus propias pociones: usa un mortero para machacar hierbas y convertirlas en polvo. Luego, pon el polvo en una botella vacía. Necesitarás un aparato para elaborar la poción."

[ready_tuto_35]
string="TRAMPILLAS: has doble clic en las trampillas para acceder a cobertizos, tejados o rutas alternativas."

[ready_tuto_35b]
string="TRAMPILLAS: has doble clic en las trampillas para acceder a cobertizos, tejados o rutas alternativas."

[system_fire_creative]
string="Puedes activar trampas creativas si te persiguen enemigos numerosos, sitúate cerca de escombros inflamables y activa el hechizo 'encender', achicharra enemigos por un tiempo limitado, aviso, usarse cuidadosamente."

[tutorial_stealth_mod]
string="JUEGA A TU MANERA 2: Muchas tácticas como el sigilo pueden usarse de diferentes maneras.**-Usa el modo sigilo para suavizar tus pasos y deslizarte en las sombras (Tecla predeterminada: 'C').*-Mantenerse oculto al escuchar conversaciones puede ayudarte a descubrir información o puntos clave.*-Realiza muertes sombrías instantáneas, atacando por la espalda solo a enemigos que no noten tu presencia (Requiere: 30 de sigilo, exclusivo para dagas o armas cortas).**La efectividad del sigilo dependerá de cuantos puntos asignes a dicha habilidad."

[tutorial_access_mod]
string="JUEGA A TU MANERA 3: Experimenta y busca alternativas. Puedes superar una puerta cerrada si:**-Buscas una llave.*-Encuentras una ruta alternativa.*-Utilizas un juego de herramientas para forzar la cerradura.**-Sobornas a una autoridad para obtener acceso.**Todo problema siempre tiene distintas soluciones."

[tutorial_rooftops_mod]
string="ELEVACIONES Y TEJADOS: Utiliza elevaciones, tejados y cobertizos para:**-Encontrar una ruta alternativa.*-Esconderte o evitar enemigos.*-Realizar un ataque de caída (No letal), saltando sobre tus enemigos desde las alturas y dejándolos inconscientes."

[system_no_lever]
string="Encuentra un trozo de madera y combínalo con el soporte de palancas para repararlo."



