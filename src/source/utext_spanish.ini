[note_garrett_content]
string="Hay un nuevo encargo de Garrett, hay una gema especial enterrada en las catacumbas de los duendes, ten mucho cuidado en la prisión, no dejes que te atrapen o arruinarás los planes."

[note_expedit_content]
string="Ya han pasado 6 días y me temo que la expedición ha fracasado, después de lo que nos costó colarnos en estas ruinas, el riesgo vale el acertijo. Descubrimos un campamento duende cerca del punto de expedición, además están las molestas ratas, debemos andarnos con cuidado."

[note_exgob_content]
string="Tú entrar, tú ladrón, pudrirte como gusanos. Aquí tener tu basura, yo ser duende miserable y pobre, yo esperar ladrón nunca mendigar comida como yo."

[note_immersives_content]
string="Durante la expedición encontramos una antigua caja fuerte, por desgracia estaba vacía y pesa un montón aunque sigue funcionando, así que he guardado algunos suministros dentro. Abrirla fue sencillo, dos de los números ya se encontraban grabados en la parte trasera, el tercero es ilegible aunque eso no debería ser un problema."

