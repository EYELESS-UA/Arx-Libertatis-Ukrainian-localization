[system_charsheet_strength]
string="Fuerza. Determina tus bonificaciones de daño en peleas y tu capacidad para usar armas pesadas. La fuerza repercute en la facultad del conocimiento del objeto y las facultades de combate."

[system_charsheet_intel]
string="Mental. Determina tu reserva de maná (energía mágica) y la resistencia a la magia. La facultad mental repercute en diversas facultades como las de lazo etéreo, magia, técnica, intuición y el conocimiento del objeto."

[system_charsheet_consti]
string="Constitución. Determina tu reserva de salud, tu resistencia al veneno y tu capacidad para llevar armadura pesada. La constitución repercute en la defensa."

[system_charsheet_mecanism]
string="Facultad técnica. Te permite forzar puertas o desmontar trampas."

[system_charsheet_intuition]
string="Intuición. Una especie de sexto sentido que te ayuda a detectar objetos escondidos, como por ejemplo pasadizos secretos y trampas. La intuición también mejora tu olfato para el comercio, lo que te permite hacer tratos mejores."

[system_charsheet_etheral_link]
string="Lazo etéreo. Este lazo te avisa de la presencia de criaturas hostiles y te da información sobre el estado de tus adversarios durante las peleas. Esta facultad también determina la velocidad con la que recuperas el maná."

[system_charsheet_objknoledge]
string="Conocimiento del objeto. Te será útil para acciones como reparar cosas, preparar pociones, envenenar armas e identificar objetos."

[system_charsheet_casting]
string="Conjuros. Esta facultad te da acceso a diferentes niveles de hechizos. Hay diez niveles de hechizos. Esta facultad también determina la capacidad para protegerte de la magia."

[system_charsheet_projectile]
string="Proyectil. Te da bonificaciones por golpear y causar daños al usar cualquier arma de largo alcance durante la pelea."

[system_charsheet_closecombat]
string="Cuerpo a cuerpo. Te da bonificaciones por golpear o causar daño al usar cualquiera de las armas de combate cuerpo a cuerpo."

[system_charsheet_defense]
string="Defensa. Determina la capacidad que tienes para usar un escudo, aumenta la clase de armadura y reduce la cantidad de daño que sufres durante las peleas."

