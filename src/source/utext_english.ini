[description_book_color_code]
string="The art of magi: scrolls, by Enselme Tricher."

[book_color_code_content]
string="Since the discovery of magic, the best possible interpretation has been given to it, giving the mage a deep perception. The magic that you will learn is a special kind – it is the magic of Erduneum.**Scrolls are sealed with a colour-coded banderole that shows how powerful they are. The color code is as follows, the higher the level, the higher the effectiveness:**Level 1: gray.*Level 2: yellow.*Level 3: orange.*Level 4: green.*Level 5: cyan.*Level 6: red.*Level 7: purple.*Level 8: dark blue.*Level 9: brown.*Level 10: black."


