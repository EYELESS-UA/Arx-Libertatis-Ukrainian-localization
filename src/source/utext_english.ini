[note_expedit_content]
string="Six days have already passed and I fear that the expedition has failed, after what it cost us to sneak into these ruins, the risk is worth the riddle. We discovered a goblin camp near the point of expedition, there are also the annoying rats, we must be careful."

[note_exgob_content]
string="You enter here, you is thief, you rot with worms. There your trash, me miserable and poor goblin, me hope thief never beg food like me."

[note_immersives_content]
string="During the expedition we found an antique safe, unfortunately it was empty and it weighs a lot but it still working, so I kept some supplies inside. Open it was simple, two of the numbers were already engraved on the back, the third is illegible although that shouldn't be a problem."

