[Sylib_briefing_1]//{~24~00@TO BE TIMED ACCORDING TO ENGLISH VERSION
String="Welcome, Guardian. Allow me to explain your next mission. You know the rules of the Noden, the dimension of gods and demon princes. No being of power is permitted to leave this dimension. But Akbaa is preparing to invade a world called Arx. A group of his followers is presently trying to invoke him. You know that this must not be. We cannot fight Akbaa from here, for we can impose nothing on the gods. So, we will send you to destroy this cult which worships him, and without the adulation of followers, his power will diminish to acceptable levels..."

[player_noden_briefing_1]//~00@TO BE TIMED ACCORDING TO ENGLISH VERSION
