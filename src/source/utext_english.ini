string="Allows the spell-caster to move through the air."

[system_spell_description_ice_field]
string="Creates a barrier of ice."

[system_spell_description_paralyse]
string="Paralyzes an enemy."

[system_spell_description_cure_poison]
string="Cures the effects of poison within a radius around the spell-caster. Beware: this will cure your enemies, too."

[system_spell_description_repel_undead]
string="Some of the undead will flee when they see the caster of this spell."

[system_spell_description_poison_projection]
string="Hurls a poisonous gas."

[system_spell_description_slowdown]
string="Slows down the movements of the creature it is aimed at."

[system_spell_description_raise_dead]
string="Summons an undead. Please note: this spell only works when standing on ground."

[system_spell_description_create_field]
string="Creates a field of protection."

[system_spell_description_disarm_trap]
string="Disables any trap within a given radius."

[system_spell_description_flying_eye]
string="Lets the spell-caster control an invisible eye in order to explore places without being seen."

[system_spell_description_fire_field]
string="Raises a wall of fire in front of the spell-caster."

[system_spell_description_Lightning_strike]
string="Hurls a lightning bolt in front of the spell-caster."

[system_spell_description_confuse]
string="Confuses the opponent."

[system_spell_description_invisibility]
string="Makes someone invisible. The spell will cease to work if the person who cast it attacks or tries to use, activate, or pick up an object."

[system_spell_description_mana_drain]
string="Drains people's mana within a given radius around the spell-caster."

[system_spell_description_life_drain]
string="Drains people's health within a given radius around the spell-caster."

[system_spell_description_explosion]
string="Creates considerable damage around the spell-caster."

[system_spell_description_enchant_weapon]
string="Gives magic properties to an object in front of the spell-caster, depending on the reactive substances that are near the object."

[system_spell_description_summon_creature]
string="Summon a demon. Note that once the demon is summoned, its behavior is unpredictable."

[system_spell_description_negate_magic]
string="Prevents any magic event from working within a given radius around the spell-caster."

[system_spell_description_incinerate]
string="Hurls a wave of incineration in front of the spell-caster."

[system_spell_description_mass_paralyse]
string="Hurls a paralyzing frozen wave around the spell-caster."

[system_spell_description_mass_lightning_strike]
string="Bolts of lightening will be created around the spell-caster."

[system_spell_description_control_target]
string="The person casting the spell can command a demon, although only summoned demons can be controlled this way."

[system_spell_description_freeze_time]
string="Time slows down for everybody except the spell-caster."

[system_spell_description_mass_incinerate]
string="Incinerates any creature within a given radius around the spell-caster."

// quest log goals

[system_Quest_log_escape_gobs]
string="I find myself in this goblin jail. I must escape from here and find out who I am!"

// newlog
[system_Quest_log_escape_gobs_done]
string="I managed to escape the goblin outpost, I still don't have a clue of what I'm doing here..."

[system_Quest_log_gob_authorization]
string="The goblin lord guarding the access to the goblins' second level asked me for a written authorization and a gem dealer license."

// newlog
[system_Quest_log_gob_authorization_done]
string="I passed the goblin lord guarding the goblin kingdom area"

[system_Quest_log_message_ortiern]
string="I must speak to the King of Arx and bring him news from the humans' outpost."

[system_Quest_log_greu_gift]
string="I met a Troll today, he wants me to be his friend, and he'd like a gift for his birthday..."

// newlog
[system_Quest_log_greu_gift_done]
string="I gave a book to Greu, he was happy, he gave me a troll amulet, I made myself a new friend today."

[system_Quest_log_fallen_rocks]
string="The King wants me to bring a message to Pog, king of the trolls, asking him to clear the rocks from the passage to the outpost."

[system_Quest_log_troll_idol]
string="An idol has been stolen from the trolls. They won't help me until this object has been returned to them. I will search the goblin area for it."

//newlog
[system_Quest_log_troll_idol_done]
string="The passage to the human outpost should be cleared now."

[system_Quest_log_rituals]
string="There have been sacrificial rituals going on lately around the castle. The King wants me to find more about this. Apparently, it could be related to the murder of Falan Orbiplanax. I must question the kingdom's people."

[system_Quest_portal]
string="Chinkash showed me the secret spell to teleport through the gates of Edurneum: Mega Spacium."

[system_Quest_log_shanny]
string="Maria's daughter, Shany, has disappeared. Maria asked me to find her -  she may be in danger."

//newlog
[system_Quest_log_shanny_done]
string="Shany is safe, I arrived just in time before she was sacrificed."

[system_Quest_log_access_temple]
string="Now I should find the secret way into the Temple of Akbaa and destroy the meteor."

[system_Quest_log_know_password]
string="Erzog told me the Temple of Akbaa is located under the tavern and he gave me the secret word to enter."

[system_Quest_log_destroy_meteor_for_good]
string="The meteor withstood my attack. It is stronger than expected. I must ask Felnor about this and explain to him what happened."

[system_Quest_log_krahoz_zohark]
string="I need to find Krahoz and Zohark in order to stop the meteor from draining mana from my body. This is the only way to destroy this meteor and stop Akbaa from reincarnating himself in Arx."

[system_Quest_log_krahoz]
string="Krahoz has been stolen by a group of rebels. The same people who killed the Queen and kidnapped the King's daughter. I must find a way to locate them."

[system_Quest_log_zohark]
string="Zohark is kept by the Order of the Edurneum. I must try knocking at their door - I am sure they will understand the vital importance of my quest."

[system_Quest_log_Shield]
string="I came across the girl I rescued in the Temple of Akbaa. I was surprised to discover that she is in fact the leader of the rebels. But this is not important. All I know is that she will give me Krahoz if I find a shield for her. It is called the Shield of the Ancients and it can be found in the 2nd level of the crypt."

//newlog
[system_Quest_log_Shield_done]
string="I have the mighty Shield of the Ancients."

//newlog
[system_Quest_log_mythril_done]
string="The ultimate weapon is now mine."

//newlog
[system_Quest_log_krahoz_done]
string="I have Krahoz."

//newlog
[system_Quest_log_zohark_done]
string="I have Zohark."

[system_Quest_log_Meteor_time]
string="Now that I have both Krahoz and Zohark, it is time for me to return to the Temple of Akbaa and destroy this meteor once and for all."

[system_Quest_log_Meteor_destroyed]
string="The meteor has been destroyed - Akbaa's scheming is over. Yet, oddly enough, Sylib Nurath has not called me back to the Noden. I must return to the Kingdom and see if I can find a way to get back to the Noden."

[system_Quest_log_save_kingdom]
string="The people from the kingdom of Arx are kept prisoner by the Ylsides. I must go to the jail and see what it is all about before I can leave Arx and return to the Noden."

[system_Quest_log_super_weapon]
string="The kingdom is restored. The trap set by Iserbius has failed. Now I know why I was not called back to the Noden: my mission is not yet complete. Akbaa had time to gather enough energy before I destroyed the meteor. Destroying the meteor was still the best thing to do, as Akbaa won't be as strong as he expected. He is probably merging with Iserbius at this very moment. It's a long process and most weapons will have no effect on Iserbius during it. I must create the ultimate weapon before I can face Akbaa."

[system_Quest_log_mythril]
string="The book of the ultimate weapon says I should make a weapon out of mithril, as it is the only metal that will meld with strange alloys such as Koltk powder. I hope this is true."

[system_Quest_log_Dragon_egg]
string="I must find a dragon's egg to cast a spell on the weapon."

[system_Quest_log_final_meeting]
string="The time has come for me to fulfil my mission: I will go to the Ylside bunker now and destroy Iserbius... or should I say Akbaa."

[system_Quest_log_key_bank]
string="I found a sealed key in Alicia's house. If only I could find a way to make a cast of it, I could make a replica of the key..."

//newlog
[system_Quest_log_key_bank_done]
string="I made a replica of the key in Alicia's house..."

[system_Quest_log_olivier]
string="I heard a rumor at the tavern about a treasure hunt organized by a hermit called Oliver. Apparently, the way to start the hunt off is to drop an emerald into his chest."

//newlog
[system_Quest_log_olivier_done]
string="I solved the treasure hunt organized by Oliver."

[system_Quest_log_Florence]
string="I met a ghost today. She asked me to find the people responsible for her death. She says she used to be an important person in Arx. She also said that her murderer had only one eye."

//newlog
[system_Quest_log_Florence_done]
string="The ghost mystery has been solved. Carlo was at the origin of the murder of Queen Florence."

[system_Quest_log_dragon_scale]
string="How many scales can a dragon have? I must find information about that."

[system_Quest_water_clan]
string="The goblin water clan asked me to kill the earth clan. In exchange, they will give me a magic item."

//newlog
[system_Quest_water_clan_done]
string="I killed the earth clan."

[system_Quest_earth_clan]
string="The goblin earth clan asked me to kill the water clan. In exchange, they will give me some gold from their treasure."

//newlog
[system_Quest_earth_clan_done]
string="I killed the water clan."

[system_not_enough_gold]
string="Not enough gold for this"

