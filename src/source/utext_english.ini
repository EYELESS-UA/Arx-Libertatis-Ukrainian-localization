[garlic_attack]
string="Garlic attack!!!!"

// shany sub quest
[note_5000_sons]
string="Now you have found a precious offering for our god, we can perform the ritual. I will be waiting for you at the serpents' pillar on the 4th level at ten o' clock tomorrow morning. From there, I will lead you to the secret chamber where we will call up the five thousand sons of the Beast. Be very careful that you are not followed."

[note_alotar_threat_content]
string="Remember - if you do not bring me the gems tomorrow night, you die. The Brotherhood of Gem Dealers."

[note_for_pog_content]
string="Pog, Me: Lunshire, need help. Path to humans' out-post blocked: big boulders. If trolls can unblock pathway: me happy. - L."

[note_dwarf_mithril]
string="Akanor, I think we're about to run out of mithril. The situation becomes more disturbing every day and I can't find even an ounce of mithril in our mines. We must find a solution without delay. Oredak."

[note_jail_contain]
string="Me come replace you after me eat. You watchin' humans, you is be careful with new one. Him dangery looking.* Anatole."

[description_note_fallan_content]
string="Felnor,**I discovered the existence of a cult which wishes to invoke Akbaa onto Arx. Akbaa is a powerful devil, the god of destruction that this cult is evidently trying to invoke and bring back to Arx. It would be blasphemy to allow this act to be perpetrated, and a total disaster for every living being on our planet...*Somewhere in the fortress is a cult which recites impious prayers to a fragment of a meteorite made entirely of a material called Koltk. This rock is said to come from the place where Akbaa was born... Normally this substance is indestructible.*It is the impious prayers of the priests and their hideous sacrifices which are focused by the meteor. It provides a channel of energy for Akbaa who, when he has gathered enough, will be able to complete his incarnation in Arx. If that happens, destruction and suffering will be unleashed upon us. We must find and destroy this meteorite at any cost. In truth, Felnor, only a Guardian of the Noden could destroy this meteor... This evening, I will contact the Noden to ask for their help.**Falan."

[note_king_bedroom_contain]
string="O, King, you has to remember - never EVER drink wine - you is allergic to wine. If you drinking wine, you is getting baaaaad pain... - Your devotedest apothecary."

[note_glavasias]
string="Brother Glavasias, if you should ever need to switch the security system off, please note that your access code is 113. The protective force field should not cause you any trouble. Brother Patrizio and Brother Pasquale will help you to switch off the other security systems. - Lord Iserbius."

[note_Patrizio]
string="Brother Patrizio - this heart is one of the keys to the security system. Take good care of it. - Lord Iserbius."

[note_Pasquale]
string="Brother Pasquale - remember this: the first locks the second. - Lord Iserbius."

[note_gob_guardpost_contain]
string="My dear goblin friends, as our agreement seems set to continue, I would like to confirm my order for two more humans to sacrifice to our beloved Akbaa. You will receive 1000 gold pieces per head, upon delivery. I will bring you this princely sum in person. - Lord Iserbius."

[note_mike_lost]
string="Dear Oliver, I am sorry, but I am unable to solve the fourth riddle. Do you think you might be able to give me a clue? - Mike."

[note_maria_love]
string="Maria, it's been a long time since we've been able to see each other and if only the situation were not as it is, I would do anything in the world to be by your side. Yours, - L."

[note_key_brother_treasure]
string="1-3-1 is the key to open my brothers' treasures."

//Jowood version 
[note_treasure_hunt_hint#4]
string="I am very impressed with your progress, stranger. So, here is the fourth clue (...used in order to find clue...). For the next clue, find the lava island and take a close look at it."

[player_stone_riddle_first]
string="Traveller, if you want to take part in my treasure hunt, you will need an emerald to open my chest . OLIVER."

[player_note_riddle_second]
string="Aha, I see we have a new player. Welcome, stranger. Here is the first clue: (The key to the treasure...). For the next clue, go to the trolls' mines and find the note beneath the stones."

[note_carlo_sacred_sword]
string="Operation Sacred Dagger will take place tomorrow. Be prepared. I will make sure the guards are not around when you come, and even more importantly, that the King is fast asleep. He won't suspect a thing. Do your work well and our cause will be protected. - F."

[note_carlo_calpal]
string="Note #1- Enoill, Queen Florence has become a danger to the kingdom. Please follow her without being seen and let me know what you discover. - Carlo."

[note_carlo_calpal2]
string="Note #2 - This letter you found confirms my suspicions. The Queen is plotting to assassinate the King. Therefore I want you to arrange for her disappearance. I'll leave the time and the place up to you. Of course, you will be well rewarded for this task. Burn this message once you have read it. - Carlo."

[note_carlo_calpal3]
string="Note #3 - You must complete your mission tonight. Take care of the Queen as quickly as possible after her child is born. I will take care of the King's safety myself. - Carlo."

[player_note_riddle_third]
string="Well done, stranger. Here's the second clue (... is on level...). For the next clue, try and see what cannot be seen in the chamber beneath the goblin prisons."

[note_dear_mike_sorry]
string="Dear Mike. I'm sorry, but it wouldn't be fair to the other players if I gave you a clue to riddle 4. Good luck anyway. - Oliver the Hermit."

[note_at_last]
string="At last, the time has come. Soon my body will be host to Akbaa and together as one, we will rule over Arx. If something bad should happen to me, I wish to leave this note so that someone else might continue my work for the good of Arx. - Iserbius."

[note_Darkthorn]
string="Nobody in the kingdom knows of my mission. The King chose me because I am the best zombie hunter there is. I know my task is not an easy one, but I have gathered all the tools I need to destroy these abominations! Mummies are formidable opponents, but they are easy to wipe out, because their living corpses burn very well. The other undeads are more difficult to destroy because they have this annoying habit of getting up again when you think you've finished them off. The spell to drive them away only works for a short period of time, but it doesn't kill them. The best way, and the only way I know, in fact, is to plunge a stake deep into the undead's body before it gets up again. That way, it will be destroyed for good. I don't think the equipment I have will be enough. Luckily, my prestigious predecessor left me some very useful tools. I hope I will be able to cleanse this holy place so people can once again come and pay homage to their dead. I've already been on a reconnaissance mission on the first level of the crypt. But I must stay alert to the dangers all around me. May the gods be with you. - Azrael Darkthorn."

[note_fallan_code]
