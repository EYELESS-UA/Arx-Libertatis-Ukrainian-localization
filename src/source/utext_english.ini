[description_note_ellie]
string="This letter is for you, the woman of my life, my beloved Ellie Rowse. I always think of you, all day, all night... Sunsets, breezes, everything reminds me of you, even the cold of the caverns. If only I had the courage to declare you what I feel, I'll do it soon... I'll do it as soon as my shift ends."

[description_book_cells]
string="Prison registration"

[book_cells_content]
string="REGISTRATION AND PRISONERS.***ISOLATION ROOM:**
Year 266, Yellow Season, Week of the Serpent, First day.*Cell 1: Human to sell. Note: 'Bad human found at level 2, he sleeps, very strange.'**Year 266, Green Season, Week of the Eagle, Sixth Day.*Cell 2: Human to sell. Note: 'Azuk brought me this human, me don't know but he is bald human, ridiculous human looks tasty, yummy'.***PENDING JUDGMENT ROOM:**Year 266, Green Season, Week of the Eagle, First Day.*Cell 1: Bad goblin 'Polsius', Charge: attack and blasphemy against Alotar.**Year 266, Green Season, Week of the Cow, Seventh Day.*Cell 2: Goblin prisoner 'Bolson', Charge: murder of two goblins - I killed him, king orders.**Year 266, Green Season, Week of the Dog, Fifth Day*Cell 3: Goblin prisoner 'Zurok', Charge: bad goblin, he is thief.**Year 266, White Season, Week of the Rat, Second Day.*Cell 4: Human prisoner, Charge: unauthorized access to the forbidden camera, he escaped, king very angry with me.**Year 266, White Season, Week of the Rat, Second Day*Cell 5: human prisoner, Charge: bad human attacked Koltor friend, drunken dangerous human now in cell."


