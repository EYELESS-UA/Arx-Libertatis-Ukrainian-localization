////////////////////////////////////////
// GAME_READY TUTOS AND CURIOUS FACTS //
////////////////////////////////////////

[ready_tuto_1]
string="Remember: items you'll need to accomplish your quest have a description ending with '(Quest Item)'. Don't lose these objects!."

[ready_tuto_2]
string="Remember your attack power depends on the time you've prepared your strike."

[ready_tuto_3]
string="If you press a direction while preparing your strike you'll do different moves. For instance, go left before charging to slash your opponent."

[ready_tuto_4]
string="Apart from the douse spell, you can douse a flame using a water bottle on it. Then, to refill the bottle just find a water basin and use the empty bottle on it."

[ready_tuto_5]
string="If you need to give money to somebody, your gold purse can be found in your inventory ring."

[ready_tuto_5b]
string="Are some places very dark? Don't forget to carry and use torches/lamps to light your way."

[ready_tuto_6]
string="Shopkeepers who sell weapons can also repair your own damaged weapons. Just give them your damaged weapon and they'll repair it for a fee."

[ready_tuto_7]
string="To repair your weapon, use your damaged weapon with an anvil and, depending on your object knowledge skill, the repairing will be more or less effective."

[ready_tuto_8]
string="To fish find a fishing pole (or make one using a pole and a rope) and go near a river or a lake, then use the fishing pole."

[ready_tuto_9]
string="Buy a key-ring as soon as you can! It will allow you to put all your keys on one single object."

[ready_tuto_10]
string="Have you tried to forge a weapon?. Find an unforged blade, put it on the fire, action the bellows and then hit the blade with the hammer!. The effectiveness goes according to your object knowledge skill."

[ready_tuto_11]
string="Do you know you can refill your quiver?. To do so, combine your quiver on a shopkeeper who's selling weapons and he'll refill your quiver for a small fee."

[ready_tuto_12]
string="Do you know that you can poison your weapons using a poison potion on them?. The result depends on your object knowledge skill."

[ready_tuto_13]
string="Do you know that you can mine gems?. Just find a pick-axe and use it on slab of gems you'll find incrusted in the walls."

[ready_tuto_14]
string="Don't hesitate to experience different things. One problem may have different solutions depending on your skill and the objects that you have."

[ready_tuto_15]
string="Remember a well prepared apple pie will give you more health than a mushroom and it will feed you faster."

[ready_tuto_16]
string="Be careful not to drink too much wine or you'll get drunk!."

[ready_tuto_17]
string="You've killed somebody you'll need later in the game? Don't worry: your quest is not over. There is always another way to proceed if an important person is dead."

[ready_tuto_18]
string="If you want to stop an active spell, just switch to cursor mode and choose which spell you'd like to stop, double click on the spell symbol found in the right upper corner or simply press the scroll button or '6' key (default)."

[ready_tuto_19]
string="Do you know that you can stab your enemies straight in the neck? This will finish them instantly, to do this you must attack them from behind only when they're unaware of your presence, you'll require a high stealth skill to access these special assassin abilities."

[ready_tuto_20]
string="While fighting be careful when striking: if your weapon hits a stone, a wall or another hard object, it will get damaged."

[ready_tuto_21]
string="Have you ever tried to cast a fireball on a chicken?."

[ready_tuto_21b]
string="Exotic runes will grant additional upgrades and abilities to spells. To cast an improved spell, you'll need each of the runes for that spell in its exotic version."

[ready_tuto_22]
string="Don't forget you can assign a shortcut to antidotes and life or mana potions! For instance, having a life potion set on a shortcut can be helpful while you're fighting, use them pressing 'G', 'H' or 'Y' (Default)."

[ready_tuto_23]
string="Do you know that you can use some counter magic?. For instance, use the Douse spell while an enemy is casting a fireball. If your magic skill is higher than your enemy's you'll douse his fireball."

[ready_tuto_24]
string="If you have more than 50 in your stealth skill you will be able to steal from a character. When you get near a character, if a purse appears in the left bottom of the screen then you can steal from him. Just open your inventory (Right double-click) and you'll see his too. To be able to see and steal bigger or more valuable objects, you'll need an even higher amount of stealth points."

[ready_tuto_25]
string="Have you see all of the mice and small meek rats running in the caves? Drop some cheese, meat or any food for scavengers near them... they'll be pleased."

[ready_tuto_26]
string="Do you know that wearing different armors makes different noises when you're walking?. Wearing leather armor won't make the same noise as wearing chain armor. Think about it when sneaking in the shadows."

[ready_tuto_27]
string="Do you know that can enchant weapons, armor and rings?. Use the proper reagent on them, then cast the enchant object spell! The result depends on your magic skill."

[ready_tuto_28]
string="Do you know water basin can be poisoned?. It may be useful..."

[ready_tuto_29]
string="If you want to make a new friend don't hesitate to feed the dog!."

[ready_tuto_30]
string="Don't forget to find and use exotic runes, these will improve the effectiveness of your spells and you'll get access to new features. For instance, upgrade your night vision spell to see through a door, identify all your nearby enemies or find items, this may be very useful for stealth..."

[ready_tuto_31]
string="If you need some gold, don't hesitate to visit Miguel's fight arena, you may receive periodic rewards if you participate in bets or tournaments."

[ready_tuto_32]
string="You can listen to NPCs conversations as long as they don't spot you. You can find out about important information and access some clues that may help you."

[ready_tuto_33]
string="Do you know that douse torches may be useful? Use the Douse spell or use a bottle of water on the fire. This way you can sneak through the shadows more easily."

[ready_tuto_33B]
string="Don't forget that douse torches may be useful? Use the Douse spell or use a bottle of water on the fire. This way you can sneak through the shadows more easily"

[ready_tuto_34]
string="You can brew your own potions: just use a crusher to turn herbs into powder. Then use the powder on an empty bottle. Then you'll need an apparatus to brew the potion."

[ready_tuto_35]
string="TRAPDOORS: double click on the trapdoors to access sheds, rooftops or alternate paths."

[ready_tuto_35b]
string="TRAPDOORS: double click on the trapdoors to access sheds, rooftops or alternate paths."

[system_fire_creative]
string="You can activate creative traps if you are pursued by numerous enemies, stand near flammable debris and cast the Ignite spell, light up foes for a limited time, warning, use carefully."

[tutorial_stealth_mod]
string="PLAY YOUR WAY 2: Many approaches such as stealth can be used in different ways.**-Use stealth mode to smooth your steps and sneak into the shadows (Default Key 'C').*-Staying hidden when listening to conversations can help you discover information or key points.*-Perform instant shadow kills, attacking only unaware enemies from behind (Required: 30 stealth, exclusive for daggers or short weapons).**Stealth effectiveness will depend on how many points you assign to that skill."

[tutorial_access_mod]
string="PLAY YOUR WAY 3: Experiment and look for alternatives. You can get past a locked door by:**-Searching for a key.*-Finding an alternate path.*-Using a set of tools to pick the lock.*-Bribing an authority to get access.**Every problem always has different solutions."

[tutorial_rooftops_mod]
string="ELEVATIONS AND ROOFTOPS: Use elevations, rooftops and sheds to:**-Find an alternate path.*-Hide yourself or avoid your foes.*-Perform a drop attack (Nonlethal), jumping on your enemies from the heights and leaving them unconscious."

[system_no_lever]
string="Find a piece of wood and combine it with the lever base to repair it."



