[system_charsheet_skin]
string="Change your appearance."

[system_charsheet_quickgenerate]
string="This will automatically distribute level points for you."

[system_charsheet_done]
string="Start your journey to ARX."

[system_charsheet_strength]
string="Strength. Determines your damage bonus in fights and your ability to use heavy weapons. Strength has an impact on the object knowledge skill and the combat skills."

[system_charsheet_intel]
string="Mental. Determines your mana pool (magical energy) and resistance to magic. Mental has an impact on skills such as ethereal link, magic, technical skill, intuition, and object knowledge."

[system_charsheet_consti]
string="Constitution.  Determines your health pool, your resistance to poison and your ability to wear heavy armor. Constitution has an impact on Defense"

[system_charsheet_mecanism]
string="Technical skill. This allows you to succeed at tasks such as picking locked doors and disabling traps."

[system_charsheet_intuition]
string="Intuition. A sort of sixth sense which helps you detect hidden objects such as secret passages and traps. Intuition also improves your nose for trading, allowing you to make better deals."

[system_charsheet_etheral_link]
string="Ethereal link. This link warns you of the presence of hostile creatures and gives you information about your opponent's status during fights. This skill also determines your mana regain rate."

[system_charsheet_objknoledge]
string="Object knowledge. This is used for actions such as repairing things, making potions, poisoning weapons and identifying objects."

[system_charsheet_casting]
string="Casting. This skill grants you access to different levels of spells. There are ten levels of spells. This skill also determines ability to protect yourself from magic."

[system_charsheet_projectile]
string="Projectile. Gives you bonuses for striking and inflicting damage when using any long-distance weapon in a fight."

[system_charsheet_closecombat]
string="Close combat. Gives you bonuses for striking and for inflicting damage when using any close combat weapon."

[system_charsheet_defense]
string="Defense. This skill determines your ability to use a shield, it increases the class of your armor and reduces the amount of damage you sustain during fights."

