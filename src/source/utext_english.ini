[system_tutorial_bricks]
string="Find bricks and stack them to create a suitable platform to exit the cell."

[player_shadowkill]
string="SHADOW KILL!!!!!"

[player_adrenaline]
string="ADRENALINE ATTACK!!!!!"

[system_tutorial_food_rats]
string="Some rats and mice are friendly. You can place certain types of food near them, sure they will love them.*Note: Not all rats will be friendly and much less in groups."

[tutorial_stealth]
string="PLAY YOUR WAY:***-You can kill enemies instantly attacking them from behind as long as you don't get caught in the act. You need to have at least 30 in stealth and have a dagger or a short sword equipped to do this.**-You can listen to character conversations as long as they don't detect you, while you're listening, you can discover and access information that may be useful in your quests.**-NPCs can hear you, so mind your footsteps. You can try throwing an item away from you and it might make hostile NPCs move towards it. Note that the stealth icon shows up in the bottom lefthand corner of the screen when you are hiding."

[tutorial_stealth2]
string="PLAY YOUR WAY:***-You can kill enemies instantly attacking them from behind as long as you don't get caught in the act. You need to have at least 30 in stealth and have a dagger or a short sword equipped to do this.**-You can listen to character conversations as long as they don't detect you, while you're listening, you can discover and access information that may be useful in your quests.**-NPCs can hear you, so mind your footsteps. You can try throwing an item away from you and it might make hostile NPCs move towards it. Note that the stealth icon shows up in the bottom lefthand corner of the screen when you are hiding."

[tutorial_torchi]
string="PLAY YOUR WAY 1: You can overcome an obstacle in different ways.**-Combine the bottle of water with the torch to hide.*-Interact with your environment (distract or lock the enemy with the portcullis).*-Free the prisoner during the fight.*-Attack or avoid enemies directly.**Experiment combos, as you learn new abilities, more options will become available to you."

[tutorial_torch2]
string="Well done, remember that while you are hiding the stealth icon will appear in the lower left corner, the more intense this is, the more difficult it will be for you to be detected. Note: your stealth points will influence your ability to hide."

[tutorial_transparency_door]
string="If you activate the exotic night vision spell near a door, you will be able to see through it for a short time in addition to being able to see the characters better while the spell is active."

[tutorial_exotic_rune_single]
string="You have found your first exotic rune, consuming them will upgrade spells. To cast a special spell, you'll need all the required runes both in its base version (Blue runes) and in its exotic version (Black runes).**Those are only upgrades for the base runes, so they don't increase the runes in the magic book, however, if you consume a certain exotic rune before possessing its base rune, the previously consumed runes will have their effects when you get their base runes respectively."

[tutorial_exotic_rune_plural]
string="You have found your first exotic runes, consuming them will upgrade spells. To cast a special spell, you'll need all the required runes both in its base version (Blue runes) and in its exotic version (Black runes).**Those are only upgrades for the base runes, so they don't increase the runes in the magic book, however, if you consume a certain exotic rune before possessing its base rune, the previously consumed runes will have their effects when you get their base runes respectively."

[tutorial_exotic_runes]
string="Congratulations, you have in possession an exotic rune, this kind of rune will upgrade spells that use the current rune, unlocking special features or make them further."

[system_break_door]
string="Hit the rusted portcullis to tear it down."

[system_break_box]
string="You can hit crates to destroy them, some of them may contain objects inside."

[system_shrunken_player]
string="Be careful not to get too close to NPCs while you are shrunken, they could kill you easily without detecting you, even if they are allies."

[system_dummy3]
string="You can stealthily attack enemies from behind and perform instant kills by stabbing their necks, keep in mind that this skill requires at least 30 stealth points, if they detect you on the spot, your special attack will be canceled."

[system_fire_creative]
string="You can activate creative traps if you are pursued by numerous enemies, stand near flammable rubble and cast the spell 'ignite', burn enemies for a limited time, warning, use carefully."

[system_player_note]
string="Thank you very much for supporting this project.*Check for future updates in the website.**We'll continue developing and improving the mod, you are our motivation to continue!**If you love Arx, don't hesitate to join the Arx Insanity community on Discord:**https://discord.gg/mxTKk52"

[system_supporter_note]
string="Thank you very much for supporting this project.**In appreciation, here you have some exclusive items for donators: a sneak peek to the alchemy weapons in addition to other items.**Check for future updates on the website.**We'll continue developing and improving the mod for now, you are our motivation to continue!.**If you love Arx, don't hesitate to join the Arx Insanity community on Discord:**https://discord.gg/mxTKk52"


