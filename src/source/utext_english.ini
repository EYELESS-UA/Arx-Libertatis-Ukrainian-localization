[system_tutorial_0]
string="Look in the shop chest, pick up objects you want to buy or drop in items you want to sell."

[system_tutorial_0bis]
string="Hand over your broken weapons or armor to the blacksmith to have them repaired."

[system_tutorial_1] //Jowood version
string="Right-click to toggle from 'CURSOR MODE' to 'MOUSELOOK MODE'."

[system_tutorial_1_new]
string="Right-click on this message to close it."

[system_tutorial_1_new2]
string="Tutorial messages can be found in the log section of your quest book (Default key 'F4')."

[system_tutorial_2_new]
string="Double-click on any fixed object to activate it."

[system_tutorial_2bis]
string="Press 'OPEN BOOK' (Default Key 'BACKSPACE') or click on the BOOK icon to open your quest book."

[system_tutorial_2tris]
string="Press 'OPEN INVENTORY' (Default Key 'I') or click on the BELT icon to open your inventory."

[system_tutorial_3bis] //Jowood Version
string="Equip the bone (Default key 'Enter' or 'F')."

[system_tutorial_3bis_new]
string="Press 'READY WEAPON' (Default key 'TAB') to go into 'COMBAT MODE'."

[system_tutorial_3bis_new2]
string="Click 'ACTION' to strike, the longer you hold the button down, the harder you will strike."

[system_tutorial_3]
string="Double-click on any character to talk to him."

[system_tutorial_4]
string="Press 'READY WEAPON' (Default key 'TAB') to exit 'COMBAT MODE'.*Double-click on dead bodies to open their inventories."

[system_tutorial_4_new] //Jowood version
string="Left-click and drag items into your inventory.*To use an object press 'ENTER' or 'F'."

[system_tutorial_5]
string="Click 'ACTION' when you are in mouselook to fight."

[system_tutorial_5bis]
string="When fighting, click and hold 'ACTION' then release to hit. The longer you hold, the harder you hit."

[system_tutorial_6] //JoWood Version
string="You've just found your first runes. Put them in your book (Default key 'Enter' or 'F')."

[system_tutorial_6bis]
string="Now that you have your first runes, open your book and cast your first spell."

[system_tutorial_7]
string="Crouch by pressing 'CROUCH' (Default Key 'X'), and smash the wooden trap."

[system_tutorial_8]
string="Double-click on the rope in your inventory once you have found it, then click on the elevator mechanism to tie it."

[system_tutorial_9]
string="Left-click on a spell icon to see its formula. The formula will stay on-screen as reference when you close the book."

[system_tutorial_10]
string="Press and hold 'MAGIC MODE' (Default Key 'Ctrl') to go into magic mode and draw the runes using the left mouse button, one at a time, then release 'MAGIC MODE' to cast the spell."

[system_tutorial_11]
string="Teleporter now activated; you won't be able to travel through the portals until other teleporters have been activated"

[system_tutorial_12]
string="Try to ignite the fireplace and then place some raw food near the fire to cook it"

[system_tutorial_13]
string="Try to cast the Ignite Spell on the torches to light the corridor"

[system_tutorial_14]
string="Press 'ENTER' or 'F' on a Magic Scroll to memorise the spell"

[system_tutorial_15]
string="Now the spell has been precast. When you want to cast this spell, just double-click 'ACTION' on the spell symbol that has just appeared at the bottom of the screen"

[system_tutorial_16]
string="Click on the Stair icon to change level."

[system_tutorial_level_01]
string="Congratulations! Your character's level has increased! Click on the red cross to allocate additional experience points."

[system_tutorial_level_02]
string="Add points by clicking an attribute's icon; the mouse pointer will indicate the number of points remaining."

[tutorial_bag] //Jowood version
string="Right click on the inventory belt, to show what's inside all your bags."

[tutorial_bag_02] //Jowood version
string="Note you can reorganize your inventory by double clicking on your inventory belt icon."

[tutorial_lever] //Jowood version
string="To repair the mechanism double click on the lever you've just found and then left click on the lever base on the wall nearby."

[tutorial_shop] //Jowood version
string="You're now in transaction mode. BEWARE: A transaction is effective as soon as you pick up an item from, or drop an item into the shopkeeper's chest. You can not change your mind and no refunds are given."

[tutorial_mode_01] //Jowood version
string="You are in cursor mode."

[tutorial_mode_02] //Jowood version
string="You are in Mouselook mode."

// [tutorial_stealth] //Jowood version2 //
// string="NPCs can hear you, so mind your footsteps. You can try throwing an item away from you and it might make hostile NPCs move towards it.*Note that the stealth icon shows up in the bottom lefthand corner of the screen when you are hiding." //

[tutorial_steal] //Jowood version
string="Did you know that you can steal from people? You need to have at least 50 in stealth to do this. Simply bump into somebody so you can see that person's inventory icon in the bottom-left corner of the screen. Then, left click this icon and have a look at what you'd like to steal: beware though, don't get caught in the act!"

[system_character_creation]
string="Character creation"

[system_charsheet_atributes]
string="Your attributes."

[system_charsheet_skills]
string="Your skills."

[system_charsheet_status]
string="Your status values. These depend on the equipment, skills and attributes you have."

